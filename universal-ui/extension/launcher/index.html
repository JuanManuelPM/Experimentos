<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefox · Escritorio</title><link rel="stylesheet" href="launcher.css"></head>
<body><main>
<header><span class="eyebrow">FIREFOX / APLICACIONES</span><h1>Escritorio</h1>
<div class="settingsBar"><button type="button" id="settings">Personalización ↗</button></div></header>
<section aria-labelledby="apps"><h2 id="apps">Aplicaciones</h2>
<div class="app"><span class="num">01</span><div><h3>WhatsApp</h3><p>Sesión y personalización existentes</p></div>
<div class="buttons"><button class="primary" data-app="whatsapp" data-cmd="open">Abrir</button>
<button data-app="whatsapp" data-cmd="window">Nueva ventana</button></div></div>
<div class="app"><span class="num">02</span><div><h3>ChatGPT</h3><p>Sesión y personalización existentes</p></div>
<div class="buttons"><button class="primary" data-app="chatgpt" data-cmd="open">Abrir</button>
<button data-app="chatgpt" data-cmd="window">Nueva ventana</button></div></div></section>
<section class="layouts" aria-labelledby="layouts"><h2 id="layouts">Distribuciones</h2>
<button class="layout" id="pair"><span><strong>WhatsApp + ChatGPT</strong><small>Dos ventanas de Firefox, lado a lado</small></span><b aria-hidden="true">▯▯</b></button>
<button class="layout secondary" id="split"><span><strong>Preparar vista dividida</strong>
<small>Abre las pestañas; después Alt + clic en ChatGPT</small></span><b aria-hidden="true">↗</b></button></section>
<p id="status" role="status" aria-live="polite"></p>
<footer>Las aplicaciones son pestañas originales de Firefox, no copias incrustadas.</footer>
</main><script src="launcher-core.js"></script><script src="launcher.js"></script></body></html>
