<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal UI · Demostración interactiva</title>
<style>
/* Universal UI · panel. Sistema visual Riel (tema Tide). Hairlines, una sola énfasis. */
:root {
  --ground: #05070b; --surface: #0a0c11; --raised: #11141b; --selection: #17233a;
  --border: #222b3b; --mute: #323b4d; --focus: #8cb8f2; --accent: #62c3f6; --on-accent: #06121c;
  --text: #c3cde0; --text-muted: #8a96ad; --text-dim: #5d6a81;
  --red: #ef8b98; --green: #a6d6a0; --yellow: #e7c98c;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: Cantarell, "Noto Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font: 13px/18px var(--sans); }
.panel { width: 380px; max-width: 100vw; background: var(--surface); border: 2px solid var(--focus); border-radius: 8px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.head { display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 14px; font-family: var(--mono); font-size: 12px; }
.ctx { display: flex; gap: 8px; align-items: center; color: var(--text); }
.ctx .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.ctx[data-on="true"] .dot { background: var(--focus); }
.health { color: var(--text-muted); }
.health[data-state="incompatible"] { color: var(--yellow); }

.tabs { display: flex; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; min-height: 34px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-muted); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--focus); }

section[role="tabpanel"] { max-height: 520px; overflow-y: auto; padding: 4px 0 10px; }
.group { padding: 10px 14px 4px; }
.caps { font: 600 11px/18px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; display: flex; justify-content: space-between; }
.caps small { letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--text-dim); }
hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0 0; }

/* Ámbito: común vs particular */
.scope { display: flex; gap: 0; margin: 10px 14px 2px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.scope button { flex: 1; min-height: 30px; border: 0; background: none; color: var(--text-muted); border-right: 1px solid var(--border); }
.scope button:last-child { border-right: 0; }
.scope button[aria-pressed="true"] { background: var(--selection); color: var(--text); }
.comps { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px 0; }
.comps button { border: 1px solid var(--border); background: none; border-radius: 4px; padding: 2px 8px; color: var(--text-muted); font-size: 12px; min-height: 24px; }
.comps button[aria-pressed="true"] { border-color: var(--focus); color: var(--text); }

/* Filas de control */
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 6px 0; }
.row .name { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row .name .pill { margin-left: auto; }
.row > .seg, .row > .actions { justify-self: start; }
.seg { flex-wrap: wrap; }
.src { font: 11px var(--mono); color: var(--text-dim); border: 0; background: none; padding: 0; }
.src[data-own="true"] { color: var(--focus); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--border); background: none; padding: 3px 8px; color: var(--text-muted); font-size: 12px; min-height: 26px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--focus); color: var(--on-accent); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }

.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 44px; height: 32px; border-radius: 4px; border: 1px solid var(--border); padding: 0; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.sw span { display: block; }
.sw[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }
.sw.orig { display: grid; place-items: center; grid-template-columns: 1fr; background: none; font: 10px var(--mono); color: var(--text-muted); }
.sw-label { font: 11px var(--mono); color: var(--text-dim); margin-top: 4px; }

/* Estado de cada capacidad */
.pill { font: 11px/18px var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
.pill[data-s="applied"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.pill[data-s="available"] { color: var(--text); }
.pill[data-s="not_found"] { color: var(--text-dim); border-style: dashed; }
.pill[data-s="incompatible"] { color: var(--yellow); }
.pill[data-s="error"] { color: var(--red); border-color: var(--red); }
.vis { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; min-height: 34px; border-bottom: 1px solid var(--border); }
.vis:last-child { border-bottom: 0; }
.vis .name { display: flex; gap: 8px; align-items: center; }
.vis .why { grid-column: 2 / 4; font: 11px var(--mono); color: var(--text-dim); margin-top: -6px; padding-bottom: 4px; }
.sw-toggle { width: 30px; height: 18px; border-radius: 9px; border: 1px solid var(--mute); background: var(--raised); position: relative; padding: 0; }
.sw-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); transition: transform .15s; }
.sw-toggle[aria-checked="true"] { background: var(--focus); border-color: var(--focus); }
.sw-toggle[aria-checked="true"]::after { transform: translateX(12px); background: var(--on-accent); }
.sw-toggle:disabled { opacity: .35; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .sw-toggle::after { transition: none; } }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--border); background: var(--raised); border-radius: 4px; padding: 4px 10px; min-height: 28px; color: var(--text); font-size: 12px; }
.btn:hover { border-color: var(--mute); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--focus); color: var(--on-accent); border-color: var(--focus); }
.btn.quiet { background: none; color: var(--text-muted); }

.foot { display: flex; gap: 6px; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border); }

.app { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.app .meta { font: 11px var(--mono); color: var(--text-dim); }
.app[data-current="true"] { background: var(--selection); }
.mark { width: 26px; height: 26px; border-radius: 6px; background: var(--raised); border: 1px solid var(--border); display: grid; place-items: center; font: 600 11px var(--mono); color: var(--text-muted); }
.app[data-custom="true"] .mark { border-color: var(--focus); color: var(--focus); }

.drift { font: 11px/16px var(--mono); color: var(--yellow); padding: 0 14px; }
.empty { padding: 18px 14px; color: var(--text-muted); }
.toast { position: sticky; bottom: 0; margin: 0; padding: 0 14px; height: 0; overflow: hidden; font: 11px/24px var(--mono); color: var(--text); background: var(--raised); transition: height .15s; }
.toast[data-on="true"] { height: 24px; border-top: 1px solid var(--border); }
input[type="text"] { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; min-height: 28px; width: 100%; }
label.file { display: inline-flex; align-items: center; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.demo { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; min-height: 100vh; align-items: flex-start; }
.browser { flex: 999 1 560px; min-width: 0; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.chrome { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border-bottom: 1px solid var(--border); font: 12px var(--mono); }
.chrome .tabbtn { border: 1px solid var(--border); background: none; color: var(--text-muted); border-radius: 4px; padding: 2px 10px; min-height: 26px; }
.chrome .tabbtn[aria-pressed="true"] { color: var(--text); border-color: var(--focus); }
.chrome .sim { margin-left: auto; color: var(--yellow); }
.chrome .uui-btn { border: 1px solid var(--focus); background: var(--raised); color: var(--focus); border-radius: 4px; width: 28px; height: 26px; }
iframe { width: 100%; height: 620px; border: 0; background: #fff; display: block; }
.side { flex: 0 0 380px; display: flex; flex-direction: column; gap: 8px; }
.note { font: 11px/16px var(--mono); color: var(--text-muted); max-width: 380px; }
</style>
</head>

    AVAILABLE: 'available',      // elementos reales encontrados; la modificación no está activa
    APPLIED: 'applied',          // activa y verificada contra el DOM real

            h('button', { class: 'btn quiet', 'aria-label': 'Exportar ' + p.name, onclick: () => env.download(p.name + '.uui.json', ST.exportProfile(state.settings, id)) }, '⇩'),
            h('button', { class: 'btn quiet', 'aria-label': 'Borrar ' + p.name, onclick: () => commit(s => ST.deleteProfile(s, id), 'Perfil borrado') }, '×')))) :
          h('p', { class: 'sw-label' }, 'Sin perfiles')));
      if (a) {
        const others = UUI.adapters.all().filter(o => o.id !== a.id && state.settings.apps[o.id]);
        v.append(h('div', { class: 'group' }, h('p', { class: 'caps' }, h('span', {}, 'Reutilizar en ' + a.name)),
          others.length ? h('div', { class: 'actions' }, others.map(o => h('button', { class: 'btn',
            onclick: () => commit(s => ST.copyApp(s, o.id, a.id, a), `Copiado de ${o.name}`) }, 'Copiar de ' + o.name)))
            : h('p', { class: 'sw-label' }, 'Ninguna otra app personalizada')));
      }
    }

    function render() {
      if (!state.settings) return;
      renderHead();
      for (const [tab, fn] of [['apps', renderApps], ['custom', renderCustom], ['profiles', renderProfiles]]) {
        $('tab-' + tab).setAttribute('aria-selected', String(state.tab === tab));
        $('view-' + tab).hidden = state.tab !== tab;
        if (state.tab === tab) fn();
      }
    }

    for (const tab of ['apps', 'custom', 'profiles']) {
      $('tab-' + tab).addEventListener('click', () => { state.tab = tab; render(); });
    }
    root.addEventListener('keydown', (e) => {
      if (e.target.getAttribute('role') !== 'tab') return;
      const order = ['apps', 'custom', 'profiles'];
      const i = order.indexOf(state.tab);
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        state.tab = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3];
        render(); $('tab-' + state.tab).focus();
      }
    });

    (async () => {
      state.ctx = await env.getContext();
      state.settings = await env.store.load();
      if (!state.ctx.adapter) state.scope = 'global';
      env.store.watch(s => { state.settings = s; setTimeout(refreshReport, 60); });
      await refreshReport();
    })();
    return { state, render, refreshReport };
  }

  UUI.mountPanel = mountPanel;
})(globalThis.UUI);

(function (UUI) {
  'use strict';
  const area = UUI.store.memoryArea();
  const store = new UUI.store.Store(area);
  const engines = {};
  const hostOf = { chatgpt: 'chatgpt.com', whatsapp: 'web.whatsapp.com', wikipedia: 'es.wikipedia.org' };
  let current = 'chatgpt';
  const ready = [...document.querySelectorAll('iframe')].map(f => new Promise(res => {
    const init = () => {
      if (engines[f.dataset.app]) return res();
      const id = f.dataset.app;
      engines[id] = UUI.createEngine({ adapter: UUI.adapters.get(id), document: f.contentDocument, window: f.contentWindow });
      store.load().then(s => { engines[id].apply(s); engines[id].start(); res(); });
    };
    const d = f.contentDocument;
    if (d && d.readyState === 'complete' && d.body && d.body.children.length) init();
    else f.addEventListener('load', init);
  }));
  store.watch(s => Object.values(engines).forEach(e => e.apply(s)));
  function show(id) {
    current = id;
    document.querySelectorAll('.tabbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.app === id)));
    document.querySelectorAll('iframe').forEach(f => { f.hidden = f.dataset.app !== id; });
  }
  show('whatsapp');
  let panel = null;
  const env = {
    store,
    getContext: async () => ({ host: hostOf[current], adapter: UUI.adapters.get(current), permitted: true }),
    hasPermission: async () => true,
    requestPermission: async () => true,
    getReport: async () => engines[current] ? engines[current].report() : null,
    runAction: async (id) => engines[current].runAction(id),
    download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text])); a.download = name; a.click(); },
  };
  Promise.all(ready).then(() => {
    panel = UUI.mountPanel(document.getElementById('uui'), env);
    store.update(s => {
      const themed = UUI.store.setValue(s, {level:'app', appId:'whatsapp', key:'theme'}, 'cafe');
      return UUI.store.setValue(themed, {level:'app', appId:'whatsapp', key:'mode'}, 'minimal');
    }).then(async saved => {
      panel.state.settings = saved;
      panel.state.ctx = await env.getContext();
      await panel.refreshReport();
    });
    document.querySelectorAll('.tabbtn').forEach(b => b.addEventListener('click', async () => {
      show(b.dataset.app);
      panel.state.ctx = await env.getContext();
      panel.state.component = null;
      await panel.refreshReport();
    }));
  });
})(globalThis.UUI);
</script>
