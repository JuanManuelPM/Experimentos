.index-list{margin:0;padding:0}.index-part{border-bottom:1px solid var(--line);padding:15px 0}.index-part>summary{cursor:pointer;list-style:none;font-size:14px;font-weight:700}.index-part>summary::-webkit-details-marker{display:none}.index-part>summary::after{content:'+';float:right;color:var(--quiet)}.index-part[open]>summary::after{content:'−'}.unit-block{padding:14px 0 6px 10px}.unit-block>summary{cursor:pointer;list-style:none;font-size:14px;font-weight:660}.unit-block>summary::-webkit-details-marker{display:none}.unit-block>summary::after{content:'+';float:right;color:var(--quiet)}.unit-block[open]>summary::after{content:'−'}.unit-block .unit-desc{font-size:12px;color:var(--quiet);margin:5px 0 12px}.idx-choice{display:block;width:100%;border:0;background:transparent;padding:8px 11px 8px 17px;text-align:left;line-height:1.4;font-size:13.5px}.idx-choice:hover,.idx-choice[aria-current=true]{background:var(--soft);font-weight:630}.idx-choice .index-num{display:inline-block;width:32px;font-size:11px;color:var(--quiet)}.search{padding:11px 12px;width:100%;border:1px solid var(--line);background:transparent;outline-offset:2px;font-size:14px;margin:0 0 18px}.tree-group{border-left:1px solid var(--line);padding:6px 0 7px 15px;margin:3px 0 6px 10px;font-size:13px}.tree-group p{margin:9px 0;color:var(--quiet)}.exam-table{width:100%;border-collapse:collapse;margin:18px 0 28px;table-layout:auto;font-size:13.5px}.exam-table th,.exam-table td{padding:11px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:450}.exam-table th{color:var(--quiet);font-size:12px}.exam-table th:first-child,.exam-table td:first-child{text-align:left}.exam-part{padding:0 0 24px}.exam-q{margin:25px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}.exam-q .ask{font-size:17px;margin:5px 0 10px}.section-empty{font-size:13px;color:var(--quiet)}.topline{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}

</style></head><body><main class="shell"><div class="left" id="left"><nav class="tabs" aria-label="Material de estudio" role="tablist"><button class="tab" role="tab" data-tab="machete" id="tabMachete" aria-selected="true">Machete</button><button class="tab" role="tab" data-tab="teoria" id="tabTheory" aria-selected="false">Teoría</button><button class="tab" role="tab" data-tab="indice" id="tabIndex" aria-selected="false">Índice</button></nav><div id="left-content" class="left-content" role="tabpanel"></div></div><section id="right" class="right" aria-label="Ejercicio"><div id="right-content" class="right-content"></div></section></main><script id="course-data" type="application/json">{"metadata":{"course":"Estadística Aplicada a la Psicología","version":"local-2026-11-10-v2","status":"Contenido local, aún NO publicado","provenance":"Material de estudio redactado a partir de apuntes y ejemplos vistos en conversaciones anteriores. Las consignas no son transcripciones literales del PDF. Revisar las originales antes de etiquetar algo como literal.","moduleMissing":5},"units":[{"id":"01","module":1,"partial":1,"name":"Investigación y variables","short":"Investigación","scope":"Población, muestra, variables, escalas, hipótesis y diseños de investigación.","intro":"Antes de calcular, un ejercicio puede pedirte que identifiques quiénes fueron estudiados, qué se midió y cómo se obtuvieron los datos. Son preguntas de clasificación: cada término responde a una pregunta distinta.","sections":[{"title":"De una pregunta a un estudio","body":"Población es el conjunto al que queremos referirnos. Muestra es el subconjunto que efectivamente aporta datos; su tamaño se escribe n. Unidad de análisis es cada persona, familia, consulta o registro sobre el que se mide una variable. La muestra no representa automáticamente a toda la población: importa cómo fue seleccionada.","formulas":[],"symbols":[["N","tamaño de población, si se conoce"],["n","cantidad de unidades en la muestra"]],"example":"Un estudio encuesta a 188 familiares de pacientes trasplantados. La muestra contiene 188 personas. La población depende del alcance que define la investigación y no se puede inventar a partir de n.","note":""},{"title":"Variables: qué representan los valores","body":"Una variable es una característica que cambia entre las unidades. Si los valores son etiquetas, la variable es cualitativa. Si cuantifican una magnitud o un conteo, es cuantitativa. La variable independiente es la condición o agrupación que se considera explicativa; la dependiente o respuesta es el resultado observado. En estudios observacionales, «independiente» no equivale necesariamente a causa.","formulas":[],"symbols":[],"example":"Tratamiento A/B: cualitativa nominal. Puntaje de ansiedad: cuantitativa tratada como intervalo. Número de faltas: cuantitativa discreta.","note":""},{"title":"Niveles de medición","body":"Nominal: categorías sin orden intrínseco (grupo sanguíneo). Ordinal: categorías ordenadas sin distancias necesariamente iguales (bajo, medio, alto). Intervalo: las diferencias entre números tienen sentido, pero el cero no expresa ausencia absoluta (muchos puntajes psicométricos). Razón: hay cero absoluto y tiene sentido afirmar «el doble» (duración, conteos, peso). Una escala de test puede tener números enteros y seguir tratándose como puntaje de intervalo.","formulas":[],"symbols":[],"example":"","note":"No deduzcas el nivel solo por ver cifras. «10 puntos de autoestima» no equivale a diez unidades físicas."},{"title":"Diseños y comparaciones","body":"Experimental: el investigador asigna activamente la condición de estudio. Observacional: registra lo que ocurre sin asignarla. Transversal: mide en un momento o una fotografía del período. Longitudinal: sigue unidades a lo largo del tiempo. Dos mediciones del mismo sujeto son apareadas; dos grupos de personas diferentes son independientes. Son ejes distintos y pueden combinarse.","formulas":[],"symbols":[],"example":"Los mismos adolescentes completan una prueba antes y después de un entrenamiento asignado: experimental y longitudinal, con medidas apareadas.","note":""},{"title":"Hipótesis de investigación","body":"Es una predicción sustantiva sobre el fenómeno: «se espera menor ansiedad después del taller». Todavía no es el contraste H₀/H₁ de inferencia. Reconocé quién cambia, qué variable se espera que cambie y en qué dirección. Si los datos muestran asociación, no reemplaces «se relaciona con» por «causa».","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"02","module":2,"partial":1,"name":"Tablas, frecuencias y gráficos","short":"Frecuencias","scope":"Conteos, porcentajes, acumulados, tablas cruzadas y lectura de gráficos.","intro":"Un conjunto de datos se puede convertir en una tabla. El objetivo es saber cuántos casos hay en cada categoría, qué fracción del total representan y cuántos se acumulan hasta un valor.","sections":[{"title":"Las cuatro columnas de una tabla de frecuencias","body":"Frecuencia absoluta FAᵢ: cantidad de casos del valor o intervalo i. Frecuencia relativa FRᵢ: proporción de casos en ese intervalo. Frecuencia absoluta acumulada FAAᵢ: suma de los conteos desde el comienzo hasta i. Frecuencia relativa acumulada FRAᵢ: proporción acumulada. La última fila acumulada debe llegar a N y a 1 (=100 %).","formulas":["FRᵢ = FAᵢ / N","FAAᵢ = FA₁ + … + FAᵢ","FRAᵢ = FAAᵢ / N"],"symbols":[["FAᵢ","cantidad de casos de la fila i"],["N","total de observaciones"],["FRᵢ","proporción de la fila"],["FAAᵢ","conteo hasta esa fila"]],"example":"Si las FA son 4, 6 y 10, entonces N=20; las FR son 0,20, 0,30 y 0,50; las FAA son 4, 10 y 20.","note":""},{"title":"Intervalos y acumulados","body":"En datos agrupados, cada fila representa un intervalo de valores. Al interpretar «menos de 90 minutos», hay que sumar las clases que quedan por debajo de ese límite; no usar solamente la frecuencia del intervalo 60–90. Revisá cómo se incluyeron los extremos de los intervalos.","formulas":[],"symbols":[],"example":"FA en 0–30=50; 30–60=60; 60–90=100: hasta 90 minutos hay 210 casos.","note":""},{"title":"Cómo elegir un gráfico","body":"Barras separadas: categorías nominales u ordinales. Sectores: partes de un total que suma 100 %. Histograma: números agrupados en intervalos contiguos. Dispersión: pares de medidas numéricas (unidad 4). Mirá primero qué variable representa cada eje, qué unidad usa y dónde empieza la escala. No leas números exactos de una figura borrosa.","formulas":[],"symbols":[],"example":"","note":""},{"title":"Tablas de doble entrada","body":"Cruzan dos características. Cada casilla es una intersección; los totales al borde son marginales. El porcentaje puede ser sobre el total general, dentro de una fila o dentro de una columna. La consigna determina el denominador. En el segundo parcial esta misma habilidad se vuelve probabilidad condicional.","formulas":["% del total = celda / N × 100","% de una fila = celda / total de fila × 100","% de una columna = celda / total de columna × 100"],"symbols":[],"example":"Entre 16 personas de Orientación, 6 son hombres: 6/16=37,5 %. Sobre las 34 personas totales, esos 6 representan 6/34≈17,65 %.","note":""},{"title":"Gráficos engañosos y lectura crítica","body":"Ejes recortados, anchos de intervalo desiguales y totales distintos pueden exagerar o esconder diferencias. Cuando se comparan grupos de tamaños muy distintos, una proporción por grupo suele ser más informativa que un conteo bruto.","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"03","module":3,"partial":1,"name":"Medidas descriptivas","short":"Descriptiva","scope":"Media, mediana, moda, percentiles empíricos, varianza, desvío, CV y asimetría.","intro":"La estadística descriptiva resume muchos números mediante medidas de centro, dispersión y posición. Cada una contesta una pregunta diferente. No las confundas ni uses una medida para concluir que hay un efecto significativo.","sections":[{"title":"El centro: media, mediana y moda","body":"Media: promedio aritmético; utiliza todos los valores y es sensible a valores extremos. Mediana: valor central de los datos ordenados; es más resistente a extremos. Moda: valor que más se repite; puede haber varias. Para datos agrupados, el promedio con marcas de clase es aproximado.","formulas":["x̄ = Σxᵢ / n","x̄ = Σ(xᵢ × FAᵢ) / N  (con frecuencias)"],"symbols":[["x̄","media de la muestra"],["Σ","sumatoria: sumar los términos"],["xᵢ","cada observación"],["n","cantidad de observaciones"]],"example":"2, 4, 4, 6, 9 → media=5, mediana=4, moda=4.","note":""},{"title":"Percentiles y cuartiles de una muestra","body":"El percentil k es el valor que deja aproximadamente k % de observaciones por debajo, según el método de cálculo usado. P50 coincide con la mediana; P25 y P75 son cuartiles. Para ubicar el 10 % de valores más altos se usa P90, no P10. Los softwares pueden usar convenciones diferentes para interpolar percentiles muestrales.","formulas":[],"symbols":[],"example":"Si P80=18, el 80 % de observaciones queda aproximadamente hasta 18 y el 20 % superior comienza en ese entorno.","note":""},{"title":"Varianza y desvío estándar","body":"La varianza calcula cuánta separación cuadrática hay respecto de la media. Al restar la media a cada dato, elevar la diferencia al cuadrado y promediar esas desviaciones cuadradas, las diferencias negativas no se cancelan. Por estar al cuadrado, la varianza queda expresada en unidades². El desvío estándar es su raíz y vuelve a las unidades originales.","formulas":["s² = Σ(xᵢ − x̄)² / (n − 1)","s = √s²","σ² = Σ(xᵢ − μ)² / N  (población)"],"symbols":[["s²","varianza muestral"],["s","desvío estándar muestral"],["σ²","varianza poblacional"],["μ","media poblacional"],["n − 1","grados de libertad en varianza muestral"]],"example":"Datos 2,4,4,6,9: x̄=5; diferencias −3,−1,−1,1,4; cuadrados 9+1+1+1+16=28; s²=28/4=7; s≈2,646.","note":""},{"title":"Coeficiente de variación","body":"El CV expresa el desvío como porcentaje de la media en escalas de razón con media positiva y distinta de cero. Sirve para comparar dispersión relativa cuando las medias difieren. No es apropiado para cualquier puntaje psicométrico o medias cercanas a cero.","formulas":["CV = s / |x̄| × 100 %"],"symbols":[],"example":"Grupo A: media 60, s=12 → CV=20 %. Grupo B: media 40, s=6 → CV=15 %. A es relativamente más variable.","note":""},{"title":"Asimetría e interpretación","body":"Simétrica: la distribución tiene colas similares. Asimetría positiva: cola alargada hacia valores altos; valores extremos altos suelen empujar la media hacia arriba. Negativa: cola hacia valores bajos. El orden entre media/mediana/moda puede orientar, pero no prueba por sí solo la forma del gráfico.","formulas":[],"symbols":[],"example":"Moda 12, mediana 15, media 17,8: es compatible con asimetría positiva.","note":""},{"title":"Describir no es contrastar","body":"Una diferencia observada de medias, desvíos o percentiles describe la muestra. No habilita decir «estadísticamente significativa»: eso requiere un procedimiento inferencial (unidades 8–10).","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"04","module":4,"partial":1,"name":"Correlación y regresión","short":"Regresión","scope":"Dispersogramas, correlación de Pearson, R², recta, predicción y residuos.","intro":"Cuando hay dos variables numéricas medidas sobre las mismas unidades, podemos estudiar si cambian juntas. Correlación resume la asociación lineal; regresión construye una recta para estimar un valor de respuesta.","sections":[{"title":"Pares de datos y gráfico de dispersión","body":"Cada persona aporta un par (x,y). En el gráfico, x suele ir horizontal e y vertical. Una nube ascendente indica asociación positiva; descendente, negativa. La forma curva, los valores atípicos y los grupos mezclados pueden hacer que una recta sea inadecuada.","formulas":[],"symbols":[],"example":"Si a mayor estrés se observan menos horas de sueño, la nube tendería a descender.","note":""},{"title":"Coeficiente de correlación de Pearson","body":"El coeficiente r mide sentido e intensidad de la asociación LINEAL. Está entre −1 y 1 y carece de unidades. Cercano a +1: asociación lineal positiva fuerte; cercano a −1: negativa; cercano a 0: asociación lineal débil, aunque podría haber una relación curva.","formulas":["r = Σ[(xᵢ − x̄)(yᵢ − ȳ)] / √[Σ(xᵢ − x̄)² · Σ(yᵢ − ȳ)²]"],"symbols":[["r","correlación de Pearson"],["x̄","media de x"],["ȳ","media de y"]],"example":"","note":"No existe r=1,09. Correlación no implica causalidad."},{"title":"Recta de regresión simple","body":"La recta ŷ=a+bx predice el valor medio esperado de y para cada x. La pendiente b indica cuánto cambia la predicción cuando x aumenta una unidad. El intercepto a es la predicción para x=0: puede no tener sentido si cero queda muy lejos de los datos observados.","formulas":["ŷ = a + bx","b = Σ[(xᵢ − x̄)(yᵢ − ȳ)] / Σ(xᵢ − x̄)²","a = ȳ − bx̄"],"symbols":[["ŷ","valor predicho de y"],["a","intercepto u ordenada al origen"],["b","pendiente de la recta"],["x","variable predictora"]],"example":"Si ŷ=10,33−0,683x, para estrés x=7 se predicen ≈5,55 horas de sueño.","note":""},{"title":"R², residuos y calidad de ajuste","body":"En regresión simple con intercepto, R²=r² representa la proporción de variabilidad observada de y asociada al ajuste lineal. Un residuo es la diferencia entre el valor observado y el predicho. La recta de mínimos cuadrados busca minimizar la suma de residuos al cuadrado. R² no es una probabilidad de que el modelo sea verdadero ni un porcentaje de causalidad.","formulas":["R² = r²","eᵢ = yᵢ − ŷᵢ"],"symbols":[],"example":"Si r=−0,80, R²=0,64: 64 % de variabilidad de y queda explicada por el ajuste lineal en esa muestra.","note":""},{"title":"Predicción e interpretación responsable","body":"Interpolar es predecir dentro del rango observado; extrapolar, fuera. Las predicciones extrapoladas pueden ser poco fiables incluso con r alto. Una correlación puede depender de factores comunes no observados; usar «asociado» y «estimado», no «causó».","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"06","module":6,"partial":2,"name":"Probabilidad y tablas","short":"Probabilidad","scope":"Sucesos simples y conjuntos, unión, complementos, condicionales, independencia y diagnóstico.","intro":"Una probabilidad es una proporción entre 0 y 1. Casi todos los ejercicios de esta unidad se resuelven decidiendo cuál es el conjunto de referencia, qué sucesos se combinan y cuál es el denominador correcto.","sections":[{"title":"Qué representa una probabilidad","body":"P(A) describe la proporción de casos en los que ocurre el suceso A. Una probabilidad vale entre 0 y 1 (o entre 0 % y 100 %). Los «casos favorables / casos posibles» funcionan directamente cuando los casos son equiprobables o cuando se calculan proporciones en una tabla empírica.","formulas":["P(A) = casos de A / total"],"symbols":[["A","suceso o condición"],["P(A)","probabilidad de A"],["N","total de casos"]],"example":"De 30 personas, 13 presentan aislamiento: P(aislamiento)=13/30≈0,4333.","note":""},{"title":"Y, O y NO: tres preguntas diferentes","body":"A Y B exige ambos sucesos: intersección. A O B significa al menos uno de los dos: unión inclusiva, que también incluye la intersección. NO A es el complemento. La suma simple P(A)+P(B) cuenta dos veces a quienes están en ambos; por eso hay que restar la intersección.","formulas":["P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","P(no A) = 1 − P(A)"],"symbols":[["∩","intersección: A Y B"],["∪","unión: A O B"],["Aᶜ","complemento: NO A"]],"example":"Si P(A)=0,30, P(B)=0,60, P(A∩B)=0,05, la unión es 0,85 y ninguno 0,15.","note":""},{"title":"Probabilidad condicional","body":"«Entre quienes...», «dado que...» o «de los que...» indica que ya sabemos algo. No se toma toda la muestra como referencia; se toma únicamente el grupo de la condición conocida. La pregunta completa determina el numerador, el grupo conocido determina el denominador.","formulas":["P(A | B) = P(A ∩ B) / P(B)"],"symbols":[["P(A | B)","probabilidad de A sabiendo B"],["B","condición que restringe el total"]],"example":"En una tabla hay 17 personas sin aislamiento, de las cuales 11 viven con familia: P(familia | sin aislamiento)=11/17≈64,71 %.","note":""},{"title":"Independencia no es exclusión","body":"Sucesos independientes: conocer B no modifica la probabilidad de A. Sucesos excluyentes: no pueden ocurrir ambos. Si A y B tienen probabilidades positivas, no pueden ser al mismo tiempo independientes y excluyentes. Exhaustivos: entre ambos cubren todos los casos.","formulas":["Independencia ⇔ P(A ∩ B) = P(A)P(B)","Exclusión ⇔ P(A ∩ B) = 0","Exhaustividad ⇔ P(A ∪ B) = 1"],"symbols":[],"example":"P(A)=0,65, P(B)=0,40, P(A∩B)=0,26: 0,65×0,40=0,26 → independientes, pero no excluyentes.","note":""},{"title":"Reconstruir una tabla","body":"Si te dan totales de grupos y proporciones internas, empezá por calcular los tamaños de las filas. Luego completá los resultados «sí» y «no». Verificá que la suma de cada fila y columna coincida con sus totales. Si los porcentajes redondeados producen «media persona», el cálculo es aproximado.","formulas":[],"symbols":[],"example":"","note":""},{"title":"Pruebas diagnósticas","body":"La condición real enfermo/sano es distinta del resultado positivo/negativo del test. Sensibilidad y especificidad condicionan por la realidad clínica. Los valores predictivos condicionan por el resultado del test. La diferencia es el DENOMINADOR, no la operación.","formulas":["Sensibilidad = VP / (VP + FN)","Especificidad = VN / (VN + FP)","VPP = VP / (VP + FP)","VPN = VN / (VN + FN)"],"symbols":[["VP","verdadero positivo"],["VN","verdadero negativo"],["FP","falso positivo"],["FN","falso negativo"]],"example":"Si VP=86, FN=14, FP=8, VN=212: sensibilidad=86/100=86 %; VPP=86/94≈91,49 %. Son preguntas diferentes.","note":""}]},{"id":"07","module":7,"partial":2,"name":"Distribución normal","short":"Normal","scope":"Media, desviación estándar, puntuación z, áreas bajo la curva y percentiles.","intro":"La distribución normal es una curva de campana simétrica. La media determina el centro y el desvío la amplitud: una curva con desvío grande es más extendida. Con esos dos datos podemos convertir un puntaje en una proporción de la población.","sections":[{"title":"La campana y sus parámetros","body":"La normal es continua: la probabilidad de un valor exacto es cero, mientras que las probabilidades de intervalos son áreas bajo la curva. μ indica el centro. σ es la desviación estándar: cuánto suelen alejarse los valores de μ. σ² es la varianza, el cuadrado del desvío. Si la varianza es 196, el desvío es 14.","formulas":["X ∼ N(μ, σ²)","σ = √varianza"],"symbols":[["X","variable aleatoria de interés"],["μ (mu)","media poblacional"],["σ (sigma)","desvío estándar poblacional"],["σ²","varianza poblacional"]],"example":"Si μ=68 y σ=9, el centro está en 68; un valor 77 está un desvío por encima.","note":""},{"title":"Qué significa z","body":"Un mismo puntaje bruto puede ser alto en un test y bajo en otro. El z lo convierte en desvíos respecto de la media. z=0 es exactamente la media; z=+1, un desvío por encima; z=−2, dos por debajo. Así podemos comparar diferentes escalas.","formulas":["z = (x − μ) / σ"],"symbols":[["x","puntaje observado"],["μ","media"],["σ","desvío estándar"]],"example":"Para x=74, μ=68, σ=9: z=(74−68)/9≈0,667.","note":""},{"title":"La tabla normal Φ(z)","body":"Φ(z) es el área acumulada desde la izquierda hasta z. Por eso responde «menor que». Para «mayor que», queda el área complementaria: 1−Φ(z). Para «entre a y b», restás el área acumulada inferior de la superior. Cuando no hay tabla disponible, una calculadora de distribución normal puede obtener Φ.","formulas":["P(X < x) = Φ((x − μ)/σ)","P(X > x) = 1 − Φ((x − μ)/σ)","P(a < X < b) = Φ(zᵦ) − Φ(zₐ)"],"symbols":[],"example":"P(X>74), con μ=68 y σ=9: z≈0,667; 1−Φ(z)≈0,2525, o 25,25 %.","note":""},{"title":"Percentiles teóricos","body":"El percentil 90 es el valor por debajo del cual queda el 90 % de la distribución. Si se pide el «10 % con puntaje más alto», buscamos P90. Para obtener un puntaje a partir de un porcentaje, buscamos el z de ese porcentaje acumulado y deshacemos la estandarización.","formulas":["xₚ = μ + σ Φ⁻¹(p)"],"symbols":[["p","proporción acumulada a la izquierda, entre 0 y 1"],["Φ⁻¹(p)","cuantil de la normal estándar"]],"example":"Con μ=68 y σ=9, P10≈56,47 y P90≈79,53.","note":""},{"title":"De porcentajes a cantidades","body":"La probabilidad multiplicada por el tamaño del grupo da una CANTIDAD ESPERADA. Es una estimación; aunque 0,27×300=81, no significa que una muestra observada necesariamente tenga exactamente 81 casos.","formulas":["cantidad esperada = N × P(intervalo)"],"symbols":[],"example":"","note":""},{"title":"El primer paso es leer bien «supera», «hasta», «entre»","body":"«Supera», «más de», «al menos»: área derecha. «Menos de», «a lo sumo»: izquierda. «Entre»: dos límites. «10 % superior»: límite del percentil 90. Elegir mal el lado de la curva es un error más frecuente que equivocarse en la resta.","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"08","module":8,"partial":2,"name":"Inferencia e hipótesis","short":"Hipótesis","scope":"Muestras y poblaciones, H₀/H₁, α, valor p, una/dos colas y errores.","intro":"La inferencia usa información de una muestra para evaluar afirmaciones sobre una población. Una prueba no «demuestra» una hipótesis: calcula qué tan incompatibles son los datos con un modelo nulo, siguiendo una regla fijada de antemano.","sections":[{"title":"Muestra frente a población","body":"Una media muestral x̄ estima una media poblacional μ; una proporción muestral p̂ estima p. La variabilidad de muestreo hace que la estimación cambie entre muestras. Una diferencia en la muestra puede deberse al azar o reflejar una diferencia poblacional.","formulas":[],"symbols":[["x̄","media calculada en la muestra"],["μ","media verdadera de la población"],["p̂","proporción muestral"],["p","proporción poblacional"]],"example":"","note":""},{"title":"Hipótesis nula y alternativa","body":"H₀ representa la igualdad o ausencia de diferencia en la frontera del contraste. H₁ plantea la diferencia o dirección que buscamos. Antes de escribir mayor/menor definí el orden de resta: «después menos antes» tiene signo negativo si el puntaje baja. En pares se trabaja con la media de diferencias μd.","formulas":["H₀: μdespués − μantes = 0","H₁: μdespués − μantes < 0  (disminuye)"],"symbols":[["H₀","hipótesis nula"],["H₁","hipótesis alternativa"],["μd","media poblacional de diferencias"]],"example":"Un taller busca reducir impulsividad. Definís d=después−antes; H₁: μd<0.","note":""},{"title":"α y valor p","body":"α es el nivel de significación elegido (por ejemplo 0,05). El valor p describe cuán extremos serían los datos observados bajo el modelo de H₀. Si p≤α, se rechaza H₀; si p>α, no se rechaza. El valor p NO es la probabilidad de que H₀ sea verdadera ni el porcentaje de efecto producido.","formulas":["p ≤ α → rechazar H₀","p > α → no rechazar H₀"],"symbols":[["α (alfa)","umbral del contraste, 5 %=0,05"],["p","valor p del resultado"]],"example":"p=0,02 y α=0,05: rechazar H₀. p=0,06 y α=0,05: no rechazar H₀.","note":""},{"title":"Una cola o dos colas","body":"«Aumenta», «disminuye», «mayor que»: alternativa direccional, una cola. «Difiere», «cambia», «no es igual»: alternativa bilateral, dos colas. Se decide según la pregunta científica ANTES de mirar los datos; no se cambia a una cola para conseguir un p menor.","formulas":[],"symbols":[],"example":"","note":""},{"title":"Errores de las pruebas","body":"Error tipo I: rechazar una H₀ verdadera. Error tipo II: no rechazar una H₀ falsa. α controla el riesgo tipo I bajo las condiciones del procedimiento. La potencia es la probabilidad de detectar un efecto cuando realmente existe; es 1−β, donde β representa la probabilidad de error tipo II.","formulas":["potencia = 1 − β"],"symbols":[["β (beta)","probabilidad de error tipo II"]],"example":"«No hubo evidencia estadística suficiente» no equivale a «se probó que no hay efecto».","note":""},{"title":"Qué se puede concluir","body":"Un resultado significativo no necesariamente es grande o relevante clínicamente. Una prueba realizada sobre grupos no aleatorizados tampoco convierte la diferencia en causal. Una conclusión útil nombra variable, grupos o momentos, dirección y nivel de significación.","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"09","module":9,"partial":2,"name":"Comparación de medias","short":"Medias","scope":"t apareada, t independiente, prueba de Welch, Levene y conclusiones.","intro":"Primero reconocé el diseño: ¿las dos mediciones son de las mismas personas, o hay dos grupos distintos? Esa decisión determina qué prueba t corresponde. Después se plantean hipótesis y se interpreta el valor p.","sections":[{"title":"Qué mide la prueba t","body":"Una prueba t compara medias teniendo en cuenta la variabilidad y el tamaño muestral. No alcanza con que la media A sea numéricamente mayor que B: hay que evaluar cuánto de esa diferencia es compatible con la variabilidad observada bajo H₀.","formulas":[],"symbols":[],"example":"","note":"Si el resultado es sí/no en vez de un puntaje cuantitativo, normalmente corresponde una comparación de proporciones (unidad 10)."},{"title":"Muestras apareadas","body":"Se comparan dos mediciones relacionadas de cada sujeto: antes y después, mano derecha/izquierda de una misma persona, con y sin condición. Se calcula una sola lista de diferencias y se analiza su media. La variación relevante es la de esas diferencias, NO la de dos grupos separados.","formulas":["dᵢ = despuésᵢ − antesᵢ","t = d̄ / (sᵈ / √n)","gl = n − 1"],"symbols":[["dᵢ","diferencia individual"],["d̄","media de las diferencias"],["sᵈ","desvío de las diferencias"],["gl","grados de libertad"]],"example":"Cuatro participantes: antes 10,8,12,9; después 7,7,9,8 → d=−3,−1,−3,−1; d̄=−2; t≈−3,464, gl=3.","note":""},{"title":"Muestras independientes","body":"Se comparan las medias de dos grupos distintos. Si las varianzas pueden ser diferentes, la opción de Welch suele ser apropiada. La versión de varianza combinada exige un supuesto adicional de homogeneidad y usa otros grados de libertad.","formulas":["tWelch = (x̄₁ − x̄₂) / √(s₁²/n₁ + s₂²/n₂)"],"symbols":[["x̄₁, x̄₂","medias muestrales de cada grupo"],["s₁, s₂","desvíos de cada grupo"],["n₁, n₂","cantidades de cada grupo"]],"example":"","note":""},{"title":"Levene y los supuestos","body":"Levene examina evidencia contra la igualdad de varianzas; su p NO determina si el tratamiento tuvo efecto. Con p de Levene pequeño, una opción robusta es Welch. También importa independencia de observaciones, tratamiento correcto de pares y, especialmente con muestras pequeñas, la forma aproximada de la distribución relevante.","formulas":[],"symbols":[],"example":"","note":""},{"title":"Cuando te entregan p directamente","body":"No reconstruyas toda la prueba si el examen solo pregunta H₀/H₁, variables, elección y conclusión. Verificá primero si la comparación es apareada o independiente; después compará p con α y redactá una conclusión concreta. Si la consigna ya entrega p=0,02 no inventes una media o un t que no está dado.","formulas":[],"symbols":[],"example":"","note":""},{"title":"Interpretar un resultado no significativo","body":"Si p>α, la conclusión correcta es «no hay evidencia suficiente para afirmar la diferencia especificada». No significa «ambos tratamientos producen exactamente lo mismo». Una diferencia observada tampoco demuestra causalidad si el diseño no permite inferirla.","formulas":[],"symbols":[],"example":"","note":""}]},{"id":"10","module":10,"partial":2,"name":"Comparación de proporciones","short":"Proporciones","scope":"Dos porcentajes, diferencia en puntos porcentuales, prueba z y decisiones.","intro":"Si la respuesta es binaria (sí/no) y queremos saber si dos grupos independientes tienen proporciones distintas, usamos un contraste de proporciones. La operación se parece a comparar medias, pero ahora contamos casos favorables.","sections":[{"title":"Proporción: casos favorables dentro de cada grupo","body":"La proporción p̂ se obtiene dividiendo casos «sí» por el total del grupo. Para comparar grupos de tamaños diferentes no mires solo los conteos absolutos. La diferencia 0,35−0,20=0,15 equivale a 15 puntos porcentuales, no necesariamente a «15 % más» relativo.","formulas":["p̂₁ = x₁ / n₁","p̂₂ = x₂ / n₂"],"symbols":[["x₁, x₂","casos favorables de cada grupo"],["n₁, n₂","totales de cada grupo"]],"example":"TCC 42/120=35 %; Mindfulness 20/100=20 %: diferencia de 15 puntos porcentuales.","note":""},{"title":"Hipótesis sobre proporciones","body":"En la prueba bilateral, H₀: p₁=p₂; H₁: p₁≠p₂. Para preguntar si la proporción de A es mayor que la de B, H₁: pA>pB. El sentido se decide antes de usar los datos.","formulas":["H₀: p₁ = p₂","H₁: p₁ ≠ p₂  (dos colas)"],"symbols":[],"example":"","note":""},{"title":"La prueba z de dos proporciones","body":"Bajo H₀ de igualdad se calcula una proporción conjunta de ambas muestras. Con ella se estima el error estándar de la diferencia. Después se obtiene un z y una probabilidad de cola. El procedimiento presupone grupos independientes y recuentos suficientes para aproximación normal.","formulas":["p̂ = (x₁+x₂) / (n₁+n₂)","EE₀ = √[p̂(1−p̂)(1/n₁+1/n₂)]","z = (p̂₁ − p̂₂) / EE₀"],"symbols":[["p̂","proporción combinada bajo H₀"],["EE₀","error estándar bajo la hipótesis nula"]],"example":"","note":"Si los recuentos esperados son muy bajos, corresponde evaluar una prueba exacta en lugar de confiar ciegamente en z."},{"title":"Valor p y cola de la hipótesis","body":"Con H₁:p₁>p₂, el área derecha de z. Con H₁:p₁<p₂, el área izquierda. Con H₁:p₁≠p₂, ambas colas. Una vez calculado el valor p, se compara con α como en la unidad 8.","formulas":["p bilateral = 2 × [1 − Φ(|z|)]"],"symbols":[],"example":"TCC 42/120 y Mindfulness 20/100: z≈2,46; p bilateral≈0,0138; con α=0,05 hay evidencia de diferencia.","note":""},{"title":"Distinguir porcentajes, tablas y promedios","body":"Si pregunta «¿qué porcentaje de esta tabla...?», es probabilidad descriptiva de la unidad 6. Si pide comprobar si dos porcentajes poblacionales difieren, es contraste de proporciones. Si pregunta por dos medias de un puntaje 0–100, es contraste de medias. El mismo contexto puede dar lugar a las tres preguntas.","formulas":[],"symbols":[],"example":"","note":""},{"title":"El problema de porcentajes redondeados","body":"Si una consigna indica «51 % de 125 personas», multiplicar da 63,75, que no puede ser un número exacto de individuos. Eso señala un porcentaje redondeado o una aproximación. No uses ese 63,75 como un recuento literal sin aclaración.","formulas":[],"symbols":[],"example":"","note":""}]}],"recipes":[{"id":1,"title":"Desarmar una investigación","trigger":"Preguntan población, muestra, unidad de análisis o hipótesis de investigación.","inputs":"Contexto, participantes, fenómeno, forma de medición.","formula":"n = tamaño de la muestra","steps":["Leé a quién se quiere estudiar.","Localizá quiénes fueron efectivamente medidos.","Identificá la unidad a la que corresponde cada observación.","Separá la condición comparada del resultado medido.","Redactá una hipótesis que no invente resultados."],"pitfall":"No supongas que el tamaño de la población es igual a la muestra.","unit":"01"},{"id":2,"title":"Clasificar variables","trigger":"Preguntan por tipo y escala de variables en un estudio.","inputs":"Valores reales que toma cada variable, y qué representan.","formula":"Cualitativa: nominal / ordinal · Cuantitativa: discreta / continua · Escalas: intervalo / razón","steps":["Determinar si el dato es una etiqueta o una medida numérica.","Si es categoría, decidir si tiene orden.","Si es numérico, decidir si es conteo o medida.","Analizar si el cero es absoluto antes de elegir razón.","Identificar cuál es respuesta y cuál es condición comparada."],"pitfall":"No clasifiques un puntaje psicológico como razón solo porque empieza en 0.","unit":"01"},{"id":3,"title":"Reconocer el diseño","trigger":"Preguntan si un estudio es experimental, observacional, transversal o longitudinal.","inputs":"Quién asignó condiciones, cuántas mediciones y en qué personas.","formula":"Experimental / observacional · Transversal / longitudinal · Apareado / independiente","steps":["Identificar si el investigador interviene o solo observa.","Determinar si se sigue a las mismas personas en el tiempo.","Indicar si las mediciones se emparejan por persona.","Escribir los ejes del diseño por separado."],"pitfall":"Longitudinal no implica experimental; mismo n no implica muestras apareadas.","unit":"01"},{"id":4,"title":"Formular una hipótesis sustantiva","trigger":"Piden qué espera demostrar o investigar un estudio, en palabras.","inputs":"Variable de respuesta, condición y dirección del efecto esperado.","formula":"«Se espera que [grupo/momento] tenga [mayor/menor/diferente] [variable]».","steps":["Encontrá la variable cuyo comportamiento se quiere entender.","Identificá los grupos o momentos.","Traducí la expectativa del texto sin cambiar la dirección.","No escribas un resultado estadístico que no se calculó."],"pitfall":"Una hipótesis de investigación no se sustituye automáticamente por H₀/H₁.","unit":"01"},{"id":5,"title":"Completar una tabla de frecuencias","trigger":"Aparece una lista de FA y faltan FR, FAA, FRA.","inputs":"Frecuencias absolutas por fila y total N.","formula":"FRᵢ=FAᵢ/N · FAAᵢ=Σⱼ≤ᵢ FAⱼ · FRAᵢ=FAAᵢ/N","steps":["Sumá las FA para hallar N.","Dividí cada FA por N.","Acumulá las FA de arriba hacia abajo.","Dividí los acumulados por N.","Chequeá que los últimos acumulados sean N y 1."],"pitfall":"No confundas la frecuencia del intervalo con lo que se acumuló hasta ese intervalo.","unit":"02"},{"id":6,"title":"Completar celdas faltantes","trigger":"La tabla tiene un total y algunos valores faltantes.","inputs":"Total de fila/columna y celdas conocidas.","formula":"Faltante = total − suma de conocidos","steps":["Elegí la fila o columna con una sola incógnita.","Restá al total los valores conocidos.","Colocá la diferencia en la casilla.","Repetí y verificá todos los totales."],"pitfall":"No inventes un valor si hay más incógnitas que ecuaciones independientes.","unit":"02"},{"id":7,"title":"Elegir e interpretar gráficos","trigger":"Piden elegir tipo de gráfico o interpretar sus ejes y forma.","inputs":"Tipo de variable, escala del eje y propósito.","formula":"Categoría → barras · Intervalos numéricos → histograma · Pares (x,y) → dispersión","steps":["Identificá la variable que se está graficando.","Leé unidades y escalas.","Elegí el gráfico adecuado para el tipo de variable.","Interpretá el valor o tendencia sin asumir valores invisibles."],"pitfall":"Un histograma no equivale a barras de categorías; revisá ejes truncados.","unit":"02"},{"id":8,"title":"Porcentaje de una tabla cruzada","trigger":"Hay dos variables cruzadas y preguntan porcentaje de una combinación.","inputs":"Celda de interés y total relevante.","formula":"% = celda / denominador ×100","steps":["Subrayá «del total», «de una fila» o «de una columna».","Encontrá la celda de la combinación.","Elegí el total correspondiente como denominador.","Dividí y convertí a porcentaje."],"pitfall":"El mismo numerador puede dar porcentajes distintos según el denominador.","unit":"02"},{"id":9,"title":"Media, mediana y moda","trigger":"Piden tres medidas del centro de una distribución.","inputs":"Datos observados o tabla de frecuencias.","formula":"x̄=Σxᵢ/n · Mediana = centro de datos ordenados · Moda = más frecuente","steps":["Calculá el total y el promedio.","Ordená para identificar el centro.","Contá repeticiones para la moda.","Interpretá cada medida y su resistencia a extremos."],"pitfall":"La moda no es necesariamente única; la mediana no siempre coincide con la media.","unit":"03"},{"id":10,"title":"Leer percentiles empíricos","trigger":"Piden interpretar P20, P80 u otra posición de muestra.","inputs":"Percentil informado o datos ordenados y convención de cálculo.","formula":"Pₖ deja aproximadamente k % por debajo.","steps":["Determiná qué porcentaje queda por debajo.","Si piden grupo superior, usá su complemento.","Interpretá el valor en las unidades de la variable.","Cuando haya que calcular el percentil, usá la convención indicada por cátedra/software."],"pitfall":"No uses la fórmula normal teórica para percentiles de muestra sin supuesto normal.","unit":"03"},{"id":11,"title":"Varianza, desvío y CV","trigger":"Piden cuánto varía un conjunto o su heterogeneidad.","inputs":"Valores, media, n y escala de la variable.","formula":"s²=Σ(xᵢ−x̄)²/(n−1) · s=√s² · CV=s/|x̄|×100","steps":["Calculá la media.","Restá la media a cada dato y elevá al cuadrado.","Sumá los cuadrados y dividí por n−1 (muestra).","Extraé la raíz para el desvío.","Si corresponde, dividí s por |media| y multiplicá por 100."],"pitfall":"La varianza tiene unidades al cuadrado. CV no es válido para medias nulas o muchas escalas de intervalo.","unit":"03"},{"id":12,"title":"Comparar centro y dispersión","trigger":"Dos grupos tienen medias, medianas, s o CV.","inputs":"Tablas descriptivas comparables.","formula":"Comparar x̄/mediana · comparar s o CV","steps":["Determiná cuál presenta centro más alto.","Determiná cuál muestra mayor dispersión.","Si las medias o unidades difieren y es válido, compará CV.","No confundas «mayor promedio» con «mayor dispersión»."],"pitfall":"Sin prueba inferencial no declares que la diferencia es estadísticamente significativa.","unit":"03"},{"id":13,"title":"Describir la asimetría","trigger":"Se muestra una distribución o media, mediana y moda.","inputs":"Histograma o coeficiente de asimetría, medidas de centro.","formula":"Cola derecha → positiva · Cola izquierda → negativa","steps":["Observá qué cola es más larga.","Considerá si hay valores extremos que desplazan la media.","Apoyá la interpretación en el gráfico o coeficiente.","Explicá en términos de puntajes altos o bajos."],"pitfall":"El orden de media/mediana/moda es solo indicio, no prueba universal.","unit":"03"},{"id":14,"title":"Reconocer sentido de relación","trigger":"Aparece un diagrama de dispersión.","inputs":"Ejes x/y y puntos observados.","formula":"Nube ascendente ↗ positiva · Descendente ↘ negativa","steps":["Identificá ambas variables.","Mirálas como pares de observaciones.","Reconocé tendencia ascendente, descendente o ausencia de tendencia lineal.","Describí sin afirmar causalidad."],"pitfall":"La relación puede ser curva aunque la correlación lineal sea pequeña.","unit":"04"},{"id":15,"title":"Interpretar o calcular r","trigger":"Piden asociación lineal con signo e intensidad.","inputs":"Pares de valores o r informado.","formula":"r=Σ[(xᵢ−x̄)(yᵢ−ȳ)] / √[Σ(xᵢ−x̄)²·Σ(yᵢ−ȳ)²]","steps":["Si r está dado, mirá signo y valor absoluto.","Si no está, calculá medias y desvíos de cada par.","Dividí covariación por magnitudes cuadráticas.","Comprobá −1≤r≤1 y describí tendencia lineal."],"pitfall":"r=0 no excluye relaciones no lineales; r no tiene unidades.","unit":"04"},{"id":16,"title":"Encontrar la recta de regresión","trigger":"Piden construir la ecuación predictiva a partir de pares.","inputs":"Pares (x,y), medias, pendiente e intercepto.","formula":"ŷ=a+bx · b=Σ[(xᵢ−x̄)(yᵢ−ȳ)]/Σ(xᵢ−x̄)² · a=ȳ−bx̄","steps":["Calculá las medias de x e y.","Calculá la pendiente b de todos los pares.","Calculá a=ȳ−bx̄.","Escribí ŷ=a+bx.","Interpretá signo y unidades de b."],"pitfall":"No intercambies x e y; el intercepto puede no tener significado fuera del rango observado.","unit":"04"},{"id":17,"title":"Interpretar R²","trigger":"Entregan r o R² y preguntan proporción explicada.","inputs":"Coeficiente r o valor R² de una regresión simple.","formula":"R²=r²","steps":["Elevá r al cuadrado si solo te dan r.","Multiplicá por 100 para obtener el porcentaje.","Interpretá como variabilidad explicada por el modelo lineal."],"pitfall":"R² no mide porcentaje de personas ni demuestra causalidad.","unit":"04"},{"id":18,"title":"Predecir con una recta","trigger":"Dan ŷ=a+bx y un valor de x.","inputs":"a, b y x consultado.","formula":"ŷ=a+bx","steps":["Identificá los coeficientes y su signo.","Sustituí el valor x sin cambiar unidades.","Calculá la predicción de y.","Expresá resultado y unidad."],"pitfall":"Una predicción de la recta no es un valor observado exacto.","unit":"04"},{"id":19,"title":"Evaluar límites de una predicción","trigger":"Piden si se puede extrapolar o atribuir causalidad.","inputs":"Rango de x observado, relación y diseño.","formula":"Residuo: eᵢ=yᵢ−ŷᵢ","steps":["Verificá rango observado y posición del x a predecir.","Revisá si la relación es aproximadamente lineal.","Identificá posibles valores atípicos y variables omitidas.","Explicá la diferencia entre predicción descriptiva y causalidad."],"pitfall":"Un r muy alto no valida extrapolaciones lejanas.","unit":"04"},{"id":20,"title":"Probabilidad simple y conjunta","trigger":"Preguntan «al azar», «A», «A y B».","inputs":"Total N, total del evento o celda común.","formula":"P(A)=n(A)/N · P(A∩B)=n(A y B)/N","steps":["Si es un evento, elegí el marginal de ese evento.","Si son ambos simultáneamente, elegí la intersección.","Dividí por el total general N.","Convertí a porcentaje si corresponde."],"pitfall":"No cambiar el denominador a un subgrupo salvo que la consigna condicione.","unit":"06"},{"id":21,"title":"Probabilidad condicional","trigger":"Dicen «entre los que», «dado que», «de quienes».","inputs":"Casos que cumplen A y B, total del grupo B.","formula":"P(A|B)=n(A∩B)/n(B)","steps":["Identificá la condición ya conocida B.","Usá n(B) como denominador.","Buscá la casilla A y B para numerador.","Dividí y expresá en porcentaje."],"pitfall":"P(enfermo|positivo) no es lo mismo que P(positivo|enfermo).","unit":"06"},{"id":22,"title":"Comparar probabilidad entre grupos","trigger":"Preguntan «¿en cuál grupo es más probable?».","inputs":"Numerador y tamaño propios de cada grupo.","formula":"P(resultado|grupo)=casos en grupo / total grupo","steps":["Calculá proporción del evento dentro de cada grupo.","Llevá ambas a porcentajes comparables.","Compará resultados, no cantidades brutas.","Nombrá cuál es mayor sin atribuir causalidad automáticamente."],"pitfall":"No dividir ambos numeradores por el total general.","unit":"06"},{"id":23,"title":"Unión, intersección y complemento","trigger":"Piden «A o B», «ninguno», «solo A».","inputs":"P(A), P(B) y P(A∩B).","formula":"P(A∪B)=P(A)+P(B)−P(A∩B) · P(ninguno)=1−P(A∪B)","steps":["Reconocé Y como intersección y O como unión inclusiva.","Si pide unión, sumá marginales y restá superposición.","Si pide ninguno, restá la unión a 1.","Si pide solo A, restá la intersección de P(A)."],"pitfall":"Si no dan intersección ni supuestos, muchas uniones no se pueden calcular.","unit":"06"},{"id":24,"title":"Independencia y exclusión","trigger":"Preguntan si dos sucesos son independientes/excluyentes/exhaustivos.","inputs":"P(A), P(B), P(A∩B), P(A∪B).","formula":"Independencia: P(A∩B)=P(A)P(B) · Exclusión: P(A∩B)=0","steps":["Calculá la intersección si falta y hay datos.","Compará intersección con producto para independencia.","Compará intersección con 0 para exclusión.","Compará unión con 1 para exhaustividad."],"pitfall":"Exclusión e independencia no son sinónimos.","unit":"06"},{"id":25,"title":"Armar tabla desde porcentajes","trigger":"Dan tamaños de grupos y porcentajes condicionales.","inputs":"N, porcentaje por grupo y del resultado dentro de cada grupo.","formula":"n(A)=N·P(A) · n(sí en A)=n(A)·P(sí|A)","steps":["Calculá total de cada grupo.","Multiplicá por porcentaje «sí» de cada grupo.","Obtené «no» por diferencia.","Completá sumas marginales y revisá consistencia."],"pitfall":"Si aparecen personas fraccionarias por redondeo, no las trates como conteos exactos.","unit":"06"},{"id":26,"title":"Sensibilidad y especificidad de un test","trigger":"Tabla diagnóstico positivo/negativo cruzada con realidad sano/enfermo.","inputs":"VP, VN, FP, FN.","formula":"Sensibilidad=VP/(VP+FN) · Especificidad=VN/(VN+FP) · VPP=VP/(VP+FP)","steps":["Separá la condición REAL del resultado del TEST.","Ubicá VP, VN, FP, FN en la matriz.","Elegí el denominador según «entre enfermos / entre positivos».","Dividí y nombrá qué medida calculaste."],"pitfall":"Sensibilidad no es lo mismo que valor predictivo positivo.","unit":"06"},{"id":27,"title":"Reconstruir tabla incompleta","trigger":"Dan probabilidades marginales y conjuntas de dos condiciones.","inputs":"Marginales, intersecciones y complementos.","formula":"P(A∩Bᶜ)=P(A)−P(A∩B)","steps":["Dibujá cuatro celdas 2×2.","Colocá las intersecciones dadas.","Completá por resta con marginales.","Usá complementos para cerrar.","Aplicá condicional si se solicita."],"pitfall":"Verificá que todas las celdas sean ≥0 y sumen 1.","unit":"06"},{"id":28,"title":"Estandarizar un puntaje","trigger":"Dan media, desvío y un puntaje: piden z o interpretación.","inputs":"x, μ, σ (si dan varianza, extraer la raíz).","formula":"z=(x−μ)/σ","steps":["Identificá μ y σ, no σ².","Restá x−μ.","Dividí por σ.","Decí cuántos desvíos y en qué dirección está x."],"pitfall":"No dividir por varianza cuando el enunciado pide desvío.","unit":"07"},{"id":29,"title":"Área menor, mayor o entre","trigger":"Dan normal y piden porcentaje «menos», «más» o «entre».","inputs":"μ, σ y los límites del intervalo.","formula":"P(X<x)=Φ(z) · P(X>x)=1−Φ(z) · P(a<X<b)=Φ(zb)−Φ(za)","steps":["Estandarizá cada límite con z.","Buscá Φ(z) en tabla/calculadora.","Elegí área izquierda, complemento o diferencia.","Expresá en porcentaje y verificá que quede entre 0 y 100."],"pitfall":"«Mayor que» pide 1−Φ, no Φ directamente.","unit":"07"},{"id":30,"title":"Encontrar un percentil normal","trigger":"Piden el puntaje que divide un X % inferior o superior.","inputs":"μ, σ y porcentaje acumulado a la izquierda p.","formula":"xₚ=μ+σ·Φ⁻¹(p)","steps":["Convertí el porcentaje a p acumulado a la izquierda.","Si pide X % superior, usá 1−X %.","Buscá z=Φ⁻¹(p).","Desestandarizá x=μ+σz."],"pitfall":"10 % superior corresponde a P90, no a P10.","unit":"07"},{"id":31,"title":"Convertir probabilidad en personas","trigger":"Piden «¿cuántas personas se espera?» en una población de N.","inputs":"P del evento y N.","formula":"Cantidad esperada=N×P","steps":["Obtené P mediante la distribución o una proporción.","Multiplicá N×P.","Redondeá al final si son personas.","Escribí que es una cantidad esperada."],"pitfall":"No interpretar la esperanza como cantidad observada exacta.","unit":"07"},{"id":32,"title":"Comparar puntajes entre tests","trigger":"Piden en qué escala una persona está relativamente más alta.","inputs":"x, μ, σ de cada test.","formula":"z₁=(x₁−μ₁)/σ₁ · z₂=(x₂−μ₂)/σ₂","steps":["Calculá z por separado en cada escala.","Compará los z, no los valores brutos.","Un z mayor indica posición relativa mayor.","Interpretá en desvíos."],"pitfall":"No comparar 80 puntos en un test con 30 en otro sin estandarizar.","unit":"07"},{"id":33,"title":"Traducir frases a cola y percentil","trigger":"Usan «al menos», «a lo sumo», «lo supera el 60 %».","inputs":"Expresión verbal y área de interés.","formula":"Superior q % → P(100−q) · Inferior q % → P(q)","steps":["Identificá si se busca un área o un valor de corte.","Decidí izquierda, derecha o entre.","Traducí a Φ o a un percentil.","Resolvés después con R29 o R30."],"pitfall":"El lenguaje del enunciado determina qué operación corresponde.","unit":"07"},{"id":34,"title":"Identificar pregunta estadística","trigger":"Hay una pregunta sobre comparación o efecto.","inputs":"Variable respuesta y condición comparada.","formula":"Una cola: > o < · Dos colas: ≠","steps":["Encontrá qué se mide.","Identificá grupos o momentos.","Determiná si se espera diferencia con dirección.","Redactá hipótesis de investigación clara."],"pitfall":"No confundas «se desea estudiar» con un resultado probado.","unit":"08"},{"id":35,"title":"Escribir H₀ y H₁","trigger":"Piden hipótesis nula y alternativa, «reducir», «aumentar», «diferir».","inputs":"Orden de resta, población e hipótesis direccional.","formula":"d=después−antes: reduce → H₁: μd<0; H₀: μd≥0","steps":["Definí exactamente qué diferencia calcularás.","Traducí la expectativa a <, > o ≠.","Escribí H₁ con ese signo.","Escribí H₀ como igualdad o región complementaria."],"pitfall":"Si invertís la resta tenés que invertir el signo de H₁.","unit":"08"},{"id":36,"title":"Tomar decisión con p y α","trigger":"Ya dan p y significación α.","inputs":"Valor p, α y dirección de H₁.","formula":"p≤α → rechazar H₀ · p>α → no rechazar H₀","steps":["Convertí α a decimal.","Compará p con α.","Escribí la decisión.","Redactá qué significa para la variable real del caso."],"pitfall":"No concluyas «H₀ es cierta» cuando p>α.","unit":"08"},{"id":37,"title":"Errores I y II","trigger":"Preguntan qué error puede cometerse en una decisión.","inputs":"H₀ verdadera/falsa y rechazar/no rechazar.","formula":"Tipo I: rechazar H₀ verdadera · Tipo II: no rechazar H₀ falsa","steps":["Identificá decisión de la prueba.","Imaginá si en realidad H₀ era verdadera o falsa.","Clasificá el error posible.","No afirmes que el error ocurrió realmente."],"pitfall":"α no es la probabilidad posterior de que esta decisión concreta sea equivocada.","unit":"08"},{"id":38,"title":"Una o dos colas","trigger":"Preguntan por dirección de H₁.","inputs":"Expresiones «mayor», «menor», «difiere».","formula":"H₁: ≠ → dos colas · H₁: >/< → una cola","steps":["Leé si existe una dirección científica previa.","Escribí el signo de H₁.","Elegí una o dos colas.","Aplicá el valor p correspondiente a esa elección."],"pitfall":"No elijas unilateral después de conocer el resultado.","unit":"08"},{"id":39,"title":"Concluir sin afirmar causalidad","trigger":"Piden redactar una conclusión de una prueba.","inputs":"Diseño, resultado p y tamaño del efecto si existe.","formula":"Conclusión = dirección + evidencia estadística + límites del diseño","steps":["Escribí si rechazaste H₀ o no.","Nombrá las variables y grupos.","Distinguí significación de relevancia clínica.","Solo hablá de causalidad si el diseño lo respalda."],"pitfall":"p pequeño no demuestra que la intervención causó un cambio grande.","unit":"08"},{"id":40,"title":"Elegir t apareada o independiente","trigger":"Comparan promedios entre dos momentos o dos grupos.","inputs":"Quién aporta cada medición y tipo de variable respuesta.","formula":"Mismas personas → t apareada · Personas distintas → t independiente","steps":["Identificá qué puntaje numérico se mide.","Preguntá si cada persona aparece dos veces.","Si sí, apareada; si no, independiente.","Justificá con el diseño."],"pitfall":"No llamar «dos grupos» a antes y después de las mismas personas.","unit":"09"},{"id":41,"title":"Identificar variables para prueba t","trigger":"Piden variable independiente/dependiente y escala.","inputs":"Tratamiento, momento y puntaje de resultado.","formula":"Respuesta cuantitativa · Condición nominal","steps":["Nombrá el puntaje dependiente.","Nombrá el factor grupo/momento independiente.","Indicá escala esperada según cátedra.","Vinculá con el tipo de prueba."],"pitfall":"Un puntaje 0–100 es distinto de una respuesta sí/no.","unit":"09"},{"id":42,"title":"H₀/H₁ para diferencia de medias","trigger":"Piden hipótesis sobre medias de tratamiento o cambio.","inputs":"Orden de diferencia y dirección esperada.","formula":"H₀: μA−μB=0 · H₁: μA−μB<0, >0 o ≠0","steps":["Definí las dos medias o la media de diferencias.","Anotá el orden de resta.","Expresá la predicción en signos.","Verificá que no haya contradicción con el enunciado."],"pitfall":"H₁ «menos» invierte signo si invertís grupos.","unit":"09"},{"id":43,"title":"Calcular t apareada","trigger":"Dan pares de puntajes y piden contraste.","inputs":"dᵢ, n, α.","formula":"t=d̄/(sᵈ/√n), gl=n−1","steps":["Restá las observaciones por pares.","Calculá media y desvío de las diferencias.","Dividí por el error estándar.","Buscá p unilateral/bilateral según H₁.","Tomá decisión con α."],"pitfall":"No uses el desvío de dos muestras independientes.","unit":"09"},{"id":44,"title":"Calcular t independiente (Welch)","trigger":"Dan n, medias y desvíos de dos grupos distintos.","inputs":"n₁, n₂, x̄₁, x̄₂, s₁, s₂.","formula":"t=(x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂)","steps":["Calculá diferencia de medias con orden definido.","Calculá error estándar de Welch.","Obtené t y grados de libertad ajustados en software.","Calculá o interpretá p y concluí."],"pitfall":"No asumir varianzas iguales sin justificarlo.","unit":"09"},{"id":45,"title":"Interpretar Levene","trigger":"La salida de Jamovi incluye p de Levene.","inputs":"p de Levene y α.","formula":"pLevene≤α → evidencia contra varianzas iguales","steps":["Separá el contraste de varianzas del contraste de medias.","Si Levene significativo, elegí procedimiento sin igualdad de varianzas.","Si no, no afirmes igualdad demostrada.","No confundas el p de Levene con el p de efecto terapéutico."],"pitfall":"Levene evalúa varianzas, no diferencia de promedios.","unit":"09"},{"id":46,"title":"Concluir prueba t con p dado","trigger":"Dan p de t y piden conclusión y prueba.","inputs":"Tipo de diseño, p, α, H₁.","formula":"p≤α → rechazar H₀","steps":["Elegí apareada/independiente.","Definí H₀/H₁.","Compará p con α.","Redactá conclusión concreta y condicional."],"pitfall":"No reconstruyas t si no es necesario.","unit":"09"},{"id":47,"title":"Comparar descriptivos de medias","trigger":"Preguntan qué grupo es mayor o más heterogéneo.","inputs":"Medias, s, CV por grupo.","formula":"CV=s/|x̄|×100","steps":["Compará valores medios para centro.","Compará s/CV para dispersión.","Describí dirección de diferencias.","Separá descripción de inferencia estadística."],"pitfall":"Promedio más alto no implica grupo más variable.","unit":"09"},{"id":48,"title":"Calcular proporciones por grupo","trigger":"Dan conteos sí/no y totales de dos grupos.","inputs":"Casos sí y total de cada grupo.","formula":"p̂₁=x₁/n₁ · p̂₂=x₂/n₂","steps":["Determiná qué cuenta como «éxito».","Dividí por total propio de cada grupo.","Convertí a porcentaje.","Restá proporciones si pide puntos porcentuales."],"pitfall":"35 % frente a 20 % son 15 puntos porcentuales, no 15 % relativo.","unit":"10"},{"id":49,"title":"H₀/H₁ para porcentajes","trigger":"Preguntan si una proporción poblacional difiere o supera otra.","inputs":"Dirección investigada y definición de grupo A/B.","formula":"H₀:pA=pB · H₁:pA>pB / < / ≠","steps":["Definí qué grupo es A y B.","Buscá si la hipótesis tiene dirección.","Escribí H₁ con el signo correcto.","Anotá nula correspondiente."],"pitfall":"No intercambies grupos durante el contraste.","unit":"10"},{"id":50,"title":"Calcular z de dos proporciones","trigger":"Dan éxitos y tamaños de dos muestras independientes y piden significación.","inputs":"x₁,n₁,x₂,n₂ y α.","formula":"p̂=(x₁+x₂)/(n₁+n₂) · z=(p̂₁−p̂₂)/√[p̂(1−p̂)(1/n₁+1/n₂)]","steps":["Calculá proporciones muestrales.","Calculá proporción conjunta bajo H₀.","Calculá error estándar y z.","Encontrá p según H₁.","Compará p con α y concluí."],"pitfall":"Usar si hay tamaños suficientes y grupos independientes; en otros casos se necesitan métodos alternativos.","unit":"10"},{"id":51,"title":"Convertir porcentaje redondeado","trigger":"Dan porcentajes como 51 % de N personas.","inputs":"Porcentaje y tamaño N, precisión del informe.","formula":"Cantidad aproximada = N×p","steps":["Convertí porcentaje a decimal.","Multiplicá por N.","Verificá si el producto es entero.","Señalá que es estimado si la fuente redondeó."],"pitfall":"No existen 63,75 personas: el conteo exacto requiere información adicional.","unit":"10"},{"id":52,"title":"Conclusión y errores en proporciones","trigger":"Dieron p y α de diferencia de proporciones, o piden errores.","inputs":"H₀/H₁, p, α, decisión.","formula":"p≤α → rechazar H₀ · Tipo II: no rechazar H₀ falsa","steps":["Identificá si la prueba es bilateral o unilateral.","Compará p y α.","Escribí qué muestran las proporciones poblacionales.","Indicá el error posible sin declarar que ocurrió."],"pitfall":"No rechazo no significa porcentajes exactamente iguales.","unit":"10"},{"id":53,"title":"Elegir probabilidad, proporción o t","trigger":"Mismo contexto permite preguntas sobre tablas, proporciones o puntajes.","inputs":"Variable respuesta y si piden descripción o inferencia.","formula":"% en tabla → probabilidad; sí/no entre grupos → z proporciones; puntaje entre grupos → t","steps":["Decidí si piden solamente un porcentaje o probar diferencia poblacional.","Si es contraste, mirá si respuesta es sí/no o numérica.","Elegí proporciones o medias.","Luego aplicá la receta de ese procedimiento."],"pitfall":"Una tabla de ansiedad elevada no obliga a usar t si solo preguntan porcentajes.","unit":"10"}],"exercises":[{"id":"E001","recipe":1,"story":"Un equipo investiga el nivel de ansiedad de familiares de pacientes trasplantados. Para ello administra un cuestionario a 188 familiares que aceptaron participar. El objetivo declarado es conocer la ansiedad en familiares de pacientes de un hospital público, sin publicar cuántas personas integran esa población.","ask":"Identificá población, muestra, unidad de análisis y variable de respuesta.","givens":[{"label":"Muestra","value":"188 familiares"},{"label":"Población objetivo","value":"familiares del hospital"}],"steps":["Población: todos los familiares de trasplantados del hospital que cumplen criterios de inclusión.","Muestra: los 188 familiares efectivamente evaluados.","Unidad: cada familiar. Respuesta: nivel o puntaje de ansiedad."],"answer":"Muestra: 188; unidad: familiar; respuesta: ansiedad; población: familiares definidos por el estudio.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E002","recipe":2,"story":"En una investigación sobre hábitos universitarios se registran el tipo de cursada (presencial o virtual), el nivel educativo alcanzado (secundario, terciario, universitario), el número de materias recursadas y el tiempo de reacción ante una señal medido en segundos.","ask":"Clasificá cada variable según su tipo y, cuando corresponda, su escala.","givens":[{"label":"Modalidad","value":"presencial / virtual"},{"label":"Nivel educativo","value":"3 categorías ordenadas"},{"label":"Materias recursadas","value":"conteo"},{"label":"Reacción","value":"segundos"}],"steps":["Tipo de cursada: cualitativa nominal.","Nivel educativo: cualitativa ordinal.","Materias recursadas: cuantitativa discreta, razón.","Tiempo de reacción: cuantitativa continua, razón."],"answer":"Nominal; ordinal; conteo discreto de razón; tiempo continuo de razón.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E003","recipe":3,"story":"Un grupo de estudiantes realiza una prueba de atención antes de iniciar un entrenamiento y vuelve a realizar la misma prueba ocho semanas después. El equipo investigador asignó el entrenamiento y registró los dos resultados de cada participante.","ask":"Identificá si el diseño es experimental u observacional, transversal o longitudinal, y si los datos se encuentran apareados.","givens":[{"label":"Intervención","value":"asignada por investigadores"},{"label":"Mediciones","value":"antes y después"},{"label":"Participantes","value":"mismos sujetos"}],"steps":["Como el equipo asignó el entrenamiento, es experimental.","Como se mide a las mismas unidades en dos ocasiones, es longitudinal.","Las mediciones están apareadas: cada persona tiene antes y después."],"answer":"Experimental, longitudinal y apareado.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E004","recipe":4,"story":"Una psicóloga propone investigar si un taller de habilidades emocionales ayuda a reducir el estrés académico en adolescentes. Aún no recogió resultados y solo está redactando la pregunta científica.","ask":"Escribí una hipótesis de investigación clara y delimitada, sin afirmar que el taller ya funcionó.","givens":[{"label":"Condición","value":"taller"},{"label":"Resultado","value":"estrés académico"},{"label":"Predicción","value":"disminución"}],"steps":["Separá intervención de resultado.","Escribí una expectativa observable con dirección.","No agregues significación ni valores no dados."],"answer":"Se espera un menor puntaje medio de estrés académico en los adolescentes que realicen el taller respecto de la condición de comparación.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E005","recipe":5,"story":"En una clase se encuestó cuánto tiempo dedican los alumnos diariamente a repasar. Las frecuencias de cuatro intervalos de minutos fueron 4, 6, 10 y 5 estudiantes, respectivamente. La profesora pide completar la tabla estadística.","ask":"Calculá el total N, las frecuencias relativas y las frecuencias absolutas y relativas acumuladas.","givens":[{"label":"FA","value":"4, 6, 10, 5"}],"steps":["N=4+6+10+5=25.","FR=0,16;0,24;0,40;0,20.","FAA=4;10;20;25.","FRA=0,16;0,40;0,80;1,00."],"answer":"N=25; FR=[0,16;0,24;0,40;0,20]; FAA=[4;10;20;25]; FRA=[0,16;0,40;0,80;1].","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E006","recipe":6,"story":"Un curso tiene 35 estudiantes. En un relevamiento se registraron las preferencias por cuatro actividades extracurriculares; tres categorías cuentan con 7, 9 y 11 estudiantes. La frecuencia de la cuarta categoría no fue anotada.","ask":"Encontrá la cantidad faltante y explicá cómo se comprueba el total.","givens":[{"label":"Total","value":"35"},{"label":"Frecuencias conocidas","value":"7, 9, 11"}],"steps":["Sumá las conocidas: 7+9+11=27.","Restá al total: 35−27=8.","Verificá 7+9+11+8=35."],"answer":"8 estudiantes.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E007","recipe":7,"story":"Una docente tiene registros de cantidad de alumnos por categoría de preferencia musical y, por otro lado, resultados de tiempo de respuesta agrupados en intervalos de segundos. Quiere decidir qué gráfico utilizar para cada conjunto.","ask":"Indicá qué gráfico conviene en cada caso y justificá.","givens":[{"label":"Variable 1","value":"preferencia musical categórica"},{"label":"Variable 2","value":"tiempo en intervalos"}],"steps":["Las categorías musicales son nominales: gráfico de barras separadas.","Los tiempos forman intervalos de una magnitud cuantitativa: histograma.","Comprobá la etiqueta de los ejes y la escala de cada caso."],"answer":"Barras para preferencia musical; histograma para tiempos.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E008","recipe":8,"story":"En una muestra de 40 empleados, 12 mujeres trabajan en el área A y 8 en el área B. Entre los varones, 5 trabajan en A y 15 en B. Se desea describir la composición del área B, no la proporción sobre toda la empresa.","ask":"¿Qué porcentaje de quienes trabajan en el área B son mujeres?","givens":[{"label":"Mujeres en B","value":"8"},{"label":"Varones en B","value":"15"}],"steps":["Total de B=8+15=23.","Mujeres de B=8.","8/23×100≈34,78 %."],"answer":"34,78 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E009","recipe":9,"story":"Cinco alumnos obtuvieron 3, 5, 5, 7 y 10 puntos en una actividad. La docente quiere resumir el rendimiento sin elaborar un gráfico y distinguir tres medidas de tendencia central.","ask":"Calculá media, mediana y moda.","givens":[{"label":"Puntajes","value":"3, 5, 5, 7, 10"},{"label":"n","value":"5"}],"steps":["Sumá:3+5+5+7+10=30.","Media=30/5=6.","Datos ordenados: el tercero es 5 → mediana=5.","El valor más repetido es 5 → moda=5."],"answer":"Media 6; mediana 5; moda 5.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E010","recipe":10,"story":"Un informe de evaluación psicológica indica que el percentil 90 de un test es 78 puntos. Una coordinadora necesita identificar el corte inferior aproximado del grupo del 10 % que obtuvo los puntajes más altos.","ask":"Interpretá P90 y explicá qué relación tiene con el 10 % superior.","givens":[{"label":"P90","value":"78 puntos"},{"label":"Grupo superior","value":"10 %"}],"steps":["Percentil 90 deja aproximadamente 90 % por debajo.","La fracción superior es 100−90=10 %.","El corte inferior del grupo superior se sitúa alrededor de 78 puntos."],"answer":"P90≈78 separa el 10 % con mayores puntajes; no es P10.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E011","recipe":11,"story":"En una muestra de cinco puntajes de una escala se observaron los valores 2, 4, 4, 6 y 9. Se quiere describir la dispersión usando estimadores muestrales y una medida relativa.","ask":"Calculá la varianza muestral, el desvío estándar y el coeficiente de variación.","givens":[{"label":"Datos","value":"2, 4, 4, 6, 9"},{"label":"n","value":"5"}],"steps":["Media=(2+4+4+6+9)/5=5.","Suma de cuadrados=(−3)²+(−1)²+(−1)²+1²+4²=28.","s²=28/(5−1)=7; s=√7≈2,646.","CV=2,646/5×100≈52,92 %."],"answer":"s²=7; s≈2,65; CV≈52,92 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E012","recipe":12,"story":"Dos grupos de estudiantes rindieron escalas comparables. El grupo A obtuvo una media de 60 puntos con un desvío de 12; el grupo B una media de 40 con un desvío de 6. Se busca describir su heterogeneidad relativa, no establecer significación estadística.","ask":"¿Cuál tiene mayor coeficiente de variación?","givens":[{"label":"A","value":"media 60; s 12"},{"label":"B","value":"media 40; s 6"}],"steps":["CV_A=12/60×100=20 %.","CV_B=6/40×100=15 %.","Como 20>15, A es relativamente más disperso."],"answer":"Grupo A: CV=20 %; grupo B: CV=15 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E013","recipe":13,"story":"Una distribución de puntajes de depresión presenta moda de 12, mediana de 15 y media de 17,8. El informe solicita describir si hay indicios de que unos pocos valores altos desplazan el promedio.","ask":"Indicá la dirección probable de la asimetría y una limitación de esa conclusión.","givens":[{"label":"Moda","value":"12"},{"label":"Mediana","value":"15"},{"label":"Media","value":"17,8"}],"steps":["Se observa moda < mediana < media.","Es compatible con una cola derecha más extendida.","Para concluir conviene revisar histograma o coeficiente de asimetría."],"answer":"Indicio de asimetría positiva; requiere comprobar la distribución.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E014","recipe":14,"story":"Una investigación registró simultáneamente estrés percibido y horas de sueño en universitarios. En el gráfico de dispersión se observa que, a medida que el estrés aumenta, las horas de sueño tienden a disminuir.","ask":"Describí el sentido de la asociación y si esos datos, por sí solos, demuestran causalidad.","givens":[{"label":"Tendencia","value":"estrés sube; sueño baja"}],"steps":["La nube es descendente: asociación lineal negativa.","El resultado indica covariación, no causa demostrada.","Pueden existir otras variables relevantes, como carga laboral o salud."],"answer":"Asociación negativa; no demuestra causalidad.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E015","recipe":15,"story":"Un estudio de actividades físicas y bienestar reporta una correlación de Pearson r=−0,75. El investigador quiere explicar el signo y la intensidad de la relación a alguien que no conoce las escalas de los test.","ask":"Interpretá el valor r y explicá por qué no tiene unidades.","givens":[{"label":"r","value":"−0,75"}],"steps":["El signo negativo indica relación descendente.","La magnitud |r|=0,75 señala asociación lineal marcada.","El coeficiente es estandarizado y adimensional."],"answer":"Asociación lineal negativa marcada; r no tiene unidades.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E016","recipe":16,"story":"Se registran tres sesiones de intervención (x) y su puntaje de autonomía (y): (1,2), (2,4) y (3,6). Se desea construir el modelo lineal de mínimos cuadrados que predice el puntaje a partir de sesiones.","ask":"Calculá pendiente, intercepto y ecuación de regresión.","givens":[{"label":"Pares","value":"(1,2); (2,4); (3,6)"}],"steps":["Se observa que y=2x en todos los pares.","Pendiente b=2.","Cuando x=0 la recta pasa por y=0 → a=0."],"answer":"ŷ=2x (b=2, a=0).","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E017","recipe":17,"story":"Un artículo presenta una correlación de Pearson r=−0,80 entre un test de ansiedad y el tiempo de descanso. Sus autores piden informar el coeficiente de determinación de una regresión lineal simple con intercepto.","ask":"Calculá R² y explicá su significado correcto.","givens":[{"label":"r","value":"−0,80"}],"steps":["R²=r²=(−0,80)²=0,64.","Convertí: 64 %.","Interpretá como variabilidad de y explicada por ajuste lineal, no causalidad."],"answer":"R²=0,64 (64 % de variabilidad explicada por el ajuste lineal).","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E018","recipe":18,"story":"En un estudio sobre sesiones de terapia y autonomía se obtuvo la recta predictiva ŷ=3,4+0,6x, donde x es la cantidad de sesiones. Una paciente completó 5 sesiones.","ask":"¿Qué puntaje predice el modelo?","givens":[{"label":"Recta","value":"ŷ=3,4+0,6x"},{"label":"Sesiones","value":"5"}],"steps":["Sustituí x=5.","ŷ=3,4+0,6×5=3,4+3.","Resultado=6,4 puntos."],"answer":"ŷ(5)=6,4 puntos.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E019","recipe":19,"story":"Se construyó una regresión entre edades de 9 a 13 años y rendimiento lector. Se solicita usar esa misma recta para pronosticar el rendimiento de un niño de 5 años y afirmar que la edad causa cualquier cambio.","ask":"Identificá dos problemas metodológicos.","givens":[{"label":"Rango observado","value":"9–13 años"},{"label":"Edad solicitada","value":"5 años"}],"steps":["5 años queda fuera del rango observado: extrapolación.","Una correlación o regresión observacional no prueba causalidad.","Sería necesario revisar validez externa y diseño."],"answer":"Es extrapolación arriesgada y no permite afirmar causalidad.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E020","recipe":20,"story":"En un relevamiento sobre convivencia y aislamiento participaron 30 estudiantes. De ellos, 9 viven solos y presentan aislamiento, 6 viven solos y no presentan; 4 viven con familia y presentan, y 11 viven con familia y no presentan.","ask":"Si se selecciona una persona al azar entre las 30, ¿qué probabilidad hay de que viva sola Y presente aislamiento?","givens":[{"label":"Total N","value":"30"},{"label":"Vive solo y presenta","value":"9"}],"steps":["Intersección de las dos condiciones=9.","El total del experimento es 30.","P=9/30=0,30."],"answer":"30 %.","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":"","table":[["Convivencia","Aislamiento","Sin aislamiento","Total"],["Vive solo",9,6,15],["Con familia",4,11,15],["Total",13,17,30]]},{"id":"E021","recipe":21,"story":"Una evaluación psicológica de 30 estudiantes indica que 17 no presentan aislamiento social. Dentro de ese conjunto, 11 viven con su familia y 6 viven solos. La pregunta no se refiere al total de estudiantes, sino a quienes ya sabemos que no están aislados.","ask":"De quienes NO presentan aislamiento, ¿qué porcentaje vive con su familia?","givens":[{"label":"No presentan aislamiento","value":"17"},{"label":"No presentan y con familia","value":"11"}],"steps":["Condición: no aislamiento. Denominador=17.","Casos que además viven con familia=11.","P(familia|sin aislamiento)=11/17≈0,6471."],"answer":"64,71 %.","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":"","table":[["Convivencia","Aislamiento","Sin aislamiento","Total"],["Vive solo",9,6,15],["Con familia",4,11,15],["Total",13,17,30]]},{"id":"E022","recipe":22,"story":"En una muestra de estudiantes, 15 viven solos y 15 viven con sus familias. Presentan aislamiento 9 de quienes viven solos y 4 de quienes conviven con su familia. Una docente quiere comparar el riesgo descriptivo dentro de cada grupo.","ask":"¿En qué forma de convivencia es más frecuente el aislamiento?","givens":[{"label":"Solo","value":"9 de 15"},{"label":"Con familia","value":"4 de 15"}],"steps":["Solo: 9/15=60 %.","Familia: 4/15≈26,67 %.","Compará porcentajes relativos a cada grupo."],"answer":"Mayor frecuencia entre quienes viven solos (60 % vs 26,67 %).","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":"","table":[["Convivencia","Aislamiento","Sin aislamiento","Total"],["Vive solo",9,6,15],["Con familia",4,11,15],["Total",13,17,30]]},{"id":"E023","recipe":23,"story":"Una encuesta sobre tratamientos registra que el 30 % usa el recurso A, el 60 % utiliza el recurso B y el 5 % utiliza ambos. Un estudiante quiere calcular qué porcentaje usa al menos uno y qué porcentaje no usa ninguno.","ask":"Calculá la unión de los sucesos y su complemento.","givens":[{"label":"P(A)","value":"0,30"},{"label":"P(B)","value":"0,60"},{"label":"P(A∩B)","value":"0,05"}],"steps":["P(A∪B)=0,30+0,60−0,05=0,85.","P(ninguno)=1−0,85=0,15."],"answer":"Al menos uno: 85 %; ninguno: 15 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E024","recipe":24,"story":"En una investigación se observa que P(A)=0,65, P(B)=0,40 y P(A o B)=0,79. Se desea determinar si dos conductas son independientes o mutuamente excluyentes.","ask":"Calculá la intersección y evaluá ambas propiedades.","givens":[{"label":"P(A)","value":"0,65"},{"label":"P(B)","value":"0,40"},{"label":"P(A∪B)","value":"0,79"}],"steps":["Intersección=0,65+0,40−0,79=0,26.","Producto de marginales=0,65×0,40=0,26.","Independientes: sí; excluyentes: no, porque 0,26≠0."],"answer":"Independientes, NO excluyentes.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E025","recipe":25,"story":"Se estudia a 50 universitarios: 20 mujeres y 30 varones. Dentro de las mujeres, el 70 % practica deporte; entre los varones, el 40 % practica deporte. Se quiere reconstruir la tabla de frecuencias deporte sí/no por sexo.","ask":"Calculá las cuatro celdas y sus totales.","givens":[{"label":"Mujeres","value":"20; deporte 70 %"},{"label":"Varones","value":"30; deporte 40 %"}],"steps":["Mujeres deporte=20×0,70=14; no=6.","Varones deporte=30×0,40=12; no=18.","Sí total=26; no total=24; N=50."],"answer":"Mujeres 14 sí/6 no; varones 12 sí/18 no; totales 26 sí/24 no.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E026","recipe":26,"story":"Un método diagnóstico se evaluó en 320 pacientes. El test dio positivo en 86 enfermos y 8 personas sanas; dio negativo en 14 enfermos y 212 personas sanas. La profesora pide medidas del desempeño del diagnóstico.","ask":"Calculá sensibilidad, especificidad y valor predictivo positivo.","givens":[{"label":"VP","value":"86"},{"label":"FN","value":"14"},{"label":"FP","value":"8"},{"label":"VN","value":"212"}],"steps":["Sensibilidad=86/(86+14)=0,86.","Especificidad=212/(212+8)≈0,9636.","VPP=86/(86+8)≈0,9149."],"answer":"Sensibilidad 86 %; especificidad 96,36 %; VPP 91,49 %.","ref":"Adaptado de infografía M6","level":"base","notes":"","table":[["Resultado","Sano","Enfermo","Total"],["Negativo",212,14,226],["Positivo",8,86,94],["Total",220,100,320]]},{"id":"E027","recipe":27,"story":"En una muestra se informa que 35 % presenta estrés alto, 14 % presenta estrés alto y mejoró tras una intervención y 46 % tiene estrés no alto y mejoró. Se desea responder una pregunta sobre quienes no mejoraron.","ask":"¿Cuál es la probabilidad de estrés alto dado que NO hubo mejora?","givens":[{"label":"P(estrés alto)","value":"0,35"},{"label":"P(alto y mejoró)","value":"0,14"},{"label":"P(no alto y mejoró)","value":"0,46"}],"steps":["P(alto y no mejoró)=0,35−0,14=0,21.","P(mejoró)=0,14+0,46=0,60.","P(no mejoró)=0,40.","P(alto | no mejoró)=0,21/0,40=0,525."],"answer":"52,5 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E028","recipe":28,"story":"En una escala de alexitimia, el puntaje se aproxima a una distribución normal con media 68 y varianza 196. Un paciente obtuvo 90 puntos. La coordinadora quiere comparar su puntaje respecto del promedio poblacional.","ask":"Calculá el puntaje z e interpretalo.","givens":[{"label":"Media μ","value":"68"},{"label":"Varianza σ²","value":"196"},{"label":"Puntaje x","value":"90"}],"steps":["Desvío: σ=√196=14.","z=(90−68)/14=22/14≈1,571.","La persona está 1,57 desvíos por encima de μ."],"answer":"z≈+1,57.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E029","recipe":29,"story":"Los puntajes de resiliencia psicológica se distribuyen aproximadamente de manera normal entre los estudiantes de una universidad. La media poblacional es de 68 puntos y el desvío estándar de 9 puntos. Una docente quiere identificar el porcentaje que supera un umbral de 74 puntos.","ask":"¿Qué porcentaje obtiene MÁS de 74 puntos?","givens":[{"label":"Media μ","value":"68 puntos"},{"label":"Desvío σ","value":"9 puntos"},{"label":"Corte x","value":"74 puntos"}],"steps":["z=(74−68)/9=0,6667.","Φ(0,6667)≈0,7475.","P(X>74)=1−0,7475≈0,2525."],"answer":"25,25 %.
