","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":""},{"id":"E030","recipe":30,"story":"En una población universitaria, la resiliencia se distribuye normalmente con media de 68 puntos y desviación estándar de 9 puntos. Un equipo quiere seleccionar al 10 % de las personas que obtuvieron los puntajes más altos para una segunda evaluación.","ask":"¿Qué puntaje mínimo aproximado define ese 10 % superior?","givens":[{"label":"Media μ","value":"68"},{"label":"Desvío σ","value":"9"},{"label":"Grupo superior","value":"10 %"}],"steps":["El 10 % superior empieza en P90.","Φ⁻¹(0,90)≈1,28155.","x=68+9×1,28155≈79,53."],"answer":"79,53 puntos.","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":""},{"id":"E031","recipe":31,"story":"Se administra una escala de estrés a 200 estudiantes. Un modelo de distribución normal indica que aproximadamente el 15 % supera el umbral considerado de riesgo elevado. Se quiere estimar cuántos estudiantes estarían por encima de ese umbral.","ask":"Calculá la cantidad esperada.","givens":[{"label":"Tamaño","value":"200 estudiantes"},{"label":"Proporción","value":"15 %"}],"steps":["15 %=0,15.","200×0,15=30.","Se esperan aproximadamente 30 estudiantes."],"answer":"30 estudiantes esperados.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E032","recipe":32,"story":"Una persona obtiene 30 puntos en una escala de perfeccionismo con media 28 y desvío 2. En una escala diferente de afabilidad obtiene 50 puntos, cuyo promedio es 54 y su desvío 5. Los puntajes brutos de ambos test no son directamente comparables.","ask":"¿En qué rasgo se ubica relativamente más alto respecto de su población?","givens":[{"label":"Perfeccionismo","value":"x=30, μ=28, σ=2"},{"label":"Afabilidad","value":"x=50, μ=54, σ=5"}],"steps":["zPerfeccionismo=(30−28)/2=1.","zAfabilidad=(50−54)/5=−0,8.","El primer z es mayor."],"answer":"Relativamente más alto en perfeccionismo.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E033","recipe":33,"story":"Una distribución de puntajes clínicos es aproximadamente normal. Una especialista solicita el valor que deja por ENCIMA al 20 % de personas con puntuación más alta; es decir, busca el límite inferior de ese sector extremo.","ask":"¿Qué percentil corresponde buscar antes de convertirlo en puntaje?","givens":[{"label":"Grupo superior","value":"20 %"}],"steps":["El área a la derecha es 0,20.","A la izquierda queda 1−0,20=0,80.","Se necesita el percentil 80."],"answer":"P80.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E034","recipe":34,"story":"Un hospital estudia si un programa reduce la impulsividad de 26 pacientes. Cada persona completa un test antes y después, y todavía no se presentó ninguna salida estadística. Se necesita definir qué resultado pretende observar la investigación.","ask":"Identificá variable respuesta, condición comparada y dirección de la hipótesis.","givens":[{"label":"Participantes","value":"26 pacientes"},{"label":"Mediciones","value":"antes y después"},{"label":"Expectativa","value":"reducción"}],"steps":["Respuesta: puntaje de impulsividad.","Condición: antes vs después, misma persona.","Dirección esperada: menor después."],"answer":"Hipótesis: la impulsividad media después del programa será menor que antes.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E035","recipe":35,"story":"Se mide dependencia del teléfono antes y después de un taller en los mismos adolescentes. El equipo espera que el puntaje disminuya y, para trabajar con un contraste, define la diferencia individual d como «después menos antes».","ask":"Escribí la hipótesis alternativa y la hipótesis nula en términos de la diferencia media.","givens":[{"label":"Diferencia definida","value":"d=después−antes"},{"label":"Expectativa","value":"disminuye"}],"steps":["Si el puntaje baja, después−antes es negativo.","H₁: μd<0.","H₀: μd≥0; para calcular se contrasta la frontera μd=0."],"answer":"H₁: μd<0; H₀: μd≥0.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E036","recipe":36,"story":"Una investigación sobre entrenamiento y puntaje de impulsividad reportó un valor p de 0,02. La docente había fijado antes de empezar un nivel de significación del 5 %. El contraste corresponde a una alternativa de reducción del puntaje.","ask":"Tomá una decisión estadística y redactá la conclusión.","givens":[{"label":"p","value":"0,02"},{"label":"α","value":"5 %=0,05"}],"steps":["Compara 0,02 con 0,05.","0,02<0,05 → rechazar H₀.","Hay evidencia estadística compatible con reducción al 5 %."],"answer":"Rechazar H₀; evidencia de disminución del puntaje al nivel de 5 %.","ref":"Adaptado con los datos del parcial 2026","level":"base","notes":""},{"id":"E037","recipe":37,"story":"Un ensayo sostiene que un programa de relajación es eficaz, y el equipo rechaza la hipótesis nula de ausencia de efecto. Más tarde, supongamos que se demostrara que en la población el programa en realidad no producía esa diferencia.","ask":"¿Qué tipo de error estadístico habría cometido la decisión?","givens":[{"label":"Decisión","value":"rechaza H₀"},{"label":"Realidad hipotética","value":"H₀ verdadera"}],"steps":["Se rechazó H₀.","En la realidad hipotética H₀ era verdadera.","Eso define error tipo I."],"answer":"Error tipo I.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E038","recipe":38,"story":"Una investigadora compara puntajes de memoria entre dos métodos, pero su pregunta científica original solo establece que «podrían ser diferentes», sin anticipar cuál será superior.","ask":"¿Es un contraste unilateral o bilateral? Escribí H₁.","givens":[{"label":"Pregunta","value":"diferencia sin dirección"}],"steps":["«Diferentes» implica μA≠μB.","H₁ es bilateral (dos colas).","No elegir mayor/menor mirando luego las medias."],"answer":"Bilateral; H₁: μA≠μB.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E039","recipe":39,"story":"Un estudio observacional encuentra que quienes declaran más actividad física muestran menor ansiedad media con p=0,01. El informe pretende concluir que la actividad física demostró causar menor ansiedad y que el efecto es clínicamente importante.","ask":"Corregí la conclusión para que no exceda la evidencia.","givens":[{"label":"Diseño","value":"observacional"},{"label":"p","value":"0,01"}],"steps":["Hay evidencia estadística de asociación/diferencia bajo supuestos.","El diseño observacional no aísla causalidad.","La importancia clínica requiere magnitud y contexto."],"answer":"Hay evidencia de asociación entre actividad y ansiedad, sin prueba causal ni de importancia clínica.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E040","recipe":40,"story":"Un servicio de psicología mide el puntaje de impulsividad de 26 pacientes al iniciar un programa y lo vuelve a medir al finalizar. Cada persona aporta dos valores numéricos.","ask":"¿Qué prueba de comparación de medias corresponde y por qué?","givens":[{"label":"Muestras","value":"los mismos 26 pacientes"},{"label":"Variable","value":"puntaje numérico"}],"steps":["La respuesta es cuantitativa.","Los valores están emparejados por sujeto.","Corresponde t para muestras apareadas."],"answer":"t apareada.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E041","recipe":41,"story":"En un estudio se comparan los puntajes de ansiedad, de 0 a 30, de estudiantes que realizaron tutorías y de otros estudiantes que no participaron. Cada persona pertenece a un único grupo y se mide una sola vez.","ask":"Identificá variable explicativa, variable respuesta y sus tipos.","givens":[{"label":"Grupo","value":"tutorías sí/no"},{"label":"Resultado","value":"puntaje de ansiedad 0–30"}],"steps":["Explicativa: tutorías sí/no, categórica nominal.","Respuesta: puntaje de ansiedad, cuantitativa tratada como intervalo.","Dos grupos independientes porque son personas distintas."],"answer":"Explicativa nominal; respuesta cuantitativa; grupos independientes.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E042","recipe":42,"story":"Un programa busca que el puntaje promedio de ansiedad del grupo tratado sea MENOR que el del grupo control. La diferencia poblacional se define como μTratado menos μControl.","ask":"Escribí H₀ y H₁ respetando la dirección del efecto esperado.","givens":[{"label":"Orden","value":"μTratado−μControl"},{"label":"Expectativa","value":"tratado menor"}],"steps":["Menor tratado → diferencia negativa.","H₁: μT−μC<0.","H₀: μT−μC≥0 (frontera igualdad)."],"answer":"H₁: μT−μC<0; H₀: μT−μC≥0.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E043","recipe":43,"story":"Cuatro pacientes completaron un test de ansiedad antes de un tratamiento y después del mismo. Los puntajes fueron, respectivamente, antes [10, 8, 12, 9] y después [7, 7, 9, 8]. Los datos están emparejados por paciente y se espera una reducción.","ask":"Calculá el estadístico t apareado usando d=después−antes, e indicá sus grados de libertad.","givens":[{"label":"Antes","value":"10, 8, 12, 9"},{"label":"Después","value":"7, 7, 9, 8"}],"steps":["d=[−3,−1,−3,−1], media d=−2.","s_d=√(4/3)≈1,1547.","t=−2/(1,1547/√4)≈−3,464; gl=3."],"answer":"t≈−3,464; gl=3.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E044","recipe":44,"story":"Un equipo compara puntajes de fobia de dos grupos diferentes. El tratamiento tuvo n=15, media=64,3 y desvío=28,1; la lista de espera tuvo n=19, media=86,4 y desvío=18,3. Como no se desea suponer varianzas iguales, se usa Welch.","ask":"Calculá el estadístico t aproximado para tratado menos espera.","givens":[{"label":"Tratado","value":"n=15, media=64,3, s=28,1"},{"label":"Espera","value":"n=19, media=86,4, s=18,3"}],"steps":["Diferencia=64,3−86,4=−22,1.","EE=√(28,1²/15+18,3²/19)≈8,383.","t≈−22,1/8,383≈−2,636."],"answer":"t≈−2,636.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E045","recipe":45,"story":"Una comparación entre dos grupos entrega dos pruebas de Jamovi: Levene p=0,003 y el contraste de las medias, que aparece por separado. La profesora pide elegir una versión de t adecuada al resultado de homogeneidad.","ask":"¿Qué informa Levene y qué alternativa conviene usar?","givens":[{"label":"p Levene","value":"0,003"},{"label":"α","value":"0,05"}],"steps":["Levene p=0,003<0,05: evidencia contra igualdad de varianzas.","Usar t de Welch, que no presupone igualdad.","No concluir sobre el tratamiento usando solo el p de Levene."],"answer":"Preferir Welch; Levene no prueba el efecto del tratamiento.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E046","recipe":46,"story":"En una intervención de habilidades sociales se mide el mismo grupo antes y después. La prueba t apareada obtuvo p=0,06 y la significación prefijada es 0,05. La hipótesis alternativa sostiene que el programa reduce el puntaje de dependencia del teléfono.","ask":"¿Se rechaza H₀? Redactá la conclusión sin decir que se probó ausencia de efecto.","givens":[{"label":"p","value":"0,06"},{"label":"α","value":"0,05"},{"label":"Prueba","value":"t apareada"}],"steps":["p=0,06>0,05.","No rechazar H₀.","No hay evidencia suficiente para afirmar reducción estadísticamente significativa al 5 %."],"answer":"No rechazar H₀; evidencia insuficiente de reducción.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E047","recipe":47,"story":"Dos tratamientos presentan los siguientes resúmenes de una escala: grupo A, media 64,3 y desvío 28,1; grupo B, media 86,4 y desvío 18,3. Se busca comparar dispersión relativa además de las medias.","ask":"¿Cuál tiene menor puntaje promedio y cuál mayor coeficiente de variación?","givens":[{"label":"A","value":"media 64,3; s 28,1"},{"label":"B","value":"media 86,4; s 18,3"}],"steps":["Media A menor:64,3<86,4.","CV_A=28,1/64,3×100≈43,70 %.","CV_B=18,3/86,4×100≈21,18 %."],"answer":"A tiene menor media y mayor CV (≈43,70 % vs ≈21,18 %).","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E048","recipe":48,"story":"Se comparan dos intervenciones para ansiedad clínica. En el grupo TCC, 42 de 120 participantes cumplen el criterio clínico; en Mindfulness, 20 de 100 cumplen el mismo criterio. Se quiere describir cuánto difieren sus porcentajes.","ask":"Calculá ambas proporciones y la diferencia en puntos porcentuales.","givens":[{"label":"TCC","value":"42 de 120"},{"label":"Mindfulness","value":"20 de 100"}],"steps":["TCC=42/120=0,35=35 %.","Mindfulness=20/100=0,20=20 %.","Diferencia=35−20=15 puntos porcentuales."],"answer":"35 % frente a 20 %; diferencia 15 puntos porcentuales.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E049","recipe":49,"story":"Una investigadora sospecha que la proporción de personas que completan un programa presencial es mayor que la del formato virtual. Los grupos son independientes y las proporciones poblacionales se denominan pPresencial y pVirtual.","ask":"Escribí H₀ y H₁.","givens":[{"label":"Comparación","value":"presencial vs virtual"},{"label":"Dirección","value":"presencial mayor"}],"steps":["Definí pP y pV.","H₁: pP>pV (una cola).","H₀: pP≤pV (frontera igualdad para calcular)."],"answer":"H₁: pPresencial>pVirtual; H₀: pPresencial≤pVirtual.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E050","recipe":50,"story":"En un estudio de ansiedad clínica, 42 de 120 pacientes tratados con TCC y 20 de 100 tratados con Mindfulness cumplen un criterio clínico. Se busca comprobar si las proporciones poblacionales de ansiedad clínica son diferentes, con α=0,05.","ask":"Aplicá la prueba z bilateral de dos proporciones y concluí.","givens":[{"label":"TCC","value":"42/120"},{"label":"Mindfulness","value":"20/100"},{"label":"α","value":"0,05"}],"steps":["p1=0,35; p2=0,20.","pConjunta=62/220≈0,28182.","EE=√[p(1−p)(1/120+1/100)]≈0,06091.","z=(0,35−0,20)/0,06091≈2,462; p bilateral≈0,0138."],"answer":"p≈0,014<0,05; rechazar H₀, hay evidencia de diferencia de proporciones.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E051","recipe":51,"story":"Un informe presenta el porcentaje de respuesta positiva como 51 % entre 125 participantes de un taller. No ofrece el conteo bruto y el porcentaje puede haber sido redondeado.","ask":"¿Es correcto afirmar que respondieron exactamente 63,75 personas?","givens":[{"label":"n","value":"125"},{"label":"Porcentaje","value":"51 %"}],"steps":["0,51×125=63,75.","No existe conteo exacto fraccionario de personas.","El valor es una estimación basada en porcentaje redondeado."],"answer":"No; ≈64 personas como estimación, sin conteo exacto comprobado.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E052","recipe":52,"story":"En un estudio de continuidad terapéutica se comparan dos proporciones y se obtiene un valor p de 0,153. El nivel de significación fijado es 10 % y la hipótesis alternativa supone mayor continuidad en el primer grupo.","ask":"Decidí si se rechaza H₀ e indicá qué error sería posible si H₀ fuera falsa.","givens":[{"label":"p","value":"0,153"},{"label":"α","value":"0,10"}],"steps":["0,153>0,10: no rechazar H₀.","No hay evidencia suficiente de continuidad mayor en grupo A.","Si H₀ fuera falsa, esta decisión sería un error tipo II."],"answer":"No rechazar H₀; posible error tipo II si había una diferencia real.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E053","recipe":53,"story":"Una misma investigación separa estudiantes con tutorías y sin ellas. Primero pregunta qué porcentaje de cada grupo presenta ansiedad elevada (sí/no); luego si esos porcentajes difieren estadísticamente; finalmente si difiere el PROMEDIO de ansiedad medido en una escala 0–100.","ask":"Elegí el procedimiento correcto para las tres preguntas sin confundir las variables.","givens":[{"label":"Variables","value":"ansiedad sí/no y puntaje 0–100"},{"label":"Grupos","value":"tutorías sí/no"}],"steps":["Porcentaje observado por grupo → probabilidad condicional descriptiva.","Diferencia estadística de respuestas sí/no → dos proporciones.","Diferencia de media de puntajes → t de muestras independientes."],"answer":"Probabilidades descriptivas; contraste de proporciones; t independiente, respectivamente.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"base","notes":""},{"id":"E054","recipe":29,"story":"En una investigación de psicología educativa se aplica un instrumento de ansiedad ante exámenes. Los puntajes se modelan con una distribución normal cuya media es 51 puntos y el desvío estándar es 8 puntos. La docente quiere obtener la proporción que queda por encima de un valor de 62 puntos.","ask":"¿Qué porcentaje de la población obtiene más de 62 puntos?","givens":[{"label":"Media μ","value":"51"},{"label":"Desvío σ","value":"8"},{"label":"Límite x","value":"62"}],"steps":["z=(62−51)/8≈1,3750.","P=1−Φ(z)≈0,08457.","Porcentaje≈8,46 %."],"answer":"8,46 %","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E055","recipe":29,"story":"En una investigación de psicología educativa se aplica un instrumento de bienestar emocional. Los puntajes se modelan con una distribución n ctado para estudiar","level":"variante","notes":""},{"id":"E103","recipe":9,"story":"Una profesora recopila los resultados de una evaluación breve de cinco estudiantes. Los puntajes fueron 2, 3, 3, 7, 10. Antes de aplicar procedimientos inferenciales quiere un resumen descriptivo elemental del grupo.","ask":"Calculá la media, la mediana y la moda de los resultados.","givens":[{"label":"Puntajes","value":"2, 3, 3, 7, 10"},{"label":"Cantidad","value":"5"}],"steps":["Suma=25; media=25/5=5,00.","Ordenados: [2, 3, 3, 7, 10]; central=3.","Valor más frecuente=3."],"answer":"Media=5,00, mediana=3, moda=3.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E104","recipe":9,"story":"Una profesora recopila los resultados de una evaluación breve de cinco estudiantes. Los puntajes fueron 7, 7, 9, 10, 12. Antes de aplicar procedimientos inferenciales quiere un resumen descriptivo elemental del grupo.","ask":"Calculá la media, la mediana y la moda de los resultados.","givens":[{"label":"Puntajes","value":"7, 7, 9, 10, 12"},{"label":"Cantidad","value":"5"}],"steps":["Suma=45; media=45/5=9,00.","Ordenados: [7, 7, 9, 10, 12]; central=9.","Valor más frecuente=7."],"answer":"Media=9,00, mediana=9, moda=7.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E105","recipe":9,"story":"Una profesora recopila los resultados de una evaluación breve de cinco estudiantes. Los puntajes fueron 1, 4, 4, 4, 7. Antes de aplicar procedimientos inferenciales quiere un resumen descriptivo elemental del grupo.","ask":"Calculá la media, la mediana y la moda de los resultados.","givens":[{"label":"Puntajes","value":"1, 4, 4, 4, 7"},{"label":"Cantidad","value":"5"}],"steps":["Suma=20; media=20/5=4,00.","Ordenados: [1, 4, 4, 4, 7]; central=4.","Valor más frecuente=4."],"answer":"Media=4,00, mediana=4, moda=4.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E106","recipe":20,"story":"Durante una evaluación de convivencia, 80 estudiantes responden dos preguntas sobre relaciones sociales. En el conjunto hay 22 personas que viven solas, y 10 de ellas presentan ansiedad elevada. La selección se realiza entre las 80 personas del estudio.","ask":"¿Cuál es la probabilidad conjunta de que una persona viva sola y tenga ansiedad elevada?","givens":[{"label":"Total","value":"80"},{"label":"Solo y ansiedad","value":"10"}],"steps":["La intersección contiene 10 casos.","Dividí por la muestra general:10/80=0,125."],"answer":"12,5 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E107","recipe":26,"story":"Un test de detección temprana identifica como positivo a 72 de 80 pacientes verdaderamente enfermos, y a 18 de 120 pacientes sanos. Los restantes reciben resultado negativo. Se quiere comparar sensibilidad y especificidad.","ask":"¿Qué proporción de enfermos detecta correctamente el test y qué proporción de sanos descarta correctamente?","givens":[{"label":"VP","value":"72"},{"label":"FN","value":"8"},{"label":"FP","value":"18"},{"label":"VN","value":"102"}],"steps":["Sensibilidad=72/80=0,90.","Especificidad=102/120=0,85."],"answer":"Sensibilidad 90 %; especificidad 85 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E108","recipe":22,"story":"En dos talleres de gestión emocional hay 30 participantes en cada grupo. En el taller A, 12 declaran estrés elevado; en el B, 6. El equipo necesita comparar frecuencia de estrés dentro de cada taller, sin realizar todavía una prueba inferencial.","ask":"¿En qué grupo es más frecuente la categoría de estrés elevado?","givens":[{"label":"Taller A","value":"12/30"},{"label":"Taller B","value":"6/30"}],"steps":["A:12/30=0,40.","B:6/30=0,20.","A tiene mayor proporción descriptiva."],"answer":"Taller A:40 % vs20 %.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E109","recipe":29,"story":"En un estudio sobre atención de estudiantes universitarios se informa una distribución normal con media 60 puntos y desvío 8 puntos. Se desea calcular la proporción que queda entre los dos umbrales de 54 y 68 puntos, y no solo por encima de uno.","ask":"¿Qué porcentaje queda ENTRE ambos puntajes?","givens":[{"label":"Media μ","value":"60"},{"label":"Desvío σ","value":"8"},{"label":"Límites","value":"54 y 68"}],"steps":["z inferior=(54−60)/8≈-0,7500.","z superior=(68−60)/8≈1,0000.","Φ(z superior)−Φ(z inferior)≈0,61472."],"answer":"61,47 %","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E110","recipe":29,"story":"En un estudio sobre autorregulación de estudiantes universitarios se informa una distribución normal con media 55 puntos y desvío 7 puntos. Se desea calcular la proporción que queda entre los dos umbrales de 54 y 61 puntos, y no solo por encima de uno.","ask":"¿Qué porcentaje queda ENTRE ambos puntajes?","givens":[{"label":"Media μ","value":"55"},{"label":"Desvío σ","value":"7"},{"label":"Límites","value":"54 y 61"}],"steps":["z inferior=(54−55)/7≈-0,1429.","z superior=(61−55)/7≈0,8571.","Φ(z superior)−Φ(z inferior)≈0,36112."],"answer":"36,11 %","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E111","recipe":38,"story":"Un equipo sospecha que la media de estrés de pacientes después de una terapia es MENOR que antes. La hipótesis se fijó antes de mirar los resultados, y se define la diferencia como después menos antes.","ask":"¿El contraste es unilateral o bilateral, y hacia qué lado?","givens":[{"label":"Predicción","value":"media después menor"},{"label":"Diferencia","value":"después−antes"}],"steps":["La dirección es disminución, por lo que d<0.","H₁:μd<0, unilateral izquierda."],"answer":"Unilateral izquierda.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E112","recipe":40,"story":"Se comparan dos programas de prevención de consumo problemático en escuelas diferentes. Los estudiantes del programa A nunca participaron del B y viceversa. La evaluación final utiliza una escala numérica de riesgo.","ask":"¿Qué prueba se elige para comparar las medias de ambos programas?","givens":[{"label":"Grupos","value":"personas distintas"},{"label":"Resultado","value":"puntaje numérico"}],"steps":["No hay pares individuales; son muestras independientes.","La respuesta es un puntaje cuantitativo."],"answer":"t para muestras independientes (Welch si conviene).","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E113","recipe":46,"story":"Se estudiaron los mismos estudiantes antes y después de un taller de respiración. La hipótesis original afirma que el programa mejora el puntaje de bienestar. Una t apareada entrega un valor p de 0,008, y el equipo mantiene α=0,05.","ask":"Tomá una decisión y redactá una conclusión breve sin inventar el tamaño del efecto.","givens":[{"label":"Prueba","value":"t apareada"},{"label":"p","value":"0,008"},{"label":"α","value":"0,05"}],"steps":["Comparar p=0,008 con α=0,05.","Se rechaza H₀; hay evidencia de mejoría."],"answer":"Rechazar H₀.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E114","recipe":46,"story":"Se estudiaron los mismos estudiantes antes y después de un programa de organización. La hipótesis original afirma que el programa mejora el puntaje de bienestar. Una t apareada entrega un valor p de 0,110, y el equipo mantiene α=0,05.","ask":"Tomá una decisión y redactá una conclusión breve sin inventar el tamaño del efecto.","givens":[{"label":"Prueba","value":"t apareada"},{"label":"p","value":"0,110"},{"label":"α","value":"0,05"}],"steps":["Comparar p=0,110 con α=0,05.","No se rechaza H₀; no hay evidencia suficiente de mejoría."],"answer":"No rechazar H₀.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E115","recipe":50,"story":"En una investigación de participación en terapia, 30 de 100 personas del grupo A y 22 de 110 del grupo B respondieron «sí». Se quiere saber si la diferencia observada entre las dos proporciones poblacionales es estadísticamente significativa con α=0,05, sin asumir una dirección de antemano.","ask":"Aplicá el contraste z bilateral y comunicá la decisión.","givens":[{"label":"Grupo A","value":"30/100"},{"label":"Grupo B","value":"22/110"},{"label":"α","value":"0,05"}],"steps":["p1=0,3000; p2=0,2000.","p conjunta=0,2476; EE≈0,0596.","z≈1,6768; p bilateral≈0,0936.","No rechazar H₀."],"answer":"p≈0,0936; no rechazar H₀.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""},{"id":"E116","recipe":50,"story":"En una investigación de adherencia al seguimiento, 48 de 120 personas del grupo A y 33 de 110 del grupo B respondieron «sí». Se quiere saber si la diferencia observada entre las dos proporciones poblacionales es estadísticamente significativa con α=0,05, sin asumir una dirección de antemano.","ask":"Aplicá el contraste z bilateral y comunicá la decisión.","givens":[{"label":"Grupo A","value":"48/120"},{"label":"Grupo B","value":"33/110"},{"label":"α","value":"0,05"}],"steps":["p1=0,4000; p2=0,3000.","p conjunta=0,3522; EE≈0,0630.","z≈1,5860; p bilateral≈0,1127.","No rechazar H₀."],"answer":"p≈0,1127; no rechazar H₀.","ref":"Práctica de estilo parcial; enunciado redactado para estudiar","level":"variante","notes":""}],"mocks":[{"id":"S1","title":"Segundo parcial · Modelo 2026 A","partial":2,"blocks":[{"title":"Distribución normal","story":"Un instrumento para evaluar resiliencia psicológica produce puntajes que pueden modelarse mediante una distribución normal. En la población estudiada se observa una media de 68 puntos y una desviación estándar de 9 puntos.","questions":[{"letter":"a","ask":"Determiná el puntaje que delimita el 10 % inferior y el puntaje mínimo aproximado del 10 % superior.","answer":"P10=68+9×Φ⁻¹(0,10)≈56,47. P90≈79,53."},{"letter":"b","ask":"¿Qué porcentaje obtiene un puntaje superior a 74?","answer":"z=(74−68)/9≈0,6667. P(X>74)=1−Φ(0,6667)≈0,25249→25,25 %."},{"letter":"c","ask":"¿Qué porcentaje obtiene entre 65 y 72 puntos?","answer":"zₐ=(65−68)/9=−0,3333; zᵦ=(72−68)/9≈0,4444. Área=Φ(zᵦ)−Φ(zₐ)≈0,30220→30,22 %."}],"table":null,"weight":30},{"title":"Hipótesis y comparación","story":"Un equipo realiza un entrenamiento de regulación emocional con 26 pacientes. Cada participante completa una escala de impulsividad de 0 a 20 antes de iniciar el programa y al finalizarlo. La expectativa definida previamente es que los puntajes disminuyan. El análisis informa p=0,02 y se utiliza α=0,05.","questions":[{"letter":"a","ask":"Escribí la hipótesis de investigación en palabras.","answer":"Se espera una disminución del puntaje medio de impulsividad después del programa."},{"letter":"b","ask":"Indicá las variables de estudio y sus escalas.","answer":"Momento antes/después: condición categórica nominal y relacionada; puntaje de impulsividad: respuesta cuantitativa tratada como intervalo."},{"letter":"c","ask":"Elegí la prueba y formulá H₀/H₁ definiendo d=después−antes.","answer":"t apareada por mismos participantes; H₁:μd<0; H₀:μd≥0 (frontera μd=0)."},{"letter":"d","ask":"Compará p y α y concluí.","answer":"p=0,02<0,05→rechazar H₀; evidencia estadística de disminución al nivel del 5 %."}],"table":null,"weight":30},{"title":"Tabla de convivencia","story":"Un estudio de 30 estudiantes distingue si viven solos o con su familia y si presentan aislamiento social. Los datos se organizan en la tabla siguiente.","questions":[{"letter":"a","ask":"Si se elige una persona al azar de las 30, ¿cuál es la probabilidad de que viva sola y presente aislamiento?","answer":"9/30=0,30=30 %."},{"letter":"b","ask":"De quienes NO presentan aislamiento, ¿qué porcentaje vive con su familia?","answer":"11/17≈0,6471=64,71 %."},{"letter":"c","ask":"¿En qué forma de convivencia es mayor el aislamiento proporcional? Justificá con ambos porcentajes.","answer":"Solo:9/15=60 %; con familia:4/15≈26,67 %. Mayor en quienes viven solos."},{"letter":"d","ask":"Si en lugar de la categoría aislado/no aislado se midiera un puntaje de apoyo social de 0 a 100, ¿qué prueba compararías entre los dos grupos independientes? Planteá H₁ para una diferencia sin dirección.","answer":"t independiente (si se cumplen condiciones); H₁:μSolo≠μFamilia."}],"table":[["Convivencia","Aislamiento","Sin aislamiento","Total"],["Vive solo","9","6","15"],["Con familia","4","11","15"],["Total","13","17","30"]],"weight":40}],"source":"Simulacro redactado sobre patrones de los parciales; NO es transcripción literal"},{"id":"S2","title":"Segundo parcial · Modelo 2026 B","partial":2,"blocks":[{"title":"Distribución normal","story":"En una investigación educativa, los puntajes de autorregulación siguen aproximadamente una distribución normal con media 55 y desvío estándar 7.","questions":[{"letter":"a","ask":"Hallá los valores que corresponden a los percentiles 25 y 75.","answer":"P25≈55+7×(−0,67449)=50,28; P75≈59,72."},{"letter":"b","ask":"¿Qué porcentaje registra menos de 50 puntos?","answer":"z=(50−55)/7≈−0,7143; Φ(z)≈0,2375=23,75 %."},{"letter":"c","ask":"¿Qué porcentaje obtiene entre 54 y 61 puntos?","answer":"z₁=−1/7, z₂=6/7; Φ(z₂)−Φ(z₁)≈0,36112=36,11 %."}],"table":null,"weight":30},{"title":"Taller y valor p","story":"Se midió el puntaje de dependencia del teléfono móvil de los mismos 24 adolescentes antes y después de un taller preventivo. La hipótesis de investigación era que el taller reduciría los puntajes. El valor p obtenido fue 0,06 y se había fijado α=0,05.","questions":[{"letter":"a","ask":"Formulá la expectativa del estudio en palabras.","answer":"Se espera una reducción media de dependencia del teléfono luego del taller."},{"letter":"b","ask":"Señalá variable de respuesta y condición comparada.","answer":"Respuesta: puntaje de dependencia, cuantitativa; condición: momento antes/después, mediciones apareadas."},{"letter":"c","ask":"Elegí la prueba y escribí H₀/H₁ definiendo d=después−antes.","answer":"t apareada; H₁:μd<0 y H₀:μd≥0."},{"letter":"d","ask":"Concluí correctamente comparando p y α.","answer":"0,06>0,05: no rechazar H₀. No hay evidencia suficiente de una disminución estadísticamente significativa al 5 %, sin demostrar que el efecto sea cero."}],"table":null,"weight":30},{"title":"Tabla de tutorías","story":"Se relevó ansiedad elevada en 36 estudiantes separados según participación en tutorías. Cada estudiante pertenece a un solo grupo.","questions":[{"letter":"a","ask":"¿Qué probabilidad conjunta corresponde a no hacer tutorías y tener ansiedad elevada?","answer":"11/36≈0,3056=30,56 %."},{"letter":"b","ask":"Entre quienes NO tienen ansiedad elevada, ¿qué porcentaje realizó tutorías?","answer":"13/20=0,65=65 %."},{"letter":"c","ask":"¿En qué grupo se observa mayor proporción de ansiedad elevada?","answer":"Con tutorías:5/18≈27,78 %. Sin tutorías:11/18≈61,11 %. Mayor sin tutorías."},{"letter":"d","ask":"Si el resultado fuera un puntaje de ansiedad 0–100, ¿qué contraste de medias elegirías? H₁ para cualquier diferencia.","answer":"t independiente, si procede; H₁:μConTutorías≠μSinTutorías."}],"table":[["Tutorías","Elevada","No elevada","Total"],["Con tutorías","5","13","18"],["Sin tutorías","11","7","18"],["Total","16","20","36"]],"weight":40}],"source":"Simulacro redactado sobre patrones de los parciales; NO es transcripción literal"},{"id":"P1","title":"Primer parcial · Práctica integradora","partial":1,"blocks":[{"title":"Diseño y variables","story":"Se asigna aleatoriamente a un grupo de estudiantes a un taller de habilidades sociales y a otros a una condición de control. El puntaje final de autoestima se mide una única vez en una escala de 0–30. En la descripción no figura el tamaño exacto de la muestra.","questions":[{"letter":"a","ask":"Identificá diseño, población, muestra y unidad de análisis sin inventar datos faltantes.","answer":"Estudio experimental con grupos distintos; unidad: estudiante; muestra: participantes asignados (n no indicado); población: estudiantes objetivos del estudio, no especificada más allá del contexto."},{"letter":"b","ask":"Clasificá tratamiento y puntaje final.","answer":"Tratamiento/control: explicativa cualitativa nominal; autoestima 0–30: respuesta cuantitativa usualmente tratada como intervalo."},{"letter":"c","ask":"Redactá una hipótesis de investigación no direccional.","answer":"Se espera una diferencia en el puntaje medio de autoestima entre intervención y control."}],"table":null,"weight":null},{"title":"Tabla de frecuencias","story":"Se registra tiempo diario de uso de redes en 350 estudiantes. Las frecuencias absolutas de cinco intervalos, en minutos, se muestran a continuación.","questions":[{"letter":"a","ask":"Verificá el tamaño total de la muestra.","answer":"50+60+100+110+30=350."},{"letter":"b","ask":"Calculá FR, FAA y FRA para cada intervalo.","answer":"FR≈0,1429;0,1714;0,2857;0,3143;0,0857. FAA=50;110;210;320;350. FRA≈0,1429;0,3143;0,6000;0,9143;1."},{"letter":"c","ask":"¿Qué porcentaje declara menos de 90 minutos?","answer":"(50+60+100)/350=210/350=60 %."}],"table":[["Minutos","FA"],["0–30","50"],["30–60","60"],["60–90","100"],["90–120","110"],["120–150","30"]],"weight":null},{"title":"Medidas descriptivas","story":"Un test breve fue contestado por cinco personas cuyos puntajes son 2, 4, 4, 6 y 9. La profesora solicita describir centro y dispersión a partir de los datos muestrales.","questions":[{"letter":"a","ask":"Calculá media, mediana y moda.","answer":"Media=5; mediana=4; moda=4."},{"letter":"b","ask":"Calculá varianza y desvío estándar muestral.","answer":"Media=5; suma cuadrados=28; s²=28/(5−1)=7; s=√7≈2,646."},{"letter":"c","ask":"Calculá CV e interpretá.","answer":"CV=2,646/5×100≈52,92 %; elevada dispersión relativa según contexto."}],"table":null,"weight":null},{"title":"Correlación y regresión","story":"Se registraron pares de puntuación de estrés percibido (x) y horas de sueño (y) en nueve estudiantes. Se desea estudiar asociación lineal y predecir horas de sueño sin hacer afirmaciones causales.","questions":[{"letter":"a","ask":"Describí el sentido de la relación entre x e y.","answer":"Descendente: mayor estrés asociado a menos horas de sueño."},{"letter":"b","ask":"Calculá r y R².","answer":"r≈−0,98860; R²≈0,97733 (97,73 %)."},{"letter":"c","ask":"Encontrá la recta de regresión y predecí y para x=7.","answer":"ŷ≈10,3333−0,6833x; predicción para 7≈5,55 horas."},{"letter":"d","ask":"¿Se puede afirmar causalidad a partir de esta relación?","answer":"No: el ajuste lineal no demuestra causalidad."}],"table":[["Estrés x","Sueño y"],["9","4"],["8","5"],["7","5,5"],["6","6"],["5","7"],["8","5"],["7","5,5"],["6","6,5"],["4","7,5"]],"weight":null}],"source":"Simulacro redactado sobre patrones de los parciales; NO es transcripción literal"}],"families":[{"id":"A","name":"Estudios y variables","recipes":[1,2,3,4]},{"id":"B","name":"Frecuencias y gráficos","recipes":[5,6,7,8]},{"id":"C","name":"Estadística descriptiva","recipes":[9,10,11,12,13]},{"id":"D","name":"Correlación y regresión","recipes":[14,15,16,17,18,19]},{"id":"E","name":"Probabilidad y condicionamiento","recipes":[20,21,22,25,26,27]},{"id":"F","name":"Unión y sucesos","recipes":[23,24]},{"id":"G","name":"Normal y percentiles","recipes":[28,29,30,31,32,33]},{"id":"H","name":"Inferencia e hipótesis","recipes":[34,35,36,37,38,39]},{"id":"I","name":"Medias apareadas","recipes":[40,41,42,43,46]},{"id":"J","name":"Medias independientes","recipes":[40,41,42,44,45,46,47]},{"id":"K","name":"Proporciones","recipes":[48,49,50,51,52,53]}]}</script><script>'use strict';

 }
 else if(state.view==='teoria'){

 box.innerHTML=html;
 }
 else {

function renderRight(){if(state.examId)return renderExam();const r=byId[state.recipe],u=unitForRecipe(),qs=exercisesByRecipe[state.recipe]||[],q=qs[state.exercise];if(!q){$('right-content').innerHTML='<div class="inner">No hay ejercicios.</div>';return;}

if(id==='07'){
 const pts=[];for(let x=0;x<=320;x+=4){const z=(x-160)/53,y=142-116*Math.exp(-z*z/2);pts.push((x===0?'M':'L')+(40+x)+','+y.toFixed(1));}
