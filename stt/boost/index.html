<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>STT Booster</title>
<style>body{margin:0;background:#080a0c;color:#f4f7f9;font:15px/1.45 system-ui}main{max-width:850px;margin:auto;padding:18px}section{background:#10151a;border:1px solid #28343d;border-radius:14px;padding:14px;margin:10px 0}.bar{height:12px;background:#090d10;border:1px solid #28343d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#79e69b}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #28343d;border-radius:99px;padding:4px 7px;color:#8d9aa5;font-size:10px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-top:1px solid #202830;font-size:12px}textarea{width:100%;min-height:300px;background:#090d10;color:#fff;border:1px solid #28343d;border-radius:10px;padding:10px;font:14px/1.5 system-ui}button{padding:10px 12px;border:1px solid #28343d;border-radius:9px;background:#171e24;color:#fff}</style>
<main><h1>STT Booster</h1><p>Usa el mismo audio guardado por STT Fast. La pestaña original sigue desde el principio; ésta trabaja desde el final y prueba 1→2→3→4 auxiliares mientras sigan mejorando el throughput.</p>
<section><h2 id="status">Buscando audio…</h2><div class="bar"><i id="bar"></i></div><div class="meta"><span id="coverage" class="pill">0%</span><span id="pool" class="pill">0 auxiliares</span><span id="hw" class="pill">hardware</span><span id="eta" class="pill">—</span></div></section>
<section><b>Prueba de concurrencia</b><div id="rows"></div></section>
<section><button id="copy" disabled>Copiar combinado</button> <button id="download" disabled>Descargar</button><textarea id="out" placeholder="El texto se arma en orden aunque los bloques se calculen fuera de orden."></textarea></section>
<script type="module">
const $=id=>document.getElementById(id),DB="stt-fast-v1",STORE="jobs";
let fast,file,pcm,duration=0,chunkS=90,stepS=87,total=0,workers=[],boost=new Map(),busy=new Set(),started=performance.now();
function open(){return new Promise((r,j)=>{const q=indexedDB.open(DB,1);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
async function getFast(){try{const db=await open(),v=await new Promise((r,j)=>{const q=db.transaction(STORE,"readonly").objectStore(STORE).get("current");q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)});db.close();return v}catch{return null}}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ\s]/gi," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean)}
function merge(a,b){if(!a)return b;if(!b)return a;const A=a.split(/\s+/),B=b.split(/\s+/),na=norm(a),nb=norm(b);let best=0;for(let k=1;k<=Math.min(25,na.length,nb.length);k++){let ok=0;for(let i=0;i<k;i++)if(na[na.length-k+i]===nb[i])ok++;if(ok/k>=.8)best=k}return(A.join(" ")+" "+B.slice(best).join(" ")).trim()}
function saveBoost(){try{localStorage.setItem("stt_boost_chunks_v1",JSON.stringify({sig:(fast?.fileMeta?.name||"")+"|"+(fast?.fileMeta?.size||0)+"|"+(fast?.fileMeta?.lastModified||0),chunks:[...boost.entries()]}))}catch{}}
function restoreBoost(){try{const x=JSON.parse(localStorage.getItem("stt_boost_chunks_v1")||"null"),sig=(fast?.fileMeta?.name||"")+"|"+(fast?.fileMeta?.size||0)+"|"+(fast?.fileMeta?.lastModified||0);if(x?.sig===sig&&Array.isArray(x.chunks))for(const [i,v] of x.chunks)boost.set(+i,v)}catch{}}
function pmap(){const m=new Map;for(const c of fast?.chunks||[]){const i=Math.round((+c.start||0)/stepS);if(i>=0&&i<total)m.set(i,c)}return m}
function cmap(){const m=pmap();for(const [i,c] of boost)if(!m.has(i))m.set(i,c);return m}
function coverage(){return cmap().size/Math.max(1,total)}
function render(){const c=coverage(),pct=Math.round(c*100);$("bar").style.width=pct+"%";$("coverage").textContent=pct+"% cubierto";$("pool").textContent=workers.length+" auxiliares";document.title=(pct<100?pct+"% · ":"✅ ")+"STT Booster";let out="";const m=cmap();for(let i=0;i<total;i++)if(m.get(i)?.text)out=merge(out,m.get(i).text);$("out").value=out;$("copy").disabled=!out;$("download").disabled=!out;const sec=(performance.now()-started)/1000,done=m.size,rem=done?sec*(total-done)/done:null;$("eta").textContent=rem==null?"—":rem<60?"~"+Math.ceil(rem)+" s":"~"+Math.ceil(rem/60)+" min"}
async function addWorker(){const w=new Worker("./worker.js",{type:"module"}),o={w,busy:false};workers.push(o);await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error("timeout")),180000);w.onmessage=e=>{if(e.data.kind==="ready"){clearTimeout(to);res()}else if(e.data.kind==="error"){clearTimeout(to);rej(new Error(e.data.error))}};w.postMessage({kind:"init"})});render();return o}
function missing(n=99){const m=cmap(),a=[];for(let i=total-1;i>=0&&a.length<n;i--)if(!m.has(i)&&!busy.has(i))a.push(i);return a}
async function job(w,i){w.busy=true;busy.add(i);const start=i*stepS,end=Math.min(duration,start+chunkS),part=pcm.subarray(Math.floor(start*16000),Math.floor(end*16000)).slice(),id=Math.random().toString(36).slice(2),t=performance.now();const r=await new Promise((res,rej)=>{const h=e=>{const x=e.data;if(x.id!==id)return;if(x.kind==="result"){w.w.removeEventListener("message",h);res(x)}else if(x.kind==="joberror"){w.w.removeEventListener("message",h);rej(new Error(x.error))}};w.w.addEventListener("message",h);w.w.postMessage({kind:"job",id,index:i,start,end,chunkS,pcm:part.buffer},[part.buffer])});w.busy=false;busy.delete(i);boost.set(i,{start,end,text:r.text,ms:performance.now()-t});saveBoost();render();return r}
async function calibrate(){const cores=navigator.hardwareConcurrency||4,max=Math.min(4,Math.max(1,Math.floor(cores/2)));$("hw").textContent=cores+" cores"+(navigator.deviceMemory?" · "+navigator.deviceMemory+" GB":"");let prev=0;for(let level=1;level<=max;level++){try{await addWorker()}catch{break}const ids=missing(level);if(!ids.length)break;const t=performance.now(),rs=await Promise.all(ids.map((i,k)=>job(workers[k],i))),audio=rs.reduce((a,x)=>a+x.end-x.start,0),wall=(performance.now()-t)/1000,tp=audio/Math.max(.01,wall),gain=prev?tp/prev:1;$("rows").innerHTML+=`<div class="row"><b>${level} auxiliar${level>1?"es":""}</b><span>${tp.toFixed(2)}× realtime</span><span>${level===1?"base":Math.round((gain-1)*100)+"%"}</span></div>`;if(level>1&&gain<1.10){workers.at(-1).w.terminate();workers.pop();break}prev=tp}return workers.length}
async function loop(){while(coverage()<1){fast=await getFast()||fast;const ids=missing(workers.length);if(!ids.length){await new Promise(r=>setTimeout(r,1200));continue}await Promise.all(workers.filter(x=>!x.busy).slice(0,ids.length).map((w,k)=>job(w,ids[k])))}$("status").textContent="Cobertura 100% · principio y final se encontraron";render()}
async function boot(){fast=await getFast();if(!fast?.file){$("status").textContent="No encontré el audio guardado por STT Fast";return}file=fast.file;duration=+fast.duration||0;chunkS=+fast.winner||90;stepS=Math.max(10,chunkS-3);restoreBoost();if(!duration){$("status").textContent="Esperando que STT Fast termine de preparar el audio";setTimeout(()=>location.reload(),3000);return}total=Math.max(1,Math.ceil(duration/stepS));$("status").textContent="Audio encontrado · preparando auxiliares";const ab=await file.arrayBuffer(),ctx=new AudioContext({sampleRate:16000}),d=await ctx.decodeAudioData(ab);pcm=new Float32Array(d.getChannelData(0));await ctx.close();duration=pcm.length/16000;total=Math.max(1,Math.ceil(duration/stepS));render();await calibrate();$("status").textContent="Acelerando desde el final con "+workers.length+" auxiliares";await loop()}
$("copy").onclick=()=>navigator.clipboard.writeText($("out").value);
$("download").onclick=()=>{const u=URL.createObjectURL(new Blob([$("out").value],{type:"text/plain"})),a=document.createElement("a");a.href=u;a.download="transcripcion-combinada.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
setInterval(async()=>{fast=await getFast()||fast;render()},2500);boot().catch(e=>$("status").textContent="Error: "+e.message);
</script></main>
