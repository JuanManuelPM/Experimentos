<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Prometeo E-Ink Console V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;color:#eee;font-family:ui-monospace,monospace;overflow:hidden}.app{height:100%;display:grid;place-items:center;background:#111}.device{position:relative;width:min(100vw,145.45vh);aspect-ratio:1200/825;background:#000;overflow:hidden;touch-action:none}.scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;user-select:none}.hot{position:absolute;border:0;background:transparent;cursor:pointer;outline:none}.hot:focus::after,.hot.focused::after{content:'';position:absolute;inset:4px;border:3px solid #fff;box-shadow:0 0 0 2px #000 inset}.p1{left:10%;top:21%;width:15%;height:13%}.p2{left:75%;top:21%;width:15%;height:13%}.p3{left:11%;top:59%;width:15%;height:13%}.p4{left:75%;top:59%;width:15%;height:13%}.core{left:35%;top:29%;width:30%;height:30%}.panel{position:absolute;right:1.65%;top:10.2%;width:30%;height:80.1%;display:none;image-rendering:pixelated}.panel.open{display:block}.menu{position:absolute;left:23%;top:21%;width:54%;height:51%;display:none;image-rendering:pixelated}.menu.open{display:block}.veil{position:absolute;inset:0;background:rgba(255,255,255,.06);display:none}.veil.open{display:block}.toast{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:#000;color:#fff;padding:.45rem .7rem;font-size:clamp(11px,1.4vw,18px);display:none}.toast.show{display:block}.panelHot{position:absolute;right:1.65%;top:10.2%;width:30%;height:80.1%;display:none}.panelHot.open{display:block}.debug{position:absolute;left:1.5%;top:1%;font-size:10px;color:#aaa;display:none}@media(max-aspect-ratio:1/1){.device{transform:rotate(90deg);width:100vh;height:auto}}
</style></head><body><main class="app"><div class="device" id="device" aria-label="Prometeo e-ink console">
<img class="scene" src="assets/scene.png" alt="Escena principal Prometeo en blanco y negro">
<button class="hot p1" data-name="Alumnos" aria-label="Alumnos"></button><button class="hot p2" data-name="TTS" aria-label="TTS"></button><button class="hot p3" data-name="Kindle Shell" aria-label="Kindle Shell"></button><button class="hot p4" data-name="Study" aria-label="Study"></button><button class="hot core" data-name="Organismo" aria-label="Organismo"></button>
<div class="veil" id="veil"></div><img class="panel" id="panel" src="assets/panel.png" alt="Panel derecho contextual"><div class="panelHot" id="panelHot"></div><img class="menu" id="menu" src="assets/menu.png" alt="Menú de pausa">
<div class="toast" id="toast"></div></div></main>
<script>
const items=[...document.querySelectorAll('.hot')],panel=document.getElementById('panel'),panelHot=document.getElementById('panelHot'),menu=document.getElementById('menu'),veil=document.getElementById('veil'),toast=document.getElementById('toast');let idx=0,mode='focus';
function focus(i){idx=(i+items.length)%items.length;items.forEach((el,n)=>el.classList.toggle('focused',n===idx));items[idx].focus({preventScroll:true})}
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),900)}
function openPanel(){if(mode==='menu')return;panel.classList.add('open');panelHot.classList.add('open');mode='panel';say('Panel contextual')}
function closePanel(){panel.classList.remove('open');panelHot.classList.remove('open');mode='focus';focus(idx)}
function openMenu(){if(mode==='panel')closePanel();veil.classList.add('open');menu.classList.add('open');mode='menu';say('Menú')}
function closeMenu(){veil.classList.remove('open');menu.classList.remove('open');mode='focus';focus(idx)}
function activate(){if(mode==='menu'){say('Prometeo');closeMenu();return}if(mode==='panel'){say('Abrir detalle');return}say(items[idx].dataset.name+' · abrir')}
function key(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace','m','M'].includes(e.key))e.preventDefault();if(e.key===' '){mode==='panel'?closePanel():openPanel();return}if(e.key==='m'||e.key==='M'){mode==='menu'?closeMenu():openMenu();return}if(e.key==='Escape'||e.key==='Backspace'){if(mode==='panel')closePanel();else if(mode==='menu')closeMenu();else say('Volver');return}if(e.key==='Enter'){activate();return}if(mode!=='focus')return;let map={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};if(e.key in map)focus(idx+map[e.key])}
window.addEventListener('keydown',key);items.forEach((b,i)=>{b.addEventListener('click',()=>{idx=i;focus(i);activate()});b.addEventListener('contextmenu',e=>{e.preventDefault();idx=i;focus(i);openPanel()})});panelHot.addEventListener('click',closePanel);veil.addEventListener('click',closeMenu);document.getElementById('device').addEventListener('dblclick',()=>mode==='menu'?closeMenu():openMenu());focus(0);
</script></body></html>
