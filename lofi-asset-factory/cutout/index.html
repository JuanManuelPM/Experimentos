<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8d5ce">
<title>LO-FI CUTOUT LAB</title>
<style>
:root{--bg:#d8d5ce;--panel:#f5f1e8;--ink:#111;--line:#aaa39a;--hot:#ffe36d;--blue:#cce6ff;--ok:#d9efb4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px}
#stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;border-right:2px solid #111;background:linear-gradient(#c9c7c2,#dedbd5)}
#view{width:min(78vmin,720px);height:min(78vmin,720px);max-width:94%;max-height:94%;image-rendering:auto}
#hud{position:absolute;left:10px;top:10px;background:#111;color:#fff;padding:6px 8px;font-size:9px;line-height:1.45;white-space:pre}
#panel{overflow:auto;background:var(--panel);padding:10px}
.section{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #1112}.section:last-child{border:0}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.head b{font-size:10px;letter-spacing:.05em}.head span{font-size:8px;color:#6a645c}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
button,.upload{border:2px solid var(--line);background:white;color:#111;font:900 8px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:38px;padding:5px;cursor:pointer}
button[data-on="1"]{border-color:#111;background:var(--hot)}
.skin{height:52px}.skin i{display:block;width:100%;height:18px;margin-bottom:4px;border:1px solid #1112}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.primary{background:#111;color:#fff;border-color:#111}.upload{display:flex;align-items:center;justify-content:center;position:relative}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.meta{font-size:8px;line-height:1.5;background:#fff;padding:8px;border:1px solid #1112;white-space:pre-wrap}.ok{background:var(--ok)}
#sourcePreview{width:100%;max-height:140px;object-fit:contain;background:#ccc7bf;border:1px solid #1112;display:none}
@media(max-width:760px){#app{display:block}#stage{position:absolute;left:0;right:0;top:0;bottom:292px;border-right:0;border-bottom:2px solid #111}#view{width:min(92vw,56vh);height:min(92vw,56vh)}#panel{position:absolute;left:0;right:0;bottom:0;height:292px;padding:7px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.skins{grid-template-columns:repeat(6,minmax(0,1fr))}.skin{height:46px}.skin i{height:14px}}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="view" width="512" height="512"></canvas>
    <div id="hud">CUTOUT2D\n1 CANVAS · PREBAKED FRAMES</div>
  </main>
  <aside id="panel">
    <section class="section">
      <div class="head"><b>FORMA CANÓNICA</b><span>misma skin semántica</span></div>
      <div id="forms" class="grid"></div>
    </section>
    <section class="section">
      <div class="head"><b>SKINS COMPATIBLES</b><span id="skinCount"></span></div>
      <div id="skins" class="skins"></div>
      <div class="actions" style="margin-top:6px">
        <label class="upload">USAR CUALQUIER IMAGEN<input id="upload" type="file" accept="image/*"></label>
        <button id="clearCustom">VOLVER A SKINS</button>
      </div>
      <img id="sourcePreview" alt="source preview">
    </section>
    <section class="section">
      <div class="head"><b>POSE</b><span>8 keyframes comunes</span></div>
      <div id="poses" class="grid"></div>
      <div class="actions" style="margin-top:6px">
        <button id="play" class="primary">ANIMAR</button>
        <button id="recompile">RECOMPILAR ATLAS</button>
      </div>
    </section>
    <section class="section">
      <div class="head"><b>CONTRATO</b><span class="ok">SEMANTIC SKIN V1</span></div>
      <div id="meta" class="meta"></div>
    </section>
  </aside>
</div>
<script>
const W=256,H=256,POSE_IDS=['front','left3q','right3q','back','sit','armsIn','waveL','waveR'];
const skins=[
{id:'ocean',label:'OCEAN',body:'#16799d',secondary:'#e8ece7',accent:'#d98a12',detail:'#566064',pattern:'solid'},
{id:'ember',label:'EMBER',body:'#b94236',secondary:'#f0d4ae',accent:'#5a2d27',detail:'#2b2020',pattern:'diagonal'},
{id:'moss',label:'MOSS',body:'#4e7b48',secondary:'#d7d0aa',accent:'#c98e35',detail:'#263e2b',pattern:'dots'},
{id:'plum',label:'PLUM',body:'#705089',secondary:'#e1d7e8',accent:'#d59c2d',detail:'#372846',pattern:'stripes'},
{id:'sun',label:'SUN',body:'#e3b92f',secondary:'#f6f0d5',accent:'#a65828',detail:'#493d23',pattern:'solid'},
{id:'ink',label:'INK',body:'#242833',secondary:'#d9dde1',accent:'#c8752d',detail:'#090b10',pattern:'diagonal'},
{id:'coral',label:'CORAL',body:'#d66867',secondary:'#f3d7c8',accent:'#405b76',detail:'#6d3030',pattern:'dots'},
{id:'ice',label:'ICE',body:'#78abc7',secondary:'#eef6f8',accent:'#445d72',detail:'#2d4858',pattern:'stripes'},
{id:'sand',label:'SAND',body:'#b99b6b',secondary:'#efe2c7',accent:'#6f5335',detail:'#57432e',pattern:'solid'},
{id:'lime',label:'LIME',body:'#83a947',secondary:'#e8f0d0',accent:'#405d35',detail:'#26351d',pattern:'diagonal'},
{id:'rose',label:'ROSE',body:'#b95b82',secondary:'#f2dce6',accent:'#7b374e',detail:'#512638',pattern:'dots'},
{id:'steel',label:'STEEL',body:'#697786',secondary:'#d7dde2',accent:'#ba6d36',detail:'#313b46',pattern:'stripes'}
];
const P=(shape,box,source,role,poly)=>({shape,box,source,role,poly});
const forms=[
{
 id:'blob',label:'BLOB BIPED',parts:{
  body:P('ellipse',[.20,.10,.60,.72],'body','body'),belly:P('ellipse',[.33,.42,.34,.34],'torso','secondary'),
  face:P('ellipse',[.37,.18,.26,.17],'head','secondary'),armL:P('poly',[.08,.31,.30,.39],'armL','body',[[.98,.08],[.70,.10],[.12,.58],[.02,.92],[.34,.70],[.96,.38]]),
  armR:P('poly',[.62,.31,.30,.39],'armR','body',[[.02,.08],[.30,.10],[.88,.58],[.98,.92],[.66,.70],[.04,.38]]),
  footL:P('ellipse',[.25,.73,.23,.16],'legL','accent'),footR:P('ellipse',[.52,.73,.23,.16],'legR','accent'),
  beak:P('ellipse',[.42,.28,.16,.16],'face','accent')
 },baseOrder:['armL','armR','body','belly','face','beak','footL','footR']
},
{
 id:'human',label:'SIMPLE HUMAN',parts:{
  torso:P('round',[.35,.35,.30,.34],'torso','body'),head:P('ellipse',[.36,.11,.28,.27],'head','body'),face:P('ellipse',[.41,.18,.18,.13],'face','secondary'),
  armL:P('round',[.22,.37,.13,.34],'armL','body'),armR:P('round',[.65,.37,.13,.34],'armR','body'),
  legL:P('round',[.36,.65,.12,.27],'legL','detail'),legR:P('round',[.52,.65,.12,.27],'legR','detail')
 },baseOrder:['armL','armR','legL','legR','torso','head','face']
},
{
 id:'bean',label:'HEAD+BODY',parts:{
  body:P('round',[.27,.17,.46,.61],'body','body'),face:P('ellipse',[.37,.25,.26,.16],'face','secondary'),
  armL:P('ellipse',[.14,.40,.22,.17],'armL','body'),armR:P('ellipse',[.64,.40,.22,.17],'armR','body'),
  footL:P('ellipse',[.31,.73,.19,.14],'legL','accent'),footR:P('ellipse',[.50,.73,.19,.14],'legR','accent')
 },baseOrder:['armL','armR','body','face','footL','footR']
}
];
const pose={
 front:{},
 left3q:{face:[-.05,0,-.03,.92,1],beak:[-.06,0,-.05,.9,1],armL:[-.02,.01,.20,.92,1],armR:[-.05,.02,-.12,.72,.95],footL:[-.01,0,.05,1,1],footR:[-.04,.01,-.05,.8,.95],order:'farRight'},
 right3q:{face:[.05,0,.03,.92,1],beak:[.06,0,.05,.9,1],armL:[.05,.02,.12,.72,.95],armR:[.02,.01,-.20,.92,1],footL:[.04,.01,.05,.8,.95],footR:[.01,0,-.05,1,1],order:'farLeft'},
 back:{hidden:['face','beak','belly'],armL:[.01,0,-.10,1,1],armR:[-.01,0,.10,1,1]},
 sit:{body:[0,.05,0,1.03,.92],torso:[0,.05,0,1.03,.92],head:[0,.03,0,1,1],face:[0,.03,0,1,1],beak:[0,.03,0,1,1],armL:[.02,.06,.18,1,.88],armR:[-.02,.06,-.18,1,.88],legL:[-.03,.04,-.65,1.15,.9],legR:[.03,.04,.65,1.15,.9],footL:[-.05,.05,-.30,1.1,.9],footR:[.05,.05,.30,1.1,.9]},
 armsIn:{armL:[.15,.05,-.65,.9,.82],armR:[-.15,.05,.65,.9,.82]},
 waveL:{armL:[.02,-.13,-1.05,1,.9],armR:[0,.01,-.12,1,1]},
 waveR:{armL:[0,.01,.12,1,1],armR:[-.02,-.13,1.05,1,.9]}
};
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=true;
const formsEl=document.getElementById('forms'),skinsEl=document.getElementById('skins'),posesEl=document.getElementById('poses'),metaEl=document.getElementById('meta'),hud=document.getElementById('hud'),sourcePreview=document.getElementById('sourcePreview');
let form=forms[0],skin=skins[0],poseId='front',customImage=null,atlas=null,playing=false,timer=0,frame=0;
function skinColor(s,role){return role==='body'?s.body:role==='secondary'?s.secondary:role==='accent'?s.accent:s.detail}
function patternFill(c,s,box,role){c.fillStyle=skinColor(s,role);c.fill();if(s.pattern==='solid')return;c.save();c.clip();c.globalAlpha=.18;c.strokeStyle=s.detail;c.lineWidth=3;if(s.pattern==='diagonal'){for(let x=-H;x<W+H;x+=18){c.beginPath();c.moveTo(x,0);c.lineTo(x-H,H);c.stroke()}}else if(s.pattern==='stripes'){for(let y=0;y<H;y+=18){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}else if(s.pattern==='dots'){c.fillStyle=s.detail;for(let y=0;y<H;y+=22)for(let x=0;x<W;x+=22){c.beginPath();c.arc(x+(y/22%2)*9,y,3,0,Math.PI*2);c.fill()}}c.restore()}
const boundsCache=new WeakMap();
function contentBounds(img){
 if(boundsCache.has(img))return boundsCache.get(img);
 const sw=96,sh=96,c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,sw,sh);
 const d=x.getImageData(0,0,sw,sh).data;const corners=[[0,0],[sw-1,0],[0,sh-1],[sw-1,sh-1]].map(([cx,cy])=>{const i=(cy*sw+cx)*4;return[d[i],d[i+1],d[i+2]]});
 const bg=[0,1,2].map(k=>corners.reduce((a,v)=>a+v[k],0)/4);let x0=sw,y0=sh,x1=0,y1=0,n=0;
 for(let y=0;y<sh;y++)for(let xx=0;xx<sw;xx++){const i=(y*sw+xx)*4,a=d[i+3];const dist=Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]);if(a>24&&dist>54){x0=Math.min(x0,xx);y0=Math.min(y0,y);x1=Math.max(x1,xx);y1=Math.max(y1,y);n++}}
 const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;const b=n>80?[x0/sw*iw,y0/sh*ih,Math.max(1,(x1-x0+1)/sw*iw),Math.max(1,(y1-y0+1)/sh*ih)]:[0,0,iw,ih];boundsCache.set(img,b);return b;
}
function sourceRegions(img){
 const [x,y,w,h]=contentBounds(img);return {
  body:[x,y,w,h],head:[x+w*.25,y,w*.5,h*.34],face:[x+w*.33,y+h*.08,w*.34,h*.27],torso:[x+w*.25,y+h*.28,w*.5,h*.45],
  armL:[x,y+h*.25,w*.38,h*.48],armR:[x+w*.62,y+h*.25,w*.38,h*.48],legL:[x+w*.18,y+h*.64,w*.36,h*.36],legR:[x+w*.46,y+h*.64,w*.36,h*.36]
 }}
function pathFor(c,p,x,y,w,h){c.beginPath();if(p.shape==='ellipse'){c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2)}else if(p.shape==='round'){const r=Math.min(w,h)*.28;c.roundRect(x,y,w,h,r)}else{const pts=p.poly||[[0,0],[1,0],[1,1],[0,1]];pts.forEach((q,i)=>{const px=x+q[0]*w,py=y+q[1]*h;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath()}}
function trFor(name){const a=pose[poseId]?.[name]||[0,0,0,1,1];return {dx:a[0]||0,dy:a[1]||0,r:a[2]||0,sx:a[3]??1,sy:a[4]??1}}
function drawPart(c,name,p,img,regions,s){
 const [bx,by,bw,bh]=p.box,t=trFor(name);const x=(bx+t.dx)*W,y=(by+t.dy)*H,w=bw*W,h=bh*H;const cx=x+w/2,cy=y+h/2;
 c.save();c.translate(cx,cy);c.rotate(t.r);c.scale(t.sx,t.sy);c.translate(-cx,-cy);pathFor(c,p,x,y,w,h);
 if(img){c.save();c.clip();const r=regions[p.source]||regions.body;c.drawImage(img,r[0],r[1],r[2],r[3],x,y,w,h);c.restore()}else patternFill(c,s,[x,y,w,h],p.role);
 c.strokeStyle='rgba(20,20,20,.28)';c.lineWidth=1.2;c.stroke();c.restore();
}
function renderFrame(target,formObj,skinObj,poseName,img){
 const old=poseId;poseId=poseName;target.clearRect(0,0,W,H);target.fillStyle='#bdbab5';target.fillRect(0,0,W,H);const regs=img?sourceRegions(img):null;
 const hidden=new Set(pose[poseName]?.hidden||[]);let order=[...formObj.baseOrder];if(pose[poseName]?.order==='farRight')order=order.sort((a,b)=>(a==='armR'?-1:b==='armR'?1:0));if(pose[poseName]?.order==='farLeft')order=order.sort((a,b)=>(a==='armL'?-1:b==='armL'?1:0));
 for(const name of order){const p=formObj.parts[name];if(p&&!hidden.has(name))drawPart(target,name,p,img,regs,skinObj)}
 if(formObj.id!=='blob'&&poseName!=='back'){target.fillStyle='#111';target.beginPath();target.arc(W*.47,H*.245,2.5,0,Math.PI*2);target.arc(W*.53,H*.245,2.5,0,Math.PI*2);target.fill()}
 if(formObj.id==='blob'&&poseName!=='back'){target.fillStyle='#111';target.beginPath();target.arc(W*.47,H*.225,2.5,0,Math.PI*2);target.arc(W*.53,H*.225,2.5,0,Math.PI*2);target.fill()}
 poseId=old;
}
function compileAtlas(){
 const a=document.createElement('canvas');a.width=W*4;a.height=H*2;const ac=a.getContext('2d');for(let i=0;i<POSE_IDS.length;i++){const temp=document.createElement('canvas');temp.width=W;temp.height=H;renderFrame(temp.getContext('2d'),form,skin,POSE_IDS[i],customImage);ac.drawImage(temp,(i%4)*W,Math.floor(i/4)*H)}atlas=a;draw();updateMeta()}
function draw(){if(!atlas)return;ctx.fillStyle='#bdbab5';ctx.fillRect(0,0,512,512);const i=POSE_IDS.indexOf(poseId),sx=(i%4)*W,sy=Math.floor(i/4)*H;ctx.imageSmoothingEnabled=true;ctx.drawImage(atlas,sx,sy,W,H,0,0,512,512)}
function updateMeta(){metaEl.textContent=`FORMA: ${form.label}\nSKINS COMUNES: ${skins.length} + cualquier imagen\nPOSES: ${POSE_IDS.length}\nRUNTIME: 1 drawImage/frame después de compilar\nATLAS TEMPORAL: 1024×512\nMAPEO IMAGEN: head / torso / armL / armR / legL / legR\nFALTANTES: se reutiliza body; no bloquean compatibilidad\n3D REAL: NO\nOBJETIVO: silueta 2.5D barata, deformación aproximada`;hud.textContent=`CUTOUT2D\n${form.label}\n${customImage?'CUSTOM IMAGE':skin.label} · ${poseId.toUpperCase()}\n1 CANVAS · PREBAKED FRAMES`}
function renderControls(){
 formsEl.innerHTML='';for(const f of forms){const b=document.createElement('button');b.textContent=f.label;b.dataset.on=f.id===form.id?'1':'0';b.onclick=()=>{form=f;poseId='front';renderControls();compileAtlas()};formsEl.appendChild(b)}
 skinsEl.innerHTML='';for(const s of skins){const b=document.createElement('button');b.className='skin';b.dataset.on=!customImage&&s.id===skin.id?'1':'0';b.innerHTML=`<i style="background:${s.body}"></i>${s.label}`;b.onclick=()=>{customImage=null;sourcePreview.style.display='none';skin=s;renderControls();compileAtlas()};skinsEl.appendChild(b)}document.getElementById('skinCount').textContent=skins.length+' por forma';
 posesEl.innerHTML='';for(const id of POSE_IDS){const b=document.createElement('button');b.textContent=id.toUpperCase();b.dataset.on=id===poseId?'1':'0';b.onclick=()=>{poseId=id;frame=POSE_IDS.indexOf(id);renderControls();draw();updateMeta()};posesEl.appendChild(b)}updateMeta()
}
function stop(){playing=false;clearInterval(timer);document.getElementById('play').textContent='ANIMAR'}
document.getElementById('play').onclick=()=>{if(playing){stop();return}playing=true;document.getElementById('play').textContent='PARAR';timer=setInterval(()=>{frame=(frame+1)%POSE_IDS.length;poseId=POSE_IDS[frame];renderControls();draw()},180)};
document.getElementById('recompile').onclick=compileAtlas;document.getElementById('clearCustom').onclick=()=>{customImage=null;sourcePreview.style.display='none';renderControls();compileAtlas()};
document.getElementById('upload').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const img=new Image();img.onload=()=>{customImage=img;sourcePreview.src=img.src;sourcePreview.style.display='block';renderControls();compileAtlas();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)};
renderControls();compileAtlas();
</script>
</body>
</html>
