<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Prometeo · Productive Demo V7</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#app,#page{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#demo,#full{position:fixed;z-index:5000;top:10px;height:42px;border:2px solid #fff;background:#111;color:#fff;font-weight:900;letter-spacing:.08em}#demo{right:60px;padding:0 14px}#full{right:10px;width:42px}.hide{display:none!important}#caption{position:fixed;z-index:5100;top:10px;left:50%;transform:translateX(-50%);max-width:min(720px,64vw);background:#ecebe2;border:3px solid #111;color:#111;padding:9px 13px;font-size:12px;font-weight:900;text-align:center;box-shadow:5px 5px 0 rgba(255,255,255,.16);display:none}#caption.on{display:block}#cursor{position:fixed;z-index:5300;width:52px;height:62px;left:0;top:0;pointer-events:none;display:none;transition:transform .52s cubic-bezier(.2,.85,.25,1)}#cursor.on{display:block}#cursor svg{width:52px;height:62px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}#cursor.hand .arrow{display:none}#cursor:not(.hand) .hand{display:none}#cursor.press svg{transform:scale(.84)}#cursor.press .hand path{fill:#111;stroke:#fff}#pulse{position:fixed;z-index:5200;width:46px;height:46px;border:4px solid #fff;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}#pulse.on{display:block;animation:p .4s ease-out}@keyframes p{from{opacity:1;scale:.6}to{opacity:0;scale:1.7}}#mouse{position:fixed;z-index:5250;right:18px;bottom:18px;width:82px;height:112px;border:4px solid #fff;border-radius:38px 38px 30px 30px;background:#111;box-shadow:5px 5px 0 rgba(255,255,255,.18);display:none;pointer-events:none}#mouse.on{display:block}#mouse:before{content:"";position:absolute;left:50%;top:0;height:52%;border-left:3px solid #fff}.mb{position:absolute;top:0;width:50%;height:52%}.mb.l{left:0;border-radius:34px 0 0 0}.mb.r{right:0;border-radius:0 34px 0 0}.mb.down{background:#fff}.wheel{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:12px;height:24px;border:3px solid #fff;border-radius:8px}@media(max-width:650px){#demo,#full{top:6px;height:36px}#demo{right:48px;font-size:11px;padding:0 9px}#full{right:6px;width:36px}#caption{top:6px;font-size:10px;max-width:58vw;padding:7px 9px}#mouse{width:62px;height:86px;right:8px;bottom:8px}}
</style></head><body><div id="app"><iframe id="page" src="../visual-ui-v6/?v=20261003-7" allow="fullscreen" title="Prometeo UI"></iframe><button id="demo">DEMO</button><button id="full">⛶</button><div id="caption"></div><div id="pulse"></div><div id="mouse"><div class="mb l"></div><div class="mb r"></div><div class="wheel"></div></div><div id="cursor"><svg class="arrow" viewBox="0 0 48 58"><path d="M4 2v41l11-10 9 22 10-5-10-21h17z" fill="#fff" stroke="#111" stroke-width="3.4" stroke-linejoin="round"/></svg><svg class="hand" viewBox="0 0 52 62"><path d="M17 58c-6-6-9-13-9-21V25c0-3 2-6 5-6s5 2 6 5V9c0-4 3-7 7-7s7 3 7 7v15-7c0-4 3-6 6-6s6 2 6 6v9-4c0-3 2-6 6-6s6 3 6 6v17c0 8-4 15-11 19z" transform="translate(-5 0)" fill="#fff" stroke="#111" stroke-width="3.2" stroke-linejoin="round"/><path d="M14 30 7 24c-3-3-8-1-8 4 0 3 2 5 4 7l9 8" fill="#fff" stroke="#111" stroke-width="3.2" stroke-linecap="round"/></svg></div></div><script>
const f=document.getElementById('page'),demo=document.getElementById('demo'),full=document.getElementById('full'),cap=document.getElementById('caption'),cur=document.getElementById('cursor'),pulse=document.getElementById('pulse'),mouse=document.getElementById('mouse'),ml=mouse.querySelector('.l');let d,running=false,abort=false,done=0,progress=72;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function patch(){d=f.contentDocument;if(!d)return;const bg=d.getElementById('bg'),world=d.getElementById('worldScene'),grain=d.getElementById('grain');if(bg){bg.style.background='#000';bg.style.backgroundImage='none'}if(world){world.style.background='#000';world.style.backgroundImage='none'}if(grain)grain.style.display='none';d.querySelectorAll('img').forEach(i=>{if(i.id==='bg'||i.id==='worldScene')i.removeAttribute('src')});d.getElementById('demoBtn')?.classList.add('hide');d.getElementById('fullBtn')?.classList.add('hide');let sys=d.getElementById('sys');if(sys&&!d.getElementById('doneLive')){let x=d.createElement('span');x.id='doneLive';x.textContent='DONE 0/3';sys.insertBefore(x,sys.children[1]||null)}let cont=d.querySelector('[data-demo="ctx-continue"]');if(cont&&!cont.dataset.productive){cont.dataset.productive='1';cont.textContent='▶ Ejecutar bloque';cont.addEventListener('click',productive)};fixSingle();}
function fixSingle(){if(!d)return;const open=[...d.querySelectorAll('.window.open')];if(open.length===1){const desk=d.getElementById('desktop'),g=Math.max(8,Math.round(Math.min(desk.clientWidth,desk.clientHeight)*.015));Object.assign(open[0].style,{left:g+'px',top:g+'px',width:(desk.clientWidth-2*g)+'px',height:(desk.clientHeight-2*g)+'px'})}}
f.addEventListener('load',()=>{patch();setTimeout(patch,250)});
function productive(){done=Math.min(3,done+1);progress=Math.min(96,progress+8);const x=d.getElementById('doneLive');if(x)x.textContent=`DONE ${done}/3`;const pct=[...d.querySelectorAll('#sys span')].find(e=>/^\d+%$/.test(e.textContent));if(pct)pct.textContent=progress+'%';const n=[...d.querySelectorAll('#status .stat')];if(n[0]){n[0].querySelector('i').style.width=progress+'%';n[0].querySelector('b').textContent=progress}if(n[2]){n[2].querySelector('i').style.width='0%';n[2].querySelector('b').textContent='0'}const t=d.querySelector('[data-demo="task-1"]');if(t){t.style.background='#111';t.style.color='#fff';let sm=t.querySelector('small');if(sm)sm.textContent='✓ completado · output integrado'} }
function q(s){return d?.querySelector(s)}function pos(el){const r=el.getBoundingClientRect(),fr=f.getBoundingClientRect();return{x:fr.left+r.left+r.width*.55,y:fr.top+r.top+r.height*.55}}
async function move(el,hand=true){if(!el)return;const p=pos(el);cur.classList.add('on');cur.classList.toggle('hand',hand);mouse.classList.add('on');cur.style.transform=`translate(${p.x-12}px,${p.y-10}px)`;await wait(620)}
async function click(el,text,after){if(!el)return;cap.textContent=text||'';cap.classList.toggle('on',!!text);await move(el,true);const p=pos(el);cur.classList.add('press');ml.classList.add('down');pulse.style.left=p.x+'px';pulse.style.top=p.y+'px';pulse.classList.remove('on');void pulse.offsetWidth;pulse.classList.add('on');await wait(210);el.click();if(after)after();cur.classList.remove('press');ml.classList.remove('down');await wait(760)}
async function run(){if(running)return;patch();running=true;abort=false;demo.textContent='STOP';mouse.classList.add('on');const steps=[[()=>q('[data-demo="tasks-launch"]'),'Abro TRABAJO. AUTO hace lugar sin perder el escritorio.'],[()=>q('[data-demo="task-1"]'),'Elijo un bloque concreto de trabajo.'],[()=>q('[data-demo="context-launch"]'),'Abro CONTEXTO sólo cuando lo necesito.'],[()=>q('[data-demo="ctx-continue"]'),'Ejecuto el bloque: sube progreso, baja atención y aparece DONE.'],[()=>q('[data-demo="status-launch"]'),'Abro ESTADO para verificar el resultado.'],[()=>q('#context [data-close="context"]'),'Cierro CONTEXTO. Las demás ventanas recuperan el espacio.'],[()=>q('[data-demo="reader-launch"]'),'Abro LECTURA como otra tarea temporal.'],[()=>q('#reader [data-close="reader"]'),'Termino y cierro LECTURA.'],[()=>q('#status [data-close="status"]'),'Cierro ESTADO después de verificar.'],[()=>q('[data-layout="focus"]'),'FOCUS deja la tarea actual en primer plano.'],[()=>q('[data-layout="auto"]'),'AUTO devuelve el escritorio compacto y productivo.']];for(const [get,text] of steps){if(abort)break;const el=get();if(el)await click(el,text);fixSingle()}cap.classList.remove('on');cur.classList.remove('on');mouse.classList.remove('on');demo.textContent='DEMO';running=false}
demo.onclick=()=>{if(running){abort=true;demo.textContent='DEMO'}else run()};document.addEventListener('pointerdown',e=>{if(running&&e.isTrusted&&!e.target.closest('#demo'))abort=true},{capture:true});async function fs(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'});else await document.exitFullscreen()}catch(e){}}full.onclick=fs;document.addEventListener('pointerdown',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.({navigationUI:'hide'}).catch(()=>{})},{once:true});
</script></body></html>
