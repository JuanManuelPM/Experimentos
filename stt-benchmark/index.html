<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="color-scheme" content="dark">
<title>STT Benchmark</title>
<style>
:root{--bg:#080a0c;--p:#11161b;--line:#29333c;--fg:#f4f6f8;--mut:#8c99a4;--ok:#77e49b;--warn:#ffd166}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:860px;margin:auto;padding:14px 12px 70px}.top{position:sticky;top:0;z-index:5;background:rgba(8,10,12,.96);backdrop-filter:blur(12px);padding:8px 0 10px;border-bottom:1px solid #1d242a}
.head{display:flex;align-items:center;gap:12px}.mic{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:#171e24;color:white;font-size:31px}.mic.live{background:#68262e;border-color:#ff8181}.mic:disabled{opacity:.45}
.info{flex:1}.status{font-size:18px;font-weight:850}.sub{color:var(--mut);font-size:11px;margin-top:3px}.meter{height:7px;background:#10161b;border:1px solid #27313a;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;background:var(--ok)}
.progress{display:flex;gap:5px;margin-top:9px}.dot{height:5px;flex:1;border-radius:99px;background:#202830}.dot.done{background:var(--ok)}.dot.now{background:var(--warn)}
.card{border:1px solid var(--line);background:var(--p);border-radius:16px;padding:14px;margin-top:13px}.label{font-size:9px;font-weight:850;letter-spacing:.12em;color:var(--mut)}.reference{font-size:22px;line-height:1.45;margin-top:8px}.hint{font-size:11px;color:var(--mut);margin-top:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--mut)}.pill.good{border-color:#355f42;color:var(--ok)}
details{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#0d1115;padding:8px 10px}summary{cursor:pointer;color:var(--mut);font-size:11px}.rows{display:grid;gap:7px;margin-top:8px}.row{border:1px solid #222c34;background:#0a0e12;border-radius:10px;padding:8px}.rhead{display:flex;justify-content:space-between;gap:8px}.rname{font-size:12px;font-weight:800}.score{font-size:11px}.score.good{color:var(--ok)}.rtext{font-size:13px;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.rank{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #222a31;padding:8px 0}.rank:first-child{border-top:0}pre{white-space:pre-wrap;max-height:220px;overflow:auto;background:#07090b;border:1px solid #202830;border-radius:9px;padding:8px;font-size:9px}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="head"><button id="mic" class="mic">🎙️</button><div class="info"><div id="status" class="status"></div><div id="sub" class="sub">tocá, leé tal cual y tocá de nuevo al terminar</div><div class="meter"><i id="meter"></i></div></div></div><div id="progress" class="progress"></div></div>
<section class="card"><div class="label">LEÉ ESTE TEXTO</div><div id="reference" class="reference"></div><div class="hint">Hablá normal. No hace falta modular exageradamente.</div><div class="pills"><span id="workers" class="pill">workers 0/3</span><span id="session" class="pill"></span></div></section>
<details open><summary>última prueba</summary><div id="rows" class="rows"></div></details>
<section id="summaryCard" class="card" hidden><div class="label">RESUMEN DE LA SESIÓN</div><div id="ranking"></div></section>
<details><summary>diagnóstico</summary><pre id="log"></pre></details>
</div>
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script>
const BUILD='STT-BENCH-V1-20260928', MODEL='https://raw.githubusercontent.com/allorenter/vosk-browser-example/main/vosk-model-small-es-0.3.tar.gz';
const TEXTS=[
{id:'natural',text:'Hoy quiero probar qué tan bien funciona esta transcripción cuando hablo a una velocidad normal y sin exagerar la pronunciación.'},
{id:'rioplatense',text:'Che, fijate si podés entenderme aunque hable rápido, junte algunas palabras y no marque demasiado cada sílaba.'},
{id:'prometeo',text:'Prometeo debería escuchar una frase, comparar varias hipótesis y conservar las palabras que aparecen con mayor consistencia.'},
{id:'confusiones',text:'Quiero comprobar si distingue entre esto, efecto, Héctor y texto cuando las palabras aparecen dentro de una frase completa.'},
{id:'numeros',text:'El martes catorce de octubre a las siete y media tengo que revisar treinta y dos archivos antes de las nueve.'},
{id:'tecnico',text:'Después voy a abrir GitHub, ejecutar el worker y revisar si el build de Firefox coincide con el resultado publicado.'},
{id:'contexto',text:'Si una palabra sale mal al principio, no me importa que se corrija un segundo después, siempre que la frase final quede mejor y no pierda el contexto.'},
{id:'comandos',text:'Che Prometeo, poné pausa, bajá el volumen y después seguí escuchando cuando yo diga continuar.'}
];
const $=id=>document.getElementById(id), sid='stt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const state={idx:0,models:[],loaded:false,loading:false,running:false,stream:null,ctx:null,src:null,proc:null,start:0,chunks:[],liveA:null,liveB:null,results:[]};
const lanes={liveNative:{id:'live_native',name:'Live nativo',text:'',first:null},live16:{id:'live_16k',name:'Live 16 kHz',text:'',first:null},reviewRaw:{id:'review_raw',name:'Revisión completa',text:'',first:null},reviewClean:{id:'review_clean',name:'Revisión limpia',text:'',first:null},consensus:{id:'consensus',name:'Consenso',text:'',first:null}};
function log(m,d){$('log').textContent+='['+new Date().toLocaleTimeString()+'] '+m+(d?' '+JSON.stringify(d):'')+'\n'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ\s]/gi,' ').replace(/\s+/g,' ').trim()}
function tok(s){const n=norm(s);return n?n.split(' '):[]}
function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function wer(r,h){const a=tok(r),b=tok(h);return a.length?100*lev(a,b)/a.length:0}
function cer(r,h){const a=[...norm(r).replace(/\s/g,'')],b=[...norm(h).replace(/\s/g,'')];return a.length?100*lev(a,b)/a.length:0}
function align(base,cand){const A=tok(base),B=tok(cand),n=A.length,m=B.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1));const raw=String(cand||'').trim().split(/\s+/),out=new Array(n).fill(null);let i=n,j=m;while(i>0||j>0){if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1)){out[i-1]=raw[j-1];i--;j--}else if(i>0&&dp[i][j]===dp[i-1][j]+1)i--;else j--}return out}
function consensus(h){h=h.filter(Boolean);if(!h.length)return'';if(h.length===1)return h[0];let base=h[0],best=1e9;for(const a of h){let s=0;for(const b of h)if(a!==b)s+=lev(tok(a),tok(b))/Math.max(1,tok(a).length,tok(b).length);if(s<best){best=s;base=a}}const raw=String(base).trim().split(/\s+/),als=h.filter(x=>x!==base).map(x=>align(base,x));return raw.map((w,i)=>{const vs=[w,...als.map(a=>a[i]).filter(Boolean)],m=new Map();for(const v of vs){const k=norm(v),z=m.get(k)||{n:0,v};z.n++;m.set(k,z)}let q=null;for(const z of m.values())if(!q||z.n>q.n)q=z;return q?.v||w}).join(' ')}
function resample16(input,rate){if(rate===16000)return new Float32Array(input);const ratio=rate/16000,n=Math.max(1,Math.round(input.length/ratio)),o=new Float32Array(n);for(let i=0;i<n;i++){const p=i*ratio,a=Math.floor(p),b=Math.min(a+1,input.length-1),f=p-a;o[i]=input[a]*(1-f)+input[b]*f}return o}
function joinChunks(){const n=state.chunks.reduce((s,c)=>s+c.length,0),o=new Float32Array(n);let p=0;for(const c of state.chunks){o.set(c,p);p+=c.length}return o}
function cleanAudio(a){if(!a.length)return a;let peak=0;for(const x of a)peak=Math.max(peak,Math.abs(x));const th=Math.max(.006,peak*.035);let s=0,e=a.length-1;while(s<e&&Math.abs(a[s])<th)s++;while(e>s&&Math.abs(a[e])<th)e--;s=Math.max(0,s-1600);e=Math.min(a.length-1,e+1600);const out=new Float32Array(e-s+1);let p=0;for(let i=s;i<=e;i++)p=Math.max(p,Math.abs(a[i]));const g=p?Math.min(2.2,.82/p):1;for(let i=0;i<out.length;i++)out[i]=Math.max(-1,Math.min(1,a[s+i]*g));return out}
function bind(rec,l){let committed='';rec.on('partialresult',m=>{const t=(m?.result?.partial||'').trim();if(t&&l.first==null)l.first=performance.now()-state.start;l.text=(committed+' '+t).trim()});rec.on('result',m=>{const t=(m?.result?.text||'').trim();if(t){committed=(committed+' '+t).trim();l.text=committed;if(l.first==null)l.first=performance.now()-state.start}})}
async function transcribeBuffer(model,a){if(!a.length)return'';const r=new model.KaldiRecognizer(16000),parts=[];r.on('result',m=>{const t=(m?.result?.text||'').trim();if(t)parts.push(t)});for(let i=0;i<a.length;i+=4096)r.acceptWaveformFloat(a.subarray(i,Math.min(a.length,i+4096)),16000);r.retrieveFinalResult();await new Promise(x=>setTimeout(x,180));try{r.remove()}catch{}return parts.join(' ').trim()}
function render(){ $('progress').innerHTML=TEXTS.map((_,i)=>'<span class="dot '+(i<state.idx?'done':i===state.idx?'now':'')+'"></span>').join('');$('session').textContent=sid;if(state.idx<TEXTS.length){$('status').textContent='Texto '+(state.idx+1)+' de '+TEXTS.length;$('reference').textContent=TEXTS[state.idx].text}else{$('status').textContent='Sesión terminada';$('reference').textContent='Listo.'}}
async function loadModels(){if(state.loaded||state.loading)return;state.loading=true;$('mic').disabled=true;$('status').textContent='Cargando modelo 1/3…';try{state.models[0]=await Vosk.createModel(MODEL);$('workers').textContent='workers 1/3';$('status').textContent='Cargando modelos 2/3 y 3/3…';const [b,c]=await Promise.all([Vosk.createModel(MODEL),Vosk.createModel(MODEL)]);state.models[1]=b;state.models[2]=c;state.loaded=true;$('workers').textContent='workers 3/3';$('workers').className='pill good';log('models ready')}catch(e){$('status').textContent='Error cargando modelos';$('sub').textContent=String(e)}finally{state.loading=false;$('mic').disabled=false;render()}}
async function start(){if(state.idx>=TEXTS.length)return;if(!state.loaded){await loadModels();if(!state.loaded)return}for(const l of Object.values(lanes)){l.text='';l.first=null}state.chunks=[];state.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});state.ctx=new (window.AudioContext||window.webkitAudioContext)();if(state.ctx.state==='suspended')await state.ctx.resume();state.src=state.ctx.createMediaStreamSource(state.stream);state.proc=state.ctx.createScriptProcessor(4096,1,1);const z=state.ctx.createGain();z.gain.value=0;state.liveA=new state.models[0].KaldiRecognizer(state.ctx.sampleRate);state.liveB=new state.models[1].KaldiRecognizer(16000);bind(state.liveA,lanes.liveNative);bind(state.liveB,lanes.live16);state.start=performance.now();state.running=true;state.proc.onaudioprocess=e=>{if(!state.running)return;const buf=e.inputBuffer,pcm=buf.getChannelData(0),r16=resample16(pcm,state.ctx.sampleRate);state.chunks.push(r16);let sum=0,peak=0;for(let i=0;i<pcm.length;i++){sum+=pcm[i]*pcm[i];peak=Math.max(peak,Math.abs(pcm[i]))}const rms=Math.sqrt(sum/pcm.length);$('meter').style.width=Math.min(100,Math.round(Math.max(rms*380,peak*100)))+'%';state.liveA.acceptWaveform(buf);state.liveB.acceptWaveformFloat(r16,16000)};state.src.connect(state.proc);state.proc.connect(z);z.connect(state.ctx.destination);$('mic').classList.add('live');$('status').textContent='Grabando texto '+(state.idx+1);$('sub').textContent='tocá de nuevo al terminar';log('start',{idx:state.idx,sampleRate:state.ctx.sampleRate})}
async function stop(){if(!state.running)return;state.running=false;$('mic').disabled=true;$('status').textContent='Comparando…';for(const r of [state.liveA,state.liveB]){try{r.retrieveFinalResult()}catch{}}await new Promise(x=>setTimeout(x,200));try{state.liveA.remove()}catch{};try{state.liveB.remove()}catch{};try{state.proc.disconnect()}catch{};try{state.src.disconnect()}catch{};try{state.stream.getTracks().forEach(t=>t.stop())}catch{};try{await state.ctx.close()}catch{};$('meter').style.width='0%';$('mic').classList.remove('live');const a=joinChunks();lanes.reviewRaw.text=await transcribeBuffer(state.models[2],a);lanes.reviewClean.text=await transcribeBuffer(state.models[2],cleanAudio(a));lanes.consensus.text=consensus([lanes.liveNative.text,lanes.live16.text,lanes.reviewRaw.text,lanes.reviewClean.text]);const ref=TEXTS[state.idx].text,rows=Object.values(lanes).map(l=>({id:l.id,name:l.name,text:l.text,wer:wer(ref,l.text),cer:cer(ref,l.text),first:l.first})).sort((a,b)=>a.wer-b.wer||a.cer-b.cer);state.results.push({test:TEXTS[state.idx].id,rows});localStorage.setItem('stt_benchmark_'+sid,JSON.stringify({build:BUILD,session:sid,results:state.results}));$('rows').innerHTML=rows.map((r,i)=>'<div class="row"><div class="rhead"><div class="rname">'+esc(r.name)+'</div><div class="score '+(i===0?'good':'')+'">WER '+r.wer.toFixed(1)+'%</div></div><div class="rtext">'+esc(r.text||'—')+'</div></div>').join('');state.idx++;renderSummary();render();$('mic').disabled=state.idx>=TEXTS.length;$('sub').textContent=state.idx<TEXTS.length?'tocá para el siguiente texto':'benchmark completo';log('result',{test:state.results.at(-1).test,best:rows[0].id,wer:Number(rows[0].wer.toFixed(2))})}
function renderSummary(){if(!state.results.length)return;$('summaryCard').hidden=false;const ids=Object.values(lanes).map(l=>({id:l.id,name:l.name}));const rank=ids.map(x=>{const v=state.results.map(t=>t.rows.find(r=>r.id===x.id)?.wer).filter(Number.isFinite);return {...x,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:Infinity,n:v.length}}).sort((a,b)=>a.avg-b.avg);$('ranking').innerHTML=rank.map((r,i)=>'<div class="rank"><b>'+(i+1)+'. '+esc(r.name)+'</b><span>WER medio '+(Number.isFinite(r.avg)?r.avg.toFixed(1)+'%':'—')+' · '+r.n+' pruebas</span></div>').join('')}
$('mic').onclick=()=>state.running?stop():start();window.addEventListener('error',e=>log('error',{message:e.message,line:e.lineno}));log('build',{BUILD,session:sid});render();
</script>
</body></html>
