<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Visual World Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2348dd;color:#fff;font-family:Arial,sans-serif;touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}#top{position:fixed;z-index:4;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font:900 8px/1 ui-monospace,monospace;letter-spacing:.15em;text-shadow:1px 1px #000}.demo{font:900 7px/1 ui-monospace,monospace;background:#000;color:#d8ff5b;padding:6px 8px}.dock{position:fixed;z-index:5;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;background:#000;padding:5px}.dock button{width:42px;height:42px;border:0;background:#eee;color:#000;font:900 14px Arial}.dock button.on{background:#d8ff5b}.msg{position:fixed;z-index:4;left:12px;bottom:70px;max-width:min(420px,70vw);font:900 11px/1.2 Arial;text-transform:uppercase;text-shadow:1px 1px #000;pointer-events:none}.hint{position:fixed;right:12px;bottom:70px;font:700 8px/1.3 ui-monospace,monospace;text-align:right;text-shadow:1px 1px #000;opacity:.7;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="top"><span class="brand">VISUAL WORLD / ASSET COMPOSABILITY</span><span class="demo">SYNTHETIC DEMO</span></div><div class="msg" id="msg">tocá para mover la mirada</div><div class="hint">assets reales · full-image trail<br>evento → señal visible</div><nav class="dock"><button data-mode="trail" class="on">🐜</button><button data-mode="eye">◉</button><button data-mode="bell">!</button></nav>
<script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d',{alpha:false});let W=480,H=270,mode='trail',px=90,py=145,vx=1.65,vy=.92,trail=[],pulse=0,ready=0;cv.width=W;cv.height=H;
const flea=new Image(),hand=new Image(),eye=new Image();[flea,hand,eye].forEach(i=>{i.crossOrigin='anonymous';i.onload=()=>ready++});
flea.src='https://upload.wikimedia.org/wikipedia/commons/9/96/Flea_Micrographia_Hooke.png';
hand.src='https://commons.wikimedia.org/wiki/Special:Redirect/file/Typographic_Ornaments_-_Pointing_Hand.svg';
eye.src='https://upload.wikimedia.org/wikipedia/commons/1/18/Blue_cat_eye_close_up.jpg';
function stamp(){trail.push({x:px,y:py,a:1});if(trail.length>16)trail.shift()}
function eventBell(){pulse=1;document.querySelector('#msg').textContent='ARTIFACT READY · visual signal';try{const ac=new (AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18)}catch{}}
function drawImageCover(img,x,y,w,h){if(!img.complete||!img.naturalWidth)return;const ir=img.naturalWidth/img.naturalHeight,rr=w/h;let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;if(ir>rr){sw=sh*rr;sx=(img.naturalWidth-sw)/2}else{sh=sw/rr;sy=(img.naturalHeight-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function draw(){
 ctx.fillStyle='#2948df';ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.14;ctx.strokeStyle='#02040b';for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
 if(mode==='trail'){
   for(const s of trail){ctx.globalAlpha=.22+s.a*.35;ctx.save();ctx.translate(s.x,s.y);ctx.filter='grayscale(1) contrast(1.7)';ctx.drawImage(flea,-44,-33,88,66);ctx.restore();s.a*=.992}
   ctx.globalAlpha=1;ctx.filter='grayscale(1) contrast(1.7)';ctx.drawImage(flea,px-48,py-36,96,72);ctx.filter='none';
   ctx.save();ctx.translate(W-106,H-73);ctx.rotate(-.06);ctx.globalAlpha=.88;ctx.filter='grayscale(1) contrast(2)';ctx.drawImage(hand,-62,-34,124,68);ctx.restore();ctx.filter='none';
 }else if(mode==='eye'){
   ctx.save();ctx.translate(W/2,H/2);ctx.rotate(Math.sin(performance.now()/700)*.02);drawImageCover(eye,-86,-60,172,120);ctx.restore();
   ctx.globalAlpha=.55;ctx.filter='grayscale(1) contrast(2)';ctx.drawImage(hand,15,H-96,180,84);ctx.filter='none';ctx.globalAlpha=1;
 }
 if(pulse>0){ctx.strokeStyle='#d8ff5b';ctx.lineWidth=5;ctx.strokeRect(7,7,W-14,H-14);ctx.globalAlpha=pulse*.35;ctx.fillStyle='#d8ff5b';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;pulse*=.88}
}
let dist=0;function tick(){if(mode==='trail'&&ready){const ox=px,oy=py;px+=vx;py+=vy;if(px<45||px>W-45)vx*=-1;if(py<38||py>H-38)vy*=-1;dist+=Math.hypot(px-ox,py-oy);if(dist>11){stamp();dist=0}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function point(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(mode==='trail'){const dx=x-px,dy=y-py,l=Math.hypot(dx,dy)||1;vx=dx/l*2.3;vy=dy/l*2.3;stamp()}else{px=x;py=y}}
cv.addEventListener('pointerdown',point);cv.addEventListener('pointermove',e=>{if(e.buttons)point(e)});
document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.mode==='bell'){eventBell();return}mode=b.dataset.mode;document.querySelector('#msg').textContent=mode==='trail'?'tocá para redirigir el trail':'ojo real · composición simple'});
</script></body></html>
