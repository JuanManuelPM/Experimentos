<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prometeo E‑Ink Scene Factory</title>
<style>
:root{--petrol:#317873;--sand:#E4C9B0;--deep:#143734;--deep2:#1D4B47;--mid:#6FA29B;--soft:#D4B79F;--black:#081716;--ui:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--deep);color:var(--sand);font-family:var(--ui);height:100%;overflow:hidden}
body{display:grid;place-items:center;padding:10px}
.shell{width:min(1180px,100vw - 20px);aspect-ratio:4/3;position:relative;background:var(--black);border:8px solid var(--sand);box-shadow:0 0 0 4px var(--petrol),0 0 0 8px var(--sand);overflow:hidden;image-rendering:pixelated}
.chrome{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 17.5%,rgba(228,201,176,.08) 17.5% 17.7%,transparent 17.7% 79.5%,rgba(228,201,176,.08) 79.5% 79.7%,transparent 79.7%),linear-gradient(0deg,transparent 0 13%,rgba(228,201,176,.08) 13% 13.2%,transparent 13.2% 91%,rgba(228,201,176,.08) 91% 91.2%,transparent 91.2%)}
.top{position:absolute;left:0;right:0;top:0;height:9%;display:grid;grid-template-columns:17.5% 1fr 20.5%;align-items:center;border-bottom:4px solid var(--sand);background:var(--deep2);z-index:10}
.brand{font-size:clamp(16px,2.2vw,30px);font-weight:900;letter-spacing:.12em;padding-left:5%}.sceneTitle{text-align:center;font-weight:800;letter-spacing:.1em}.status{text-align:right;padding-right:6%;font-size:clamp(10px,1.4vw,18px)}
.rail{position:absolute;left:0;top:9%;bottom:13%;width:17.5%;border-right:4px solid var(--sand);background:var(--deep2);display:grid;grid-template-rows:repeat(6,1fr);z-index:9}
.nav{appearance:none;border:0;border-bottom:2px solid var(--sand);background:transparent;color:var(--sand);font:inherit;font-size:clamp(11px,1.45vw,19px);font-weight:800;display:grid;grid-template-columns:34% 1fr;align-items:center;padding:0 8%;cursor:pointer;text-align:left}
.nav .ico{font-size:1.4em;text-align:center}.nav.focused,.nav:hover{background:var(--sand);color:var(--petrol)}
.viewport{position:absolute;left:17.5%;top:9%;right:20.5%;bottom:13%;overflow:hidden;background:var(--petrol)}
.scene{position:absolute;inset:0;display:none;background-size:cover;background-position:center;image-rendering:pixelated}.scene.active{display:block}
.context{position:absolute;right:0;top:9%;bottom:13%;width:20.5%;border-left:4px solid var(--sand);background:var(--deep2);padding:2.2% 1.3%;z-index:8;overflow:hidden}.context h3{font-size:clamp(12px,1.45vw,18px);margin:0 0 8%;letter-spacing:.08em}.context .big{font-size:clamp(15px,2vw,26px);font-weight:900;line-height:1.08}.context p{font-size:clamp(9px,1.08vw,14px);line-height:1.35;margin:7% 0;color:var(--soft)}
.context .meter{height:12px;border:2px solid var(--sand);margin:7% 0}.context .meter i{display:block;height:100%;background:var(--sand)}
.actions{position:absolute;left:0;right:0;bottom:0;height:13%;border-top:4px solid var(--sand);background:var(--deep2);display:grid;grid-template-columns:17.5% 1fr 20.5%;z-index:10}.hint{display:flex;align-items:center;justify-content:center;border-right:2px solid var(--sand);font-size:clamp(9px,1vw,14px);gap:5%}.actionRow{display:grid;grid-template-columns:repeat(4,1fr);gap:1%;padding:1.2%}.act{border:2px solid var(--sand);background:var(--deep);color:var(--sand);font:inherit;font-weight:800;font-size:clamp(9px,1.15vw,15px);cursor:pointer}.act.focused,.act:hover{background:var(--sand);color:var(--petrol)}.mode{display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1vw,14px)}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}.hot::after{content:'';position:absolute;inset:-4px;border:4px solid transparent}.hot.focused::after{border-color:var(--sand);box-shadow:0 0 0 3px var(--petrol)}
.hotLabel{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);background:var(--sand);color:var(--petrol);padding:2px 6px;font-size:10px;font-weight:900;white-space:nowrap;display:none}.hot.focused .hotLabel{display:block}
.listPanel{position:absolute;inset:5% 4%;display:grid;grid-template-columns:48% 1fr;gap:4%;background:rgba(8,23,22,.82);border:4px solid var(--sand);padding:3%}.list{display:grid;grid-template-rows:repeat(6,1fr);gap:1.2%}.listItem{border:2px solid var(--mid);background:var(--deep2);color:var(--sand);font:inherit;text-align:left;padding:2.5% 4%;font-size:clamp(10px,1.25vw,16px);font-weight:700}.listItem.focused{background:var(--sand);color:var(--petrol);border-color:var(--sand)}.preview{background-size:cover;background-position:center;border:3px solid var(--sand);position:relative}.preview::after{content:'DUNE · F. HERBERT';position:absolute;left:0;right:0;bottom:0;padding:4%;background:rgba(8,23,22,.9);font-weight:900}
.promGrid{position:absolute;inset:5%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5%}.module{position:relative;border:0;background:rgba(49,120,115,.08);cursor:pointer}.module.focused::after{content:'';position:absolute;inset:0;border:5px solid var(--sand)}
.writePanel{position:absolute;inset:6%;display:grid;grid-template-rows:16% 1fr 18%;background:rgba(8,23,22,.92);border:4px solid var(--sand)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:3px solid var(--sand)}.tab{display:grid;place-items:center;border-right:2px solid var(--sand);font-weight:900}.paper{margin:4%;background:var(--sand);color:var(--petrol);padding:4%;font:700 clamp(12px,1.5vw,19px)/1.5 var(--ui);outline:none;border:0;resize:none}.writeTools{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5%;padding:2% 3%;border-top:3px solid var(--sand)}
.searchPanel{position:absolute;inset:7%;background:rgba(8,23,22,.92);border:4px solid var(--sand);padding:4%;display:grid;grid-template-rows:18% 1fr;gap:4%}.searchBox{background:var(--sand);color:var(--petrol);display:flex;align-items:center;padding:0 3%;font-weight:900;font-size:clamp(12px,1.7vw,22px)}.results{display:grid;grid-template-columns:1fr 1fr;gap:3%}.result{border:2px solid var(--mid);padding:4%;background:var(--deep2);font-weight:800}.result.focused{border-color:var(--sand);background:var(--sand);color:var(--petrol)}
.debug{position:fixed;right:10px;top:10px;background:#000d;color:#fff;padding:7px 9px;font-size:11px;display:none;z-index:9999}body.debugOn .debug{display:block}
@media(max-width:760px){body{padding:4px}.shell{width:100vw;max-height:100vh}.brand{font-size:13px}.nav{font-size:10px;padding:0 4%}.context p{font-size:8px}}
</style>
</head>
<body>
<div class="shell" id="shell" tabindex="0" aria-label="Prometeo E-Ink demo">
  <div class="top"><div class="brand">PROMETEO</div><div class="sceneTitle" id="sceneTitle">INICIO</div><div class="status">12:36 · ◉ Wi‑Fi · 86%</div></div>
  <div class="rail" id="rail">
    <button class="nav" data-target="home"><span class="ico">⌂</span><span>INICIO</span></button>
    <button class="nav" data-target="library"><span class="ico">▤</span><span>LEER</span></button>
    <button class="nav" data-target="note"><span class="ico">✎</span><span>NOTA</span></button>
    <button class="nav" data-target="prometeo"><span class="ico">⚙</span><span>PROMETEO</span></button>
    <button class="nav" data-target="search"><span class="ico">⌕</span><span>BUSCAR</span></button>
    <button class="nav" data-target="archive"><span class="ico">▣</span><span>ARCHIVO</span></button>
  </div>
  <div class="viewport" id="viewport">
    <section class="scene active" id="scene-home" style="background-image:url(./home.png)">
      <button class="hot" data-id="home-read" data-enter="library" style="left:8%;top:15%;width:25%;height:55%"><span class="hotLabel">LEER</span></button>
      <button class="hot" data-id="home-note" data-enter="note" style="left:33%;top:50%;width:31%;height:35%"><span class="hotLabel">NOTA</span></button>
      <button class="hot" data-id="home-prom" data-enter="prometeo" style="right:4%;top:12%;width:25%;height:60%"><span class="hotLabel">PROMETEO</span></button>
    </section>
    <section class="scene" id="scene-library" style="background:#102f2c">
      <div class="listPanel">
        <div class="list" id="bookList">
          <button class="listItem" data-id="book1">Dune<br><small>Frank Herbert</small></button>
          <button class="listItem" data-id="book2">Fundación<br><small>Isaac Asimov</small></button>
          <button class="listItem" data-id="book3">El nombre del viento<br><small>Patrick Rothfuss</small></button>
          <button class="listItem" data-id="book4">2001<br><small>Arthur C. Clarke</small></button>
          <button class="listItem" data-id="book5">Solaris<br><small>Stanislaw Lem</small></button>
          <button class="listItem" data-id="book6">Meditaciones<br><small>Marco Aurelio</small></button>
        </div>
        <div class="preview" style="background-image:url(./library.png)"></div>
      </div>
    </section>
    <section class="scene" id="scene-prometeo" style="background-image:url(./prometeo.png)">
      <div class="promGrid">
        <button class="module" data-id="proj-alumnos" data-label="ALUMNOS"></button>
        <button class="module" data-id="proj-kindle" data-label="KINDLE SHELL"></button>
        <button class="module" data-id="proj-tts" data-label="TTS"></button>
        <button class="module" data-id="proj-study" data-label="ESTUDIO"></button>
      </div>
    </section>
    <section class="scene" id="scene-note" style="background:#123d39">
      <div class="writePanel"><div class="tabs"><div class="tab">ESCRIBIR</div><div class="tab">BUSCAR</div><div class="tab">PLANTILLAS</div></div><textarea class="paper" id="noteText">Idea / Jardín Interior

Pequeños hábitos, grandes paisajes.</textarea><div class="writeTools"><button class="act" data-id="save">GUARDAR</button><button class="act" data-id="todo">+ HACER</button><button class="act" data-id="tag">ETIQUETA</button><button class="act" data-id="send">SYNC</button></div></div>
    </section>
    <section class="scene" id="scene-search" style="background:#102f2c"><div class="searchPanel"><div class="searchBox">⌕ apego</div><div class="results"><button class="result" data-id="res1">LIBRO<br><small>Psicología del desarrollo</small></button><button class="result" data-id="res2">NOTA<br><small>idea clase apego</small></button><button class="result" data-id="res3">HIGHLIGHT<br><small>Bowlby · pág. 184</small></button><button class="result" data-id="res4">PROMETEO<br><small>study-pack-apego</small></button></div></div></section>
    <section class="scene" id="scene-archive" style="background:#102f2c"><div class="listPanel"><div class="list"><button class="listItem" data-id="ar1">HOY · 7</button><button class="listItem" data-id="ar2">ESTUDIO · 24</button><button class="listItem" data-id="ar3">PROMETEO · 18</button><button class="listItem" data-id="ar4">IDEAS · 43</button><button class="listItem" data-id="ar5">HIGHLIGHTS · 116</button><button class="listItem" data-id="ar6">FÓSILES · 9</button></div><div class="preview" style="background-image:url(./home.png)"></div></div></section>
  </div>
  <aside class="context" id="context"></aside>
  <div class="actions"><div class="hint">TOUCH = elegir</div><div class="actionRow"><button class="act" data-global="back">← VOLVER</button><button class="act" data-global="enter">ENTER · ABRIR</button><button class="act" data-global="space">SPACE · ACCIÓN</button><button class="act" data-global="home">⌂ HOME</button></div><div class="mode" id="mode">NAV MODE</div></div>
  <div class="chrome"></div>
</div>
<div class="debug" id="debug"></div>
<script>
const DATA={
 home:{title:'INICIO',ctx:['CONTINUAR','Psicología · Apego','Pág. 184 · 73%','3 highlights · 1 nota'],meter:73},
 library:{title:'BIBLIOTECA',ctx:['LECTURA','Dune','Frank Herbert','EPUB · 412 págs.'],meter:0},
 note:{title:'NOTA / TEXTO',ctx:['CAPTURA','Inbox automático','Space = guardar rápido','Sin clasificar ahora'],meter:0},
 prometeo:{title:'PROMETEO / CONTROL',ctx:['NECESITA VOS · 1','Kindle Shell · 72%','TTS · bloqueado','Alumnos · moviendo'],meter:72},
 search:{title:'BUSCAR',ctx:['GLOBAL','4 resultados','libro · nota · highlight','Prometeo'],meter:0},
 archive:{title:'ARCHIVO',ctx:['MEMORIA','217 objetos locales','9 fósiles útiles','último sync 12:31'],meter:0}
};
const state={scene:'home',focus:null,mode:'NAVIGATION',history:[]};
const shell=document.getElementById('shell'), context=document.getElementById('context'), title=document.getElementById('sceneTitle'), mode=document.getElementById('mode');
function sceneEls(){return [...document.querySelectorAll(`#scene-${state.scene} [data-id], .rail [data-target], .actions [data-global]`)];}
function setContext(extra){const d=DATA[state.scene];let lines=[...d.ctx];if(extra)lines=[extra,...lines.slice(1)];context.innerHTML=`<h3>${lines[0]}</h3><div class="big">${lines[1]||''}</div>${d.meter?`<div class="meter"><i style="width:${d.meter}%"></i></div>`:''}<p>${(lines.slice(2).join('<br>'))}</p>`}
function activate(scene,push=true){if(scene===state.scene)return;if(push)state.history.push(state.scene);document.querySelector('.scene.active')?.classList.remove('active');state.scene=scene;document.getElementById('scene-'+scene).classList.add('active');title.textContent=DATA[scene].title;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('focused',n.dataset.target===scene));setContext();focusFirst();}
function clearFocus(){document.querySelectorAll('.focused').forEach(e=>e.classList.remove('focused'));}
function focus(el){if(!el)return;clearFocus();el.classList.add('focused');state.focus=el;let label=el.dataset.label||el.textContent.trim().split('\n')[0]||el.dataset.target||el.dataset.global;setContext(label);}
function focusables(){let sel=[];if(state.scene==='home')sel=[...document.querySelectorAll('#scene-home [data-id]')];else sel=[...document.querySelectorAll(`#scene-${state.scene} [data-id]`)];return sel;}
function focusFirst(){let a=focusables();focus(a[0]||document.querySelector(`.nav[data-target="${state.scene}"]`));}
function move(dir){if(state.mode==='TEXT')return;const a=focusables();if(!a.length)return;let i=Math.max(0,a.indexOf(state.focus));let cols=state.scene==='prometeo'||state.scene==='search'?2:1;if(dir==='up')i=Math.max(0,i-cols);if(dir==='down')i=Math.min(a.length-1,i+cols);if(dir==='left')i=Math.max(0,i-1);if(dir==='right')i=Math.min(a.length-1,i+1);focus(a[i]);}
function enter(){let e=state.focus;if(!e)return;if(e.dataset.enter)activate(e.dataset.enter);else if(e.dataset.target)activate(e.dataset.target);else if(state.scene==='note'&&e.id==='noteText')textMode(true);else setContext((e.dataset.label||e.textContent.trim().split('\n')[0]||'ABIERTO')+' · ABIERTO');}
function space(){if(state.mode==='TEXT')return;let e=state.focus;setContext((e?.dataset.label||e?.textContent.trim().split('\n')[0]||'ACCIÓN')+' · ACCIÓN RÁPIDA');}
function back(){if(state.mode==='TEXT'){textMode(false);return};let s=state.history.pop();activate(s||'home',false);}
function textMode(on){state.mode=on?'TEXT':'NAVIGATION';mode.textContent=on?'TEXT MODE':'NAV MODE';if(on){document.getElementById('noteText').focus()}else{shell.focus();focusFirst()}}
function home(){state.history=[];activate('home',false)}

document.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.target)));
document.querySelectorAll('[data-enter]').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.enter)));
document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{focus(b); if(b.closest('.scene')?.id==='scene-note' && b.id==='noteText')textMode(true); else if(b.dataset.enter)activate(b.dataset.enter); else setContext((b.dataset.label||b.textContent.trim().split('\n')[0]||'SELECCIÓN')+' · SELECCIONADO')}));
document.querySelectorAll('[data-global]').forEach(b=>b.addEventListener('click',()=>({back,enter,space,home}[b.dataset.global]?.())));
document.getElementById('noteText').addEventListener('focus',()=>textMode(true));
shell.addEventListener('keydown',e=>{if(state.mode==='TEXT'){if(e.key==='Escape'){e.preventDefault();textMode(false)}return};const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(map[e.key]){e.preventDefault();move(map[e.key])} else if(e.key==='Enter'){e.preventDefault();enter()} else if(e.code==='Space'){e.preventDefault();space()} else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();back()} else if(e.key.toLowerCase()==='h')home(); else if(e.key.toLowerCase()==='d')document.body.classList.toggle('debugOn');});
document.addEventListener('keydown',e=>{if(e.target===document.body&&!['INPUT','TEXTAREA'].includes(e.target.tagName))shell.focus()});
setContext();focusFirst();shell.focus();
</script>
</body></html>
