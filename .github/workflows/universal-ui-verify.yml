name: Universal UI candidate verification

on:
  push:
    branches:
      - universal-ui/v0
    paths:
      - 'universal-ui/**'
      - '.github/workflows/universal-ui-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Universal UI tests and demo build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: universal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: universal-ui/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build standalone demo
        run: npm run build:demo
      - name: Check browser extension JavaScript syntax
        run: find extension -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
