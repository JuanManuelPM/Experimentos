name: Universal UI candidate verification

on:
  push:
    branches:
      - universal-ui/v0
      - candidate/firefox-launcher-v0-20261101
    paths:
      - 'universal-ui/**'
      - '.github/workflows/universal-ui-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Universal UI tests and demo build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: universal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: universal-ui/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build standalone demo
        run: npm run build:demo
      - name: Check browser extension JavaScript syntax
        run: find extension -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Package candidate Firefox extension
        run: |
          cd ..
          zip -q -r firefox-launcher-0.3.0.zip universal-ui/extension universal-ui/docs/FIREFOX_LAUNCHER_V0_3.md
      - name: Upload installable candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: firefox-launcher-0.3.0
          path: firefox-launcher-0.3.0.zip
          if-no-files-found: error
