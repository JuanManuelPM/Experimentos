name: Zero Friction LLM Lab

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "worker-lab/zero-friction/run.mjs"
      - ".github/workflows/zero-friction-llm.yml"
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: zero-friction-ollama-v1-qwen05-gemma270-llama1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull zero-friction models
        run: |
          ollama pull qwen2.5:0.5b-instruct
          ollama pull gemma3:270m
          ollama pull llama3.2:1b

      - name: Run benchmark
        run: node worker-lab/zero-friction/run.mjs

      - name: Publish result to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/zf-pages origin/gh-pages
          mkdir -p /tmp/zf-pages/zero-friction/results
          cp worker-lab/zero-friction/out/latest.json /tmp/zf-pages/zero-friction/results/latest.json
          cd /tmp/zf-pages
          git config user.name "worker-lab-bot"
          git config user.email "worker-lab-bot@users.noreply.github.com"
          git add zero-friction/results/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Zero Friction LLM benchmark"
          git push origin HEAD:gh-pages
