name: PROMETEO music W003-04 Agua en movimiento
on:
  push:
    branches: [gh-pages]
    paths:
      - 'prometeo/music/releases/w003-04/render.py'
      - 'prometeo/music/releases/w003-04/break_editor.py'
      - '.github/workflows/prometeo-music-w003-04.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-music-w003-04
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline DSP dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Source gate - syntax and sample license
        run: |
          python -m py_compile prometeo/music/releases/w003-04/render.py prometeo/music/releases/w003-04/break_editor.py
          python - <<'PY'
          import sys,numpy as np,soundfile as sf,tempfile,pathlib
          sys.path.insert(0,'prometeo/music/releases/w003-04')
          from break_editor import vary_break,SOURCES,slice_licensed_wav,reconstruct_slices
          assert len({s["id"] for s in SOURCES.values()})==len(SOURCES)
          assert all("Original" in s["license"] for s in SOURCES.values())
          with tempfile.TemporaryDirectory() as t:
            p=pathlib.Path(t)/'test.wav'
            sr=44100
            sf.write(p,np.sin(2*np.pi*320*np.arange(sr)/sr),sr)
            provenance={'sourceId':'synthetic-fixture','origin':'original',
              'license':'original','permissionEvidence':'generated by CI'}
            cells=slice_licensed_wav(p,provenance)
            assert reconstruct_slices(cells,[1,0,4,3]).ndim==2
            try: slice_licensed_wav(p,{})
            except ValueError: pass
            else: raise AssertionError('Unlicensed source was accepted')
          changes=[tuple((x['kind'],x['step'],x['velocity']) for x in vary_break(2,b)) for b in range(8)]
          assert len(set(changes))==8,'identical high-intensity bars'
          print('FIRST_ARTICLE structure / license gate PASS')
          PY
      - name: Render new long-form recording
        run: python prometeo/music/releases/w003-04/render.py
      - name: Verify bytes, 112 bars, source identity and stem reconstruction
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,soundfile as sf,numpy as np
          p=pathlib.Path('prometeo/music/releases/w003-04')
          q=json.loads((p/'QA_RECEIPT.json').read_text())
          score=json.loads((p/'SONGPROJECT.json').read_text())
          assert q['taskId']==score['taskId']=='music-w003-20261122-04'
          assert q['bars']==score['bars']==112 and q['sampleRate']==44100
          assert q['events']['DRUMS']>1100 and q['breakVariation']['minAdjacentEventDifference']>0
          m,sr=sf.read(p/'MASTER.wav',dtype='float32',always_2d=True)
          assert sr==44100 and m.shape[1]==2 and 150<len(m)/sr<160
          assert (p/'MASTER.mp3').stat().st_size>250000
          assert q['masterSamplePeak']<=.902 and q['stemMasterResidualRMS']<.00015
          stems=[sf.read(p/'STEMS'/f'{n}.flac',dtype='float32',always_2d=True)[0]
                 for n in ('DRUMS','SUB_BASS','KEYS','AIR')]
          assert all(x.shape==m.shape for x in stems)
          err=np.sqrt(np.mean((m-np.sum(stems,axis=0))**2,dtype=np.float64))
          assert err<.00015,err
          srtest=subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name','-of','default=noprint_wrappers=1',str(p/'MASTER.mp3')],text=True)
          assert 'mp3' in srtest
          print('BINARY_READBACK PASS',sr,len(m)/sr,err,q['breakVariation'])
          PY
      - name: Export real A/B sections and manifest
        run: |
          python - <<'PY'
          import json,subprocess,pathlib,datetime,hashlib
          p=pathlib.Path('prometeo/music/releases/w003-04')
          bpm=174
          for name,bar in [('LOW',12),('MID',28),('HIGH',88)]:
            sec=bar*240/bpm
            subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error',
              '-ss',str(sec),'-t',str(8*240/bpm),'-i',str(p/'MASTER.wav'),
              '-c:a','libmp3lame','-b:a','160k',str(p/f'EXCERPT_{name}.mp3')],check=True)
          qs=json.loads((p/'QA_RECEIPT.json').read_text())
          files=['MASTER.wav','MASTER.mp3','SONGPROJECT.json','QA_RECEIPT.json']+[f'EXCERPT_{x}.mp3' for x in ('LOW','MID','HIGH')]
          files += [f'STEMS/{x}.flac' for x in ('DRUMS','SUB_BASS','KEYS','AIR')]
          hashes={n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in files}
          (p/'manifest.json').write_text(json.dumps({
            'schema':'prometeo.music.release/v2','taskId':'music-w003-20261122-04',
            'title':'AGUA EN MOVIMIENTO','bpm':174,'bars':112,'sampleRate':44100,
            'status':'BINARY_RENDER_VERIFIED_HUMAN_APPROVED_NO',
            'renderedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'filesSha256':hashes,'criticalListening':'NOT_RUN',
            'referenceAudioAB':'NOT_RUN','humanApproved':False
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit new original audio only, rebase without destroying concurrent work
        run: |
          set -e
          git config user.name "prometeo-music-w003-04-render"
          git config user.email "actions@users.noreply.github.com"
          git add prometeo/music/releases/w003-04/MASTER.wav prometeo/music/releases/w003-04/MASTER.mp3 prometeo/music/releases/w003-04/STEMS prometeo/music/releases/w003-04/SONGPROJECT.json prometeo/music/releases/w003-04/QA_RECEIPT.json prometeo/music/releases/w003-04/EXCERPT_*.mp3 prometeo/music/releases/w003-04/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "music W003-04: publish measured original master and stems [skip ci]"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
