name: "PROMETEO · images W003/06 · original raster escrow"
on:
  push:
    branches:
      - candidate/prometeo-images-w003-20261122-06
    paths:
      - .github/workflows/prometeo-images-w003-06.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: promete-images-w003-06-raster-escrow
  cancel-in-progress: false
jobs:
  original-raster:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image byte verification
        run: pip install Pillow
      - name: Download three already-generated original rasters (no new generation)
        env:
          IMG_01: "https://elevenlabsusercontent.com/database/workspace/8a6e929b5fe34c25873c0a09b7da6ce5/content_generation/RTBNUIEKERin8wOYfOjo/nA8QI0FFhUjRNGo9EPH7/content.png?Expires=1795384800&KeyName=assets-cdn-key-1&Signature=kLrNH3jag4n6DZh0AQFTj7vFxjk="
          IMG_02: "https://elevenlabsusercontent.com/database/workspace/8a6e929b5fe34c25873c0a09b7da6ce5/content_generation/A3ZxdWh64FGezjZc2Njw/jj0fgs8GZ9eRGiRzS1KO/content.png?Expires=1795384800&KeyName=assets-cdn-key-1&Signature=NXUscWpAgcT44rg8bKnvaE4nU8s="
          IMG_04: "https://elevenlabsusercontent.com/database/workspace/8a6e929b5fe34c25873c0a09b7da6ce5/content_generation/aWFopgpZ0afOXsWira7M/zhYdCKwW24w3SF4JiFWg/content.png?Expires=1795384800&KeyName=assets-cdn-key-1&Signature=lNOYQkZ0xAG8RnYZlbG3FOOd_6M="
        run: |
          set -euo pipefail
          mkdir -p prometeo/launch/20261122/relaunch/images/work/06/media
          curl -fsSL --retry 2 --retry-delay 2 "$IMG_01" -o prometeo/launch/20261122/relaunch/images/work/06/media/01.png
          curl -fsSL --retry 2 --retry-delay 2 "$IMG_02" -o prometeo/launch/20261122/relaunch/images/work/06/media/02.png
          curl -fsSL --retry 2 --retry-delay 2 "$IMG_04" -o prometeo/launch/20261122/relaunch/images/work/06/media/04.png
      - name: Decode, inspect and create genuine raster contact proof
        working-directory: prometeo/launch/20261122/relaunch/images/work/06
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from datetime import datetime, timezone
          import json,hashlib
          names=['01','02','04']
          data={}
          strip=Image.new('RGB',(960,180),(16,18,20))
          hashes=set()
          for i,name in enumerate(names):
              p=Path('media')/(name+'.png')
              assert p.read_bytes()[:8]==b'\x89PNG\r\n\x1a\n',p
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  w,h=im.size
                  assert w>=1024 and h>=576,(name,w,h)
                  frame=ImageOps.fit(im.convert('RGB'),(320,180))
                  strip.paste(frame,(i*320,0))
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              assert sha not in hashes,'identical output duplicated'
              hashes.add(sha)
              data[name]={'file':str(p),'width':w,'height':h,'bytes':p.stat().st_size,'sha256':sha,'decode':'OBSERVED_PASS'}
          strip.save('media/contact_01_02_04.webp',quality=80,method=6)
          result={'taskId':'images-w003-20261122-06','generatedAt':datetime.now(timezone.utc).isoformat(),'actualOriginalsOnBranch':names,'notProduced':['03','06'],'frame05HighResInChatOnly':True,'binaryVerification':'PASS_FOR_THREE','perceptualContinuity':'NOT_RUN','blindOrderTest':'NOT_RUN','humanApproved':False,'files':data}
          Path('media/QA_BINARY.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Publish actual bytes and remove temporary credential-bearing workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prometeo-images-w003-06.yml
          git add prometeo/launch/20261122/relaunch/images/work/06/media/01.png prometeo/launch/20261122/relaunch/images/work/06/media/02.png prometeo/launch/20261122/relaunch/images/work/06/media/04.png
          git add prometeo/launch/20261122/relaunch/images/work/06/media/contact_01_02_04.webp prometeo/launch/20261122/relaunch/images/work/06/media/QA_BINARY.json
          git diff --cached --quiet || git commit -m 'images W003 06: escrow three original rasters with binary QA'
          git pull --rebase origin candidate/prometeo-images-w003-20261122-06
          git push origin HEAD:candidate/prometeo-images-w003-20261122-06
