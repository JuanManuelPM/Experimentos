name: NPC civilian · live public Pages QA
on:
  push:
    branches: [candidate/prometeo-3d-npc-civilian-build-20261116]
    paths:
      - '.github/workflows/prometeo-npc-live-pages-qa.yml'
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Chromium and JS sanity
        run: |
          node --check prometeo/3d-npc-civilian-v1/viewer/qa_live.mjs
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Verify real public URL and render desktop/mobile
        run: node prometeo/3d-npc-civilian-v1/viewer/qa_live.mjs
      - name: Preserve actual live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-public-live-qa
          path: prometeo/3d-npc-civilian-v1/evidence/live/
          if-no-files-found: warn
      - name: Commit public URL verification into isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prometeo/3d-npc-civilian-v1/evidence/live/
          if ! git diff --cached --quiet; then
            git commit -m 'qa: archive live GitHub Pages WebGL and SHA verification'
            git push origin HEAD:candidate/prometeo-3d-npc-civilian-build-20261116
          fi
