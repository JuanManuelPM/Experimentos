name: "PROMETEO · Import assets batch 03"
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/prometeo-assets-batch-03.yml", "prometeo/assets-library/import-batch-03.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-assets-batch-03
  cancel-in-progress: false
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import verified CC0 packs
        run: python3 prometeo/assets-library/import-batch-03.py
      - name: Publish completed packs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prometeo/assets-library
          if ! git diff --cached --quiet; then
            git commit -m "PROMETEO: publish imported batch 03 assets and receipt"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
