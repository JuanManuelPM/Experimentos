name: "PROMETEO MUSIC W003 07 - acoustic-electronic render"
on:
  push:
    branches:
      - "candidate/prometeo-music-w003-20261122-07"
    paths:
      - "prometeo/launch/20261122/relaunch/music/results/07/render.py"
      - ".github/workflows/prometeo-music-w003-07.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-music-w003-07
  cancel-in-progress: false
jobs:
  make-audio:
    if: github.ref == 'refs/heads/candidate/prometeo-music-w003-20261122-07'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exclusive worker branch
        uses: actions/checkout@v4
      - name: Install available renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user numpy scipy soundfile
          ffmpeg -version | head -1
      - name: Render FIRST ARTICLE before scaling
        run: |
          python3 prometeo/launch/20261122/relaunch/music/results/07/render.py --first-article
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 prometeo/launch/20261122/relaunch/music/results/07/first-article/master.wav
      - name: Render complete uncut human-performance dialogue
        run: |
          python3 prometeo/launch/20261122/relaunch/music/results/07/render.py --full
      - name: Compress playback preview and verify decoders
        run: |
          cd prometeo/launch/20261122/relaunch/music/results/07
          python3 -m json.tool audio/SOURCE_PROVENANCE.json > /dev/null
          python3 -m json.tool audio/QA.json > /dev/null
          ffmpeg -hide_banner -loglevel error -y -i audio/master.wav -c:a libvorbis -qscale:a 5 audio/master.ogg
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of json audio/master.ogg
          for f in audio/stems/*.wav audio/ab_*.wav first-article/master.wav; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done
      - name: Commit only the licensed source and independently rendered outputs
        run: |
          git config user.name "Prometeo music render bot"
          git config user.email "prometeo-render@users.noreply.github.com"
          git add prometeo/launch/20261122/relaunch/music/results/07/audio prometeo/launch/20261122/relaunch/music/results/07/first-article
          if ! git diff --cached --quiet; then
            git commit -m "music-w003-07: licensed acoustic recording, audible master, stems and technical QA"
            git fetch origin candidate/prometeo-music-w003-20261122-07
            git rebase origin/candidate/prometeo-music-w003-20261122-07
            git push origin HEAD:candidate/prometeo-music-w003-20261122-07
          fi
