name: PROMETEO music W002-04 original liquid DnB audio
on:
  push:
    branches: [gh-pages]
    paths:
      - "prometeo/music/releases/w002-04/render.py"
      - "prometeo/music/releases/w002-04/break_editor.py"
      - ".github/workflows/prometeo-music-w002-04.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthesis and media tools
        run: |
          python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render original composition
        run: python prometeo/music/releases/w002-04/render.py
      - name: Verify actual audio bytes and four stems
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,soundfile as sf
          p=pathlib.Path('prometeo/music/releases/w002-04')
          q=json.loads((p/'QA_RECEIPT.json').read_text())
          score=json.loads((p/'SONGPROJECT.json').read_text())
          assert q['taskId']=='music-w002-20261122-04'
          assert score['taskId']==q['taskId'] and len(score['events']['DRUMS'])>900
          assert q['bars']==96 and q['bpm']==174 and q['sampleRate']==32000
          assert q['stemMasterResidualRMS']<.00015 and q['masterSamplePeak']<=.902
          w,s=sf.read(p/'MASTER.wav',always_2d=True)
          assert s==32000 and w.shape[1]==2 and len(w)/s>130
          assert (p/'MASTER.wav').stat().st_size>100000
          assert (p/'MASTER.mp3').stat().st_size>100000
          for name in ('DRUMS','SUB_BASS','KEYS','AIR'):
            f=p/'STEMS'/f'{name}.flac'
            x,sr=sf.read(f,always_2d=True)
            assert x.shape==w.shape and sr==s and f.stat().st_size>100000
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(p/'MASTER.mp3')]))
          assert any(a.get('codec_name')=='mp3' for a in meta['streams'])
          print('PASS: WAV MP3, 4 stems, score, provenance, numerical QA')
          PY
      - name: Write release manifest
        run: |
          python - <<'PY'
          import pathlib,json,datetime
          p=pathlib.Path('prometeo/music/releases/w002-04')
          q=json.loads((p/'QA_RECEIPT.json').read_text())
          m={'schema':'prometeo.music.release/v1',
             'status':'BINARY_RENDER_VERIFIED_NOT_HUMAN_APPROVED',
             'taskId':q['taskId'],'title':'AGUA EN MOVIMIENTO',
             'bpm':174,'bars':96,'audioUrl':'MASTER.mp3',
             'wavUrl':'MASTER.wav','stems':'STEMS/',
             'projectUrl':'SONGPROJECT.json','qa':'QA_RECEIPT.json',
             'renderedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist produced binaries safely
        run: |
          set -e
          git config user.name "prometeo-music-w002-04-render"
          git config user.email "actions@users.noreply.github.com"
          git add prometeo/music/releases/w002-04/MASTER.wav prometeo/music/releases/w002-04/MASTER.mp3 prometeo/music/releases/w002-04/STEMS prometeo/music/releases/w002-04/SONGPROJECT.json prometeo/music/releases/w002-04/QA_RECEIPT.json prometeo/music/releases/w002-04/manifest.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "music W002-04: verified liquid DnB master and stems [skip ci]"
          for i in 1 2 3 4 5 6 7 8 9; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
