name: PROMETEO UV V2 · real NPC WebGL canary
on:
  push:
    branches:
      - candidate/prometeo-3d-uv-editor-v2-qa-20261117
    paths:
      - '.github/workflows/prometeo-uv-v2-canary.yml'
      - 'prometeo/3d-uv-texture-editor-v2/**'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: prometeo/3d-uv-texture-editor-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax + Node tests
        run: |
          node --check src/core.mjs
          node --check src/editor.mjs
          node --check tests/remote_browser.mjs
          node --test tests/core.test.mjs
      - name: Python real PNG and GLB inspector tests
        run: |
          python -m pip install pillow
          python -m unittest discover -s tests -p 'test_*.py' -v
          python create_canary.py
      - name: Download immutable v0.1.3 actual GLB and inspect UV topology
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/JuanManuelPM/Experimentos/candidate/prometeo-3d-npc-civilian-build-20261116/prometeo/3d-npc-civilian-v1/dist/civil_azul.glb' \
            --output civil_azul.glb
          echo '8bec29e84c9f0d082cc8ac08fd8cbe898dfcaa82abc9e1fa1bb13de46bfa5e4b  civil_azul.glb' | sha256sum --check
          mkdir -p evidence
          python tools/inspect_glb.py civil_azul.glb evidence/UV_PROFILE.real.json
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real WebGL preview, PNG change, exports and mobile 320
        run: |
          mkdir -p evidence/remote
          python - <<'PY'
          from PIL import Image
          Image.new('RGBA',(512,512),(246,40,8,255)).save('evidence/remote/input-orange.png')
          PY
          node tests/remote_browser.mjs
          python tools/verify_pixels.py evidence/remote
      - name: Upload factual evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-v2-real-npc-canary
          if-no-files-found: warn
          path: |
            prometeo/3d-uv-texture-editor-v2/evidence/UV_PROFILE.real.json
            prometeo/3d-uv-texture-editor-v2/evidence/remote/**
          retention-days: 14
