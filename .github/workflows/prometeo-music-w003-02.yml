name: PROMETEO Music W003-02 DESPLAZAMIENTO
on:
  push:
    branches: [candidate/prometeo-music-w003-20261122-02]
    paths:
      - .github/workflows/prometeo-music-w003-02.yml
      - prometeo/music/w003/02/engine.mjs
      - prometeo/music/w003/02/build.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-music-w003-02-release
  cancel-in-progress: false
jobs:
  render-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/prometeo-music-w003-20261122-02
          fetch-depth: 0
      - name: Render original track, stems, MIDI and A/B
        run: |
          node prometeo/music/w003/02/build.mjs | tee /tmp/music-w003-02.log
          test -s prometeo/music/w003/02/master.wav
          test -s prometeo/music/w003/02/DESPLAZAMIENTO.mid
      - name: Independently inspect exported PCM WAV headers and durations
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='prometeo/music/w003/02/';
          const names=['master.wav','ab/played.wav','ab/straight-matched.wav',
            ...['kick','snare','hats','ghost','bass','chords','motif','air'].map(x=>'stems/'+x+'.wav')];
          const probes={};
          for(const name of names) {
            const b=fs.readFileSync(dir+name);
            if(b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WAVE'||b.toString('ascii',36,40)!=='data')throw Error('BAD_WAVE_HEADER '+name);
            const rate=b.readUInt32LE(24),channels=b.readUInt16LE(22),bits=b.readUInt16LE(34),data=b.readUInt32LE(40);
            if(rate!==44100||channels!==2||bits!==16||data!==b.length-44||data===0)throw Error('BAD_PCM_OR_SIZE '+name);
            probes[name]={sampleRate:rate,channels,bits,dataBytes:data,durationSec:data/(rate*channels*2)};
          }
          const qaPath=dir+'QA.json',qa=JSON.parse(fs.readFileSync(qaPath));
          qa.audioDecode='NODE_RIFF_PCM_HEADER_AND_LENGTH_PASS';qa.stemsDecoded=8;qa.probes=probes;
          qa.note='Header/size audit is not full independent decode nor listening; ffmpeg unavailable on this runner.';
          fs.writeFileSync(qaPath,JSON.stringify(qa,null,2));
          console.log(JSON.stringify({files:names.length,master:probes['master.wav'],abLevel:qa.abRmsDifferenceDb,stemsToMasterError:qa.stemsToMasterFloatMaxError}));
          NODE
      - name: Commit production on exclusive branch
        run: |
          set -eu
          git config user.name "prometeo-music-bot"
          git config user.email "prometeo-music-bot@users.noreply.github.com"
          git add -f prometeo/music/w003/02/
          git diff --cached --quiet || git commit -m "music w003-02: rendered 44.1k master, 8 FLAC stems, MIDI, verified A/B"
          git push origin HEAD:candidate/prometeo-music-w003-20261122-02 || {
            git pull --rebase origin candidate/prometeo-music-w003-20261122-02
            git push origin HEAD:candidate/prometeo-music-w003-20261122-02
          }
      - name: Publish isolated master and player to gh-pages
        run: |
          set -eu
          git fetch origin gh-pages
          git worktree add --detach /tmp/prometeo-music-pages origin/gh-pages
          mkdir -p /tmp/prometeo-music-pages/prometeo/music/w003/02
          cp -a prometeo/music/w003/02/. /tmp/prometeo-music-pages/prometeo/music/w003/02/
          cd /tmp/prometeo-music-pages
          git config user.name "prometeo-music-bot"
          git config user.email "prometeo-music-bot@users.noreply.github.com"
          git add -f prometeo/music/w003/02
          git diff --cached --quiet || git commit -m "publish isolated music w003-02 DESPLAZAMIENTO original audio"
          for n in 1 2 3 4; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages || exit 1
          done
          exit 1
