name: PROMETEO video W001-08 encode
on:
  push:
    branches:
      - gh-pages
    paths:
      - 'prometeo/previews/video/w001/08/render.py'
      - '.github/workflows/prometeo-video-w001-08.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.25,<3'
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render original 12-second montage
        run: python prometeo/previews/video/w001/08/render.py
      - name: Verify exported video and exact source boundaries
        run: |
          python - <<'PY'
          import json,subprocess
          p='prometeo/previews/video/w001/08/MATERIA-008.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert v['codec_name']=='h264' and (v['width'],v['height'])==(960,540)
          assert int(v['nb_frames'])==288 and abs(float(d['format']['duration'])-12)<.08
          assert a['codec_name']=='aac'
          proof=json.load(open('prometeo/previews/video/w001/08/PROBE.json'))
          assert proof['cutFrames']==[36,72,111,150,198,240,264]
          print('VIDEO_FILE_ENCODED PASS 12s / 288fr H.264 AAC / 2 original plates')
          PY
      - name: Publish media on Pages with concurrent write safety
        run: |
          set -eu
          git config user.name 'prometeo-video-encoder'
          git config user.email 'actions@users.noreply.github.com'
          git add prometeo/previews/video/w001/08/MATERIA-008.mp4 prometeo/previews/video/w001/08/poster.png prometeo/previews/video/w001/08/soundtrack.wav prometeo/previews/video/w001/08/PROBE.json
          if git diff --cached --quiet; then echo "Media already current"; exit 0; fi
          git commit -m 'video W001/08: publish original encoded H264/AAC montage [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
