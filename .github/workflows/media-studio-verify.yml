name: YouTube Studio native integration tests

on:
  push:
    branches:
      - master
      - candidate/youtube-native-studio-20261101
    paths:
      - 'userstyles/media-studio.user.js'
      - 'userstyles/tests/media-studio.test.mjs'
      - '.github/workflows/media-studio-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: userstyles/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund --no-save jsdom@26.1.0
      - name: Syntax check
        run: node --check ../media-studio.user.js
      - name: Functional regressions
        run: node --test media-studio.test.mjs
