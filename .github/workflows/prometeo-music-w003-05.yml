name: PROMETEO music W003 05 render original
on:
  push:
    branches:
      - candidate/prometeo-music-w003-20261122-05
    paths:
      - .github/workflows/prometeo-music-w003-05.yml
      - prometeo/works/20261122/music-w003-05/render.py
      - prometeo/works/20261122/music-w003-05/motif_transform.py
      - prometeo/works/20261122/music-w003-05/score.json
      - prometeo/works/20261122/music-w003-05/qa_tests.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exclusive branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DSP dependencies
        run: python -m pip install numpy scipy soundfile
      - name: Render first article before full work
        working-directory: prometeo/works/20261122/music-w003-05
        run: python render.py --first-article --out first_article
      - name: Render four movement master and real stems
        working-directory: prometeo/works/20261122/music-w003-05
        run: python render.py --full --out master
      - name: Install ffmpeg on bare Ubuntu runner
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Convert original master to MP3
        working-directory: prometeo/works/20261122/music-w003-05
        run: ffmpeg -nostdin -y -hide_banner -loglevel error -i master/MASTER.flac -codec:a libmp3lame -q:a 2 MASTER.mp3
      - name: Automated audio and motif regressions
        working-directory: prometeo/works/20261122/music-w003-05
        run: python qa_tests.py
      - name: Commit only this worker audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prometeo/works/20261122/music-w003-05/MASTER.mp3
          git add prometeo/works/20261122/music-w003-05/master/*.flac
          git add prometeo/works/20261122/music-w003-05/master/METRICS.json
          git add prometeo/works/20261122/music-w003-05/first_article/MASTER.flac
          git add prometeo/works/20261122/music-w003-05/first_article/METRICS.json
          git diff --cached --quiet || git commit -m "render: W003 music 05 genuine master stems and first article"
          git push origin HEAD:candidate/prometeo-music-w003-20261122-05
