name: PROMETEO video W002-03 archival documentary
on:
  push:
    branches:
      - candidate/prometeo-video-w002-03-20261122
    paths:
      - 'prometeo/previews/video/w002/03/**'
      - '.github/workflows/prometeo-video-w002-03.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuinely available media tools
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak
      - name: Download licensed sources, run DEEP-SPEC spike, render documentary, decode whole file
        run: |
          python prometeo/previews/video/w002/03/render.py
      - name: Independently verify provenance and final A/V
        run: |
          python prometeo/previews/video/w002/03/verify_ledger.py prometeo/previews/video/w002/03/PROVENANCE.json
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height,nb_frames -of json prometeo/previews/video/w002/03/LA-CIUDAD-BAJO-EL-AGUA.mp4
          ffmpeg -v error -xerror -i prometeo/previews/video/w002/03/LA-CIUDAD-BAJO-EL-AGUA.mp4 -f null -
      - name: Publish isolated work to gh-pages only when movie has passed tests
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/prometeo/previews/video/w002/03"
          git fetch origin gh-pages
          git worktree add -b publish-video-w002-03 /tmp/video-w002-pages origin/gh-pages
          DEST="/tmp/video-w002-pages/prometeo/previews/video/w002/03"
          mkdir -p "$DEST"
          for name in 'LA-CIUDAD-BAJO-EL-AGUA.mp4' 'index.html' 'poster.jpg' 'PROBE.json' 'PROVENANCE.json' 'PREPRODUCTION.deep-spec-v1.json' 'render.py' 'verify_ledger.py' 'README.md' 'frame_02.jpg' 'frame_14.jpg' 'frame_22.jpg' 'frame_30.jpg' 'frame_46.jpg'; do
            test -s "$SRC/$name"
            cp "$SRC/$name" "$DEST/$name"
          done
          cd /tmp/video-w002-pages
          git config user.name 'prometeo-video-w002-03'
          git config user.email 'actions@users.noreply.github.com'
          git add prometeo/previews/video/w002/03
          if git diff --cached --quiet; then
            echo 'Already published'
            exit 0
          fi
          git commit -m 'video W002/03: publish verified documentary and audiovisual provenance [skip ci]'
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              echo 'Pages publication committed'
              exit 0
            fi
            sleep 3
          done
          echo 'BLOCKED: gh-pages write collision after eight CAS/rebase tries'
          exit 1
