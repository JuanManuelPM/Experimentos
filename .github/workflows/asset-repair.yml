name: Asset Repair Proof
on:
  push:
    branches: [master]
    paths:
      - "worker-lab/asset-repair/**"
      - ".github/workflows/asset-repair.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Run asset search and preserve failure evidence
        shell: bash
        run: |
          set +e
          mkdir -p worker-lab/asset-repair/out
          node worker-lab/asset-repair/run.mjs 2>&1 | tee worker-lab/asset-repair/out/runner.log
          code=${PIPESTATUS[0]}
          echo "$code" > worker-lab/asset-repair/out/runner-exit.txt
          exit 0
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser verify candidates
        shell: bash
        run: |
          if [ -f worker-lab/asset-repair/out/latest.json ]; then
            node worker-lab/asset-repair/qa.mjs
          else
            echo "No latest.json; preserving runner log instead."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-repair-evidence
          path: worker-lab/asset-repair/out/
          retention-days: 7
      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/ar-pages origin/gh-pages
          rm -rf /tmp/ar-pages/asset-repair
          mkdir -p /tmp/ar-pages/asset-repair/results
          cp worker-lab/asset-repair/index.html /tmp/ar-pages/asset-repair/index.html
          test -d worker-lab/asset-repair/out && cp -R worker-lab/asset-repair/out/. /tmp/ar-pages/asset-repair/results/ || true
          cd /tmp/ar-pages
          git config user.name "worker-lab-bot"
          git config user.email "worker-lab-bot@users.noreply.github.com"
          git add asset-repair
          git commit -m "Publish asset repair proof" || exit 0
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
