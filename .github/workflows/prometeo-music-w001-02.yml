name: PROMETEO music W001-02 render master and stems
on:
  push:
    branches: [gh-pages]
    paths:
      - "prometeo/previews/music/w001/02/render.py"
      - ".github/workflows/prometeo-music-w001-02.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric synthesis modules
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12,<1'
      - name: Render original 180-second song
        run: |
          command -v ffmpeg
          python prometeo/previews/music/w001/02/render.py
      - name: Verify actual file and audio codec
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          d=pathlib.Path('prometeo/previews/music/w001/02')
          qa=json.loads((d/'QA_RECEIPT.json').read_text())
          assert qa['durationSeconds']==180 and qa['sampleRate']==32000
          assert qa['stemMasterResidualRMS']<.0003 and qa['masterPeak']<.998
          assert len(qa['stems'])==8 and qa['topLayerGuard']
          files=list((d/'STEMS').glob('*.flac'))
          assert len(files)==8
          for name in ('MASTER.wav','MASTER.mp3','FIRST_LOOP.wav'):
            assert (d/name).stat().st_size>100_000
          z=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(d/'MASTER.mp3')]))
          audio=[x for x in z['streams'] if x['codec_type']=='audio']
          assert len(audio)==1 and audio[0]['codec_name']=='mp3'
          assert abs(float(z['format']['duration'])-180)<.2
          print('MUSIC AUDIO FILE VERIFIED 180s 8 STEMS PASS')
          PY
      - name: Register verified song in shared Music Studio library
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          d=pathlib.Path('prometeo/music/releases/w001-02')
          d.mkdir(parents=True,exist_ok=True)
          r={
            'schema':'prometeo.music.release/v1',
            'status':'PUBLISHED_VERIFIED',
            'waveJob':'W001-02',
            'title':'FÁBRICA VACÍA',
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'audioUrl':'../../../previews/music/w001/02/MASTER.mp3',
            'projectUrl':'../../../previews/music/w001/02/SONGPROJECT.json',
            'tracks':8,'durationSeconds':180,'bpm':128,
            'source':'candidate/prometeo-music-w001-02-20261121',
            'qa':'../../../previews/music/w001/02/QA_RECEIPT.json',
            'renderType':'DETERMINISTIC_PYTHON_REFERENCE_NOT_WEBAUDIO_PARITY'
          }
          (d/'manifest.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist actual media, verified report and library release
        run: |
          set -e
          git config user.name "prometeo-music-w001-02-render"
          git config user.email "actions@users.noreply.github.com"
          git add prometeo/previews/music/w001/02/MASTER.wav prometeo/previews/music/w001/02/MASTER.mp3 prometeo/previews/music/w001/02/FIRST_LOOP.wav prometeo/previews/music/w001/02/STEMS prometeo/previews/music/w001/02/QA_RECEIPT.json prometeo/previews/music/w001/02/QUALITY_DELTA.json prometeo/music/releases/w001-02/manifest.json
          if git diff --cached --quiet; then echo "No file change"; exit 0; fi
          git commit -m "music W001-02: deliver real 180s master and 8 stems [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
