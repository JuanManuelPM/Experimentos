<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Estadística · Primer parcial</title><style>
:root{--bg:#fbfbfa;--text:#262a29;--secondary:#4f5953;--muted:#828c85;--line:#e4e8e3;--accent:#7774bd;--ok:#27765e;--bad:#a65e58;--wash:#f1f1f8}*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.55;font-size:15px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#shell{max-width:700px;margin:auto}.sticky{position:sticky;z-index:6;top:0;background:color-mix(in srgb,var(--bg) 97%,transparent);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.headrow{height:45px;display:flex;align-items:center;gap:9px;padding:0 19px}.goback{width:27px;height:34px;display:flex;align-items:center;justify-content:flex-start;border:0;background:none;color:var(--muted);font-size:25px;line-height:1}.unitpicker{appearance:none;-webkit-appearance:none;flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:630;text-overflow:ellipsis;outline:0;padding:8px 10px 8px 0}.metahead{color:#929c95;font-size:11px;white-space:nowrap}.tabs{height:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 18px}.tab{border:0;background:none;color:#828b85;font-size:13px;font-weight:570;border-bottom:2px solid transparent}.tab.active{color:var(--text);font-weight:720;border-bottom-color:var(--accent)}.progress{height:2px;background:#eceeea}.progress span{display:block;height:100%;background:var(--accent);width:0%;transition:width .12s linear}.reader{padding:17px 21px 85px}.sectionmini{font-size:10.5px;letter-spacing:.08em;font-weight:650;color:#9ba59b;margin-bottom:12px}.intro{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 25px}.unithead{margin-bottom:22px}.unithead h1{font-size:27px;font-weight:630;letter-spacing:-.047em;line-height:1.14;margin:0 0 9px}.indexhead{padding-top:35px}.indexhead h1{font-size:34px;font-weight:650;letter-spacing:-.058em;margin:0 0 5px}.index-sub{color:var(--muted);font-size:13px}.index-list{border-top:1px solid var(--line);margin-top:33px}.index-unit{display:grid;grid-template-columns:31px 1fr 19px;gap:11px;align-items:center;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}.index-unit .inum{color:#9ca59d;font-size:12px}.index-unit strong{font-size:17px;line-height:1.15;font-weight:650;letter-spacing:-.027em}.index-unit small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.index-unit .arr{color:#9ba69d}.concept{padding:19px 0 22px;border-top:1px solid var(--line);scroll-margin-top:110px}.concept:first-of-type{border-top:0;padding-top:5px}.concept h2,.exercise h2{font-size:19px;line-height:1.25;font-weight:650;letter-spacing:-.031em;margin:0 0 11px}.kicker{color:#9aa29b;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.07em;font-weight:630;margin-bottom:6px}.concept .what,.concept .purpose,.concept .example{color:#434b46;font-size:14.5px;line-height:1.61;margin:0 0 10px}.concept .purpose b,.concept .example b{font-weight:650}.label{color:#828c84;font-size:10.5px;letter-spacing:.05em;font-weight:670;margin:15px 0 3px}.purpose,.example{margin-top:0}.defs{display:grid;gap:4px;margin:10px 0 14px}.defs .def{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:9px;font-size:13.7px;line-height:1.5;padding:4px 0}.defs strong{font-weight:690;color:#303732}.defs span{color:#4d574f}.formula{font-family:Georgia,'Times New Roman',serif;font-size:23px;color:#303a32;letter-spacing:.005em;padding:7px 0 5px;overflow-wrap:anywhere}.cheats{padding-top:2px}.cheat-section{padding:15px 0 19px;border-top:1px solid var(--line)}.cheat-section:first-child{border-top:0;padding-top:0}.cheat-section h2{font-size:18px;font-weight:670;letter-spacing:-.03em;margin:0 0 11px}.cheat-item{margin-bottom:8px;font-size:14px;line-height:1.55}.cheat-item b{font-weight:670}.cheat-item span{color:#525d53}.cheat-item.formula-note{padding:4px 0 6px}.cheat-item.formula-note b{display:block;font-family:Georgia,serif;font-size:20px;font-weight:500;line-height:1.6}.cheat-item.formula-note span{display:block;font-size:12.5px}.exercise{border-top:1px solid var(--line);padding:21px 0 22px;scroll-margin-top:110px}.exercise:first-child{border-top:0;padding-top:0}.exercise .statement{font-size:14.6px;line-height:1.65;color:#3c4640;margin:0 0 13px}.exercise .source{color:#a2aaa3;font-size:10.5px;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.choice{border:1px solid #dce2dc;background:#fff;border-radius:7px;padding:10px 12px;text-align:left;min-height:41px;font-size:13px;line-height:1.3;transition:background-color .12s,border-color .12s}.choice.selected{background:var(--wash);border-color:var(--accent);color:#403a89}.choice.correct{border-color:#8cbbab;background:#f4fbf6;color:#1b6a4d}.choice.wrong{border-color:#cfa4a2;background:#fff9f8;color:#944942}.optionlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0 0}.optionlist .choice{min-width:0}.feedback{min-height:17px;margin:7px 0 0;font-size:12px;line-height:1.4;color:#69756b}.feedback.good{color:var(--ok)}.feedback.bad{color:var(--bad)}.vf-item{margin:15px 0 12px;padding:0 0 12px;border-bottom:1px solid #eff1ee}.vf-item:last-child{border:0;margin-bottom:0;padding-bottom:0}.vf-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;align-items:center;gap:9px}.vf-claim{font-size:13.7px;line-height:1.5;color:#3c463f}.vf-controls{display:flex;gap:4px}.vf-controls .choice{padding:9px 0;min-height:39px;flex:1;text-align:center;font-weight:700}.tablewrap{max-width:100%;overflow-x:auto;margin:14px 0}.datatab{border-collapse:collapse;font-size:12.5px;width:100%;min-width:280px}.datatab th,.datatab td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:right;font-weight:440;font-variant-numeric:tabular-nums}.datatab th{color:#88928a;font-size:11px;font-weight:650}.datatab th:first-child,.datatab td:first-child{text-align:left}.bargraph{max-width:370px;display:grid;gap:7px;margin:12px 0}.barrow{display:grid;grid-template-columns:20px 1fr 28px;gap:10px;align-items:center;color:#626e64;font-size:12px}.bartrack{background:#e8ebe8;height:8px}.bartrack span{display:block;background:#9493c8;height:100%}.multirow{margin:12px 0}.multirow .multilabel{color:#667168;font-size:12px;font-weight:670}.multirow .optionlist{margin-top:7px}.aux{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:10px}.more{border:0;background:none;color:#77827a;padding:4px 0;font-size:12px;text-decoration:underline;text-decoration-color:#c6ccc5;text-underline-offset:4px}details.extras{margin:10px 0 0}details.extras summary{cursor:pointer;list-style:none;color:#7e8980;font-size:12px;padding:7px 0}details.extras summary::-webkit-details-marker{display:none}details.extras[open] summary{color:var(--accent)}details.extras .expl{font-size:13.3px;line-height:1.6;color:#4e5950;padding:4px 0 6px}details.extras .expl p{margin:6px 0}.quiet-note{font-size:11px;color:#919b92;margin:0 0 19px}.final-note{padding:30px 0 10px;color:#929b93;font-size:12px}.empty{padding:70px 0;color:var(--muted)}@media(min-width:650px){.headrow{padding-inline:27px}.tabs{padding-inline:26px}.reader{padding-inline:28px}.defs .def{grid-template-columns:190px 1fr}}@media(max-width:390px){.reader{padding-inline:16px}.headrow{padding-inline:15px}.tabs{padding-inline:12px}.defs .def{grid-template-columns:106px 1fr;gap:7px;font-size:13px}.vf-row{grid-template-columns:minmax(0,1fr) 74px}.choice{padding:9px 8px}.unithead h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* Navigation v2: same compact bar everywhere inside a unit; no redundant back row. */
.navline{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 16px}
.unit-trigger{flex:none;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;padding:9px 8px;min-width:36px;text-align:left;border-radius:10px}
.unit-trigger:focus-visible{outline:2px solid var(--accent)}
.tabs{flex:1;height:39px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:#f0f1ee;border-radius:24px;padding:3px;min-width:0}
.tab{border:0;border-radius:21px;font-size:13px;font-weight:550;color:#828b85;white-space:nowrap;min-width:0}
.tab.active{color:var(--text);font-weight:680;background:#fff;box-shadow:0 1px 5px #0000000b}
.reader{padding-top:17px;padding-bottom:75px}
.indexhead{padding-top:14px}.indexhead h1{margin-bottom:0}
.indexline{display:flex;align-items:center;gap:9px}
.levelback{border:0;background:none;color:#829086;font-size:25px;line-height:1;padding:7px 7px 7px 0}
.index-list{margin-top:22px}

</style></head><body><div id="shell"><header id="header" class="sticky" hidden><div class="navline"><button type="button" id="unit-trigger" class="unit-trigger" aria-label="Volver al índice de unidades">01</button><nav id="tabs" class="tabs" role="tablist" aria-label="Sección"><button type="button" class="tab" data-tab="theory" role="tab">Teoría</button><button type="button" class="tab" data-tab="practice" role="tab">Práctica</button><button type="button" class="tab" data-tab="cheat" role="tab">Machete</button></nav></div><div class="progress" role="progressbar" aria-label="Contenido recorrido" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="percent"></span></div></header><main id="main" class="reader"></main></div><script type="application/json" id="course-data">{"units":[{"id":"01","title":"Investigación y variables","intro":"Entender quién se estudia, qué se mide y cómo se hizo la investigación.","source":"M1 · Ejercitación de conceptos introductorios","theory":[{"id":"01.1","title":"Población y muestra","what":"La población es el conjunto sobre el que queremos sacar conclusiones; la muestra son las personas que realmente participaron.","use":"En los ejercicios te permite distinguir de quién habla la investigación de cuántos casos se midieron.","example":"Si se quiere estudiar a los estudiantes de Psicología y se entrevista a 80, esos 80 son la muestra, no toda la población.","formula":null},{"id":"01.2","title":"Variables","what":"Una variable es una característica que puede cambiar entre personas o situaciones.","use":"La consigna suele pedirte nombrar qué se midió y reconocer si es un grupo, un puntaje, una cantidad o una categoría.","example":"En un estudio sobre sueño y ansiedad, las horas de sueño y el puntaje de ansiedad son dos variables diferentes.","formula":null},{"id":"01.3","title":"Tipos de variables","what":"Las categorías describen clases; las cantidades expresan números. Una cantidad puede ser un conteo discreto o una medida continua.","use":"Te sirve para elegir cómo resumir los datos y qué análisis estadístico corresponde.","example":"«Cantidad de materias recursadas» es un conteo; «tiempo de reacción» es una medida; «grupo con tratamiento» es una categoría.","formula":null},{"id":"01.4","title":"Escalas de medición","what":"Nominal distingue categorías; ordinal las ordena; intervalo compara diferencias; razón tiene un cero que representa ausencia de la cantidad.","use":"Cuando el parcial pide clasificar variables, la escala debe justificarse por lo que representan los valores, no solo por tener números.","example":"El nivel educativo es ordinal porque tiene orden; los segundos de reacción tienen un cero real; un puntaje psicológico no se vuelve escala de razón por empezar en cero.","formula":null},{"id":"01.5","title":"Observacional o experimental","what":"En un estudio experimental se asigna deliberadamente una intervención; en uno observacional se registra lo que ocurre sin asignarla.","use":"La pista es buscar quién decidió el tratamiento, no si aparecen muchas personas o se midieron números.","example":"Si asignan aleatoriamente un taller a un grupo y a otro no, hay intervención; si comparan hábitos existentes, solo observaron.","formula":null},{"id":"01.6","title":"Las mismas personas o grupos distintos","what":"Dos mediciones hechas a una misma persona están relacionadas; mediciones de personas diferentes pertenecen a grupos independientes.","use":"Esta distinción vuelve a aparecer en las pruebas t del segundo parcial y determina qué comparación corresponde.","example":"Medir la atención antes y después de un entrenamiento en los mismos alumnos produce datos apareados; comparar dos cursos distintos no.","formula":null},{"id":"01.7","title":"Hipótesis de investigación","what":"Es una predicción comprobable sobre una relación, diferencia o efecto, formulada antes de conocer el resultado.","use":"Sirve para escribir qué se quiere demostrar sin confundir la predicción con una conclusión ya comprobada.","example":"«El taller aumentará el puntaje medio de autoestima frente al grupo control» es una hipótesis, no un resultado.","formula":null}],"practice":[{"id":"M1-P01","type":"mark","title":"¿Qué número es la muestra?","parts":["Una investigación evalúa a ",{"text":"188","value":"188"}," familiares de pacientes durante ",{"text":"6","value":"6"}," meses y mide sus niveles de ansiedad."],"question":"Tocá cuántas personas fueron evaluadas.","answer":"188","solution":["La muestra son los \u003cb>188 familiares evaluados\u003c/b>. Los seis meses indican el período observado, no el tamaño muestral."],"source":"M1 · E3(a), práctica adaptada","hints":["Buscá la cantidad de participantes.","No confundas personas con tiempo."]},{"id":"M1-P02","type":"choice","title":"¿Qué tipo de variable es?","prompt":"Se registra el \u003cb>número de materias recursadas\u003c/b> por cada estudiante.","options":["Cualitativa nominal","Cuantitativa discreta","Cuantitativa continua","Cualitativa ordinal"],"answer":1,"solution":["Se cuentan 0, 1, 2, 3… materias. Es una \u003cb>cantidad discreta\u003c/b>, no una categoría ni una medida continua."],"source":"M1 · E2(b)","hints":["Los resultados pueden contarse uno por uno.","No existen 2,4 materias recursadas."],"table":null,"chart":null},{"id":"M1-P03","type":"choice","title":"¿Qué escala corresponde?","prompt":"Una encuesta registra el nivel educativo máximo alcanzado: primario, secundario, terciario o universitario.","options":["Nominal","Ordinal","Intervalo","Razón"],"answer":1,"solution":["Las categorías tienen un \u003cb>orden\u003c/b>, pero la distancia entre niveles no es una magnitud numérica regular. Por eso es \u003cb>ordinal\u003c/b>."],"source":"M1 · E2(c)","hints":["¿Podés ordenar esas categorías?","¿La distancia entre «primario» y «secundario» es una medida numérica?"],"table":null,"chart":null},{"id":"M1-P04","type":"choice","title":"¿Qué diseño es?","prompt":"Una investigadora asigna al azar a estudiantes a un taller de habilidades o a un grupo control y compara el puntaje al terminar.","options":["Observacional","Experimental","Solo descriptivo"],"answer":1,"solution":["La investigadora \u003cb>asigna\u003c/b> qué intervención recibe cada grupo. Es experimental; los grupos están formados por personas distintas."],"source":"Parcial 2026 · E1(a), adaptación","hints":["Buscá si alguien decidió el tratamiento.","«Asigna al azar» es la pista central."],"table":null,"chart":null},{"id":"M1-P05","type":"choice","title":"¿Son mediciones relacionadas?","prompt":"Se mide la atención de los \u003cb>mismos 25 alumnos\u003c/b> antes y después de ocho semanas de entrenamiento.","options":["Muestras independientes","Mediciones apareadas","Una sola medición transversal"],"answer":1,"solution":["Cada estudiante tiene un dato antes y otro después. Los dos valores están \u003cb>emparejados por persona\u003c/b>."],"source":"M1 · E1(e), adaptación","hints":["¿Cambia la persona evaluada entre las mediciones?","Cada participante aparece dos veces."],"table":null,"chart":null},{"id":"M1-P06","type":"choice","title":"Identificá la variable explicativa","prompt":"Un experimento compara dos tratamientos y luego mide un puntaje de ansiedad entre 0 y 21. ¿Cuál es la variable que distingue los grupos?","options":["Puntaje de ansiedad","Tipo de tratamiento","Cantidad total de pacientes"],"answer":1,"solution":["El \u003cb>tratamiento\u003c/b> es la condición explicativa. El \u003cb>puntaje de ansiedad\u003c/b> es la respuesta medida después."],"source":"Parcial 2026 · E1(b), adaptación","hints":["¿Qué cambia deliberadamente entre los grupos?","El resultado no es lo mismo que la condición asignada."],"table":null,"chart":null},{"id":"M1-P07","type":"choice","title":"¿Cuál es una hipótesis válida?","prompt":"Antes de comenzar un estudio de talleres de autoestima, ¿qué se puede escribir como hipótesis de investigación?","options":["«El taller ya demostró ser eficaz»","«El grupo con taller tendrá mayor autoestima media que el control»","«Los participantes respondieron 12 preguntas»"],"answer":1,"solution":["Una hipótesis \u003cb>predice\u003c/b> un resultado que todavía debe comprobarse. No afirma que la eficacia ya esté demostrada."],"source":"Simulacro P1 · E1(c)","hints":["Una hipótesis es una predicción comprobable.","Elegí una afirmación que todavía pueda resultar falsa."],"table":null,"chart":null},{"id":"M1-P08","type":"choice","title":"¿Qué es longitudinal?","prompt":"Una encuesta vuelve a entrevistar a los mismos hogares en distintos momentos del año.","options":["Transversal, porque son familias","Longitudinal, porque se repite en el tiempo","Experimental, porque hay encuestas"],"answer":1,"solution":["El criterio es el \u003cb>seguimiento de las mismas unidades a lo largo del tiempo\u003c/b>. Eso la hace longitudinal, sin volverla experimental."],"source":"M1 · E1(b)","hints":["Prestá atención a «distintos momentos».","Medir repetidamente no significa asignar una intervención."],"table":null,"chart":null}]},{"id":"02","title":"Tablas y frecuencias","intro":"Pasar de cantidades a porcentajes, acumulados y comparaciones.","source":"M2 · Presentación de datos","theory":[{"id":"02.1","title":"Frecuencia absoluta","what":"La frecuencia absoluta (FA) indica cuántos casos pertenecen a una categoría o intervalo.","use":"Se usa para contestar «¿cuántos?» y para encontrar el total sumando todas las filas.","example":"Si 100 estudiantes usan redes sociales entre 60 y 90 minutos por día, la FA de ese intervalo es 100.","formula":"N = suma de las FA"},{"id":"02.2","title":"Frecuencia relativa","what":"La frecuencia relativa (FR) indica qué parte del total representa una categoría.","use":"Sirve para comparar grupos de tamaños diferentes y transformar cantidades en porcentajes.","example":"Si 100 de 350 estudiantes están en un intervalo, la FR es 100 ÷ 350 = 0,286, es decir 28,6 %.","formula":"FR = FA ÷ N"},{"id":"02.3","title":"Frecuencia acumulada","what":"La frecuencia absoluta acumulada (FAA) suma los casos desde el primer intervalo hasta el que estás mirando.","use":"Aparece cuando preguntan cuántos tuvieron «hasta» un valor determinado.","example":"Con 50, 60 y 100 casos en los tres primeros intervalos, la tercera FAA es 50 + 60 + 100 = 210.","formula":"FAA = suma hasta esa fila"},{"id":"02.4","title":"Frecuencia relativa acumulada","what":"La FRA transforma la cantidad acumulada en una parte del total.","use":"Te permite saber qué proporción queda por debajo de un límite de la tabla.","example":"Si hasta 90 minutos hay 210 de 350 estudiantes, la FRA es 210 ÷ 350 = 0,60: el 60 %.","formula":"FRA = FAA ÷ N"},{"id":"02.5","title":"Tablas de dos variables","what":"Una tabla cruzada reparte a las personas según dos características al mismo tiempo.","use":"Antes de sacar porcentajes hay que encontrar si el enunciado habla del total general, de una fila o de una columna.","example":"«Entre las mujeres, ¿cuántas trabajan en diagnóstico?» se calcula usando el total de mujeres, no todo el personal.","formula":null},{"id":"02.6","title":"Gráficos y porcentajes","what":"Un gráfico muestra los mismos datos que una tabla, pero resumidos en barras, sectores o líneas.","use":"En el parcial te pueden pedir que identifiques un porcentaje, una categoría frecuente o una representación engañosa.","example":"Si una barra se ve más alta solo por un eje recortado, la diferencia visual puede parecer mucho mayor que la real.","formula":null}],"practice":[{"id":"M2-P01","type":"numeric","title":"Encontrá el total","prompt":"La tabla muestra cuántas personas usan redes sociales durante cada intervalo. ¿Cuántas fueron consultadas?","label":"N","answer":350,"tolerance":0.001,"solution":["N = 50 + 60 + 100 + 110 + 30 = \u003cb>350 personas\u003c/b>."],"source":"M2 · E2(a)","hints":["Sumá todas las frecuencias absolutas.","No sumes los límites de minutos; sumá la columna FA."],"table":[["Minutos diarios","FA"],["0–30","50"],["30–60","60"],["60–90","100"],["90–120","110"],["120–150","30"]],"pairs":null,"unit":null},{"id":"M2-P02","type":"numeric","title":"Frecuencia relativa","prompt":"¿Qué porcentaje corresponde al intervalo de \u003cb>60 a 90 minutos\u003c/b>?","label":"FR en %","answer":28.57142857142857,"tolerance":0.06,"solution":["FA = 100; N = 350.","FR = 100 ÷ 350 = 0,2857 = \u003cb>28,57 %\u003c/b>."],"source":"M2 · E2(b)","hints":["La parte es 100 y el total 350.","Dividí 100 por 350 y multiplicá por 100."],"table":[["Minutos diarios","FA"],["0–30","50"],["30–60","60"],["60–90","100"],["90–120","110"],["120–150","30"]],"pairs":null,"unit":null},{"id":"M2-P03","type":"numeric","title":"Frecuencia acumulada","prompt":"¿Cuántas personas usan redes hasta el final del intervalo \u003cb>60–90 minutos\u003c/b>?","label":"FAA","answer":210,"tolerance":0.001,"solution":["Sumás \u003cb>todas las filas anteriores incluida esa fila\u003c/b>: 50 + 60 + 100 = \u003cb>210\u003c/b>."],"source":"M2 · E2(b)","hints":["«Acumulada» significa sumar desde el principio.","Sumá las tres primeras FA."],"table":[["Minutos diarios","FA"],["0–30","50"],["30–60","60"],["60–90","100"],["90–120","110"],["120–150","30"]],"pairs":null,"unit":null},{"id":"M2-P04","type":"numeric","title":"Proporción acumulada","prompt":"¿Qué porcentaje corresponde a una FAA de \u003cb>210\u003c/b> sobre un total de \u003cb>350\u003c/b>?","label":"FRA en %","answer":60,"tolerance":0.015,"solution":["FRA = 210 ÷ 350 = 0,60.","En porcentaje: \u003cb>60 %\u003c/b>."],"source":"M2 · E2(b)","hints":["Dividí el acumulado por el total.","210 ÷ 350 = 0,60. Falta expresarlo como porcentaje."],"table":null,"pairs":null,"unit":null},{"id":"M2-P05","type":"numeric","title":"Completá la celda faltante","prompt":"Una tabla de entrevistas tiene total 196. Las otras filas registran 6, 9, 72 y 95 entrevistas. ¿Cuál es la frecuencia que falta?","label":"FA faltante","answer":14,"tolerance":0.001,"solution":["Las filas conocidas suman 6 + 9 + 72 + 95 = 182.","196 − 182 = \u003cb>14\u003c/b>."],"source":"M2 · E3(b)","hints":["Todas las FA juntas deben sumar el total.","Restá del total la suma de las otras cuatro."],"table":null,"pairs":null,"unit":null},{"id":"M2-P06","type":"multi","title":"Una fila completa","prompt":"Para la tercera fila de la tabla (60–90), completá los cuatro valores. Escribí FR y FRA como porcentajes.","fields":[{"label":"FA","answer":100,"tolerance":0.001},{"label":"FR %","answer":28.57142857142857,"tolerance":0.06},{"label":"FAA","answer":210,"tolerance":0.001},{"label":"FRA %","answer":60,"tolerance":0.015}],"solution":["FA = \u003cb>100\u003c/b>.","FR = 100/350 = \u003cb>28,57 %\u003c/b>.","FAA = 50+60+100 = \u003cb>210\u003c/b>.","FRA = 210/350 = \u003cb>60 %\u003c/b>."],"source":"Simulacro P1 · E2(c)","hints":["FA es la cantidad de la fila y FAA la suma hasta esa fila.","FR divide FA por N; FRA divide FAA por N."],"table":[["Minutos diarios","FA"],["0–30","50"],["30–60","60"],["60–90","100"],["90–120","110"],["120–150","30"]],"pairs":null},{"id":"M2-P07","type":"numeric","title":"Porcentajes entre grupos","prompt":"En orientación trabajan 10 mujeres y 6 hombres. ¿Qué porcentaje del sector son mujeres?","label":"Mujeres (%)","answer":62.5,"tolerance":0.015,"solution":["Total del sector = 10 + 6 = 16.","10 ÷ 16 × 100 = \u003cb>62,5 %\u003c/b>."],"source":"M2 · E6, adaptación","hints":["El denominador es el personal de ese sector.","10 ÷ (10 + 6) × 100."],"table":null,"pairs":null,"unit":null},{"id":"M2-P08","type":"choice","title":"Leé un gráfico","prompt":"En un gráfico hay tres categorías A, B y C. ¿Cuál contiene la mitad de los casos?","options":["A","B","C"],"answer":2,"solution":["Total = 12 + 8 + 20 = 40.","La categoría C tiene 20: \u003cb>20/40 = 50 %\u003c/b>."],"source":"Ejercicio nuevo basado en M2 · E1/E5","hints":["Sumá las tres barras.","La mitad del total 40 es 20."],"table":null,"chart":[["A",12],["B",8],["C",20]]},{"id":"M2-P09","type":"choice","title":"¿Se puede acumular?","prompt":"Una tabla contiene «terapia individual», «terapia grupal» y «sin terapia». ¿Tiene sentido calcular FAA siguiendo ese orden arbitrario?","options":["Sí, siempre","No, son categorías nominales","Sí, si hay tres filas"],"answer":1,"solution":["El acumulado supone un \u003cb>orden con significado\u003c/b>. Esas categorías son nominales; acumularlas según un orden arbitrario no produce una medida útil."],"source":"M2 · Interpretación de tablas, ejercicio adaptado","hints":["¿El orden de las opciones expresa más o menos cantidad?","Las categorías son nominales."],"table":null,"chart":null}]},{"id":"03","title":"Medidas descriptivas","intro":"Encontrar el valor típico y entender qué tan dispersos están los datos.","source":"M3 · Medidas de resumen","theory":[{"id":"03.1","title":"Media","what":"La media es el valor que resultaría si repartieras el total de los puntajes en partes iguales.","use":"En el examen puede aparecer calculada o te pueden pedir obtenerla de datos o de Jamovi.","example":"Un grupo con notas 2, 4 y 9 tiene media 5 aunque nadie haya sacado exactamente 5.","formula":"Media = suma de datos ÷ cantidad"},{"id":"03.2","title":"Mediana y moda","what":"La mediana divide los datos ordenados en dos mitades; la moda es el valor que más se repite.","use":"Te permite contestar dos preguntas distintas: qué deja a la mitad de los casos a cada lado y qué puntuación es más frecuente.","example":"En 2, 4, 4, 6, 9, la mediana es 4 y la moda también es 4; si el 9 cambiara por 90, la mediana seguiría siendo 4.","formula":null},{"id":"03.3","title":"Percentiles","what":"Un percentil marca un punto de corte: P80 deja aproximadamente al 80 % de los datos por debajo o en ese valor.","use":"En las guías te preguntan por el «10 % más alto» o el «30 % más bajo» sin nombrar directamente el percentil.","example":"El 10 % de personas con más ansiedad comienza cerca de P90, no de P10.","formula":"10 % superior → P90"},{"id":"03.4","title":"Desvío estándar","what":"El desvío estándar resume cuánto se alejan, en general, los valores respecto de la media.","use":"Sirve para distinguir dos grupos con el mismo promedio pero puntajes más concentrados o más dispersos.","example":"Dos cursos pueden promediar 7; si uno tiene notas casi todas entre 6 y 8 y el otro entre 2 y 10, el segundo tendrá mayor desvío.","formula":"s = raíz de la varianza muestral"},{"id":"03.5","title":"Varianza y CV","what":"La varianza promedia desviaciones al cuadrado; el coeficiente de variación (CV) expresa el desvío en relación con la media.","use":"El parcial puede pedirte calcular s² o comparar qué grupo es relativamente más variable aunque sus promedios sean distintos.","example":"Un grupo con media 10 y desvío 1 tiene CV 10 %; otro con media 5 y desvío 2 tiene CV 40 %.","formula":"CV = 100 × s ÷ media"},{"id":"03.6","title":"Asimetría","what":"Una distribución es asimétrica cuando presenta una cola más extendida hacia valores altos o bajos.","use":"Te ayuda a interpretar por qué unas pocas puntuaciones extremas pueden desplazar la media respecto de la mediana.","example":"En un grupo donde casi todos puntúan 10 y una sola persona 90, ese valor extremo eleva la media y estira la cola hacia la derecha.","formula":null}],"practice":[{"id":"M3-P01","type":"numeric","title":"Calculá la media","prompt":"Cinco estudiantes obtuvieron estos puntajes: \u003cb>2, 4, 4, 6 y 9\u003c/b>. ¿Cuál es la media?","label":"Media","answer":5,"tolerance":0.001,"solution":["Sumá: 2 + 4 + 4 + 6 + 9 = 25.","Dividí entre 5: \u003cb>media = 5\u003c/b>."],"source":"Simulacro P1 · E3(a)","hints":["La media usa todos los valores.","Sumá 25 y dividí por 5."],"table":null,"pairs":null,"unit":null},{"id":"M3-P02","type":"choice","title":"Mediana y moda","prompt":"Para los datos \u003cb>2, 4, 4, 6, 9\u003c/b>, ¿cuál es la mediana y cuál la moda?","options":["Mediana 5 · moda 4","Mediana 4 · moda 4","Mediana 4 · moda 9","Mediana 6 · moda 5"],"answer":1,"solution":["La mediana es el \u003cb>valor del medio\u003c/b> de cinco datos ordenados: 4.","La moda es el que más se repite: \u003cb>4\u003c/b>."],"source":"Simulacro P1 · E3(a)","hints":["Hay cinco datos ordenados: el tercero es el central.","¿Qué número aparece dos veces?"],"table":null,"chart":null},{"id":"M3-P03","type":"numeric","title":"Varianza muestral","prompt":"Para 2, 4, 4, 6, 9, la media es 5. ¿Cuál es la varianza \u003cb>muestral\u003c/b>?","label":"s²","answer":7,"tolerance":0.001,"solution":["Desviaciones al cuadrado: 9, 1, 1, 1, 16; total = 28.","Dividí por n−1 = 4: \u003cb>s² = 28/4 = 7\u003c/b>."],"source":"Simulacro P1 · E3(b)","hints":["Primero restá la media a cada dato y elevá al cuadrado.","La suma es 28. Como es muestral, dividí por 4, no por 5."],"table":null,"pairs":null,"unit":null},{"id":"M3-P04","type":"numeric","title":"Coeficiente de variación","prompt":"La media del grupo es 5 y el desvío muestral es √7 ≈ 2,646. ¿Qué CV tiene?","label":"CV en %","answer":52.91502622129182,"tolerance":0.08,"solution":["CV = 100 × desvío ÷ media.","CV = 100 × 2,6458 ÷ 5 ≈ \u003cb>52,92 %\u003c/b>."],"source":"Simulacro P1 · E3(c)","hints":["En el CV, el desvío va arriba y la media abajo.","Calculá 2,646 ÷ 5 y multiplicá por 100."],"table":null,"pairs":null,"unit":null},{"id":"M3-P05","type":"choice","title":"¿Qué percentil usar?","prompt":"Queremos saber a partir de qué puntuación comienza el \u003cb>10 % con mayor ansiedad\u003c/b>.","options":["P10","P50","P90","P100"],"answer":2,"solution":["Si buscás el 10 % superior, dejás el \u003cb>90 % por debajo\u003c/b>. El corte es P90."],"source":"M3 · E3 y parcial P1 2026 E1(d)","hints":["El porcentaje indicado está arriba, no abajo.","100 % − 10 % = 90 %."],"table":null,"chart":null},{"id":"M3-P06","type":"choice","title":"Interpretá medidas dadas","prompt":"Un informe indica media = 17,8, mediana = 15 y moda = 12. ¿Qué sugiere ese orden?","options":["Asimetría positiva","Simetría perfecta","Asimetría negativa","Que el valor 17,8 es la moda"],"answer":0,"solution":["El orden media > mediana > moda \u003cb>sugiere una cola hacia valores altos\u003c/b>.","Para confirmarlo, conviene consultar el gráfico o el coeficiente de asimetría."],"source":"M3 · E3, adaptación","hints":["¿Hacia dónde pueden estar estirando la media unos valores extremos altos?","Media mayor que mediana suele sugerir sesgo positivo."],"table":null,"chart":null},{"id":"M3-P07","type":"choice","title":"¿Qué grupo es más variable?","prompt":"Grupo A: media 10, desvío 1. Grupo B: media 5, desvío 2. ¿Cuál tiene mayor \u003cb>variabilidad relativa\u003c/b>?","options":["A, porque la media es mayor","B, porque su CV es mayor","Tienen igual CV"],"answer":1,"solution":["CV(A) = 1 ÷ 10 × 100 = \u003cb>10 %\u003c/b>.","CV(B) = 2 ÷ 5 × 100 = \u003cb>40 %\u003c/b>.","B es relativamente más variable."],"source":"Simulacro P1 · E3(d), variante","hints":["No compares solo los desvíos ni las medias.","Calculá s/media para cada grupo."],"table":null,"chart":null},{"id":"M3-P08","type":"choice","title":"¿Qué medida estoy leyendo?","prompt":"Un informe dice: «La mitad de los 130 alumnos obtuvo una nota de 7 o menos». ¿Qué medida está interpretando?","options":["Moda","Media","Mediana","Desvío"],"answer":2,"solution":["La mediana separa las observaciones ordenadas en dos mitades. No indica el valor que más se repite."],"source":"M3 · E6, adaptación","hints":["La expresión importante es «la mitad».","¿Qué medida divide en dos partes?"],"table":null,"chart":null},{"id":"M3-P09","type":"choice","title":"¿Qué requiere datos que faltan?","prompt":"Un parcial pide la media de ansiedad por tratamiento, pero solo presenta la descripción del experimento y nombra una base externa que no está adjunta. ¿Qué corresponde hacer?","options":["Inventar los puntajes probables","Calcular la media a partir del número de pacientes","Necesitar los valores de la base o su salida estadística"],"answer":2,"solution":["No se puede calcular una media sin \u003cb>puntajes observados\u003c/b> o un resultado equivalente.","En los parciales reales, algunas tablas dependen de las bases nombradas en las consignas."],"source":"Parcial P1 2026 E1(b), criterio de datos","hints":["¿El tamaño de muestra alcanza para conocer la media?","La media necesita puntajes, no solo el total de personas."],"table":null,"chart":null}]},{"id":"04","title":"Correlación y regresión","intro":"Encontrar relaciones entre dos variables y hacer predicciones justificadas.","source":"M4 · Análisis de regresión y correlación","theory":[{"id":"04.1","title":"Dos variables relacionadas","what":"Cada persona aporta un par de valores: uno para X y otro para Y. La relación describe cómo cambian juntos.","use":"Antes de calcular hay que saber qué variable se utiliza para predecir y cuál se quiere estimar.","example":"Si X es estrés y Y son horas de sueño, cada estudiante aporta un nivel de estrés y un número de horas; no se pueden mezclar filas.","formula":null},{"id":"04.2","title":"Correlación r","what":"La correlación r indica la dirección y la fuerza de la relación \u003cem>lineal\u003c/em> entre dos variables.","use":"En los ejercicios te pueden pedir decidir si es positiva o negativa, calcular r o interpretar un valor ya dado.","example":"Si r = −0,80, los estudiantes con más X suelen tener menos Y; el signo no dice que X cause Y.","formula":"−1 ≤ r ≤ 1"},{"id":"04.3","title":"Coeficiente de determinación","what":"R² indica qué proporción de la variabilidad de Y está asociada al ajuste de la recta.","use":"Se usa para interpretar cuánto explican los cambios de X dentro del modelo, sin confundirlo con causalidad.","example":"Con r = −0,80, R² = 0,64: el modelo lineal explica el 64 % de la variación de Y en esos datos.","formula":"R² = r²"},{"id":"04.4","title":"Recta de regresión","what":"La recta resume la tendencia mediante un punto de partida a y un cambio b por cada unidad de X.","use":"Sirve para estimar un valor de Y, interpretar una pendiente y entender el intercepto.","example":"En ŷ = 47 − 4x, cada hora adicional de deporte se asocia con 4 puntos menos de estrés esperado.","formula":"ŷ = a + bx"},{"id":"04.5","title":"Calcular la recta","what":"La pendiente compara cómo varían juntos X e Y con cuánto varía X por sí sola; el intercepto posiciona la recta sobre los datos.","use":"En los ejercicios con pares numéricos podés calcular a y b a partir de los datos o recuperarlos de la salida estadística.","example":"Si b = −0,68 y a = 10,33, para X=7 la predicción es 10,33 − 0,68×7 ≈ 5,55 horas.","formula":"b = cov(X,Y) ÷ var(X) · a = ȳ − b x̄"},{"id":"04.6","title":"Causalidad y extrapolación","what":"Dos variables pueden moverse juntas por otros motivos, y una recta solo se estimó con el rango de datos disponible.","use":"El parcial suele preguntar si un resultado permite afirmar causalidad o si una predicción fuera del rango es confiable.","example":"Observar menos sueño con más estrés no prueba qué lo causó; predecir X=80 a partir de datos entre X=4 y 9 sería extrapolar.","formula":null}],"practice":[{"id":"M4-P01","type":"choice","title":"¿Qué dirección tiene?","prompt":"En un grupo, cuando aumenta el estrés suelen disminuir las horas de sueño. ¿Qué signo esperás para r?","options":["Positivo","Negativo","Necesariamente cero"],"answer":1,"solution":["La tendencia va en sentidos opuestos: \u003cb>correlación negativa\u003c/b>."],"source":"M4 · E5/E8, adaptación","hints":["Una variable sube mientras la otra baja.","Cuando se mueven en sentidos contrarios, r tiene signo negativo."],"table":null,"chart":null},{"id":"M4-P02","type":"choice","title":"¿Puede existir ese valor?","prompt":"Se informa una correlación de \u003cb>r = 1,09\u003c/b>. ¿Qué problema hay?","options":["Es muy positiva, pero válida","No es posible: r debe estar entre −1 y 1","El problema es que falta el porcentaje"],"answer":1,"solution":["El coeficiente de Pearson siempre está en \u003cb>[−1, 1]\u003c/b>.","1,09 queda fuera de ese rango y no puede ser una correlación válida."],"source":"M4 · E6(a)","hints":["Recordá los límites posibles de r.","Ni una relación perfecta supera 1 en valor absoluto."],"table":null,"chart":null},{"id":"M4-P03","type":"numeric","title":"Convertí r en R²","prompt":"Si r = −0,80, ¿qué porcentaje de variación explica la recta?","label":"R² en %","answer":64,"tolerance":0.001,"solution":["R² = (−0,80)² = 0,64.","Expresado como porcentaje: \u003cb>64 %\u003c/b>. El signo desaparece al elevar al cuadrado."],"source":"M4 · E4(b), adaptación","hints":["Elevá r al cuadrado.","(−0,8)² = 0,64; multiplicá por 100."],"table":null,"pairs":null,"unit":null},{"id":"M4-P04","type":"numeric","title":"Hacé una predicción","prompt":"La recta es \u003cb>ŷ = 47 − 4x\u003c/b>. ¿Cuál es la predicción para x = 8?","label":"ŷ","answer":15,"tolerance":0.001,"solution":["Reemplazá x por 8: ŷ = 47 − 4×8.","ŷ = 47 − 32 = \u003cb>15\u003c/b>."],"source":"Integrador P1 · E2(b)","hints":["No necesitás calcular una nueva recta: ya está dada.","Sustituí x=8 en 47−4x."],"table":null,"pairs":null,"unit":null},{"id":"M4-P05","type":"choice","title":"Interpretá la pendiente","prompt":"En ŷ = 47 − 4x, X mide horas de deporte y Y un puntaje de estrés. ¿Qué significa b = −4?","options":["Por cada hora de deporte, el estrés esperado es 4 puntos menor","A las 4 horas el estrés es 0","El estrés causa más deporte"],"answer":0,"solution":["La pendiente describe un \u003cb>cambio esperado de −4 en Y por cada unidad adicional de X\u003c/b>.","La recta expresa asociación, no causalidad demostrada."],"source":"Integrador P1 · E2(a)","hints":["La pendiente dice cuánto cambia Y al aumentar X una unidad.","El signo es negativo."],"table":null,"chart":null},{"id":"M4-P06","type":"choice","title":"¿Qué significa el intercepto?","prompt":"En ŷ = 47 − 4x, ¿qué representa a = 47?","options":["La predicción de Y cuando X=0","El máximo valor que Y puede tomar","Que hay 47 participantes"],"answer":0,"solution":["El intercepto es la predicción de Y para \u003cb>X = 0\u003c/b>.","Que sea interpretable en la realidad depende de si ese valor de X tiene sentido y está dentro del rango pertinente."],"source":"M4 · E9 / Integrador P1 E2(a)","hints":["Pensá qué queda de la fórmula si x=0.","47−4×0 = 47."],"table":null,"chart":null},{"id":"M4-P07","type":"multi","title":"Leé una regresión completa","prompt":"Estos son los pares de datos del simulacro de estrés y sueño. Completá los resultados aproximados de la regresión de sueño (Y) sobre estrés (X).","fields":[{"label":"r","answer":-0.9885977854493444,"tolerance":0.015},{"label":"R² en %","answer":97.7325581395348,"tolerance":0.12},{"label":"Pendiente b","answer":-0.6833333333333333,"tolerance":0.015},{"label":"Intercepto a","answer":10.333333333333334,"tolerance":0.035}],"solution":["Para cada par (xᵢ,yᵢ), se mantienen juntos los datos del mismo estudiante.","Las medias son x̄ ≈ 6,667 e ȳ ≈ 5,778.","b = Σ[(x−x̄)(y−ȳ)] / Σ[(x−x̄)²] ≈ \u003cb>−0,6833\u003c/b>.","a = ȳ − b·x̄ ≈ \u003cb>10,3333\u003c/b>.","r ≈ \u003cb>−0,9886\u003c/b> y R² ≈ \u003cb>97,73 %\u003c/b>.","Recta: \u003cb>ŷ = 10,3333 − 0,6833x\u003c/b>."],"source":"Simulacro P1 · E4 / Parcial 2026 · E2","hints":["Buscá la asociación negativa: r debe quedar cerca de −1.","Para R² elevá r al cuadrado. Para la recta, primero pendiente y después intercepto."],"table":null,"pairs":[["x · Estrés","9","8","7","6","5","8","7","6","4"],["y · Sueño","4","5","5,5","6","7","5","5,5","6,5","7,5"]]},{"id":"M4-P08","type":"numeric","title":"Usá la recta calculada","prompt":"La regresión de sueño sobre estrés fue \u003cb>ŷ = 10,3333 − 0,6833x\u003c/b>. ¿Cuántas horas de sueño se predicen si el estrés vale 7?","label":"Sueño predicho (h)","answer":5.55,"tolerance":0.03,"solution":["ŷ = 10,3333 − 0,6833 × 7.","ŷ ≈ \u003cb>5,55 horas\u003c/b>.","La predicción usa X=7, que está dentro del rango observado."],"source":"Simulacro P1 · E4(d) / Parcial 2026 · E2(d)","hints":["La recta ya está dada, no vuelvas a calcular r.","Multiplicá −0,6833 por 7 y sumá 10,3333."],"table":null,"pairs":null,"unit":null},{"id":"M4-P09","type":"choice","title":"¿Hay causalidad?","prompt":"Una correlación de r = −0,99 entre estrés y sueño permite afirmar que el estrés \u003cb>causa\u003c/b> menos horas de sueño.","options":["Sí, porque |r| es casi 1","No; asociación no prueba causalidad","Sí, porque la pendiente es negativa"],"answer":1,"solution":["Una correlación muy fuerte puede deberse a otros factores o a relaciones complejas.","Sin un diseño adecuado no se puede concluir que X \u003cb>cause\u003c/b> Y."],"source":"M4 · E2(d), E5(e) y Simulacro P1 · E4(e)","hints":["La fuerza de la relación no establece su causa.","¿El estudio asignó experimentalmente el nivel de estrés?"],"table":null,"chart":null},{"id":"M4-P10","type":"choice","title":"¿Es una predicción razonable?","prompt":"Calculaste una recta usando valores de X entre 4 y 9. Te piden predecir Y para \u003cb>X = 50\u003c/b>. ¿Cuál es el principal problema?","options":["No hay ninguno si r es fuerte","La predicción extrapola demasiado fuera del rango medido","Siempre debemos usar X=50"],"answer":1,"solution":["Predecir X=50 cuando solo se observaron valores de 4 a 9 es una \u003cb>extrapolación extrema\u003c/b>.","Aunque el ajuste sea fuerte dentro del rango, fuera de él la predicción puede no ser válida."],"source":"M4 · E5(e), variante","hints":["Compará el X pedido con los X observados.","La recta no fue contrastada cerca de 50."],"table":null,"chart":null}]}],"version":"2026-11-17.content-first-partial.v1","copyright":"Adaptaciones pedagógicas breves; no se reproducen guías completas."}</script><script type="application/json" id="extra-data">{"01.1":[["Población","Todas las personas sobre las que se quiere concluir."],["Muestra","Las personas que realmente participaron."],["Unidad de análisis","Cada persona u objeto del que se obtiene información."]],"01.2":[["Variable","Característica medida que cambia entre personas o situaciones."],["Variable explicativa (X)","Característica o con ]],["Correlación y determinación",[["r","Dirección y fuerza de asociación lineal."],["R² = r²","Proporción de variabilidad de Y explicada por la recta."],["R² en %","Multiplicar r² por 100. El signo de r desaparece."]]],["Recta de regresión",[["ŷ = a + bx","Predicción de Y según X."],["b","Cambio esperado en Y cuando X aumenta una unidad."],["a","Predicción de Y cuando X = 0."],["Predicción","Sustituir X en la recta; no reemplazar Y."]]],["Calcular con pares de datos",[["Pendiente b","Σ[(x − x̄)(y − ȳ)] / Σ[(x − x̄)²]."],["Intercepto a","ȳ − b × x̄."],["r","Covariación estandarizada; se interpreta entre −1 y 1."]]],["Interpretación crítica",[["Correlación ≠ causalidad","No alcanza con r alto para demostrar un efecto."],["Extrapolación","Predecir muy fuera del rango de X observado puede ser poco fiable."],["Intercepto","Puede no tener sentido práctico si X = 0 queda fuera del rango."]]]]}</script><script type="application/json" id="numeric-data">{"M2-P01":[350,300,250,100],"M2-P02":[28.57,60,0.286,71.43],"M2-P03":[210,100,160,350],"M2-P04":[60,0.6,40,210],"M2-P05":[14,24,182,6],"M2-P07":[62.5,50,37.5,160],"M3-P01":[5,4,6.25,25],"M3-P03":[7,5.6,28,14],"M3-P04":[52.92,40,18.9,2.646],"M4-P03":[64,-64,80,0.64],"M4-P04":[15,79,-15,43],"M4-P08":[5.55,15.12,7.62,10.33]}</script><script type="application/json" id="multi-data">{"M2-P06":[[100,60,210],[28.57,60,0.286],[210,100,160],[60,28.57,0.6]],"M4-P07":[[-0.9886,0.9886,-0.6833],[97.73,98.86,0.9773],[-0.6833,0.6833,-0.9886],[10.3333,5.7778,-10.3333]]}</script><script type="application/json" id="tf-data">{"M1-P02":[["La cantidad de materias recursadas es discreta.",1,"Es un conteo de 0, 1, 2… materias."],["Como se escribe con números, es una variable cualitativa.",0,"Es cuantitativa porque indica una cantidad."],["El tiempo de reacción suele considerarse una variable continua.",1,"El tiempo es una medida, no un conteo."]],"M1-P03":[["El nivel educativo tiene un orden entre categorías.",1,"Primario, secundario y universitario function textSafe(s){return escapeHTML(s)}
function store(k,v){answers[k]=v;save()}
function niceNum(v){if(Number.isInteger(v))return String(v);let n=Number(v);return String(Math.round((n+Number.EPSILON)*10000)/10000).replace('.',',')}
function itemLink(n){return escapeHTML(n)}
function toDisplayValue(x){return typeof x==='number'?niceNum(x):escapeHTML(x)}
function readProgress(){const doc=document.documentElement;const max=Math.max(1,doc.scrollHeight-window.innerHeight);const percent=Math.min(100,Math.max(0,window.scrollY/max*100));PERCENT.style.width=percent+'%';PERCENT.parentNode.setAttribute('aria-valuenow',String(Math.round(percent)))}
window.addEventListener('scroll',readProgress,{passive:true});window.addEventListener('resize',readProgress);
function updateControls(){let active=view==='unit';HEAD.hidden=!active;if(active){UNIT_TRIGGER.textContent=PARTIALS[partial].units[unit].id;for(const b of TABS.querySelectorAll('[data-tab]')){const yes=b.dataset.tab===tab;b.classList.toggle('active',yes);b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1}}}
function homePage(){navigate({view:'units',partial},true)}
function openUnit(i,t='theory'){navigate({view:'unit',partial,unit:Number(i),tab:t},true)}
function changeTab(t){if(view==='unit'&&t!==tab)navigate({view:'unit',partial,unit,tab:t},true)}
function getRoute(){return {view,partial,unit,tab}}
function keyOf(r){return [r.view,r.partial,r.unit,r.tab].join(':')}
function getURL(r){const p=new URLSearchParams();if(r.view==='partials'){p.set('view','partials')}else if(r.view==='unit'){p.set('unit',PARTIALS[r.partial].units[r.unit].id);if(r.tab!=='theory')p.set('tab',r.tab)}if(r.partial!==0){p.set('partial',PARTIALS[r.partial].id)}let search=p.toString();return location.pathname+(search?'?'+search:'')}
function savePosition(){previousScroll.set(keyOf(getRoute()),window.scrollY)}
function navigate(next,push=true){if(view==='unit'||view==='units'||view==='partials')savePosition();const r={...getRoute(),...next};if(!PARTIALS[r.partial])r.partial=0;if(r.view==='unit'&&!PARTIALS[r.partial].units[r.unit])r.view='units';if(!TAB_ORDER.includes(r.tab))r.tab='theory';({view,partial,unit,tab}=r);if(push)history.pushState(getRoute(),' ',getURL(getRoute()));render();const prior=previousScroll.get(keyOf(getRoute()))||0;requestAnimationFrame(()=>{window.scrollTo({top:prior,behavior:'instant'});readProgress()})}
function render(){updateControls();document.title=(view==='unit'?PARTIALS[partial].units[unit].title+' · ':view==='units'?PARTIALS[partial].title+' · ':'')+'Estadística';if(view==='partials'){MAIN.innerHTML=`<div class="indexhead"><h1>Estadística</h1></div><div class="index-list">${PARTIALS.map((p,i)=>`<button type="button" class="index-unit" data-partial="${i}" ${p.ready===false?'disabled aria-disabled="true"':''}><span class="inum">${String(i+1).padStart(2,'0')}</span><span><strong>${escapeHTML(p.title)}</strong>${p.ready===false?'<small>Próximamente</small>':''}</span><span class="arr">›</span></button>`).join('')}</div>`;readProgress();return}
if(view==='units'){const p=PARTIALS[partial];MAIN.innerHTML=`<div class="indexhead"><div class="indexline"><button class="levelback" data-view="partials" aria-label="Volver a parciales">‹</button><h1>${escapeHTML(p.title)}</h1></div></div><div class="index-list">${p.units.map((u,i)=>`<button class="index-unit" data-unit="${i}"><span class="inum">${escapeHTML(u.id)}</span><span><strong>${escapeHTML(u.title)}</strong><small>${u.practice.length} ejercicios · ${u.theory.length} conceptos</small></span><span class="arr">›</span></button>`).join('')}</div>`;readProgress();return}
const u=PARTIALS[partial].units[unit];MAIN.innerHTML=tab==='theory'?theory(u):tab==='practice'?practices(u):cheat(u);readProgress();}
function theory(u){return `${u.theory.map((c,i)=>`<section class="concept" id="${escapeHTML(c.id)}"><h2>${escapeHTML(c.title)}</h2>${EXTRAS[c.id]?`<div class="defs">${EXTRAS[c.id].map(([label,value])=>`<div class="def"><strong>${escapeHTML(label)}</strong><span>${escapeHTML(value)}</span></div>`).join('')}</div>`:`<p class="what">${c.what}</p>`}${c.formula?`<div class="formula" aria-label="Fórmula">${escapeHTML(c.formula)}</div>`:''}<div class="label">PARA QUÉ SIRVE</div><p class="purpose">${c.id==='01.6'?'Permite elegir el método de comparación correcto según si cada dato tiene una pareja o pertenece a otro grupo.':c.use}</p><div class="label">EJEMPLO</div><p class="example">${c.example}</p></section>`).join('')}` }
function cheat(u){return `<div class="cheats">${CHEATS[u.id].map(([title,items])=>`<section class="cheat-section"><h2>${escapeHTML(title)}</h2>${items.map(([key,val])=>`<div class="cheat-item${/[=Σ√]/.test(key)?' formula-note':''}"><b>${escapeHTML(key)}:</b> <span>${escapeHTML(val)}</span></div>`).join('')}</section>`).join('')}</div>`}
function table(q){if(q.table?.length){const [header,...rows]=q.table;return `<div class="tablewrap"><table class="datatab"><thead><tr>${header.map(v=>`<th>${escapeHTML(v)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${escapeHTML(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}return ''}
function pairs(q){if(!q.pairs?.length)return '';let rows=q.pairs;return `<div class="tablewrap"><table class="datatab"><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${escapeHTML(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function chart(q){if(!q.chart?.length)return '';let m=Math.max(...q.chart.map(x=>x[1]));return `<div class="bargraph">${q.chart.map(([k,v])=>`<div class="barrow"><span>${escapeHTML(k)}</span><div class="bartrack"><span style="width:${v/m*100}%"></span></div><span>${v}</span></div>`).join('')}</div>`}
function feedbackFor(key,correct,explain){const current=answers[key];if(current===undefined)return '<span class="feedback" aria-live="polite"></span>';return `<span class="feedback ${current===correct?'good':'bad'}" aria-live="polite">${current===correct?'✓':'✕'} ${escapeHTML(explain)}</span>`}
function optionList(q,key,values,correctIndex,part='single'){return `<div class="optionlist" role="group" aria-label="Elegí una respuesta">${values.map((v,i)=>{const selected=answers[key]===i;return `<button type="button" class="choice${selected?' selected '+(i===correctIndex?'correct':'wrong'):''}" data-key="${escapeHTML(key)}" data-choice="${i}" data-q="${escapeHTML(q.id)}" data-correct="${correctIndex}" aria-pressed="${selected}">${toDisplayValue(v)}</button>`}).join('')}</div>${feedbackFor(key,correctIndex,answers[key]===correctIndex?'Correcto.': 'Revisá el cálculo o consultá la resolución.')}`}
function makeChoices(q){let raw=NUM[q.id]||[q.answer,q.answer*2,q.answer/2,q.answer+1];return raw.map(Number)}
function practiceBody(q){if(q.type==='choice'&&TF[q.id]){return `<div class="vf">${TF[q.id].map(([claim,v,why],i)=>{let key=q.id+':vf:'+i;let selected=answers[key];return `<div class="vf-item"><div class="vf-row"><div class="vf-claim">${escapeHTML(claim)}</div><div class="vf-controls">${[[1,'V'],[0,'F']].map(([chosen,label])=>`<button class="choice${selected===chosen?' selected '+(chosen===v?'correct':'wrong'):''}" data-key="${key}" data-choice="${chosen}" data-q="${q.id}" data-correct="${v}" aria-label="${label==='V'?'Verdadero':'Falso'}" aria-pressed="${selected===chosen}">${label}</button>`).join('')}</div></div>${feedbackFor(key,v,why)}</div>`}).join('')}</div>`}
if(q.type==='mark'){let key=q.id+':mark';let parts=q.parts.map(p=>typeof p==='string'?p:`<button class="choice" style="padding:4px 10px;min-height:30px" data-key="${key}" data-choice="${escapeHTML(p.value)}" data-q="${q.id}" data-correct="${q.answer}" aria-pressed="${answers[key]===p.value}">${escapeHTML(p.text)}</button>`).join('');return `<div class="statement">${parts}</div>${feedbackFor(key,q.answer,'La muestra son los casos evaluados, no el tiempo transcurrido.')}`}
if(q.type==='numeric'){let values=makeChoices(q),correctIndex=values.findIndex(n=>Math.abs(n-q.answer)<=Math.max(q.tolerance||0,0.005));return `<div class="sublabel">${q.label?escapeHTML(q.label):'Elegí el resultado'}</div>${optionList(q,q.id+':number',values,correctIndex<0?0:correctIndex)}`}
if(q.type==='multi'){return q.fields.map((f,i)=>{let opts=MULTI[q.id]?.[i]||[f.answer,f.answer*2,f.answer/2];let correct=opts.findIndex(n=>Math.abs(n-f.answer)<=Math.max(f.tolerance||0,0.01));return `<div class="multirow"><div class="multilabel">${escapeHTML(f.label)}</div>${optionList(q,q.id+':multi:'+i,opts,Math.max(0,correct))}</div>`}).join('')}
if(q.type==='choice')return optionList(q,q.id+':choice',q.options,q.answer);
return '<p class="quiet-note">Tipo de actividad no reconocido.</p>'}
function practices(u){return u.practice.map((q,i)=>`<section class="exercise" id="${escapeHTML(q.id)}"><h2><span class="ex-index" aria-label="Ejercicio ${i+1}">${String(i+1).padStart(2,'0')}</span>${escapeHTML(q.title)}</h2>${q.prompt?`<p class="statement">${q.prompt}</p>`:''}${table(q)}${chart(q)}${pairs(q)}${practiceBody(q)}<div class="assist" data-assist="${escapeHTML(q.id)}"><div class="assist-controls"><button class="assist-btn" type="button" data-help="${escapeHTML(q.id)}" data-help-mode="hint">Pista</button><button class="assist-btn" type="button" data-help="${escapeHTML(q.id)}" data-help-mode="solution">Resolución</button></div><div class="assist-body" data-help-body="${escapeHTML(q.id)}" hidden aria-live="polite"></div></div><span class="sr-only">Fuente: ${escapeHTML(q.source||'Ejercicio adaptado')}</span></section>`).join('') }
function patchCard(key,chosen){const selector='[data-key="'+CSS.escape(key)+'"]';const buttons=MAIN.querySelectorAll(selector);if(!buttons.length)return;const correct=String(buttons[0].dataset.correct);store(key,key.endsWith(':mark')?String(chosen):Number(chosen));buttons.forEach(b=>{let yes=String(b.dataset.choice)===String(chosen);b.classList.toggle('selected',yes);b.classList.toggle('correct',yes&&String(chosen)===correct);b.classList.toggle('wrong',yes&&String(chosen)!==correct);b.setAttribute('aria-pressed',String(yes))});const group=buttons[0].closest('.vf-item')||buttons[0].closest('.multirow')||buttons[0].closest('.exercise');if(!group)return;const feed=group.querySelector('.feedback');if(!feed)return;const right=String(chosen)===correct;feed.className='feedback '+(right?'good':'bad');if(key.includes(':vf:')){let [id,idx]=key.split(':vf:');let why=TF[id]?.[Number(idx)]?.[2]||'';feed.textContent=(right?'✓ ':'✕ ')+why;}else{feed.textContent=right?'✓ Correcto':'✕ Revisá la respuesta';}}
function toggleHelp(id,mode){const q=PARTIALS[partial].units[unit].practice.find(x=>x.id===id);if(!q)return;const item=MAIN.querySelector('[data-assist="'+CSS.escape(id)+'"]');if(!item)return;const box=item.querySelector('[data-help-body]');const prev=helpState.get(id);let next;if(prev?.mode===mode){if(mode==='hint'&&prev.step+1<(q.hints||[]).length){next={mode,step:prev.step+1}}else next=null}else next={mode,step:0};if(!next)helpState.delete(id);else helpState.set(id,next);box.hidden=!next;box.innerHTML=!next?'':next.mode==='hint'?`<p>${escapeHTML((q.hints||[])[next.step]||'')}</p>`:(q.solution||[]).map(s=>`<p>${s}</p>`).join('');item.querySelectorAll('[data-help]').forEach(b=>{const active=next?.mode===b.dataset.helpMode;b.classList.toggle('active',!!active);b.setAttribute('aria-pressed',String(!!active));b.textContent=b.dataset.helpMode==='hint'&&active&&next.step+1<(q.hints||[]).length?'Otra pista':b.dataset.helpMode==='hint'?'Pista':'Resolución'})}
MAIN.addEventListener('click',e=>{const btn=e.target.closest('[data-view],[data-partial],[data-unit],[data-key],[data-help]');if(!btn)return;if(btn.dataset.view==='partials'){navigate({view:'partials'},true);return}if(btn.dataset.partial!==undefined){const p=Number(btn.dataset.partial);if(PARTIALS[p]?.ready===false)return;navigate({view:'units',partial:p,unit:0,tab:'theory'},true);return}if(btn.dataset.unit!==undefined){openUnit(btn.dataset.unit);return}if(btn.dataset.key){patchCard(btn.dataset.key,btn.dataset.choice);return}if(btn.dataset.help){toggleHelp(btn.dataset.help,btn.dataset.helpMode);return}});
UNIT_TRIGGER.addEventListener('click',()=>navigate({view:'units'},true));
TABS.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)changeTab(b.dataset.tab)});
let sx=0,sy=0,started=false;
MAIN.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.tablewrap')){started=false;return}started=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
MAIN.addEventListener('touchend',e=>{if(!started||e.changedTouches.length!==1)return;started=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.65)return;if(view==='unit'){const next=TAB_ORDER.indexOf(tab)+(dx<0?1:-1);if(next<0){navigate({view:'units'},true)}else if(next<TAB_ORDER.length)changeTab(TAB_ORDER[next])}else if(view==='units'){if(dx>0)navigate({view:'partials'},true);else if(PARTIALS[partial].units.length)openUnit(unit)}else if(view==='partials'&&dx<0){navigate({view:'units'},true)}},{passive:true});
function routeFromLocation(){const p=new URLSearchParams(location.search);const ix=PARTIALS.findIndex(x=>x.id===p.get('partial'));const pi=Math.max(0,ix);const id=p.get('unit');const u=PARTIALS[pi].units.findIndex(x=>x.id===id);return {partial:pi,unit:Math.max(0,u),tab:TAB_ORDER.includes(p.get('tab'))?p.get('tab'):'theory',view:p.get('view')==='partials'?'partials':u>=0?'unit':'units'}}
window.addEventListener('popstate',()=>navigate(routeFromLocation(),false));
({view,partial,unit,tab}=routeFromLocation());render();
})();</script></body></html>
