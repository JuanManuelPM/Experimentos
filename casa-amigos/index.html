<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dfe8c8">
  <title>CASA — chat con voz</title>
  <meta name="description" content="Entrá con un nombre, hablá con tus amigos y hacé que los mensajes se lean en voz alta.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <section class="join" id="joinView">
      <div class="brand"><i class="gem"></i><b>CASA</b></div>
      <h1>Entrá y hablá.</h1>
      <p>Una sola sala. Sin cuenta, sin contraseña, ahora también con voz.</p>
      <form id="nameForm">
        <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Tu nombre" aria-label="Tu nombre" required>
        <button class="primary" type="submit">Entrar a la casa</button>
        <small id="joinError" role="alert"></small>
      </form>
    </section>

    <section class="app hidden" id="chatView">
      <div class="chat">
        <header>
          <div class="room"><i class="gem mini"></i><b>Casa de los pibes</b></div>
          <div class="headerRight">
            <button class="voiceToggle" id="voiceToggle" type="button" aria-pressed="false" title="Activar lectura automática de mensajes recibidos">
              <span class="voiceIcon" aria-hidden="true">🔇</span><b>Voz</b>
            </button>
            <button class="mobileCount" id="mobileCount" type="button"></button>
            <span class="status" id="status"><i></i><span>Conectando…</span></span>
          </div>
        </header>
        <div class="messages" id="messages" aria-live="polite">
          <div class="empty" id="empty"><b>La casa está tranquila.</b><span>Mandá el primer mensaje.</span></div>
        </div>
        <form class="composer" id="messageForm">
          <input id="messageInput" maxlength="500" autocomplete="off" placeholder="Escribí algo…" aria-label="Mensaje" disabled>
          <button class="speakDraft" id="speakDraft" type="button" aria-label="Leer este mensaje" title="Leer este mensaje" disabled>▶</button>
          <button class="primary send" id="sendButton" type="submit" disabled>Enviar</button>
        </form>
      </div>
      <aside>
        <div class="asideTitle"><b>En la casa</b><span id="onlineCount">0 online</span></div>
        <div class="people" id="people"></div>
        <div class="voiceHint"><b>Voz</b><span>▶ reproduce cualquier mensaje. “Voz” lee automáticamente lo que te manden.</span></div>
        <button class="leave" id="leaveButton" type="button">Cambiar nombre / salir</button>
      </aside>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
