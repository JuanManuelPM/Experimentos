<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5DABF">
<meta name="description" content="Walkie Chat">
<title>Walkie Chat</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=5">
<link rel="stylesheet" href="./shelf-v8.css?v=1">
<link rel="stylesheet" href="./walkie-v13.css?v=1">
<link rel="stylesheet" href="./walkie-v15.css?v=1">
</head>
<body>
<section class="walkieLandingShell" id="joinScreen">
  <main class="walkieLanding">
    <div class="landingGrid">
      <section class="radioStage" aria-label="Walkie Chat">
        <div class="radioLockup">
          <div class="landingRadioArt" aria-hidden="true"></div>
          <button class="themeKnobHotspot" id="themeKnobButton" type="button" aria-label="Cambiar tema"></button>
          <div class="radioWordmark"><b>WALKIE</b><span>CHAT</span></div>
        </div>
      </section>

      <form class="landingForm" id="joinForm" action="/" method="get">
        <div class="landingNameLine">
          <input id="joinName" name="n" maxlength="28" autocomplete="nickname" placeholder="Tu nombre" aria-label="Tu nombre" required>
        </div>
        <input id="joinRoomInput" type="hidden" name="r" value="publico">
        <input type="hidden" name="go" value="1">

        <div class="landingActions" id="landingChoice">
          <button class="landingAction primaryChoice" id="publicJoinButton" type="submit">ENTRAR AL PÚBLICO</button>
          <button class="landingAction" id="createPrivateButton" type="button">CREAR LINK APARTE</button>
        </div>

        <div class="inviteActions hidden" id="inviteChoice">
          <button class="landingAction primaryChoice" id="inviteJoinButton" type="submit">ENTRAR</button>
        </div>

        <div class="privateReady hidden" id="privateReady">
          <div class="privateLinkRow">
            <div class="privateLink" id="privateLink"></div>
            <button id="copyPrivateButton" type="button">COPIAR</button>
          </div>
          <button class="enterPrivate" id="enterPrivateButton" type="submit">ENTRAR</button>
        </div>

        <button class="utilityGhost" id="joinAvatarButton" type="button" tabindex="-1" aria-hidden="true"><span id="joinAvatarPreview"><b>?</b></span></button>
        <input class="hiddenFile utilityGhost" id="joinAvatarFile" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
        <i class="landingRoomLabel" id="joinRoomLabel">PUBLICO</i>
        <span class="landingMode" id="landingMode"></span>
        <button class="joinSubmitGhost" id="joinButton" type="submit" tabindex="-1">ENTRAR</button>
        <div class="landingStatus" id="landingStatus"></div>
      </form>
    </div>
  </main>
</section>

<section class="shell hidden" id="appScreen">
  <main class="app">
    <header class="topbar">
      <div class="brand"><i class="liveDot"></i><b>WALKIE</b><span class="hidden">/ <i id="roomLabel">PUBLICO</i></span></div>
      <div class="topActions">
        <button class="shareButton" id="shareButton" type="button" title="Compartir">↗</button>
        <button class="peopleButton" id="peopleButton" type="button" title="Personas conectadas"><b id="onlineCount">1</b><small>ONLINE</small></button>
        <div class="themeWrap">
          <button class="iconButton" id="themeButton" type="button" title="Tema">◐</button>
          <div class="themePopover hidden" id="themePopover">
            <div class="themeKicker">TEMA · DOS COLORES</div>
            <div class="themeSwitch"><button id="themePrev" type="button">←</button><div class="themeSample"><i id="swatchA"></i><i id="swatchB"></i></div><button id="themeNext" type="button">→</button></div>
            <div class="themeName" id="themeName"></div>
          </div>
        </div>
        <button class="meButton" id="meButton" type="button" title="Perfil"><b>?</b></button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite"><div class="empty" id="emptyState"><b>Silencio por ahora.</b><span></span></div></section>
    <div class="draftBar" id="draftStatus" data-mode="idle"><span id="draftStatusText">LISTO</span><i class="progressRail" aria-hidden="true"></i></div>
    <form class="composer" id="composer">
      <button class="voiceButton" id="voiceButton" type="button">Voz</button>
      <input id="messageInput" maxlength="180" autocomplete="off" enterkeyhint="send" placeholder="Escribí un mensaje…">
      <button class="previewPrepared hidden" id="previewPrepared" type="button" title="Escuchar antes de enviar">▶</button>
      <button class="sendButton" id="sendButton" type="submit" aria-label="Enviar" disabled>ENVIAR</button>
    </form>
  </main>
</section>

<dialog class="sheet" id="voiceSheet"><div class="sheetHead"><div><b>VOCES</b><span>Una por persona mientras esté conectada</span></div><button class="closeButton" id="voiceClose" type="button">×</button></div><div class="voiceList" id="voiceList"></div></dialog>
<dialog class="sheet" id="profileSheet"><div class="sheetHead"><div><b>PERFIL</b><span>Nombre, foto e intro rápida</span></div><button class="closeButton" id="profileClose" type="button">×</button></div><form class="profileEditor" id="profileForm"><div class="profileAvatarWrap"><button class="avatarPick" id="profileAvatarButton" type="button"><span id="profileAvatarPreview"><b>?</b></span></button></div><input class="hiddenFile" id="profileAvatarFile" type="file" accept="image/*"><div class="field"><label for="profileName">NOMBRE</label><input id="profileName" maxlength="28" required></div><div class="field"><label for="profileIntro">INTRO RÁPIDA</label><input id="profileIntro" maxlength="36" placeholder="Juan dice"><div class="optional" id="introHint">Vacío = “Juan dice”.</div></div><button class="primary" type="submit">GUARDAR</button></form></dialog>
<dialog class="sheet" id="peopleSheet"><div class="sheetHead"><div><b>ONLINE</b><span>Quienes están acá ahora</span></div><button class="closeButton" id="peopleClose" type="button">×</button></div><div id="peopleList"></div></dialog>
<div class="toast hidden" id="toast"></div>
<script type="module" src="./bootstrap-v15.js?v=1"></script>
</body>
</html>
