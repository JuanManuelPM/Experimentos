<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Prometeo · Demo Runner V5</title><style>
:root{--ink:#11110f;--paper:#ecebe3;--white:#f8f7f1;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}#app{position:fixed;inset:0}#page{position:absolute;inset:0;width:100%;height:100%;border:0;background:#101010}#demo{position:fixed;left:14px;top:14px;z-index:1000;height:46px;padding:0 18px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);color:var(--ink);font:900 15px var(--mono);letter-spacing:.08em;box-shadow:4px 4px 0 rgba(0,0,0,.28)}#demo.running{background:var(--ink);color:var(--white)}#controls{position:fixed;left:14px;top:68px;z-index:1000;display:none;gap:8px}#controls.on{display:flex}.ctl{height:38px;min-width:50px;border:2px solid var(--ink);border-radius:13px;background:var(--paper);font:900 13px var(--mono)}#caption{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:1000;max-width:min(720px,70vw);padding:10px 15px;border:3px solid var(--ink);border-radius:17px;background:var(--paper);color:var(--ink);font:900 14px/1.25 var(--mono);text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.22);display:none}#caption.on{display:block}#cursor{position:fixed;left:0;top:0;width:58px;height:58px;z-index:1100;display:none;pointer-events:none;transition:transform .58s cubic-bezier(.22,.85,.28,1);transform:translate(-100px,-100px)}#cursor.on{display:block}#cursor .p{width:54px;height:54px;border:4px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--white);color:var(--ink);font:900 31px/1 var(--mono);box-shadow:7px 7px 0 rgba(0,0,0,.28)}#cursor.press .p{transform:scale(.82);background:var(--ink);color:var(--white)}#ring{position:fixed;width:68px;height:68px;border:4px solid var(--ink);border-radius:50%;z-index:1090;pointer-events:none;display:none;transform:translate(-50%,-50%)}#ring.on{display:block;animation:ring .42s ease-out 1}@keyframes ring{0%{opacity:.9;scale:.6}100%{opacity:0;scale:1.55}}@media(max-width:650px){#demo{left:8px;top:8px;height:40px;padding:0 13px;font-size:13px}#controls{left:8px;top:54px}#caption{top:8px;max-width:64vw;font-size:12px;padding:8px 11px}}
</style></head><body><div id="app"><iframe id="page" src="../visual-ui-v4/" title="Prometeo Visual UI"></iframe><button id="demo">DEMO</button><div id="controls"><button id="pause" class="ctl">Ⅱ</button><button id="speed" class="ctl">1×</button></div><div id="caption"></div><div id="cursor"><div class="p">➤</div></div><div id="ring"></div></div><script>
const frame=document.getElementById('page'),demoBtn=document.getElementById('demo'),controls=document.getElementById('controls'),pauseBtn=document.getElementById('pause'),speedBtn=document.getElementById('speed'),caption=document.getElementById('caption'),cursor=document.getElementById('cursor'),ring=document.getElementById('ring');
const D={running:false,paused:false,abort:false,speed:1,doc:null};
function child(){try{return frame.contentDocument}catch(e){return null}}function cap(t){caption.textContent=t;caption.classList.toggle('on',!!t)}function sleep(ms){return new Promise(async r=>{let left=ms;while(left>0&&!D.abort){if(D.paused){await new Promise(x=>setTimeout(x,70));continue}let d=Math.min(40,left);await new Promise(x=>setTimeout(x,d));left-=d*D.speed}r()})}async function waitFor(fn,ms=2600){let s=performance.now();while(!D.abort&&performance.now()-s<ms){if(!D.paused&&fn())return true;await new Promise(r=>setTimeout(r,45))}return false}
function target(name){const d=D.doc||child();if(!d)return null;const q={project:'[data-action="project"]',decision:'#panel [data-action="decision"]',later:'#dialog [data-action="closeDialog"]',menu:'[data-action="menu"]',work:'#menu .menuItem:nth-child(2)',back:'#menu [data-action="closeMenu"]',continue:'#panel [data-action="continue"]',close:'#panel [data-action="closePanel"]'};return d.querySelector(q[name])}
async function move(el,text){if(!el||D.abort)return false;cap(text);let fr=frame.getBoundingClientRect(),tr=el.getBoundingClientRect(),x=fr.left+tr.left+tr.width/2-29,y=fr.top+tr.top+tr.height/2-29;cursor.classList.add('on');cursor.style.transform=`translate(${x}px,${y}px)`;await sleep(700);return !D.abort}async function press(el){if(!el||D.abort)return;let r=el.getBoundingClientRect(),fr=frame.getBoundingClientRect();cursor.classList.add('press');ring.style.left=(fr.left+r.left+r.width/2)+'px';ring.style.top=(fr.top+r.top+r.height/2)+'px';ring.classList.remove('on');void ring.offsetWidth;ring.classList.add('on');await sleep(170);el.click();await sleep(130);cursor.classList.remove('press')}
async function step(name,text,after){let el=target(name);if(!el){cap('No encontré '+name);await sleep(500);return false}if(!await move(el,text))return false;await press(el);if(after)await waitFor(after);await sleep(500);return !D.abort}
function bindCancel(){let d=child();if(!d)return;d.addEventListener('pointerdown',e=>{if(D.running&&e.isTrusted)stop('Demo detenida por interacción')},true);d.addEventListener('keydown',e=>{if(D.running&&e.isTrusted)stop('Demo detenida por teclado')},true)}function finish(t='Demo completada'){D.running=false;D.paused=false;D.abort=false;demoBtn.textContent='DEMO';demoBtn.classList.remove('running');controls.classList.remove('on');pauseBtn.textContent='Ⅱ';cursor.classList.remove('on','press');ring.classList.remove('on');cap(t);setTimeout(()=>{if(!D.running)cap('')},1500)}function stop(t='Demo detenida'){if(!D.running)return;D.abort=true;setTimeout(()=>finish(t),60)}
async function run(){if(D.running){stop();return}D.running=true;D.abort=false;D.paused=false;demoBtn.textContent='STOP';demoBtn.classList.add('running');controls.classList.add('on');cap('Preparando demo…');frame.src='../visual-ui-v4/?demo='+Date.now();await new Promise(res=>frame.addEventListener('load',res,{once:true}));D.doc=child();bindCancel();await sleep(350);
if(!await step('project','1/8 · Abrimos el proyecto actual.',()=>D.doc.querySelector('#panel.on')))return finish();if(!await step('decision','2/8 · Pedimos una decisión sin abandonar la escena.',()=>D.doc.querySelector('#dialog.on')))return finish();if(!await step('later','3/8 · Cerramos el diálogo y volvemos al mundo.',()=>!D.doc.querySelector('#dialog.on')))return finish();if(!await step('menu','4/8 · Abrimos el menú general como pausa.',()=>D.doc.querySelector('#menu.on')))return finish();if(!await step('work','5/8 · Recorremos una opción real del menú.'))return finish();if(!await step('back','6/8 · Volvemos a la escena.',()=>!D.doc.querySelector('#menu.on')))return finish();if(!await step('project','7/8 · El mismo proyecto abre contexto en este tamaño de pantalla.',()=>D.doc.querySelector('#panel.on')))return finish();if(!await step('continue','8/8 · Ejecutamos una acción real.'))return finish();let c=target('close');if(c){await move(c,'Fin · Cerramos el contexto.');await press(c);await waitFor(()=>!D.doc.querySelector('#panel.on'));await sleep(350)}finish()}
demoBtn.addEventListener('click',run);pauseBtn.addEventListener('click',()=>{if(!D.running)return;D.paused=!D.paused;pauseBtn.textContent=D.paused?'▶':'Ⅱ';if(D.paused)cap('Demo pausada')});speedBtn.addEventListener('click',()=>{D.speed=D.speed===1?2:1;speedBtn.textContent=D.speed+'×'});frame.addEventListener('load',bindCancel);
</script></body></html>
