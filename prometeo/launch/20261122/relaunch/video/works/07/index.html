function frame(now){if(!playing)return;let dt=(now-started)/1000;sync(elapsed+dt);if(current>=D){pause();sync(D);return}requestAnimationFrame(frame)}
function pause(){playing=false;elapsed=current;stopAudio();document.getElementById('play').textContent='▶ Ver película'}
async function play(){if(playing){pause();return}if(current>=D){sync(0)}elapsed=current;await (audioCtx?.resume?.()||Promise.resolve());startAudio(current);started=performance.now();playing=true;document.getElementById('play').textContent='Ⅱ Pausar';document.getElementById('status').textContent='Reproduciendo película y música originales';requestAnimationFrame(frame)}
document.getElementById('play').onclick=play;document.getElementById('seek').oninput=e=>{let resume=playing;pause();sync(+e.target.value);if(resume)play()};
async function exportWebM(){let b=document.getElementById('export');if(!window.MediaRecorder||!canvas.captureStream){document.getElementById('status').textContent='Este navegador no admite exportación WebM';return}pause();sync(0);b.disabled=true;b.textContent='Renderizando…';let ac=audioCtx||(audioCtx=new AudioContext());await ac.resume();let audioDest=ac.createMediaStreamDestination();let v=canvas.captureStream(FPS),a=audioDest.stream;let rec=new MediaRecorder(new MediaStream([...v.getVideoTracks(),...a.getAudioTracks()]),{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise(resolve=>{rec.onstop=resolve});rec.start();let start=performance.now();startAudio(0,audioDest);await new Promise(resolve=>{const step=()=>{let t=(performance.now()-start)/1000;sync(t);if(t<D)requestAnimationFrame(step);else resolve()};step()});rec.stop();stopAudio();await done;v.getTracks().forEach(x=>x.stop());const blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='EL_RELEVO_W003_07.webm';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);b.disabled=false;b.textContent='Exportar WebM';document.getElementById('status').textContent='Archivo WebM exportado';sync(0)}
document.getElementById('export').onclick=()=>exportWebM().catch(e=>{document.getElementById('status').textContent='Exportación falló: '+e.message;document.getElementById('export').disabled=false});
window.PROMETEO_FILM={render,segments,soundtrack,duration:D,fps:FPS};sync(0);
