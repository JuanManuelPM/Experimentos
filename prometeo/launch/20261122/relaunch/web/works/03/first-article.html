<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARCHIVO ABIERTO · Primer artículo</title><style>*{box-sizing:border-box}body{margin:0;background:#ede9e0;color:#252522;font-family:Arial,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,29%)}.art{display:grid;place-items:center;min-height:100vh;padding:5vw;background:#d1d3c9}.art canvas{width:auto;max-width:100%;max-height:89vh;box-shadow:0 20px 45px #101c2733}.info{display:flex;flex-direction:column;padding:clamp(25px,4vw,65px);border-left:1px solid #b9b9b2}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase}.info h1{font-family:Georgia,serif;font-size:clamp(48px,5vw,90px);font-weight:400;line-height:.95;letter-spacing:-.06em;margin:auto 0 20px}.info p{line-height:1.55;max-width:300px}.info footer{margin-top:auto;padding-top:40px;color:#565650;font-size:12px}@media(max-width:710px){.layout{display:flex;flex-direction:column}.art{min-height:68vh;padding:25px}.art canvas{max-height:59vh}.info{border:0;min-height:32vh}.info h1{margin:22px 0}.info footer{padding-top:15px}}</style></head><body><main class="layout"><div class="art"><canvas id="art" aria-label="Cianotipo digital original de plantas imaginarias"></canvas></div><section class="info"><div class="eyebrow">NADIA AROCENA / ESTUDIO DE PRIMER ARTÍCULO / 01</div><h1>La noche<br>en las hojas.</h1><p>Un herbario de formas imposibles. Dibujado desde código, renderizado como imagen raster nativa, no una foto prestada.</p><footer>2026 · Botánica · Cianotipo digital · Imagen generada 1600 × 2064 píxeles</footer></section></main><script type="module">import{WORKS,renderArtwork}from"./art.js";const a=renderArtwork(document.getElementById("art"),WORKS[0],1600);document.documentElement.dataset.articleReady="true";document.documentElement.dataset.raster=a.width+"x"+a.height;</script></body></html>
