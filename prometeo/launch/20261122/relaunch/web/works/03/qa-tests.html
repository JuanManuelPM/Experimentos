<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivo Abierto · pruebas reales</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;background:#eeeae2;color:#252525}li{margin:.6em 0}li.pass{color:#135b39}li.fail{color:#972b24}canvas{max-width:120px;max-height:140px}iframe{width:390px;max-width:100%;height:200px;border:1px solid #aaa}</style></head><body><h1>Pruebas de ARCHIVO ABIERTO</h1><p>Se ejecutan en este navegador. Los resultados no son aprobación artística.</p><p id="summary">Ejecutando…</p><ol id="log"></ol><canvas id="sample"></canvas><iframe src="./index.html" title="Aplicación bajo prueba"></iframe>
<script type="module">
import {WORKS,renderArtwork} from "./art.js";
import {RasterZoomViewer} from "./viewer.js";
const log=document.getElementById("log"),summary=document.getElementById("summary");let passed=0,failed=0;
function check(desc,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS ":"FAIL ")+desc;log.append(li);if(ok)passed++;else failed++}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
check("Seis obras con ID único, título, origen y año",WORKS.length===6&&new Set(WORKS.map(w=>w.id)).size===6&&WORKS.every(w=>w.provenance&&w.title&&w.year));
check("Cuatro técnicas gráficas distintas",new Set(WORKS.map(w=>w.kind)).size===4);
const canvas=document.getElementById("sample"),info=renderArtwork(canvas,WORKS[0],1600);
check("Primer artículo: raster nativo 1600×2064",info.width===1600&&info.height===2064&&canvas.width===1600);
const ctx=canvas.getContext("2d"),a=ctx.getImageData(100,100,1,1).data,b=ctx.getImageData(800,700,1,1).data;
check("El raster contiene píxeles no transparentes y diferentes",a[3]===255&&b[3]===255&&(a[0]!==b[0]||a[1]!==b[1]||a[2]!==b[2]));
const stage=document.createElement("div");stage.style.width="300px";stage.style.height="400px";const img=document.createElement("img");stage.append(img);document.body.append(stage);const z=new RasterZoomViewer(stage,img);
z.setScale(3);check("Visor reusable escala a 300%",z.scale===3&&stage.dataset.zoom==="3.00");z.setScale(900);check("Zoom limitado a 500%",z.scale===5);z.reset();check("Reset devuelve 100%",z.scale===1&&z.x===0&&z.y===0);stage.remove();
const f=document.querySelector("iframe");await new Promise(resolve=>{if(f.contentDocument?.readyState==="complete")resolve();else f.addEventListener("load",resolve,{once:true})});await sleep(400);
const d=f.contentDocument;check("Aplicación inicializada y galería de seis obras",d.documentElement.dataset.ready==="true"&&d.querySelectorAll(".work").length===6);
const btn=[...d.querySelectorAll(".filter")].find(b=>b.textContent==="Botánica");btn?.click();check("Filtro Botánica muestra dos obras",d.querySelectorAll(".work").length===2&&d.querySelector("#count").textContent.startsWith("2 /"));
const input=d.querySelector("#search-input");input.value="sin-resultado-irrepetible";input.dispatchEvent(new Event("input",{bubbles:true}));check("Búsqueda sin resultados comunica vacío",d.querySelectorAll(".work").length===0&&!d.querySelector("#archive-empty").hidden);
d.querySelector("#clear-filters").click();check("Limpiar filtros restaura seis",d.querySelectorAll(".work").length===6);
d.querySelector(".art-link")?.click();await sleep(1500);
const dialog=d.querySelector("#detail");check("Visor abierto y ficha completa",dialog.open&&d.querySelector("#detail-title").textContent.length>5&&d.querySelector("#provenance").textContent.length>20);
check("Visor raster con resolución grande",d.querySelector("#resolution").textContent.includes("2600")||d.querySelector("#resolution").textContent.includes("2100"));
d.querySelector("#zoom-in").click();check("Botón + amplía imagen",d.querySelector("#zoom").textContent!=="100 %");d.querySelector("#close-detail").click();check("Cerrar permite volver al archivo",!dialog.open);
summary.textContent=passed+" PASS · "+failed+" FAIL · navegador "+navigator.userAgent;document.documentElement.dataset.qa=failed?"FAIL":"PASS";document.documentElement.dataset.counts=passed+"/"+failed;
</script></body></html>
