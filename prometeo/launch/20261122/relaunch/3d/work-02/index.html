const roomKeys=['sala','patio','comedor','estudio'];function roomChange(key){camera.go(key);document.querySelectorAll('#nav button').forEach(b=>{const yes=b.dataset.room===key;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});let i=roomKeys.indexOf(key);document.getElementById('section').textContent=String(i+1).padStart(2,'0')+' / 04';document.getElementById('room').textContent=PRESETS[key].name;document.getElementById('detail').textContent=PRESETS[key].detail}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>roomChange(b.dataset.room)));
document.getElementById('lighting').addEventListener('click',()=>{targetDay=targetDay>.5?0:1;const isNight=targetDay<.5;document.getElementById('lightlabel').textContent=isNight?'Luz artificial':'Luz natural';document.getElementById('lighting').setAttribute('aria-pressed',String(isNight))});
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag[0],dy=e.clientY-drag[1];camera.turn(-dx*.0042,dy*.003);drag=[e.clientX,e.clientY]});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.move(e.deltaY>0?-1:1,0,.25)},{passive:false});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key)){keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()}if('1234'.includes(e.key)&&e.key.length===1)roomChange(roomKeys[+e.key-1])});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let dragTouch=0;canvas.addEventListener('touchstart',e=>{dragTouch=e.touches.length},{passive:true});canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){camera.move(1,0,.016)}},{passive:true});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(t){const dt=Math.min(.055,(t-last)/1000||.016);last=t;day+=(targetDay-day)*Math.min(1,dt*(still?20:2.4));if(keys.size)camera.move((keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0),(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dt);camera.tick(dt);const cam={pos:camera.pos,target:camera.target()};const hidden=resolveOcclusion(cam.pos,cam.target,objects,canvas.clientWidth);try{drawStats=engine.draw(objects,cam,day,hidden);state.textContent=JSON.stringify({renderer:'WEBGL2',frame:engine.frame,room:camera.scene,day:day.toFixed(2),occluded:[...hidden],size:[drawStats.width,drawStats.height],objects:objects.length,glError:drawStats.glError});}catch(e){errors.push(e.message);status.classList.add('show');status.textContent='Falló el render: '+e.message;return}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.__CASA_QA__={getState:()=>({room:camera.scene,pos:[...camera.pos],frame:engine.frame,day,glError:drawStats?.glError,hidden:resolveOcclusion(camera.pos,camera.target(),objects,canvas.clientWidth).size,meshCount:objects.length}),go:roomChange,snap:(key)=>{roomChange(key);for(let i=0;i<1200&&camera.moving;i++)camera.tick(.016)},light:(v)=>{targetDay=v?1:0},lightInstant:(v)=>{day=targetDay=v?1:0;document.getElementById('lightlabel').textContent=v?'Luz natural':'Luz artificial';document.getElementById('lighting').setAttribute('aria-pressed',String(!v))},rooms:roomKeys,dimensions:architecturalScene.dimensions};
</script></body></html>
