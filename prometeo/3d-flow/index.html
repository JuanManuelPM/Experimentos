<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e0d"><meta name="description" content="Ruta visual del flujo de producción 3D de PROMETEO, con nodos, errores y versiones comprobables.">
<title>PROMETEO · Flujo 3D</title>
<link rel="stylesheet" href="./style.css?v=2.1.0"><script defer src="./app.js?v=2.1.0"></script>
</head>
<body>
<header class="topbar">
 <a class="back" href="../estudios/3d/" title="Estudio 3D" aria-label="Volver al Estudio 3D">‹</a>
 <div class="identity"><span class="mark">PROMETEO</span><span class="slash">/</span><strong>FLUJO</strong></div>
 <div class="top-actions"><span id="flow-version">v1.1.0</span><button id="top-more" aria-label="Más opciones" aria-expanded="false">···</button></div>
</header>
<nav class="tabs" aria-label="Vistas del flujo">
 <button data-view="route" class="active" aria-selected="true">Ruta</button>
 <button data-view="issues" aria-selected="false">Errores <i id="issue-badge" hidden></i></button>
 <button data-view="map" aria-selected="false">Mapa</button>
 <button data-view="versions" aria-selected="false">Versiones</button>
</nav>
<main id="main">
 <section class="view active" data-screen="route" aria-label="Ruta del flujo">
  <div class="route-head"><h1 id="route-title">Ruta de producción</h1><button id="route-reset" class="quiet" type="button" title="Ver ruta universal">Universal ↗</button></div>
  <div id="route" class="route" aria-label="Etapas de la producción 3D"></div>
 </section>
 <section class="view" data-screen="issues" aria-label="Errores históricos">
  <div class="issues-head"><h1 id="issues-title">Errores</h1><select id="project-select" aria-label="Elegir creación"></select></div>
  <div id="issues-list" class="issue-list"></div>
 </section>
 <section class="view map-screen" data-screen="map" aria-label="Mapa detallado">
  <div class="map-toolbar">
    <div id="stage-strip" class="stage-strip" aria-label="Etapas del mapa"></div>
    <div class="map-actions"><button id="map-reset" title="Centrar" aria-label="Centrar mapa">⌗</button><button id="map-search-button" title="Buscar nodo" aria-label="Buscar nodo">⌕</button></div>
  </div>
  <div id="map-search-panel" class="map-search" hidden><input id="map-search" placeholder="ID o nodo" aria-label="Buscar nodo" autocomplete="off"/><div id="search-results"></div></div>
  <div id="graph-viewport" class="graph-viewport" tabindex="0" aria-label="Diagrama interactivo; arrastrar y pellizcar para navegar">
   <svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama del proceso" preserveAspectRatio="xMidYMid meet"></svg>
   <button id="map-fit" aria-label="Ajustar encuadre" title="Ajustar encuadre">⛶</button>
  </div>
 </section>
 <section class="view" data-screen="versions" aria-label="Historial de versiones">
   <div class="route-head"><h1>Versiones</h1></div><div id="versions-list" class="version-list"></div>
 </section>
</main>
<div id="more-popover" class="popover" hidden>
 <a href="./FLOW_3D_MASTER.md" target="_blank" rel="noopener">Documentación ↗</a>
 <a href="../project-explorer/">Creaciones ↗</a>
 <a href="../forja/">FORJA ↗</a>
</div>
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Detalles del flujo" aria-hidden="true">
 <header class="sheet-head"><span id="sheet-kicker"></span><button id="sheet-close" aria-label="Cerrar detalle">×</button></header>
 <h2 id="sheet-title"></h2>
 <div id="sheet-content" class="sheet-content"></div>
</aside>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
