<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAMPO 05 · World Studio</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1720;color:#eef6f6;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.panel{background:#0b1720e8;border:1px solid #52737e;padding:12px;border-radius:9px;min-width:0;max-width:100%}h1{font-size:clamp(16px,3.8vw,28px);margin:0;letter-spacing:.14em}p{margin:4px 0;color:#c1d3d8}#status{color:#9de4d9;overflow-wrap:anywhere}#metrics{font-variant-numeric:tabular-nums;font-size:13px}#detail{max-width:360px;font-size:12px;line-height:1.4;color:#c3d9df}.map{display:grid;grid-template-columns:repeat(5,13px);gap:3px}.map span{width:13px;height:13px;border:1px solid #678995;background:#142530}.map span[data-state=ready]{background:#78b9af}.map span[data-state=current]{background:#fff}.map span[data-state=loading]{background:#dca862}.map span[data-state=visited]{background:#3c6474}.legend{font-size:11px;margin-top:7px;max-width:95px}#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;color:#e3ffff;font-size:22px}#controls{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:16px;display:grid;grid-template-columns:repeat(3,58px);gap:6px}button{border:1px solid #8fb4ba;background:#142c38e8;color:#fff;border-radius:9px;min-height:54px;min-width:54px;font:600 20px system-ui;touch-action:none}button.held,button:active{background:#457b83}button:focus-visible{outline:3px solid #fff}#reset{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));right:16px;font-size:14px;padding:0 16px}#instructions{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:#d9e6ec;white-space:nowrap;pointer-events:none}#fatal{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:20px;background:#0b1720;z-index:5}#fatal[hidden]{display:none}#fatal p{max-width:500px;overflow-wrap:anywhere}@media(max-width:480px){#hud{left:8px;right:8px;gap:6px}.panel{padding:8px}#detail{font-size:11px;max-width:230px}#metrics{font-size:12px}#controls{left:10px;grid-template-columns:repeat(3,50px)}button{min-width:48px;min-height:48px}#reset{right:10px}#instructions{display:none}}@media(max-height:420px){#detail,.legend{display:none}#controls{grid-template-columns:repeat(3,44px);bottom:8px}button{min-width:44px;min-height:42px}#reset{bottom:8px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body>
<canvas id="canvas" aria-label="Mundo tridimensional, arrastrá para mirar"></canvas>
<div id="hud"><section class="panel"><h1>CAMPO / 05</h1><p>WORLD STUDIO · STREAMING</p><p id="status" role="status">Preparando sectores…</p><p id="metrics">—</p><p id="detail"></p></section><section class="panel"><div id="map" class="map" aria-label="Mapa de los 25 sectores"></div><div class="legend">Blanco: actual<br>Verde: listo<br>Ámbar: carga<br>Azul: visitado</div></section></div>
<div id="cross">+</div><div id="controls" aria-label="Movimiento"><span></span><button data-key="w" aria-label="Avanzar">▲</button><span></span><button data-key="a" aria-label="Izquierda">◀</button><button data-key="s" aria-label="Retroceder">▼</button><button data-key="d" aria-label="Derecha">▶</button></div><button id="reset">REINICIAR</button><div id="instructions">WASD / flechas · arrastrá para mirar · Quaternius CC0</div>
<div id="fatal"><div><h1>CAMPO / 05</h1><p id="fatal-message">Cargando Three.js y el manifest…</p><button onclick="location.reload()">REINTENTAR</button></div></div>
<script type="module">
const $=id=>document.getElementById(id);
try{
 const response=await fetch('./scene.json');if(!response.ok)throw Error('Manifest HTTP '+response.status);const m=await response.json();
 const {mountWorld}=await import('./viewer.mjs');const cells=new Map();for(const s of [...m.sectors].sort((a,b)=>a.coord[1]-b.coord[1]||a.coord[0]-b.coord[0])){let cell=document.createElement('span');cell.title=s.coord.join(',');cell.dataset.state='idle';$('map').append(cell);cells.set(s.coord.join(','),cell)}
 window.worldStudio=mountWorld(m,{canvas:$('canvas'),controls:document.querySelectorAll('[data-key]'),reset:$('reset'),status:$('status'),metrics:$('metrics'),detail:$('detail'),cells});$('fatal').hidden=true;
}catch(e){$('fatal-message').textContent='No se pudo iniciar: '+e.message;console.error(e)}
</script></body></html>
