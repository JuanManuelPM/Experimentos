<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PROMETEO · Quaternius</title>
<style>body{margin:0;background:#171717;color:#eee;font:15px system-ui;height:100dvh;display:grid;grid-template-columns:minmax(245px,320px) 1fr;overflow:hidden}aside{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px;border-right:1px solid #555}h1{font-size:17px;margin:0}small,#status{color:#b5b5b5}select,input,button,a{font:inherit}select,input,button{background:#292929;color:#fff;border:1px solid #666;border-radius:6px;padding:10px;min-width:0}select{width:100%}button{cursor:pointer}a{color:#c7dcff}#list{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1}#list button{text-align:left;overflow-wrap:anywhere}#list button.active{background:#555}main{position:relative;min-width:0;min-height:0}canvas{display:block;touch-action:none}#overlay{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}#overlay>*{pointer-events:auto;background:#171717d9;padding:8px;border-radius:6px}#clips{max-width:240px;width:auto}#notice{position:absolute;bottom:12px;left:12px;right:12px;background:#171717dc;padding:8px;pointer-events:none;overflow-wrap:anywhere}#notice:empty{display:none}@media(max-width:650px){body{grid-template-columns:1fr;grid-template-rows:40% 60%}aside{border-right:0;border-bottom:1px solid #555}h1{font-size:15px}#overlay{top:6px;left:6px;right:6px}#overlay>*{font-size:12px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body><aside><h1>QUATERNIUS · BIBLIOTECA 3D</h1><small id="totals">Cargando catálogo…</small><select id="pack"></select><input id="search" placeholder="Buscar modelo"><div id="list"></div><a href="https://github.com/JuanManuelPM/Experimentos/tree/prometeo/assets-quaternius/prometeo-assets/packs">Archivos en GitHub</a></aside><main id="view"><div id="overlay"><select id="clips" hidden></select><button id="rotate">Girar</button><a id="asset" target="_blank" rel="noopener" hidden>Archivo</a></div><div id="notice"></div></main>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const $=id=>document.getElementById(id),base='https://raw.githubusercontent.com/JuanManuelPM/Experimentos/prometeo/assets-quaternius/prometeo-assets/',url=p=>base+p.split('/').map(encodeURIComponent).join('/');
const scene=new T.Scene();scene.background=new T.Color(0x252525);const cam=new T.PerspectiveCamera(42,1,.001,10000);cam.position.set(3,2,4);const view=$('view'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.prepend(renderer.domElement);const controls=new OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.autoRotateSpeed=.8;scene.add(new T.HemisphereLight(0xffffff,0x676767,2.3));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);const grid=new T.GridHelper(10,20,0x666666,0x444444);scene.add(grid);
new ResizeObserver(()=>{const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(view);
let active=null,mixer=null,animations=[],selected=null,request=0,action=null,clock=new T.Clock();function dispose(o){o.traverse(x=>{x.geometry?.dispose();for(const m of (Array.isArray(x.material)?x.material:[x.material]))if(m){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose()}})}
function fit(o){const b=new T.Box3().setFromObject(o);if(b.isEmpty())return;const c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()),r=Math.max(s.x,s.y,s.z,.01),d=r*2.25/Math.min(1,cam.aspect);controls.target.copy(c);cam.position.copy(c).add(new T.Vector3(.85,.55,1).normalize().multiplyScalar(d));cam.near=Math.max(.0001,r/1000);cam.far=r*100;cam.updateProjectionMatrix();grid.position.set(c.x,b.min.y-.001,c.z);grid.scale.setScalar(r/5);controls.update()}
async function load(pack,file,button){const seq=++request,src=url(pack.folder+'/'+file.path);$('notice').textContent='Cargando '+file.path.split('/').pop()+'…';$('asset').href=src;$('asset').hidden=false;$('clips').hidden=true;let ext=file.path.split('.').pop().toLowerCase();try{let a=ext==='fbx'?await new FBXLoader().loadAsync(src):ext==='obj'?await new OBJLoader().loadAsync(src):await new GLTFLoader().loadAsync(src),o=a.scene||a;if(seq!==request){dispose(o);return}if(active){mixer?.stopAllAction();scene.remove(active);dispose(active)}active=o;scene.add(o);fit(o);animations=a.animations||o.animations||[];mixer=new T.AnimationMixer(o);const c=$('clips');c.replaceChildren(new Option('Sin animación','-1'));animations.forEach((x,i)=>c.add(new Option(x.name||'Clip '+(i+1),i)));c.hidden=!animations.length;if(animations.length){c.value='0';action=mixer.clipAction(animations[0]);action.play()}$('notice').textContent=file.path.split('/').pop()+' · '+animations.length+' animaciones';document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('active',b===button));}catch(e){if(seq===request)$('notice').textContent='No se pudo cargar este archivo: '+e.message}}
$('clips').onchange=()=>{action?.stop();let i=Number($('clips').value);if(i>=0){action=mixer.clipAction(animations[i]);action.reset().play()}};$('rotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('rotate').textContent=controls.autoRotate?'Detener giro':'Girar'};renderer.setAnimationLoop(()=>{mixer?.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,cam)});
try{const resp=await fetch(base+'catalog.json',{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const data=await resp.json();const packs=data.results.filter(x=>x.status==='IMPORTED');$('totals').textContent=data.imported+'/'+data.requested+' packs · '+data.models+' modelos · CC0';const p=$('pack');packs.forEach(x=>p.add(new Option(x.name+' ('+x.models+')',x.id)));function list(){selected=packs.find(x=>String(x.id)===p.value);const q=$('search').value.toLowerCase(),list=$('list');list.replaceChildren();if(!selected)return;for(const f of selected.files.filter(f=>f.path.toLowerCase().includes(q))){const b=document.createElement('button');b.textContent=f.path.split('/').pop();b.title=f.path;b.onclick=()=>load(selected,f,b);list.append(b)}}p.onchange=list;$('search').oninput=list;list()}catch(e){$('totals').textContent='Catálogo no disponible: '+e.message}
</script></body></html>
