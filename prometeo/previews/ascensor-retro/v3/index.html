<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1119">
<title>ASCENSOR RETRO · V3 · Tres mundos</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1119;color:#f3dec4;font-family:system-ui,-apple-system,Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}#stage,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#stage canvas{touch-action:none}
#head{position:fixed;left:clamp(14px,3vw,38px);top:calc(15px + env(safe-area-inset-top));z-index:2;pointer-events:none}#head strong{font:600 clamp(13px,1.5vw,17px) Georgia,serif;letter-spacing:.19em}#head small{display:block;font-size:10px;letter-spacing:.26em;color:#d4b893;margin-top:5px}#phase{position:fixed;left:clamp(14px,3vw,38px);top:69px;font-size:10px;letter-spacing:.18em;color:#d9b78b;z-index:2;pointer-events:none}
#toolbar{position:fixed;z-index:3;top:16px;right:clamp(12px,2vw,25px);display:flex;gap:6px}#toolbar button,#floors button,#bottom button{border:1px solid #a58a633e;background:#121922b9;border-radius:3px;backdrop-filter:blur(10px)}#toolbar button{padding:10px 13px;font-size:10px;letter-spacing:.09em;min-height:38px}button:hover,.active{border-color:#d5b784!important;background:#7356365c!important}
#floors{position:fixed;right:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3}
#floors button{width:42px;height:44px;font-family:Georgia,serif;font-size:17px}
#bottom{position:fixed;left:clamp(12px,2vw,25px);right:clamp(12px,2vw,25px);bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;z-index:3}#bottom button{height:44px;min-width:44px;font-size:18px}
#timeline{appearance:none;-webkit-appearance:none;flex:1;width:0;height:3px;background:linear-gradient(to right,#e8c389 var(--progress,0%),#ffffff50 var(--progress,0%));outline:0}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ead1ab;border-radius:100%;border:3px solid #30231c}
#clock{min-width:39px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.09em}#asset{font-size:9px;letter-spacing:.05em;color:#c7b89b}
#gate{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:radial-gradient(ellipse at center,#0b19285c,#070b11a0);transition:opacity .6s}#gate.hide{opacity:0;pointer-events:none}#start{height:78px;width:78px;background:#1c2025bd;border:1px solid #d1ae79;border-radius:50%;box-shadow:0 0 70px #dba35a23;font-size:27px;padding-left:4px}
#fault{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#0b1119;color:#f3dac1;padding:30px;text-align:center}#fault .plane{width:min(380px,90vw)}#fault strong{font:21px Georgia,serif}#fault p{color:#d4b893;line-height:1.6;font-size:13px}#fault small{color:#9b9489}#fault .cutaway{margin:25px auto;width:60px;height:150px;border:1px solid #897957;position:relative}#fault .cutaway:before{content:"";position:absolute;left:6px;right:6px;top:26px;height:55px;border:2px solid #dcb68c}#fault .cutaway:after{content:"";position:absolute;left:11px;right:11px;bottom:16px;height:1px;background:#dcb68c}
@media(max-width:720px){#head strong{font-size:12px}#head small,#phase{font-size:8px}#toolbar{top:10px}#toolbar button{font-size:9px;padding:8px;min-height:34px}#floors button{width:36px;height:40px}#bottom{gap:7px}#bottom button{height:38px;min-width:38px}#asset{display:none}}@media(max-height:420px){#head{top:10px}#phase{top:45px}#floors{right:8px}#floors button{height:32px;width:34px}#bottom{bottom:7px}#bottom button{height:35px}#toolbar button{min-height:31px}}
/* V3 clean presentation: optional controls tucked behind one accessible menu. */
#head,#phase,#asset,#gate{display:none}#tools{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));right:12px}#tools summary{list-style:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid #aa956744;background:#111b25bd;color:#f3dec4;font-size:22px;cursor:pointer}#tools summary::-webkit-details-marker{display:none}
#tools[open] .menu{display:grid;gap:7px;padding:12px;background:#121a22ed;border:1px solid #a58a6355;position:absolute;right:0;top:49px;min-width:175px}
#toolbar,#floors{position:static;display:flex;flex-direction:column;transform:none;gap:6px}#floors{flex-direction:row}#toolbar button,#floors button{min-height:44px;min-width:44px}#bottom{left:12px;right:12px;bottom:max(8px,env(safe-area-inset-bottom));gap:9px}#bottom button{width:44px;height:44px;min-width:44px}#timeline{height:3px}#timeline::-webkit-slider-thumb{width:22px;height:22px}#clock{font-size:11px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<div id="stage"></div>
<div id="head"><strong>ASCENSOR RETRO</strong><small>UN EDIFICIO · TRES REALIDADES</small></div><div id="phase">VESTÍBULO</div>
<details id="tools"><summary aria-label="Controles de la escena">☰</summary><div class="menu"><div id="toolbar"><button id="mode" aria-label="Alternar cine y cámara libre">EXPLORAR</button><button id="building" aria-label="Ver edificio 3D entero">EDIFICIO</button></div>
<div id="floors"><button data-floor="0" aria-label="Primer mundo">Ⅰ</button><button data-floor="1" aria-label="Segundo mundo">Ⅱ</button><button data-floor="2" aria-label="Tercer mundo">Ⅲ</button></div></div></details>
<div id="bottom"><button id="play" aria-label="Reproducir o pausar">▷</button><input id="timeline" type="range" min="0" max="58" step=".01" value="0" aria-label="Tiempo de la escena"><span id="clock">00:00</span><button id="sound" aria-label="Silenciar sonido">♫</button><span id="asset">GLB …</span></div>
<div id="gate"><button id="start" aria-label="Comenzar recorrido">▷</button></div>
<div id="fault" role="alert"><div class="plane"><strong>La escena 3D no se pudo iniciar</strong><div class="cutaway"></div><p id="faultmessage">Revisá la conexión y abrí en un navegador con WebGL2.</p><small>Esta vista es un esquema 2D de error, no el render del edificio.</small></div></div>
<script>
(function(){let failed=false;
 function fault(code,message){if(failed)return;failed=true;const area=document.querySelector('#fault');
 document.querySelector('#faultmessage').textContent=code+': '+message;
 area.style.display='grid';window.__bootError={code,message};}
 window.addEventListener('error',e=>{if(e.target?.tagName==='SCRIPT')fault('MODULE_IMPORT','Error de módulo de la escena o de red.');
 else fault(e.message?.includes('WEBGL_CONTEXT')?'WEBGL_CONTEXT':'RUNTIME',e.message||'Error de ejecución.');},true);
 window.addEventListener('unhandledrejection',e=>fault('ASSET_LOAD / RUNTIME',String(e.reason?.message||e.reason||'Carga interrumpida')));
 window.__showSceneError=fault;
})();
</script>
<script type="module" src="./app.mjs"></script>
</body></html>
