<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12"><title>ASCENSOR · viaje entre realidades</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#d9cba8;font-family:system-ui,-apple-system,Arial,sans-serif}canvas{display:block;width:100%;height:100%}button{cursor:pointer;color:inherit;touch-action:manipulation}
#gate{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 45%,#1720278a,#04070aba);z-index:4;transition:opacity .6s}
#gate.hide{opacity:0;pointer-events:none}#go{width:84px;height:84px;border-radius:50%;border:1px solid #b5a17b;background:rgba(22,19,17,.65);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px #a8793728}
#go svg{width:24px;fill:#e6d0a2;transform:translateX(2px)}#controls{position:fixed;left:20px;right:20px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:16px;z-index:3;opacity:0;transition:opacity .55s}
#controls.visible{opacity:1}#controls button{width:44px;height:44px;flex:none;background:rgba(12,15,20,.64);border:1px solid #82735288;border-radius:99px;display:flex;justify-content:center;align-items:center;font-size:18px}
#timeline{appearance:none;-webkit-appearance:none;flex:1;min-width:30px;height:3px;background:linear-gradient(90deg,#d4b276 var(--progress,0%),#ffffff38 var(--progress,0%));border-radius:5px;outline:none;touch-action:pan-x}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#dcbf8e;border:3px solid #201a17}
#clock{font-size:11px;letter-spacing:.11em;font-variant-numeric:tabular-nums;color:#bcab90;min-width:46px;text-align:right}
#fault{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#080b11;color:#d5b38a;font-size:15px;line-height:1.6;z-index:7}
@media(max-width:560px){#controls{left:10px;right:10px;gap:11px}#controls button{width:42px;height:42px}#go{width:76px;height:76px}}
</style></head><body>
<div id="gate"><button id="go" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M6 3 L21 12 L6 21 Z"/></svg></button></div>
<div id="controls"><button id="toggle" aria-label="Pausar o reproducir">Ⅱ</button><input id="timeline" aria-label="Tiempo" type="range" min="0" max="22.7" step=".01" value="0"><span id="clock">00:00</span><button id="sound" aria-label="Silenciar">♪</button></div>
<div id="fault"></div>
<script>
(function(){
 const show=()=>{const f=document.getElementById('fault');if(!f)return;
 f.textContent='No se pudo iniciar WebGL o cargar los módulos 3D. Abrí esta página con Chrome actualizado y conexión a internet.';
 f.style.display='flex';
 };
 window.addEventListener('error',e=>{if(e?.message||e?.target?.tagName==='SCRIPT')show()},true);
 window.addEventListener('unhandledrejection',show);
})();
</script>
<script type="module" src="./app.mjs"></script>
</body></html>
