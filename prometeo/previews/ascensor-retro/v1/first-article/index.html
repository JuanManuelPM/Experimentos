<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1119"><title>ASCENSOR · Primer artículo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080d13;overflow:hidden;height:100%;font-family:Arial,sans-serif;color:#e6cf9c}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:9px;background:rgba(10,13,18,.78);padding:8px 10px;border:1px solid #6b573a;border-radius:40px;z-index:3}
button{background:transparent;border:1px solid #68583f;color:#dac28f;min-width:56px;padding:10px 14px;border-radius:30px;font-size:13px}
button.active{background:#bd975d;color:#171715}
#err{position:fixed;inset:25%;display:none;align-items:center;justify-content:center;background:#080d13;color:#f1a99a;text-align:center}
</style></head>
<body><div id="hud"><button data-open="0" class="active">0%</button><button data-open="0.5">50%</button><button data-open="1">100%</button></div><div id="err"></div>
<script type="module" src="./app.mjs"></script></body></html>
