<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c16"><title>Respawn Desk V4 · PROMETEO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b13;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#bar{position:fixed;left:22px;right:22px;bottom:calc(15px + env(safe-area-inset-bottom));height:44px;background:transparent;cursor:pointer;z-index:3;touch-action:none;display:flex;align-items:flex-end;padding-bottom:9px}#bar::before{content:'';position:absolute;left:0;right:0;bottom:9px;height:2px;background:#ffffff3d;pointer-events:none}#fill{height:2px;position:relative;width:0;background:#e6e3d3;box-shadow:0 0 8px #d3e8fd}#play{position:fixed;left:24px;bottom:calc(57px + env(safe-area-inset-bottom));border:0;border-radius:99px;background:#0007;color:#fff;font-size:22px;width:46px;height:46px;cursor:pointer;backdrop-filter:blur(8px);z-index:3}#replay{position:fixed;right:24px;bottom:calc(57px + env(safe-area-inset-bottom));border:0;border-radius:99px;background:#0007;color:#fff;font-size:23px;width:46px;height:46px;cursor:pointer;backdrop-filter:blur(8px);z-index:3}#fail{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#eee;font-size:14px;text-align:center;background:#080b14}#pulse{position:fixed;inset:0;pointer-events:none;opacity:0;background:#d1efff;z-index:2}button:focus-visible{outline:2px solid #fff}
</style></head><body><canvas id="stage" aria-label="Escena tridimensional cinematográfica reproducible"></canvas><div id="pulse"></div><button id="play" aria-label="Pausar">Ⅱ</button><button id="replay" aria-label="Repetir">↻</button><div id="bar" role="slider" aria-label="Progreso" tabindex="0" aria-valuemin="0" aria-valuemax="36" aria-valuenow="0"><div id="fill"></div></div><div id="fail">Este dispositivo no pudo iniciar el visor 3D.</div><script>addEventListener('error',e=>{const f=document.getElementById('fail');f.textContent='Error de escena: '+(e.message||'carga interrumpida');f.style.display='flex';f.style.zIndex='9'});addEventListener('unhandledrejection',e=>{const f=document.getElementById('fail');f.textContent='No se pudo cargar: '+String(e.reason||'error');f.style.display='flex';f.style.zIndex='9'});</script><script type="module" src="./scene.mjs"></script></body></html>
