<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080f16"><title>NOCTURNA · Estación bajo tormenta</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080f16}canvas{display:block;width:100%;height:100%;touch-action:none}button{position:fixed;bottom:20px;right:20px;display:grid;place-items:center;width:48px;height:48px;border:1px solid #aebdba77;background:#10171a99;color:#d7eee2;border-radius:50%;font-size:20px;cursor:pointer;backdrop-filter:blur(10px)}button:focus-visible{outline:2px solid white}#error{display:none;position:absolute;inset:0;place-items:center;color:#d7e4e3;font:15px system-ui;text-align:center;padding:25px}</style></head><body><canvas id="scene" aria-label="Surtidor de estación de servicio bajo lluvia nocturna"></canvas><button id="play" aria-label="Pausar o reproducir">Ⅱ</button><div id="error" role="status">No se pudo iniciar WebGL2.</div>
<script type="module">
try{
  const url=new URL(location.href);url.searchParams.set('article','1');history.replaceState(null,'',url.href);
  if(typeof DecompressionStream==='undefined')throw Error('Gzip streams unsupported');
  const response=await fetch('./scene.mjs.gz',{cache:'no-store'});
  if(!response.ok)throw Error('Source '+response.status);
  const decompressed=new Response(response.body.pipeThrough(new DecompressionStream('gzip')));
  const source=await decompressed.text();
  const moduleURL=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  try{await import(moduleURL)}finally{URL.revokeObjectURL(moduleURL)}
}catch(e){console.error('NOCTURNA SOURCE_ONLY error',e);document.querySelector('#error').style.display='grid'}
</script></body></html>
