<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae9e4"><title>Ventilador · V2 · PROMETEO</title>
<style>
:root{color-scheme:light;--ink:#263b3f;--line:rgba(32,60,63,.17);--paper:rgba(246,247,243,.82);--blue:#2a7775}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eae9e4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#stage:active{cursor:grabbing}
#top{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;align-items:center;pointer-events:none}#top .stamp{font-size:10px;letter-spacing:.22em;font-weight:700;opacity:.63}#right{position:fixed;right:clamp(16px,3vw,42px);top:clamp(50px,9vh,92px);display:flex;flex-direction:column;gap:10px}
button{cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--paper);backdrop-filter:blur(18px);border-radius:999px;min-height:44px;font:600 12px/1.1 inherit;transition:background .2s,border-color .2s,transform .2s;touch-action:manipulation}button:active{transform:scale(.96)}button.active{background:#315c5d;color:#fff;border-color:#315c5d}button:focus-visible{outline:3px solid #28aba0;outline-offset:2px}
#right button{width:46px;height:46px;font-size:20px;font-family:system-ui}#bottom{position:fixed;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:5px;border:1px solid rgba(48,66,67,.12);background:rgba(249,249,246,.90);backdrop-filter:blur(20px);border-radius:999px;box-shadow:0 9px 30px rgba(30,52,53,.08);white-space:nowrap}
#bottom button{min-width:76px;min-height:44px;border:0;background:transparent;font-size:11px;padding:0 13px}#bottom button.active{background:#285e60;color:white}#bottom button span{margin-right:7px;font-variant-numeric:tabular-nums;opacity:.66}
#card{position:fixed;bottom:clamp(92px,15vh,140px);left:clamp(18px,4vw,62px);max-width:295px;pointer-events:none;transition:opacity .2s}#card small{font-size:10px;letter-spacing:.2em;opacity:.50;font-weight:700}#card h1{margin:6px 0 7px;font-size:clamp(19px,2.2vw,28px);letter-spacing:-.055em;font-weight:650;line-height:1.07}#card p{font-size:13px;line-height:1.44;color:#5c6a69;margin:0}#card.hidden{opacity:0}#card .hint{font-size:11px;color:#456f6b;letter-spacing:.04em}
#parts{position:fixed;left:clamp(18px,4vw,62px);top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto;scrollbar-width:none}#parts.open{display:flex}#parts button{text-align:left;background:transparent;border:0;min-height:31px;padding:4px 10px;letter-spacing:.015em;color:#60706d;font-size:11px;font-weight:600}#parts button.active{background:#315c5d;color:white}
#assembly{position:fixed;right:clamp(18px,4vw,60px);bottom:clamp(100px,17vh,155px);display:none;gap:7px;align-items:center}#assembly.open{display:flex}#assembly button{padding:0 16px}#counter{font-size:12px;opacity:.55;font-variant-numeric:tabular-nums;padding:0 8px}
#note{position:fixed;right:20px;bottom:90px;color:#697a77;font-size:10px;text-align:right;opacity:.65;pointer-events:none}
#error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;background:#eae9e4;color:#7d3232}
@media(max-width:680px){#top{top:14px}#bottom{bottom:14px}#bottom button{min-width:0;padding:0 8px;font-size:10px;min-height:43px}#bottom button span{display:none}#card{bottom:82px;left:18px;max-width:210px}#card h1{font-size:19px}#card p{font-size:11px}#right{top:48px;right:12px;gap:6px}#right button{width:39px;height:39px}#parts{top:47%;left:5px;max-height:38vh}#parts button{font-size:10px;max-width:114px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#assembly{right:12px;bottom:89px;gap:3px}#assembly button{min-height:36px;padding:0 9px}#counter{font-size:10px;padding:0 3px}#note{display:none}}
@media(max-height:430px){#card{bottom:82px;left:14px;max-width:235px}#card p{display:none}#parts{top:53%;max-height:54vh;max-width:122px}#top{top:9px}#right{top:38px}#bottom{bottom:8px}#assembly{bottom:71px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="stage" aria-label="Escena tridimensional interactiva de un ventilador de mesa"></canvas>
<div id="top"><div class="stamp">VENTILADOR / 002</div></div>
<div id="right"><button id="isolate" title="Aislar pieza" aria-label="Aislar pieza">◎</button><button id="reset" title="Restablecer cámara" aria-label="Restablecer cámara">↺</button></div>
<div id="parts" aria-label="Partes del ventilador"></div>
<div id="card" class="hidden" aria-live="polite"><small id="countLabel">01 / 09</small><h1 id="partName"></h1><p id="partDescription"></p></div>
<div id="assembly"><button id="replay" aria-label="Repetir montaje">↻ Montar</button><span id="counter">0 / 10</span></div>
<div id="bottom" role="group" aria-label="Etapas"><button data-step="0" class="active"><span>01</span>Entero</button><button data-step="1"><span>02</span>Despiece</button><button data-step="2"><span>03</span>Interior</button><button data-step="3"><span>04</span>Montaje</button><button data-step="4"><span>05</span>En marcha</button></div>
<div id="note"></div><div id="error" role="alert">No se pudo iniciar WebGL2. Abrí este visor en un navegador con aceleración 3D.</div>
<script>addEventListener('error',e=>{const box=document.getElementById('error');box.style.display='flex';box.textContent='Error al cargar la escena: '+(e.message||'sin detalles');});</script>
<script src="parts.js"></script><script src="lib/assembly-presenter.js"></script><script src="scene.js"></script></body></html>
