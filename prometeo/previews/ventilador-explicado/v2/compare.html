<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ventilador · Comparar V1 / V2</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eae9e4;font-family:system-ui,Arial;color:#293e3e;overflow:hidden}main{height:100%;display:flex;flex-direction:column}.toolbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px rgba(0,0,0,.09)}button{font:600 12px system-ui;border:1px solid #a6b6b3;border-radius:28px;background:#f9faf5;color:#304a49;min-height:39px;padding:0 15px;cursor:pointer}button.active{background:#294f4f;color:white}a{position:absolute;left:15px;color:inherit;text-decoration:none;font-size:13px}.panels{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.panel{position:relative;min-width:0;border-right:1px solid #bec9c6}.panel:last-child{border:0}.panel iframe{border:0;width:100%;height:100%;display:block}.tag{position:absolute;left:15px;top:10px;font-size:11px;font-weight:750;letter-spacing:.15em;pointer-events:none;z-index:1;background:#eef1ebce;padding:5px 8px;border-radius:4px}@media(max-width:500px){.toolbar{height:47px}button{padding:0 8px;min-height:34px;font-size:11px}.tag{font-size:10px;left:7px}}</style></head><body><main><div class="toolbar"><a href="./" title="Volver al ventilador">←</a><button class="active" data-view="trescuartos">¾</button><button data-view="frontal">Frente</button><button data-view="perfil">Perfil</button></div><div class="panels"><div class="panel"><span class="tag">V1</span><iframe title="Ventilador V1" src="baseline/index.html?compare=1"></iframe></div><div class="panel"><span class="tag">V2</span><iframe title="Ventilador V2" src="index.html?compare=1"></iframe></div></div></main><script>
const frames=[...document.querySelectorAll('iframe')];let selected='trescuartos';const hide='#bottom,#top,#right,#card,#parts,#assembly,#note{display:none!important}';
function send(f){f.contentWindow?.postMessage({type:'FAN_VIEW',name:selected},'*')}
frames.forEach(f=>f.addEventListener('load',()=>{try{const css=f.contentDocument.createElement('style');css.textContent=hide;f.contentDocument.head.appendChild(css)}catch(e){}send(f)}));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));frames.forEach(send)}));
</script></body></html>
