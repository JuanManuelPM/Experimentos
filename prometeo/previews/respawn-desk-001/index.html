// WebGL2 raster pipeline: no remote libraries, no texture server; local preview works offline.
const vert=`#version 300 es
in vec3 a_pos;in vec3 a_norm;in vec3 a_col;in float a_emit;
uniform mat4 u_vp;out vec3 v_n;out vec3 v_col;out vec3 v_p;out float v_e;
void main(){v_n=a_norm;v_col=a_col;v_p=a_pos;v_e=a_emit;gl_Position=u_vp*vec4(a_pos,1.0);}`;
const frag=`#version 300 es
precision highp float;in vec3 v_n;in vec3 v_col;in vec3 v_p;in float v_e;
uniform vec3 u_camera;uniform float u_alpha;uniform float u_fog;uniform vec3 u_fogColor;out vec4 outColor;
void main(){vec3 n=normalize(v_n), sun=normalize(vec3(-0.53,0.89,0.33));float lam=max(dot(n,sun),0.0);
float candle=2.0/(1.0+0.6*pow(distance(v_p,vec3(-1.2,2.2,-2.2)),2.0));
float screen=1.7/(1.0+1.5*pow(distance(v_p,vec3(0.0,1.7,-1.6)),2.0));
vec3 lit=v_col*(0.42+0.49*lam+0.35*candle)+v_col*vec3(.3,.72,.88)*screen*.37+v_col*v_e*1.7;
float fog=1.0-exp(-distance(v_p,u_camera)*u_fog);
vec3 col=mix(lit,u_fogColor,clamp(fog,0.,.93));col=col/(vec3(1.0)+col*.42);
outColor=vec4(pow(col,vec3(0.88)),u_alpha);}`;
const shader=(type,code)=>{const sh=gl.createShader(type);gl.shaderSource(sh,code);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh};
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const attr=['a_pos','a_norm','a_col','a_emit'].map(k=>gl.getAttribLocation(program,k));const unif=n=>gl.getUniformLocation(program,n);
const uVP=unif('u_vp'),uCam=unif('u_camera'),uAlpha=unif('u_alpha'),uFog=unif('u_fog'),uFogC=unif('u_fogColor');
function upload(batch){const data=batch.serialize(),out={count:data.count,buffers:[]};for(const field of ['positions','normals','colors','emissives']){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data[field],gl.STATIC_DRAW);out.buffers.push(b)}return out}
const cityMesh=upload(city),roomMesh=upload(room);city.p=city.n=city.c=city.e=null;room.p=room.n=room.c=room.e=null;
function draw(mesh,alpha){if(alpha<.005)return;gl.uniform1f(uAlpha,alpha);for(let i=0;i<4;i++){gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buffers[i]);gl.enableVertexAttribArray(attr[i]);gl.vertexAttribPointer(attr[i],i===3?1:3,gl.FLOAT,false,0,0)}gl.drawArrays(gl.TRIANGLES,0,mesh.count)}
function lookAt(eye,target){let z=unit(vsub(eye,target)),x=unit(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov*Math.PI/360),nf=1/(near-far);return [f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]}
function mul4(a,b){const c=new Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)c[col*4+row]=a[row]*b[col*4]+a[4+row]*b[col*4+1]+a[8+row]*b[col*4+2]+a[12+row]*b[col*4+3];return c}
let time=0,playing=true,last=0,frame=0;
function resize(){const dpr=Math.min(1.65,devicePixelRatio||1),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
function render(now){if(!last)last=now;const dt=Math.min(.07,(now-last)/1000);last=now;if(playing)time=Math.min(21.5,time+dt);if(time===21.5&&playing){playing=false;play.textContent='▶';play.setAttribute('aria-label','Reproducir')}
 resize();const state=sampleRail(SHOTLIST,time);gl.clearColor(.014,.021,.042,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 const vp=mul4(perspective(state.fov,canvas.width/canvas.height,.06,1400),lookAt(state.position,state.target));
 gl.uniformMatrix4fv(uVP,false,new Float32Array(vp));gl.uniform3fv(uCam,state.position);gl.uniform3fv(uFogC,new Float32Array([.018,.026,.048]));gl.uniform1f(uFog,time<10?.00039:.0014);
 // Rendering city first with depth write disabled while it dissolves through the roof.

 gl.depthMask(true);draw(roomMesh,time<8?0:Math.min(1,(time-8)/2));
 fill.style.width=`${(time/21.5)*100}%`;bar.setAttribute('aria-valuenow',time.toFixed(2));
 pulse.style.opacity= time>16.37&&time<16.57?String(.38*(1-Math.abs(time-16.47)/.1)): '0';
 window.__PROMETEO3D={ready:true,sceneId:'respawn-desk-001',time,shot:state.shotId,cityTriangles:cityMesh.count/3,roomTriangles:roomMesh.count/3,frame:frame++};
 requestAnimationFrame(render)}

function setPlaying(v){playing=v;play.textContent=v?'Ⅱ':'▶';play.setAttribute('aria-label',v?'Pausar':'Reproducir')}
play.addEventListener('click',()=>setPlaying(!playing));replay.addEventListener('click',()=>{time=0;setPlaying(true)});
