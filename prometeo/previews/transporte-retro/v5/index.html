<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1520"><title>TRANSPORTE / 05 · PROMETEO</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1520;color:#f1dac0;font-family:system-ui,-apple-system,Arial}canvas{display:block;touch-action:none}
#top{position:fixed;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px;z-index:4;pointer-events:none;background:linear-gradient(#061018cf,transparent)}
#top>*{pointer-events:auto}.title{font-family:Georgia,serif;font-size:clamp(15px,2.6vw,22px);font-weight:400;letter-spacing:.20em;text-transform:uppercase}.meta{font-size:10px;letter-spacing:.24em;color:#c9ac82}#status{font-size:11px;color:#d5a78e;min-height:12px}
#control{position:fixed;z-index:5;inset:auto 0 0;padding:6px 16px max(5px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#071019ec 45%);display:grid;gap:6px}
#ui{display:flex;align-items:center;justify-content:space-between;gap:9px}#ui>div{display:flex;gap:7px}button{border:1px solid #dac29a70;background:#0f2027dd;color:#f2dfc5;min-width:48px;height:47px;padding:0 13px;border-radius:24px;font-size:19px;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(9px)}button.active{background:#c39b67;color:#111e22}button:focus-visible{outline:2px solid #f6dda6}
#label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#ead4b7;text-align:center;max-width:34vw}
#scrub{appearance:none;width:100%;height:3px;border:0;background:#b3a18b6b;border-radius:4px;cursor:pointer}#scrub::-webkit-slider-thumb{appearance:none;width:19px;height:19px;background:#e7bd81;border:2px solid #132936;border-radius:50%}
#progress{position:fixed;bottom:0;left:0;height:2px;background:#e2b37c;width:0;pointer-events:none}
#error{position:fixed;z-index:20;inset:0;display:none;align-content:center;justify-items:center;gap:17px;text-align:center;padding:34px;background:#0b1520;color:#eccda9;font-size:15px}#error small{max-width:340px;color:#9cafa9;line-height:1.5}
@media(max-width:640px){#top{padding:10px 12px}.title{font-size:14px;letter-spacing:.09em}#control{padding:5px 9px 5px;gap:6px}button{min-width:44px;height:44px;padding:0 9px}#label{display:none}.meta{font-size:9px}#status{display:none}}

#subtitle{position:fixed;left:50%;bottom:122px;transform:translateX(-50%);max-width:80vw;
color:#f3d6a5;font-size:clamp(12px,2vw,17px);font-family:Georgia,serif;
letter-spacing:.21em;text-align:center;z-index:4;pointer-events:none;
text-shadow:0 2px 16px #000,0 2px 4px #020508}
@media(max-width:640px){#subtitle{bottom:110px;font-size:11px;max-width:86vw}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body>
<header id="top"><span class="title">TRANSPORTE / 05</span><div style="text-align:right"><div class="meta">BUENOS AIRES · NOCHE</div><div id="status" aria-live="polite"></div></div></header>
<div id="subtitle" aria-live="polite"></div><div id="control"><input id="scrub" type="range" min="0" max="62" step=".05" value="0" aria-label="Recorrer secuencia">
<div id="ui"><div><button id="play" aria-label="Reproducir o pausar">Ⅱ</button><button id="prev" aria-label="Plano anterior">‹</button><button id="next" aria-label="Plano siguiente">›</button></div><span id="label"></span><div><button id="free" aria-label="Cámara libre">◎</button><button id="sound" aria-label="Sonido ambiente">◌</button></div></div></div><div id="progress"></div>
<div id="error" role="alert"><strong>No se pudo abrir la escena 3D</strong><small id="reason">Comprobá la compatibilidad WebGL2 y la conexión a Internet.</small></div>
<script type="module">
const error=document.getElementById('error'),reason=document.getElementById('reason');
let c=document.createElement('canvas');let gl=null;try{gl=c.getContext('webgl2')}catch(e){}
if(!gl){error.style.display='grid';reason.textContent='WEBGL_CONTEXT: este navegador no tiene WebGL2 disponible.';}
else import('./scene.mjs').catch(e=>{error.style.display='grid';reason.textContent='MODULE_IMPORT / RUNTIME: '+String(e.message||e);console.error(e);});
</script></body></html>
