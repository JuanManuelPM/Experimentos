<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04161d"><title>NEREIDA III · Laboratorio submarino</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04161d;color:#e4f4ed;font-family:system-ui,-apple-system,sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#fade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 49%,rgba(0,9,16,.37));}
header{position:fixed;top:0;left:0;right:0;padding:16px max(18px,env(safe-area-inset-left)) 8px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
#brand{font-size:13px;font-weight:750;letter-spacing:.32em;color:#d2f4ed;text-shadow:0 2px 15px #000}#brand small{display:block;font-size:9px;letter-spacing:.18em;font-weight:500;opacity:.55;margin-top:6px}
#toptools{display:flex;gap:7px;pointer-events:auto}button{appearance:none;border:1px solid rgba(145,216,204,.28);background:rgba(5,27,36,.71);color:#d8ede5;border-radius:8px;cursor:pointer;font-size:11px;font-weight:650;letter-spacing:.08em;padding:11px 13px;backdrop-filter:blur(8px)}button:active,button[aria-pressed=true]{background:#83b9a3;color:#09232a}
#places{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;justify-content:center;width:max-content;max-width:calc(100% - 30px)}
#places button{border-radius:5px;padding:12px 13px;background:rgba(3,25,33,.78)}#places button[aria-current=true]{border-color:#99dbc5;background:rgba(39,101,103,.75)}
#joystick{position:fixed;left:22px;bottom:84px;width:103px;height:103px;border-radius:50%;border:1px solid rgba(169,223,211,.22);background:rgba(9,44,50,.22);touch-action:none;display:grid;place-items:center}
#knob{width:38px;height:38px;border-radius:50%;border:1px solid rgba(196,246,230,.56);background:rgba(130,218,204,.22);pointer-events:none;box-shadow:0 0 24px rgba(108,199,197,.13)}
#hint{position:fixed;right:20px;bottom:83px;font-size:9px;opacity:.52;text-align:right;line-height:1.65;letter-spacing:.07em;pointer-events:none}
#notice{position:fixed;inset:0;display:grid;place-items:center;background:#071920;z-index:8;padding:32px;text-align:center}
#notice article{max-width:360px}#notice b{display:block;letter-spacing:.28em;font-size:18px;margin-bottom:16px}#notice p{font-size:12px;line-height:1.75;opacity:.7}#notice[hidden]{display:none}
#status{position:fixed;top:70px;right:16px;color:#add6c7;font:10px ui-monospace,monospace;letter-spacing:.09em;pointer-events:none;opacity:.7}
@media (max-width:660px){header{padding:12px 12px 8px}#brand{font-size:11px;letter-spacing:.19em}#brand small{font-size:8px}#toptools button{font-size:10px;padding:9px 10px}#places{bottom:calc(9px + env(safe-area-inset-bottom))}#places button{font-size:9px;padding:10px 9px}#joystick{left:16px;bottom:66px;width:88px;height:88px}#hint{display:none}#status{top:57px;right:14px;font-size:9px}}
@media (max-height:390px){#joystick{bottom:52px;width:72px;height:72px}#knob{width:28px;height:28px}#places button{padding:8px 9px}#brand small{display:none}}
/* V3 presentation: only a compact scene menu and movement puck are persistent. */
header{padding:12px max(12px,env(safe-area-inset-left)) 8px}#brand{font-size:11px;letter-spacing:.24em}#brand small{display:none}
#toptools{display:none;position:fixed;right:12px;top:66px;flex-direction:column;gap:6px;z-index:3}
#menu{pointer-events:auto;min-width:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px}
#places{display:none;bottom:max(14px,env(safe-area-inset-bottom));flex-wrap:wrap;max-width:96vw}
body.menu-open #places,body.menu-open #toptools{display:flex}body.menu-open #hint{display:block}
button,#places button{min-height:44px;min-width:44px}#joystick{left:12px;bottom:max(15px,env(safe-area-inset-bottom));width:72px;height:72px}#knob{width:30px;height:30px}
#status{display:none}#hint{display:none;bottom:62px;right:14px}body.menu-open #joystick{bottom:76px}
@media(pointer:fine){#joystick{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script>
</head><body>
<canvas id="view" aria-label="Laboratorio submarino tridimensional explorable"></canvas><div id="fade"></div>
<header><div id="brand">NEREIDA III<small>ESTACIÓN ABISAL / 4 200 M</small></div><button id="menu" aria-label="Abrir controles" aria-expanded="false">⋯</button><div id="toptools"><button id="tour" aria-pressed="false">▶ RECORRIDO</button><button id="shot" title="Guardar captura">▣</button></div></header>
<div id="status" aria-live="polite"></div>
<div id="joystick" aria-label="Control de desplazamiento"><div id="knob"></div></div>
<div id="hint">ARRASTRÁ PARA MIRAR<br>WASD PARA CAMINAR</div>
<nav id="places" aria-label="Salas"><button data-room="0" aria-current="true">01 · OBSERVATORIO</button><button data-room="1">02 · BIOLOGÍA</button><button data-room="2">03 · CONTROL</button></nav>
<div id="notice"><article><b>NEREIDA III</b><p id="notice-text">Abriendo la estación a 4.200 metros de profundidad…</p></article></div>
<script>const menu=document.getElementById("menu");menu.onclick=()=>{const on=document.body.classList.toggle("menu-open");menu.setAttribute("aria-expanded",String(on));menu.textContent=on?"×":"⋯"};document.querySelectorAll("[data-room],#tour").forEach(b=>b.addEventListener("click",()=>{if(document.body.classList.contains("menu-open"))menu.click()}));</script><script type="module" src="./scene.mjs"></script>
<script>window.addEventListener('error',e=>{const n=document.querySelector('#notice');if(n&&!n.hidden){document.querySelector('#notice-text').textContent='Fallo al iniciar el módulo: '+String(e.message||'error desconocido')}});window.addEventListener('unhandledrejection',e=>{const n=document.querySelector('#notice');if(n&&!n.hidden){document.querySelector('#notice-text').textContent='No se pudo cargar el módulo 3D: '+String(e.reason?.message||e.reason||'error de red')}});</script>
</body></html>
