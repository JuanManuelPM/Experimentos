/* MUSIC V2 · listening-first mobile layout. Keep track metrics synced with studio.js (69px rows). */
:root{--bg:#0c1015;--surface:#13191f;--line:#29303a;--text:#f0f0ec;--muted:#a2aeb8;--accent:#bcdccf;--active:#bcdccf}
#app>header{height:62px;min-height:62px;padding:8px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;grid-template-areas:"song transport position library edit";gap:9px;background:#10151b;position:relative;z-index:30}
#brand,.grow{display:none}
#songTitle{grid-area:song;font-size:15px;font-weight:650;color:#f2f3f1;max-width:none;min-width:0}
#transport{grid-area:transport;gap:3px}
#transport button{height:40px;width:38px;min-width:38px;padding:0;border:0;background:transparent;border-radius:9px;font-size:18px}
#transport #play{background:#d1e9dc;color:#111b17}
#transport #play.on{background:#87bda6}
#position{grid-area:position;min-width:92px;color:#c4c9cb}
#libraryToggle{grid-area:library}
#editToggle{grid-area:edit}
#toolsToggle{grid-area:tools;display:none}
#libraryToggle,#editToggle,#toolsToggle{height:40px;border:1px solid #34414b;border-radius:9px;background:#1b242d;padding:0 13px;font-weight:600}
#advanced{display:none;position:absolute;right:12px;top:calc(100% + 5px);z-index:40;max-width:min(440px,calc(100vw - 24px));background:#171e27;border:1px solid #45515f;border-radius:13px;padding:13px;box-shadow:0 16px 36px #0008;align-items:center;flex-wrap:wrap;gap:7px}
#advanced label{white-space:nowrap;color:#c4ccd4;display:flex;align-items:center;gap:5px}
#advanced button{min-height:39px}
#app.tools-open #advanced{display:flex}
#editor{background:#141b22;border-top:1px solid #39424a}
#app:not(.editing) #editor{display:none}
#editToggle.on{border-color:#91bdaa;background:#29473b;color:#e4fff1}
#corner,#names{background:#12191f}
#namesSections{background:#12191f}
#lanes{background:#0e141b}
.trackName{border-bottom-color:#29333b}
.trackName.selected{background:#1b2c32}
.lane{border-bottom-color:#29333b}
#rulerbar{flex-shrink:0}
#libraryPanel[hidden]{display:none!important}
#libraryPanel{position:fixed;inset:0;z-index:100;background:#0c1015;color:#f0f1ed;overflow:auto;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.libraryInner{width:min(750px,100%);margin:0 auto;padding:22px 0 55px}
.libraryHeading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.libraryHeading h2{font-size:clamp(24px,6vw,36px);letter-spacing:-.035em;font-weight:650;margin:0}
#libraryClose{min-height:45px;min-width:45px;background:#222c35;border:1px solid #45515b;font-size:26px;padding:0}
#librarySearch{display:block;width:100%;height:48px;background:#151d25;border:1px solid #3b4650;border-radius:10px;margin:25px 0 10px;padding:0 16px;font-size:16px}
#libraryCount{font-size:12px;color:#a6b4bf;margin-bottom:12px}
.libraryRow{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;gap:15px;background:transparent;border:0;border-top:1px solid #283139;border-radius:0;padding:18px 3px;min-height:75px}
.libraryRow strong{display:block;font-size:16px;font-weight:600;line-height:1.3}
.libraryRow small{display:block;font-size:12px;color:#a4afba;margin-top:5px}
.libraryRow .arrow{color:#b8d9c8;font-size:20px}
.libraryRow:hover,.libraryRow:focus-visible{background:#1a242c}
#libraryFeedback{font-size:13px;color:#b6c2c9;min-height:21px}
body:has(#libraryPanel:not([hidden])){overflow:hidden}
@media(max-width:730px){
#app>header{height:102px;min-height:102px;padding:9px 12px;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:35px 43px;grid-template-areas:"song library tools" "transport position edit";column-gap:8px;row-gap:6px}
#songTitle{font-size:13px;line-height:1.2;max-width:none}
#libraryToggle{font-size:12px;padding:0 9px;max-height:34px}
#toolsToggle{display:block;max-height:34px;padding:0 9px}
#editToggle{font-size:12px;padding:0 9px}
#transport{justify-self:start}
#transport button{height:36px;width:35px;min-width:35px;font-size:16px}
#position{font-size:12px;min-width:75px}
#corner,#names{width:110px;min-width:110px}
#corner{font-size:9px;padding-left:7px}
#namesSections{font-size:9px;padding-left:8px}
.trackName{padding:5px;gap:3px}
.trLabel strong{font-size:10px;line-height:1.1}
.trLabel small{font-size:9px}
.trackName .mini{padding:3px 5px;min-width:20px}
#editor{max-height:44dvh;min-height:140px;padding:10px;gap:7px}
#editor label{font-size:11px}
#advanced{top:calc(100% + 3px);right:9px}
}
@media(min-width:731px){#toolsToggle{display:block}#app>header{grid-template-columns:minmax(0,1fr) auto auto auto auto auto;grid-template-areas:"song transport position library edit tools"}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
