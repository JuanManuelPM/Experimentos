<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VELOCIDAD CERO · PROMETEO</title><style>
:root{color-scheme:dark;--bg:#101217;--surface:#181c24;--line:#303745;--text:#ebedf1;--muted:#8893a5;--accent:#c6d7fa;--active:#b5e6cc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,select,input{font:inherit;color:inherit}button,select{background:#252b36;border:1px solid #394250;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{border-color:#8293ae}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b3d3ff}button.on{background:#375344;border-color:#8bbda0}button:disabled{opacity:.35}input[type=range]{accent-color:#b9dec8}input[type=number]{background:#222936;border:1px solid #475166;border-radius:6px;padding:7px;width:74px}#app{height:100dvh;display:flex;flex-direction:column;min-width:0}header{height:auto;min-height:62px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}#brand{font-weight:750;letter-spacing:.14em;white-space:nowrap}#brand small{font-size:10px;color:var(--muted);letter-spacing:.07em}#songTitle{font-size:13px;font-weight:600;color:#cbd4e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.grow{flex:1}#transport{display:flex;align-items:center;gap:6px}#position{min-width:90px;font-variant-numeric:tabular-nums;color:#cad3e2;text-align:center}#status{font-size:11px;color:var(--muted)}main{min-height:0;flex:1;display:flex;flex-direction:column}#rulerbar{display:flex;height:33px;border-bottom:1px solid var(--line);flex-shrink:0}#corner{width:192px;min-width:192px;background:#161a21;display:flex;align-items:center;padding-left:13px;color:var(--muted);font-size:11px}#ruler{height:33px;flex:1;overflow:hidden;position:relative;touch-action:pan-x}#viewport{flex:1;min-height:0;display:flex}#names{width:192px;min-width:192px;overflow:hidden;border-right:1px solid var(--line);background:#151a22}#lanes{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;background:#11161d;scrollbar-color:#536071 #171b23}#timeline{position:relative;min-height:100%;width:100%}#sections{height:25px;position:relative;border-bottom:1px solid #353b46}#namesSections{height:25px;background:#181c24;border-bottom:1px solid #353b46;padding:5px 12px;color:#9da6b5;font-size:11px}#rowNames{position:relative}#rows{position:relative}#cursor{position:absolute;top:0;width:2px;background:#d1e7f3;z-index:15;pointer-events:none;box-shadow:0 0 7px #98bed8}#rulerCanvas{position:absolute;left:0;top:0}#empty{display:none}.trackName{height:69px;border-bottom:1px solid #2d3540;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer}.trackName.selected{background:#283341}.trLabel{flex:1;min-width:0}.trLabel strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trLabel small{font-size:10px;color:#a3aabb}.dot{width:7px;height:30px;border-radius:3px;flex-shrink:0}.mini{padding:5px 7px;border-radius:5px;font-size:11px}.trackName .mute.on,.trackName .solo.on{background:#8db7ad;color:#13221f}.lane{height:69px;position:relative;border-bottom:1px solid #2d3540;background:repeating-linear-gradient(90deg,transparent,transparent calc(var(--beatpx) - 1px),#202731 calc(var(--beatpx) - 1px),#202731 var(--beatpx))}.lane.selected{background-color:#1a2530}.clip{position:absolute;min-width:2px;height:14px;border-radius:2px;opacity:.84;cursor:pointer;z-index:2;border:1px solid rgba(255,255,255,.18)}.clip.selected{outline:2px solid #eff8e1;z-index:4;opacity:1}.wave{position:absolute;pointer-events:none;inset:0;opacity:.34;z-index:1}#editor{min-height:124px;max-height:40vh;border-top:1px solid #394452;background:#191f28;display:flex;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:9px;overflow:auto}#editor b{font-size:12px;min-width:110px}#editor label{font-size:11px;color:#a6b0c0;display:flex;flex-direction:column;gap:3px}#editor .spacer{flex:1}#files{display:none}#toast{position:absolute;right:16px;bottom:149px;max-width:360px;background:#253241;padding:10px 14px;border:1px solid #577086;border-radius:8px;display:none;z-index:99}select{max-width:160px}#zoomVal{font-size:11px;color:var(--muted)}#instrument{max-width:125px}@media(max-width:730px){header{gap:6px;padding:8px}#brand{font-size:11px}#songTitle{max-width:150px}button,select{padding:8px}#corner,#names{width:146px;min-width:146px}.trackName{gap:4px;padding:5px}.trLabel strong{font-size:10px}.mini{padding:5px}.dot{width:4px}#editor{padding:9px;gap:7px;min-height:140px}#editor b{width:100%}#status{display:none}}

#songTitle{font-size:clamp(16px,2.7vw,28px);max-width:100%;font-weight:700;color:#f1eee9}#play{background:#e8e4d7;color:#11151a;font-size:21px;font-weight:700;padding:10px 17px;border-radius:9px}#editor{display:none}#app.editing #editor{display:flex}#brand{font-size:10px;color:#909cb0}#names{background:#13171e}#returnRoot{color:#d6ddd8;text-decoration:none;border:1px solid #45505c;padding:9px;border-radius:7px}@media(max-width:730px){header{min-height:90px}#songTitle{order:2;width:100%;max-width:unset}#position{min-width:72px}#brand small{display:none}#zoomVal{display:none}#editor{max-height:35vh}}
</style></head><body><div id="app"><header><a href="../../../../root/" id="returnRoot" aria-label="Volver a PROMETEO ROOT">← ROOT</a><div id="brand">PROMETEO <small> · W001 / 09</small></div><div id="songTitle"></div><div class="grow"></div><div id="transport"><button id="play" title="Reproducir">▶</button><button id="pause" title="Pausar">Ⅱ</button><button id="stop" title="Detener">■</button><button id="loop" title="Repetir">↻</button></div><span id="position">01:01 · 0:00</span><label style="display:flex;align-items:center;gap:4px">Zoom <input id="zoom" type="range" min="25" max="140" value="55" style="width:68px"></label><span id="zoomVal">55</span><button id="abCompare" title="Alternar A/B de instrumento o batería" aria-label="Comparar instrumentos o percusiones con las mismas notas">A/B</button><button id="exportWav">WAV</button><button id="exportStem" title="Exportar pista seleccionada">STEM</button><button id="exportProject">JSON</button><button id="editToggle" onclick="document.getElementById('app').classList.toggle('editing')" aria-label="Mostrar u ocultar editor">Editar</button><button id="openProject">Abrir</button><input id="files" type="file" accept=".json,application/json"><span id="status">LISTO</span></header><main><div id="rulerbar"><div id="corner">COMPÁS / TIEMPO</div><div id="ruler"><canvas id="rulerCanvas"></canvas></div></div><div id="viewport"><div id="names"><div id="namesSections">SECCIONES</div><div id="rowNames"></div></div><div id="lanes"><div id="timeline"><div id="sections"></div><div id="rows"></div><div id="cursor"></div></div></div></div><div id="editor"><b id="selectionName">Seleccioná una nota</b><label>Instrumento<select id="instrument"></select></label><label>Nota MIDI<input id="midi" type="number" min="20" max="108" value="60"></label><label>Tiempo (s)<input id="time" type="number" min="0" step="0.01"></label><label>Duración (s)<input id="dur" type="number" min="0.02" step="0.01"></label><label>Velocidad<input id="vel" type="number" min="1" max="127"></label><label>Volumen<input id="gain" type="range" min="0" max="1.4" step="0.01"></label><label>Reverb<input id="reverb" type="range" min="0" max="0.8" step="0.01"></label><label>Delay<input id="delay" type="range" min="0" max="0.65" step="0.01"></label><button id="saveNote">Aplicar</button><button id="addNote">+ Nota</button><button id="removeNote">Eliminar</button></div></main><div id="toast"></div></div><script src="song-data.js"></script><script src="waveforms.js"></script><script src="studio.js"></script></body></html>
