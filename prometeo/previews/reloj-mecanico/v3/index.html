<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><title>Horologium · Reloj mecánico V3 · PROMETEO</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c0e0c;color:#ede1c6}#view{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#view:active{cursor:grabbing}
.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:20px;display:flex;align-items:center;gap:13px;pointer-events:none}.mark{width:33px;height:33px;border:1px solid #bc9b61;border-radius:50%;display:grid;place-items:center;font:23px Georgia,serif;color:#e2bf76}.title{font:15px Georgia,serif;letter-spacing:.25em}.tiny{color:#9c988a;font:9px system-ui;letter-spacing:.20em;margin-top:4px}
.status{position:fixed;top:max(14px,env(safe-area-inset-top));right:19px;display:flex;gap:6px}.control{appearance:none;background:#171913df;color:#e8dac0;border:1px solid #6f6651a0;min-width:42px;min-height:42px;border-radius:4px;cursor:pointer;touch-action:manipulation;font-size:17px}.control:hover{background:#29271e}.control.selected{background:#c8ac72;color:#171711;border-color:#c8ac72}.control:focus-visible{outline:2px solid #f3ddaa;outline-offset:2px}
.bottom{position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:min(650px,calc(100vw - 24px))}.rail{display:flex;align-items:stretch;gap:4px;padding:4px;background:#111410e8;border:1px solid #554832;border-radius:6px;width:100%;backdrop-filter:blur(10px)}.rail button{flex:1;min-width:0;font:600 10px system-ui;letter-spacing:.08em;min-height:43px;background:transparent;border:0;color:#c8b99c;cursor:pointer}.rail button.selected{background:#bba06a;color:#18170f;border-radius:3px}.seek{width:100%;display:flex;align-items:center;gap:12px;padding:0 3px}.seek .caption{font-size:9px;color:#a08d6b;white-space:nowrap;letter-spacing:.1em}.seek input{flex:1;accent-color:#d7b77e;min-width:0}.hint{position:fixed;left:20px;bottom:122px;font:9px system-ui;letter-spacing:.12em;color:#a79b81;pointer-events:none}.overlay{display:none;position:fixed;inset:0;background:#11140feF;place-items:center;padding:30px;text-align:center;z-index:20}.overlay.show{display:grid}.overlay .msg{max-width:430px;color:#ded2b8;font:15px/1.6 system-ui}.overlay small{display:block;margin-top:8px;font:11px system-ui;color:#a9a18d}.badge{position:fixed;top:90px;right:20px;font:9px system-ui;letter-spacing:.1em;color:#a89b80;pointer-events:none}
@media(max-width:650px){.top{left:11px;top:10px;gap:7px}.mark{width:27px;height:27px;font-size:17px}.title{font-size:11px}.tiny{font-size:7px}.status{top:8px;right:8px;gap:4px}.control{min-width:37px;min-height:37px;font-size:15px}.bottom{bottom:9px;width:calc(100vw - 12px)}.rail{gap:1px;padding:3px}.rail button{font-size:9px;letter-spacing:0;min-height:39px}.hint,.badge{display:none}.seek{gap:7px}.seek .caption{font-size:8px}}
/* V3 presentation-first. */
.top{left:12px;top:10px;gap:8px}.mark{display:none}.title{font-size:12px;letter-spacing:.2em}.tiny{font-size:8px}.status{right:8px;top:8px;gap:4px}.control{min-width:44px;min-height:44px;background:#111511a8;border-color:#77695166}.bottom{width:min(550px,calc(100vw - 16px));bottom:max(8px,env(safe-area-inset-bottom));gap:4px}.rail{padding:0;gap:0;background:#111410dc;border:1px solid #8e79533d;border-radius:8px}.rail button{min-height:44px;font-size:10px;letter-spacing:.025em}.seek{display:none;background:#111410cc;border-radius:6px;padding:0 8px}.seek.visible{display:flex;min-height:44px}.seek input{min-height:44px}.hint,.badge{display:none}.rail button.selected{border-radius:7px}.title{color:#dbc596}.top{max-width:calc(100% - 165px)}@media(max-width:480px){.rail button{font-size:9px;letter-spacing:0}.tiny{display:none}.title{font-size:11px}.top{top:18px}.bottom{width:calc(100vw - 12px)}}@media(max-height:450px){.tiny{display:none}.bottom{width:420px;max-width:calc(100vw - 20px)}} 
.seek.caption-only{width:auto;max-width:100%;min-height:30px;justify-content:center;border:1px solid #8977474d;background:#131711cc;padding:8px 16px}.seek.caption-only input,.seek.caption-only #ratio{display:none}.seek.caption-only #beat{color:#e3c994;font-size:10px;letter-spacing:.10em;white-space:normal;text-align:center}
</style></head><body>
<canvas id="view" aria-label="Reloj antiguo en tres dimensiones. Arrastrá para rotar la cámara, pellizcá para acercarte, y usá los controles para desmontar o reensamblar."></canvas>
<header class="top"><div class="mark">H</div><div><div class="title">HOROLOGIUM</div><div class="tiny">PROMETEO · RELOJ MECÁNICO · V3</div></div></header>
<nav class="status" aria-label="Vista y reproducción"><button id="camera" class="control" title="Cambiar cámara" aria-label="Cambiar cámara">◎</button><button id="play" class="control selected" title="Pausar mecanismo" aria-label="Pausar mecanismo">Ⅱ</button><button id="home" class="control" title="Restablecer cámara" aria-label="Restablecer cámara">↺</button></nav>

<div class="hint"></div>
