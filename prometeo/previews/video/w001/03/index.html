<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dentro del dosificador · PROMETEO Video W001-03</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#111e29;color:#f7f2e9;font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px}
main{width:min(100%,1280px)}canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;border:1px solid #516574;box-shadow:0 12px 45px #0005;background:#f3efe7}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0 0}
button,a{background:#ed744b;border:0;border-radius:4px;color:#0e212b;padding:12px 16px;font-weight:750;font-size:14px;cursor:pointer;text-decoration:none}
button.secondary{background:#d8ddd7}
label{color:#dce4e3;font-size:13px}input[type=range]{width:min(420px,50vw);accent-color:#ed744b}
small{display:block;color:#acb9c1;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main>
<canvas id="stage" width="1280" height="720" aria-label="Animación explicativa original sobre el funcionamiento de un dosificador de jabón"></canvas>
<div class="controls"><button id="play">▶ Reproducir</button><button id="pause" class="secondary">❚❚ Pausar</button><label for="scrub">Tiempo</label><input id="scrub" type="range" min="0" max="12" step="0.01" value="0"><span id="time">0:00 / 0:12</span><button id="export" class="secondary">Exportar WebM</button></div>
<small>Obra original · 12 segundos · 1280 × 720 · 24 FPS nominal. La previsualización es interactiva; exportación WebM depende de MediaRecorder de tu navegador. El MP4 de referencia se codificó con FFmpeg y se entrega por separado.</small>
</main>
<script>
(() => {
'use strict';
const c=document.querySelector('#stage'), x=c.getContext('2d'), W=1280,H=720,DURATION=12,FPS=24;
const P={paper:'#F1EFE8',ink:'#152B36',muted:'#586B70',teal:'#159E9B',tealLight:'#BEE4D9',orange:'#EE794F',yellow:'#F8C26B',white:'#FCFAF4',line:'#AAB5B0',navy:'#233E49'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,t)=>{const u=clamp((t-a)/(b-a));return u*u*(3-2*u)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rounded(px,py,w,h,r,color,stroke=null,sw=1){x.beginPath();x.roundRect(px,py,w,h,r);if(color){x.fillStyle=color;x.fill()}if(stroke){x.lineWidth=sw;x.strokeStyle=stroke;x.stroke()}}
function rect(px,py,w,h,color){x.fillStyle=color;x.fillRect(px,py,w,h)}
function line(x1,y1,x2,y2,color,width=2){x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function circle(px,py,r,color,stroke=null,sw=1){x.beginPath();x.arc(px,py,r,0,Math.PI*2);if(color){x.fillStyle=color;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=sw;x.stroke()}}
function text(s,px,py,size=20,color=P.ink,weight=500,align='left',tracking=0){x.save();x.fillStyle=color;x.textAlign=align;x.font=`${weight} ${size}px Inter, Arial, sans-serif`;if(tracking)x.letterSpacing=tracking+'px';x.fillText(s,px,py);x.restore()}
function arrow(px,py,dir,color=P.orange,scale=1){x.save();x.translate(px,py);x.rotate(dir);x.beginPath();x.moveTo(-8*scale,-5*scale);x.lineTo(0,0);x.lineTo(-8*scale,5*scale);x.lineWidth=3*scale;x.strokeStyle=color;x.stroke();x.restore()}
function liquidDot(px,py,r=5,color=P.orange){circle(px,py,r,color);circle(px-1.6,py-1.5,1.2,P.white)}
function grid(){
 rect(0,0,W,H,P.paper);
 for(let i=0;i<=W;i+=40){line(i,0,i,H,'#d1d9d045',1)}
 for(let j=0;j<=H;j+=40){line(0,j,W,j,'#d1d9d045',1)}
 rect(0,0,10,H,P.ink);rect(10,0,10,H,P.orange);
 circle(64,55,7,P.orange);text('DISECCIÓN',82,62,18,P.ink,850,'left',2);
 text('OBJETOS / POR DENTRO',1214,61,16,P.muted,650,'right',1.25);
 line(64,82,1216,82,'#9DAFA8',1.5);line(64,656,1216,656,'#9DAFA8',1.5);
 text('PROMETEO · VIDEO 03',64,688,14,P.muted,600,'left',1);
 text('MECANISMOS COTIDIANOS',1216,688,14,P.muted,600,'right',1);
}
function bottle(t){
 const press=smooth(2.00,4.2,t)*(1-smooth(6.4,9.2,t));
 const delta=Math.round(48*press);
 const squeeze=clamp(smooth(2.2,3.2,t)-smooth(5.55,6.4,t));
 const intake=clamp(smooth(6.65,7.55,t)-smooth(9.4,10.2,t));
 x.save();
 rounded(592,118,622,516,25,'#E3E9E0','#BDCAC1',2);
 for(let i=0;i<7;i++){line(608+i*100,129,608+i*100,623,'#CAD6CD',1)}
 for(let i=0;i<5;i++){line(607,164+i*100,1200,164+i*100,'#CAD6CD',1)}
 circle(660,172,8,P.ink);circle(1158,172,8,P.ink);circle(660,582,8,P.ink);circle(1158,582,8,P.ink);
 rounded(744,376,328,260,35,P.white,P.ink,7);
 rounded(754,476,308,150,24,'#B8E3D9');
 for(let k=0;k<5;k++){line(755,476+k*30,1060,476+k*30,'#77C7BB',1.2)}
 rect(758,415,10,195,'#E5EEE7');
 for(let k=0;k<5;k++){line(1045,493+k*24,1057,493+k*24,'#5FAEAB',2)}
 rounded(786,321,246,88,20,P.white,P.ink,6);
 rounded(882,423,28,176,10,P.white,P.ink,4);
 rounded(888,472,16,118,6,'#87D2C4');
 rounded(826,307,144,154,18,P.white,P.ink,6);
 rounded(837,323,122,126,10,'#DCECE4');
 const springY=352+delta,bottom=426;
 x.beginPath();x.moveTo(843,springY);
 for(let i=0;i<=10;i++){const yy=springY+(bottom-springY)*i/10;x.lineTo(843+(i%2?19:-3),yy)}
 x.strokeStyle=P.muted;x.lineWidth=3;x.stroke();
 line(864,346,864,427,'#96ADA8',1.6);
 line(917,333,917,201+delta,'#122E39',18);
 line(917,333,917,201+delta,P.white,10);
 rounded(894,192+delta,182,25,11,P.ink);
 rounded(916,199+delta,141,10,4,P.white);
 rounded(1046,213+delta,40,37,8,P.ink);
 rounded(1055,223+delta,21,17,4,P.white);
 rounded(802,177+delta,164,39,13,P.ink);
 rect(825,172+delta,116,7,P.orange);
 rounded(806,179+delta,155,8,5,'#3B5861');
 rect(896,215+delta,41,124,P.ink);
 rect(910,218+delta,12,114,P.white);
 rounded(836,329+delta,126,21,9,P.navy);
 rect(847,334+delta,104,6,P.orange);
 if(press>0.05) rounded(855,356+delta,103,Math.max(5,88-delta),6,'#f6c47054');
 circle(895,443,16,P.ink);circle(895,443+(intake?5:0),8,intake?P.teal:P.orange);
 circle(916,328,14,P.ink);circle(916,328,7,squeeze?P.orange:P.teal);
 if(intake>0.1){
  for(let k=0;k<5;k++){const pr=((t-6.6)*0.48+k/5)%1,py=590-pr*162;liquidDot(895,py,5,P.teal)}
  arrow(926,532,-Math.PI/2,P.teal,1.3);
 }
 if(squeeze>0.1){for(let k=0;k<6;k++){
  const pr=((t-2.4)*0.57+k/6)%1,d=pr*350;
  if(d<105)liquidDot(916,320-d,5,P.orange);
  else if(d<230)liquidDot(918+(d-105),214+delta,5,P.orange);
  else liquidDot(1045+(d-230)*.32,214+delta+Math.pow((d-230)/120,1.3)*58,5,P.orange);
 }
 arrow(1018,214+delta,0,P.orange,1.2)}
 if(squeeze>0.2){const xx=1089,y=235+delta;for(let k=0;k<4;k++){
 const pr=((t*0.58+k*0.22)%1);circle(xx+pr*44,y+pr*105,lerp(4,8,pr),P.orange)
 }}
 rounded(834,125+delta,114,41,20,'#E9B29B',P.ink,2.5);
 rounded(854,108+delta,90,35,18,'#F5CFBE');
 rounded(872,114+delta,44,10,5,'#E9B29B');
 line(963,344,1110,344,P.muted,2);circle(963,344,4,P.ink);
 text('PISTÓN',1114,337,16,P.ink,800);
 text('MÓVIL',1114,354,13,P.muted,650);
 line(908,447,1110,463,P.muted,2);circle(908,447,4,P.ink);
 text('VÁLVULA',1114,455,14,P.ink,800);
 text('DE ENTRADA',1114,472,12,P.muted,600);
 x.restore();
 return {press,delta,squeeze,intake};
}
function leftPanel(t){
 const panelX=68;
 text('EL SECRETO DEL',panelX,148,26,P.muted,700,'left',1.2);
 text('JABÓN',panelX,226,74,P.ink,900,'left',-3);
 text('LÍQUIDO',panelX,299,74,P.ink,900,'left',-3);
 rounded(panelX,324,336,4,2,P.orange);
 text('Un pistón. Dos válvulas.',panelX,359,24,P.muted,550);
 let phase=0;
 if(t>=2)phase=1;
 if(t>=4.6)phase=2;
 if(t>=6.6)phase=3;
 if(t>=10.6)phase=4;
 const stages=[
 ['00','¿QUÉ HAY ADENTRO?','Una pequeña bomba transforma presión en movimiento.'],
 ['01','PRESIONÁS','El pistón baja y comprime el jabón.'],
 ['02','EL JABÓN SALE','La válvula de salida deja pasar el líquido.'],
 ['03','SE RECARGA','El resorte sube: entra jabón desde el depósito.'],
 ['✓','LISTO PARA OTRA VEZ','Todo funciona con dos válvulas y un resorte.']
 ];
 const a=stages[phase];
 rounded(panelX,392,458,217,20,P.ink);
 rounded(panelX+20,412,65,38,9,P.orange);
 text(a[0],panelX+52,439,25,P.ink,850,'center');
 text(a[1],panelX+22,488,29,P.white,850);
 x.font='500 21px Inter,Arial';
 const words=a[2].split(' ');let s='',yy=533;
 for(const word of words){const candidate=s?`${s} ${word}`:word;
 if(x.measureText(candidate).width>407){text(s,panelX+22,yy,19,'#D1E1DB',500);yy+=27;s=word}else s=candidate}
 if(s)text(s,panelX+22,yy,19,'#D1E1DB',500);
 const starts=[0,2,4.6,6.6,10.6,12],labels=['ABRIR','BAJAR','SALIR','CARGAR','FIN'];
 for(let i=0;i<5;i++){let bg=t>=starts[i+1]?P.teal:(t>starts[i]?P.orange:'#738A8B');rounded(panelX+i*91,623,80,5,2,bg)}
 text(labels[Math.min(phase,4)],panelX,649,13,P.muted,650,'left',1);
}
function markers(t){
 if(t>=2&&t<6.6){rounded(714,266,100,31,10,P.orange);text('EMPUJE',764,287,15,P.ink,850,'center');arrow(763,302,Math.PI/2,P.orange,1.2)}
 if(t>=6.6&&t<10.6){rounded(683,454,140,31,10,P.teal);text('ASPIRACIÓN',753,475,14,P.white,850,'center');arrow(806,516,-Math.PI/2,P.teal,1.25)}
 rounded(1163,592,18,18,4,P.teal);text('IN',1154,608,13,P.muted,800,'right');
 rounded(1113,592,18,18,4,P.orange);text('OUT',1105,608,13,P.muted,800,'right');
}
function drawAt(t){t=clamp(t,0,DURATION);x.clearRect(0,0,W,H);grid();bottle(t);leftPanel(t);markers(t);rect(64,708,1152*(t/DURATION),6,P.orange);return t}
let playing=false,last=0,pos=0,raf;
function tick(ms){if(!playing)return;if(!last)last=ms;pos+=(ms-last)/1000;last=ms;if(pos>=DURATION){pos=DURATION;playing=false}drawAt(pos);sync();if(playing)raf=requestAnimationFrame(tick)}
function sync(){document.querySelector('#scrub').value=String(pos);document.querySelector('#time').textContent=`0:${String(Math.floor(pos)).padStart(2,'0')} / 0:12`}
function play(){if(pos>=DURATION)pos=0;if(!playing){playing=true;last=0;raf=requestAnimationFrame(tick)}}
function pause(){playing=false;cancelAnimationFrame(raf);last=0}
document.querySelector('#play').onclick=play;document.querySelector('#pause').onclick=pause;
document.querySelector('#scrub').oninput=e=>{pause();pos=Number(e.target.value);drawAt(pos);sync()};
async function record(){if(!c.captureStream||!window.MediaRecorder)throw new Error('MediaRecorder no disponible');pause();pos=0;drawAt(0);const stream=c.captureStream(FPS),mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(s=>MediaRecorder.isTypeSupported(s));if(!mime)throw new Error('WebM no soportado');const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3600000}),parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};const done=new Promise((res,rej)=>{rec.onstop=()=>res(new Blob(parts,{type:mime}));rec.onerror=rej});rec.start(250);let started=performance.now();await new Promise(resolve=>{function f(now){let elapsed=clamp((now-started)/1000,0,DURATION);drawAt(elapsed);pos=elapsed;sync();if(elapsed<DURATION)requestAnimationFrame(f);else resolve()}requestAnimationFrame(f)});rec.stop();const blob=await done;stream.getTracks().forEach(s=>s.stop());drawAt(0);pos=0;sync();return blob}
document.querySelector('#export').onclick=async()=>{const b=document.querySelector('#export');b.disabled=true;b.textContent='Codificando…';try{const blob=await record(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dosificador_w001_03.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert(err.message)}finally{b.disabled=false;b.textContent='Exportar WebM'}};
window.renderAt=drawAt;window.exportVideo=record;window.getVideoInfo=()=>({duration:DURATION,canvas:[W,H],fps:FPS});drawAt(0);
})();
</script>
</body>
</html>
