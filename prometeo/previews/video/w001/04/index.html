<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRAL · Apertura Festival de Cine</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111012;color:#efece5;font:14px/1.35 system-ui,Arial,sans-serif}main{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px}.frame{width:min(100%,1240px);background:#080809;box-shadow:0 20px 70px #0008;position:relative;aspect-ratio:16/9;overflow:hidden}canvas{width:100%;height:100%;display:block}.controls{width:min(100%,1240px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.title{margin-right:auto;font-weight:750;letter-spacing:.08em;font-size:12px}.title span{color:#f35542}.controls button{background:#ede8df;border:0;border-radius:3px;color:#161416;padding:12px 17px;cursor:pointer;font-weight:800;letter-spacing:.06em}.controls button:disabled{opacity:.4;cursor:wait}.controls input{accent-color:#f35542;flex:1;min-width:120px}.meta{width:min(100%,1240px);display:flex;justify-content:space-between;color:#9c9893;font-size:11px;letter-spacing:.08em}.meta a{color:inherit;text-decoration:underline}button:focus-visible,input:focus-visible{outline:2px solid #f35542;outline-offset:3px}@media(max-width:620px){main{padding:12px;justify-content:center}.controls{gap:8px}.title{width:100%;margin-right:0}.controls button{padding:11px 12px;font-size:11px}.meta{font-size:9px}}
</style></head><body><main>
<div class="frame"><canvas id="stage" width="1280" height="720" aria-label="Apertura animada UMBRAL, festival ficticio de cine"></canvas></div>
<div class="controls"><div class="title">UMBRAL <span>●</span> APERTURA / 2026</div><button id="play" type="button">REPRODUCIR</button><input id="scrub" type="range" min="0" max="12" step="0.01" value="0" aria-label="Buscar tiempo"><strong id="clock">00:00 / 00:12</strong><button id="export" type="button">EXPORTAR WEBM</button></div>
<div class="meta"><span>12 SEGUNDOS · 1280 × 720 · 30 FPS · IMÁGENES GENERADAS POR CÓDIGO</span><span>DISEÑO ORIGINAL · SIN ARCHIVOS DE TERCEROS</span></div>
</main><script>
'use strict';
const W=1280,H=720,D=12,canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('clock'),exportBtn=document.getElementById('export');
const C={ink:'#101011',paper:'#ece8de',red:'#f25540',dim:'#99958e'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const op=(t,a,b)=>ease((t-a)/(b-a));
const text=(str,x,y,size,weight=700,color=C.paper,align='left',track=0)=>{ctx.save();ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=`${weight} ${size}px Arial, Helvetica, sans-serif`;if(!track){ctx.fillText(str,x,y)}else{let widths=[...str].map(c=>ctx.measureText(c).width),total=widths.reduce((a,b)=>a+b,0)+track*(str.length-1),start=align==='center'?x-total/2:align==='right'?x-total:x;for(let i=0;i<str.length;i++){ctx.fillText(str[i],start,y);start+=widths[i]+track}}ctx.restore()};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x,y,x2,y2,c,lw=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke()}
function disk(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function ring(x,y,r,thick,c,phase=0,arc=Math.PI*2){ctx.beginPath();ctx.arc(x,y,r,phase,phase+arc);ctx.strokeStyle=c;ctx.lineWidth=thick;ctx.stroke()}
function header(t,section){text('UMBRAL / MOTION IDENT',58,51,15,700,C.paper,'left',2);text('EDICIÓN 2026',1222,51,13,600,C.paper,'right',1.1);line(58,66,1222,66,'#55514c',1);text(`0${section} / 04`,58,678,13,700,C.dim,'left',1.3);line(151,674,1090,674,'#383536',2);rect(151,673,939*clamp(t/12),3,C.red);text('12 SEC',1222,678,13,700,C.dim,'right',1)}
function draw(t){t=clamp(t,0,D);ctx.clearRect(0,0,W,H);rect(0,0,W,H,C.ink);
// A deterministic, fine projection texture. No external imagery.
for(let i=0;i<95;i++){let x=(i*379+Math.floor(t*24)*13)%W,y=(i*167+Math.floor(t*24)*17)%H;rect(x,y,1,1,'#292625')}
if(t<1.15){let k=op(t,.05,1.08);rect(640-4-600*k,0,8+1200*k,H,C.red);rect(640-2-595*k,0,4+1190*k,H,C.ink);ring(640,360,80+250*k,4,C.paper,Math.PI/8,Math.PI*1.68);text('UN FESTIVAL DE CINE',640,590,19,700,C.paper,'center',4)}
if(t>=1.15&&t<3.8){header(t,1);let k=op(t,1.2,1.65),exit=1-op(t,3.4,3.8);ctx.save();ctx.globalAlpha=exit;let r=270+48*Math.sin((t-1.15)*.9);disk(1037,360,r,C.red);ring(1037,360,r*.66,40,C.ink,0,Math.PI*1.7);ring(1037,360,r*.32,10,C.paper,-Math.PI/2,Math.PI*1.35);rect(55,146,8,300*k,C.red);text('EL CINE',92-55*(1-k),297,126,800,C.paper);text('SE ABRE.',92-55*(1-k),426,121,800,C.paper);text('UNA INVITACIÓN A CRUZAR EL MARCO',92,510,17,700,C.dim,'left',2.4);ctx.restore()}
if(t>=3.8&&t<6.3){let k=op(t,3.8,4.35),exit=1-op(t,5.95,6.3);rect(0,0,W*k,H,C.paper);ctx.save();ctx.globalAlpha=exit;let x=690+260*(1-k);rect(x,0,590,H,C.red);for(let i=0;i<5;i++){let r=140+i*95;ring(1003,350,r,8,C.ink,-2.3+t*.12,2.2)}text('OTRAS',76,268,132,850,C.ink);text('MIRADAS.',76,399,117,850,C.ink);rect(78,448,276*k,9,C.red);text('01 — 04 / IDENTIDAD EN MOVIMIENTO',77,543,17,700,C.ink,'left',2);ctx.restore();header(t,2)}
if(t>=6.3&&t<8.95){header(t,3);let k=op(t,6.3,7.1),r=160+95*k;ring(640,353,r,90,C.red,Math.PI*.02,(Math.PI*2)*k);ring(640,353,r-105,48,C.paper,Math.PI*(.5+(1-k)*1.0),Math.PI*1.50*k);rect(0,0,640-290*k,720,C.ink);rect(640+290*k,0,640-290*k,720,C.ink);text('UNA NUEVA',640,145,21,700,C.paper,'center',3.4);text('FORMA DE VER',640,587,23,750,C.paper,'center',3);text('UM / 26',640,633,14,700,C.dim,'center',3)}
if(t>=8.95){let k=op(t,8.95,9.55),fade=1-op(t,11.58,12);ctx.save();ctx.globalAlpha=fade;let r=225;ring(216,357,r,52,C.red,Math.PI*.08,Math.PI*1.62);ring(216,357,r-74,20,C.paper,-Math.PI*.5,Math.PI*1.25);rect(0,0,65,720,C.ink);rect(373,0,42,720,C.ink);ctx.save();ctx.translate(469+60*(1-k),370);ctx.scale(.93,1);text('UMBRAL',0,0,134,850,C.paper);ctx.restore();rect(472,400,686*k,6,C.red);text('FESTIVAL DE CINE',479,449,27,650,C.paper,'left',3.3);text('EDICIÓN IMAGINARIA · 2026',479,497,19,700,C.dim,'left',2.1);text('NO ES UN LUGAR. ES OTRA MIRADA.',479,565,14,700,C.paper,'left',2);ctx.restore();header(t,4)}
if(t>11.78)rect(0,0,W,H,`rgba(16,16,17,${op(t,11.78,12)})`);
}
let current=0,playing=false,start=0,raf=0,activeRecorder=null;
function frame(n){if(!playing)return;let t=clamp((n-start)/1000,0,D);current=t;draw(t);sync();if(t<D)raf=requestAnimationFrame(frame);else stop()}
function sync(){scrub.value=current.toFixed(2);clock.textContent=`00:${String(Math.floor(current)).padStart(2,'0')} / 00:12`}
function stop(){playing=false;cancelAnimationFrame(raf);playBtn.textContent='REPRODUCIR'}
function seek(t){current=clamp(t,0,D);draw(current);sync();if(playing)start=performance.now()-current*1000;return current}
function play(){if(playing){stop();return}if(current>=D)seek(0);playing=true;playBtn.textContent='PAUSAR';start=performance.now()-current*1000;raf=requestAnimationFrame(frame)}
playBtn.onclick=play;scrub.oninput=()=>seek(Number(scrub.value));window.seek=seek;window.drawFrame=draw;
function sound(ctx,dur){let rate=ctx.sampleRate,size=Math.ceil(rate*dur),buffer=ctx.createBuffer(1,size,rate),data=buffer.getChannelData(0);for(let i=0;i<size;i++){let t=i/rate,val=0;let bass=(Math.sin(t*2*Math.PI*55)+.4*Math.sin(t*2*Math.PI*82.4))*.045;val+=bass*Math.sin(Math.PI*clamp(t/.6))*clamp((dur-t)/.6);for(const beat of [0.25,1.15,3.8,6.3,8.95,11.54]){let d=t-beat;if(d>0&&d<.65)val+=.18*Math.exp(-d*18)*Math.sin(2*Math.PI*(92-35*d)*d)}val+=.006*Math.sin(2*Math.PI*(410+.8*t)*t);data[i]=Math.max(-.85,Math.min(.85,val))}return buffer}
async function exportWebM(){if(!canvas.captureStream||!window.MediaRecorder){alert('Este navegador no permite exportar WebM.');return}stop();seek(0);exportBtn.disabled=true;exportBtn.textContent='CODIFICANDO…';let stream=canvas.captureStream(0),track=stream.getVideoTracks()[0],mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';let ac=new AudioContext(),dest=ac.createMediaStreamDestination(),src=ac.createBufferSource();src.buffer=sound(ac,D);src.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});activeRecorder=recorder;let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise(resolve=>recorder.onstop=resolve);recorder.start();src.start();let began=performance.now();await new Promise(resolve=>{function step(now){let t=Math.min(D,(now-began)/1000);seek(t);track.requestFrame?.();if(t<D)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)});src.stop();recorder.stop();await done;let blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='UMBRAL-APERTURA-12s.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),20000);stream.getTracks().forEach(x=>x.stop());ac.close();activeRecorder=null;exportBtn.disabled=false;exportBtn.textContent='EXPORTAR WEBM';seek(0)}
exportBtn.onclick=()=>exportWebM().catch(e=>{console.error(e);alert('No se pudo exportar: '+e.message);exportBtn.disabled=false;exportBtn.textContent='EXPORTAR WEBM'});seek(0);
</script></body></html>
