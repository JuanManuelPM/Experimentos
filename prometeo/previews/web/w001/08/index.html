function addStars(){var group=document.getElementById('stars'),s=119;for(var i=0;i<132;i++){s=(s*16807)%2147483647;var x=(s%1440);s=(s*16807)%2147483647;var y=s%525;s=(s*16807)%2147483647;var circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',s%9===0?'1.6':'.7');circle.setAttribute('fill','#f9f0d9');circle.setAttribute('opacity',String(.34+(s%50)/100));group.appendChild(circle);}}

function render(announce){root.className='experience scene-'+active+(lit?'':' lamp-off');title.textContent=scenes[active].title;desc.textContent=scenes[active].body;document.getElementById('time').textContent=scenes[active].time;document.getElementById('chapter').textContent=scenes[active].chapter;document.getElementById('current').textContent=String(active+1).padStart(2,'0');previous.disabled=active===0;next.disabled=active===scenes.length-1;Array.prototype.forEach.call(steps.children,function(button,i){if(i===active)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});story.classList.remove('reveal');void story.offsetWidth;story.classList.add('reveal');if(announce)document.getElementById('announcement').textContent='Escena '+(active+1)+' de 5. '+scenes[active].title;}
function setScene(index,user){var nextIndex=Math.max(0,Math.min(scenes.length-1,index));if(nextIndex===active)return;active=nextIndex;render(true);history.replaceState(null,'','#escena-'+(active+1));if(playing&&user)arm();if(playing&&active===scenes.length-1)pause();}
function arm(){clearTimeout(timer);if(playing&&document.visibilityState!=='hidden'){timer=setTimeout(function(){if(active<scenes.length-1){setScene(active+1,false);if(playing)arm();}else pause();},interval);}}
function pause(){playing=false;clearTimeout(timer);playBtn.setAttribute('aria-pressed','false');document.getElementById('play-icon').textContent='▶';document.getElementById('play-label').textContent='Reproducir';}
function play(){if(active===scenes.length-1)setScene(0,true);playing=true;playBtn.setAttribute('aria-pressed','true');document.getElementById('play-icon').textContent='Ⅱ';document.getElementById('play-label').textContent='Pausar';arm();}
scenes.forEach(function(scene,i){var btn=document.createElement('button');btn.type='button';btn.className='step';btn.setAttribute('aria-label','Ir a escena '+(i+1)+': '+scene.chapter);var span=document.createElement('span');span.setAttribute('aria-hidden','true');btn.appendChild(span);btn.addEventListener('click',function(){setScene(i,true);});steps.appendChild(btn);});
previous.addEventListener('click',function(){setScene(active-1,true);});next.addEventListener('click',function(){setScene(active+1,true);});
playBtn.addEventListener('click',function(){playing?pause():play();});
lightBtn.addEventListener('click',function(){lit=!lit;root.classList.toggle('lamp-off',!lit);lightBtn.setAttribute('aria-pressed',String(lit));document.getElementById('light-label').textContent=lit?'Luz encendida':'Luz apagada';document.getElementById('announcement').textContent=lit?'Faro encendido':'Faro apagado';});
window.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey||e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();setScene(active-1,true);}if(e.key==='ArrowRight'){e.preventDefault();setScene(active+1,true);}if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?pause():play();}});
window.addEventListener('hashchange',function(){var m=/^#escena-([1-5])$/.exec(location.hash);if(m)setScene(Number(m[1])-1,true);});
document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(timer);else arm();});
var sx=0,sy=0;root.addEventListener('touchstart',function(e){if(e.target.closest('button'))return;sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;},{passive:true});
root.addEventListener('touchend',function(e){if(e.target.closest('button'))return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.7)setScene(active+(dx<0?1:-1),true);},{passive:true});
addStars();addRain();if(reduced)pause();render(false);
})();
</script>
</body>
</html>
