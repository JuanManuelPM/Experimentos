<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0c14">
<title>ARCADE / 86 · PROMETEO 3D · V3</title>
<meta name="description" content="Salón arcade 3D: seis máquinas, juego real y pantallas de contenido intercambiable.">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c14;color:#eee8d7}
button{font:700 12px/1 system-ui;letter-spacing:.1em;cursor:pointer;color:inherit;user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid #9deedc}
#stage{position:fixed;inset:0;z-index:0;touch-action:none}#stage canvas{width:100%;height:100%;display:block}
#top{position:absolute;z-index:2;top:0;left:0;right:0;padding:max(15px,env(safe-area-inset-top)) 20px 13px;background:linear-gradient(#0a0b16dc,transparent);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:900;letter-spacing:.2em;color:#e7d5b8}.brand:before{content:"";width:7px;height:7px;border-radius:100%;background:#89eacf;box-shadow:0 0 15px #89eacf}
.meta{font-size:10px;letter-spacing:.15em;color:#b1acb6}
#panel{position:absolute;z-index:5;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(660px,90vw);pointer-events:none}
.machine{width:100%;display:flex;align-items:center;justify-content:center;gap:15px;background:#111525de;border:1px solid #77687888;border-radius:15px;padding:9px 13px;backdrop-filter:blur(12px);pointer-events:auto}
.name{flex:1;min-width:0;text-align:center}#machineTitle{font-weight:900;font-size:13px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#machineSub{font-size:10px;color:#a6aabb;margin-top:5px}#counter{font-size:10px;color:#bdb7b7;white-space:nowrap}
.mini{width:34px;height:34px;border-radius:50%;background:#20273b;border:1px solid #7d788555;font-size:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.action{min-height:42px;padding:0 13px;border-radius:8px;border:1px solid #a29a9c65;background:#1a2135df}
.primary{background:#d7a86f;color:#1a1721;border-color:#ffce98}
.action:active,.mini:active,.pad:active{transform:scale(.95);filter:brightness(1.2)}
#move{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:14px;z-index:4;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,40px);gap:4px}
.pad{background:#111525b7;border:1px solid #aaa7b477;color:#f9dbab;border-radius:10px;font-size:19px;backdrop-filter:blur(8px);touch-action:none}
#forward{grid-column:2;grid-row:1}#turnLeft{grid-column:1;grid-row:2}#back{grid-column:2;grid-row:2}#turnRight{grid-column:3;grid-row:2}
#fire{position:absolute;right:18px;bottom:max(30px,env(safe-area-inset-bottom));z-index:4;width:61px;height:61px;border-radius:50%;border:2px solid #fcd4b0;background:#823e69aa;color:#ffe2c6;font-size:22px;touch-action:none}
#hint{position:absolute;bottom:144px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;white-space:nowrap;color:#d9c7b3a0;font-size:9px;letter-spacing:.17em;text-shadow:0 1px 8px #090912}
#notice{position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);max-width:min(540px,90vw);background:#201722;border:1px solid #e5a0a0;padding:22px;border-radius:12px;color:#ffe5d0;box-shadow:0 0 45px #000;line-height:1.5;font-size:13px}
[hidden]{display:none!important}
#gameLayer{position:fixed;inset:0;z-index:30;background:#0b0c14ed;padding:18px 12px 12px;display:flex;flex-direction:column;gap:8px}
#gameLayer header{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.11em;font-weight:800}
#closeGame{height:38px;min-width:75px;border:1px solid #aaa;border-radius:8px;background:#24293c}
#gameFrame{flex:1;width:100%;background:#111;border:1px solid #6b7180;border-radius:6px}
@media(max-width:650px){
 #panel{width:calc(100vw - 174px);max-width:430px;bottom:12px;gap:6px}
 .machine{padding:5px;gap:6px}#machineTitle{font-size:10px;letter-spacing:.05em}#machineSub{font-size:9px}#counter{font-size:8px}.mini{height:28px;width:28px;font-size:17px}
 .actions{gap:4px}.action{min-height:30px;padding:0 7px;font-size:9px;letter-spacing:0}
 #move{bottom:13px;left:8px;grid-template-columns:repeat(3,35px);grid-template-rows:repeat(2,35px);gap:3px}#fire{right:8px;bottom:21px;width:48px;height:48px}
 #hint{bottom:112px;font-size:8px}#top{padding:8px 12px}.meta{font-size:8px}.brand{font-size:9px}
}
@media(max-height:440px){#hint{bottom:112px}#panel{bottom:8px}}

/* V3 presentation: no persistent diagnostic panel. Contextual secondary controls. */
#top{padding:10px 14px;background:none}.meta{display:none}
#hint{top:38px;bottom:auto;white-space:normal;text-align:center;max-width:80vw}
#panel{width:auto;max-width:calc(100vw - 18px);bottom:max(12px,env(safe-area-inset-bottom));gap:4px}
.primaryRow{display:flex;gap:6px;pointer-events:auto;order:2}
#panel .machine,#extraActions{display:none}
#panel.open .machine,#panel.open #extraActions{display:flex}
#panel.open{background:#101320ed;border:1px solid #8f819166;border-radius:14px;padding:8px;max-width:95vw;width:min(400px,95vw)}
#panel.open .machine{width:100%;order:0}#panel.open .actions{order:1}
#panel .action,#panel .mini,#closeGame{min-height:44px;min-width:44px;font-size:11px}
#move{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:3px;bottom:max(10px,env(safe-area-inset-bottom))}
#fire{display:none;width:52px;height:52px;bottom:max(12px,env(safe-area-inset-bottom))}
body.playing #fire{display:block}
@media(max-width:480px){#panel:not(.open){left:auto;right:8px;transform:none}body.playing #panel:not(.open){right:67px}#hint{font-size:9px}#top{padding:8px 12px}}
@media (pointer:fine){#move{opacity:.55}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js"}}</script>
</head><body>
<main id="stage" aria-label="Sala 3D explorable"></main>
<header id="top"><div class="brand">PROMETEO / ARCADE</div><div class="meta">STUDIO 3D · V3 · 06 MACHINES</div></header>
<div id="hint">ARRASTRÁ PARA MIRAR · WASD PARA CAMINAR · E PARA JUGAR</div>
<nav id="move" aria-label="Movimiento"><button id="forward" class="pad" aria-label="Avanzar">↑</button><button id="turnLeft" class="pad" aria-label="Girar izquierda">←</button><button id="back" class="pad" aria-label="Retroceder">↓</button><button id="turnRight" class="pad" aria-label="Girar derecha">→</button></nav>
<button id="fire" aria-label="Disparar">●</button>
<div id="panel"><div class="primaryRow"><button id="play" class="action primary">JUGAR</button><button id="menuToggle" class="action" aria-expanded="false" aria-label="Abrir controles">☰</button></div>
 <div class="machine"><button id="prev" class="mini" aria-label="Máquina anterior">‹</button><div class="name"><div id="machineTitle">NEBULA RUN</div><div id="machineSub"></div></div><span id="counter">02 / 06</span><button id="next" class="mini" aria-label="Máquina siguiente">›</button></div>
 <div class="actions" id="extraActions"><button id="focus" class="action">ACERCAR</button><button id="media" class="action">IMAGEN / VIDEO</button><button id="own" class="action">JUEGO HTML</button><button id="clearMedia" class="action" hidden>RESTABLECER</button></div>
</div>
<input type="file" id="imageInput" accept="image/*,video/*" hidden>
<input type="file" id="gameInput" accept=".html,.htm,text/html" hidden>
<div id="notice" role="alert" hidden></div>
<div id="gameLayer" hidden><header><span>JUEGO PERSONAL · ARCHIVO LOCAL</span><button id="closeGame">CERRAR</button></header><iframe id="gameFrame" title="Juego propio" sandbox="allow-scripts allow-pointer-lock"></iframe></div>
<script>
window.addEventListener("error",e=>{const n=document.querySelector("#notice");n.hidden=false;n.textContent="NETWORK / MODULE · "+(e.message||"Error desconocido de carga");});
window.addEventListener("unhandledrejection",e=>{const n=document.querySelector("#notice");n.hidden=false;n.textContent="MODULE / ASSET · "+(e.reason?.message||String(e.reason));});
</script>
<script>const p=document.getElementById("panel"),m=document.getElementById("menuToggle");m.onclick=()=>{const open=p.classList.toggle("open");m.setAttribute("aria-expanded",String(open));};document.getElementById("stage").addEventListener("pointerdown",()=>{p.classList.remove("open");m.setAttribute("aria-expanded","false")});</script><script type="module" src="./app.mjs"></script>
</body></html>
