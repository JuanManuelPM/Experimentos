<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101817">
<meta name="description" content="ARCHIVO 05: un pequeño puzle físico 3D. Apilá dos módulos sobre un sensor para abrir la compuerta.">
<title>ARCHIVO 05 · El peso de la puerta</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2e9;background:#101817}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{touch-action:manipulation}
#world{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#2e4240,#111d1c 60%,#0c1212);touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.logo{display:flex;gap:9px;align-items:center;letter-spacing:.13em;font-size:11px;font-weight:700;text-transform:uppercase;text-shadow:0 2px 20px #101817aa}
.mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid #d5dfce8a;border-radius:50%;font-size:12px;letter-spacing:0}
.sub{display:block;opacity:.54;letter-spacing:.10em;font-weight:500;margin-top:3px;font-size:9px}
#timer{font-variant-numeric:tabular-nums;text-align:right;font-size:20px;font-weight:300;letter-spacing:.06em;line-height:1.15}#timer small{display:block;font-size:9px;letter-spacing:.2em;font-weight:700;opacity:.48}
#bottom{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;align-items:end;justify-content:space-between;gap:12px;pointer-events:none}
.info{background:#101817cc;border:1px solid #a4b1a044;border-radius:12px;padding:11px 14px;max-width:330px;backdrop-filter:blur(12px);pointer-events:auto}
.kicker{display:block;color:#b7c49e;text-transform:uppercase;letter-spacing:.17em;font-size:9px;font-weight:800}
#mission{display:block;margin-top:5px;font-size:12px;line-height:1.4;color:#e4e8df}
#status{display:block;color:#d7b980;font-size:10px;line-height:1.2;margin-top:5px;min-height:1.2em}
.controls{display:flex;gap:7px;align-items:center;pointer-events:auto}
.ctrl{border:1px solid #dae4d36b;background:#162220e8;color:#e8f0e5;min-width:46px;min-height:46px;padding:0 12px;border-radius:9px;font:700 11px/1.1 inherit;letter-spacing:.04em;cursor:pointer;user-select:none;touch-action:none;backdrop-filter:blur(10px)}
.ctrl:active,.ctrl.pressed{background:#cad8bc;color:#17201d}.ctrl:focus-visible{outline:2px solid #e3c788;outline-offset:3px}
.ctrl.accent{border-color:#d4c08a;color:#e7d39c}.ctrl.disabled{opacity:.35}
#dpad{display:none;gap:3px;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);align-items:center;justify-items:center}
#dpad .ctrl{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;font-size:17px}
#dpad [data-control="up"]{grid-column:2;grid-row:1}#dpad [data-control="left"]{grid-column:1;grid-row:2}#dpad [data-control="down"]{grid-column:2;grid-row:2}#dpad [data-control="right"]{grid-column:3;grid-row:2}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#09110fc9;backdrop-filter:blur(7px);padding:24px}#end.visible{display:flex}
.end-card{max-width:380px;width:100%;text-align:center;border:1px solid #d7c99c66;background:#1a2522;padding:35px 26px;border-radius:17px;box-shadow:0 20px 90px #0008}
.end-card .number{font-size:12px;letter-spacing:.3em;color:#d7bf89}#endTitle{font-size:clamp(28px,7vw,48px);font-weight:300;letter-spacing:-.04em;margin:10px 0}#endDesc{font-size:13px;color:#bec9be;line-height:1.55;margin:0 0 24px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101817;color:#d7cfae;font-size:11px;letter-spacing:.18em;z-index:15;text-align:center;padding:32px}
#loading.hidden{display:none}
#hudToggle{position:fixed;top:67px;right:18px;pointer-events:auto;border:0;background:#10181799;color:#c6d0bc;border-radius:5px;font-size:10px;padding:7px 10px;cursor:pointer}
body.hide-hud #bottom{display:none}
@media(hover:none),(pointer:coarse){#dpad{display:grid}.info{max-width:200px;padding:9px 10px}.controls{gap:4px}.ctrl{min-width:44px;padding:0 8px}}
@media(max-width:650px){#bottom{left:7px;right:7px;gap:4px}.controls{gap:3px}.ctrl{min-width:43px;padding:0 6px;font-size:10px}.info{max-width:145px;padding:8px}#mission{font-size:11px}.kicker{font-size:8px}.sub{display:none}}
@media(max-height:500px){#top{top:7px}.info{max-width:190px}.ctrl{min-height:43px}#dpad{grid-template-rows:repeat(2,43px)}#bottom{bottom:6px}#hudToggle{top:39px}}
</style>
</head>
<body>
<main id="world" aria-label="Escena 3D del puzle físico"></main>
<header id="top"><div class="logo"><span class="mark">05</span><div>ARCHIVO / PUZLE FÍSICO<span class="sub">El peso de la puerta</span></div></div><div id="timer"><small>TIEMPO</small><span id="timeText">01:40</span></div></header>
<button id="hudToggle" aria-label="Ocultar o mostrar controles">HUD</button>
<div id="bottom"><div class="info"><span class="kicker" id="phase">OBJETIVO · 00 / 02</span><span id="mission">Apilá los dos módulos sobre la plataforma iluminada.</span><span id="status">Tocá una caja para seleccionarla.</span></div>
<div class="controls">
<div id="dpad" aria-label="Movimiento en el plano"><button class="ctrl" data-control="up" aria-label="Avanzar">↑</button><button class="ctrl" data-control="left" aria-label="Izquierda">←</button><button class="ctrl" data-control="down" aria-label="Retroceder">↓</button><button class="ctrl" data-control="right" aria-label="Derecha">→</button></div>
<button class="ctrl" data-control="lift" title="Espacio" aria-label="Alzar caja">ALZAR</button><button class="ctrl" data-control="lower" title="Shift" aria-label="Bajar caja">BAJAR</button>
<button id="release" class="ctrl accent" title="Escape">SOLTAR</button><button id="reset" class="ctrl" title="R" aria-label="Reiniciar partida">↻</button>
</div></div>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle"><div class="end-card"><span class="number">ARCHIVO 05 / REGISTRO</span><h1 id="endTitle">Mecanismo abierto.</h1><p id="endDesc">El peso está donde debe estar.</p><button id="replay" class="ctrl accent" style="padding:0 22px">VOLVER A INTENTAR</button></div></div>
<div id="loading" role="status">INICIANDO SIMULACIÓN FÍSICA...</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module" src="./game.mjs"></script>
</body>
</html>
