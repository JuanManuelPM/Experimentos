<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c111c">
<title>LÚMEA · Criatura fantástica · Estudio 3D</title>
<meta name="description" content="Criatura fantástica original, malla 3D editable, seis apéndices animados y emociones por mirada y cuerpo.">
<style>
:root{color-scheme:dark;--ink:#ebe7ec;--sub:#a8aebb;--line:rgba(242,237,244,.19);--panel:rgba(16,21,34,.68)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse 65% 80% at 56% 52%,#31314c 0%,#172032 47%,#0a111d 100%)}
#viewport{position:fixed;inset:0;touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}
#viewport canvas{display:block;width:100%;height:100%}
header{position:absolute;top:calc(18px + env(safe-area-inset-top));left:clamp(16px,4vw,54px);right:16px;pointer-events:none;display:flex;align-items:baseline;gap:13px}
header strong{font:500 clamp(18px,2.2vw,29px)/1 Georgia,serif;letter-spacing:.19em}
header span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--sub)}
#tag{position:absolute;top:calc(64px + env(safe-area-inset-top));left:clamp(16px,4vw,54px);font-size:11px;max-width:185px;line-height:1.5;color:rgba(220,226,237,.67);pointer-events:none}
footer{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(16px);box-shadow:0 9px 38px #080d1770;white-space:nowrap}
button{border:0;background:transparent;color:#d2d6df;border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;font:500 11px/1.1 inherit;letter-spacing:.035em}
button:hover{background:#ffffff17}button[aria-pressed=true]{background:#d5dfe4;color:#18202c}
#export{border-left:1px solid var(--line);border-radius:0 9px 9px 0;color:#b8e6df}
#status{position:absolute;bottom:calc(87px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;pointer-events:none;color:#b7c1ca;font-size:10px;letter-spacing:.12em}
.hint{position:absolute;bottom:calc(23px + env(safe-area-inset-bottom));right:clamp(15px,3vw,43px);font-size:10px;color:#909aa8;pointer-events:none}
@media(max-width:670px){header{top:calc(14px + env(safe-area-inset-top))}#tag{top:calc(45px + env(safe-area-inset-top));font-size:10px;max-width:155px}
footer{bottom:calc(10px + env(safe-area-inset-bottom));max-width:calc(100vw - 14px)}button{font-size:10px;padding:11px 9px}.hint{display:none}#status{bottom:calc(72px + env(safe-area-inset-bottom))}}
@media(max-height:480px){#tag{display:none}header{top:8px}footer{bottom:8px}#status{bottom:62px}}
@media(prefers-reduced-motion:reduce){footer{backdrop-filter:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
</head><body>
<main id="viewport" aria-label="Visor tridimensional de Lúmea"></main>
<header><strong>LÚMEA</strong><span>Estudio de criatura · 004</span></header>
<p id="tag">Seis extremidades, dos velos membranosos, tres ojos. Ninguna especie conocida.</p>
<footer aria-label="Emociones del personaje">
<button type="button" data-mood="curiosa" aria-pressed="true">Curiosa</button>
<button type="button" data-mood="alegre" aria-pressed="false">Alegre</button>
<button type="button" data-mood="cautelosa" aria-pressed="false">Cautelosa</button>
<button type="button" id="reset" aria-label="Centrar cámara">Centrar</button>
<button type="button" id="export" aria-label="Exportar pose del personaje a GLB">GLB ↓</button>
</footer>
<span id="status" role="status" aria-live="polite">Preparando modelo tridimensional…</span>
<span class="hint">Arrastrar para orbitar · pellizcar para acercar</span>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {createCreature} from './creature.mjs';
const mount=document.getElementById('viewport'),status=document.getElementById('status');
let renderer;
try {
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
} catch(err) {
  status.textContent='Este dispositivo no pudo iniciar WebGL: '+String(err.message||err);
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.44;
mount.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.1,70);
camera.position.set(3.1,1.18,7.45);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-.18,0);controls.enableDamping=true;
controls.dampingFactor=.07;controls.enablePan=false;
controls.minDistance=3.6;controls.maxDistance=12;
controls.minPolarAngle=.34;controls.maxPolarAngle=Math.PI-.34;
controls.rotateSpeed=.72;controls.zoomSpeed=.84;
controls.update();
scene.add(new THREE.HemisphereLight(0xd4e7ff,0x362c48,2.0));
const addLight=(color,intensity,x,y,z)=>{const l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);scene.add(l)};
addLight(0xe6d7f6,3.35,-3,6,5);
addLight(0xa9f7ea,3.55,4,2,-3);
addLight(0xe5a9c5,1.4,-4,-2,-3);
const sculpture=createCreature();scene.add(sculpture.root);
const dust=new THREE.Group();scene.add(dust);
const dustMat=new THREE.MeshBasicMaterial({color:0x9edbd7,transparent:true,opacity:.31});
const dustGeo=new THREE.IcosahedronGeometry(.025,0);
for(let i=0;i<37;i++){
  const m=new THREE.Mesh(dustGeo,dustMat);
  const a=i*2.399963,r=1.95+(i%7)*.29;
  m.position.set(Math.cos(a)*r,((i*19)%29)/7-2.1,Math.sin(a)*r-1.2);
  m.userData.seed=i;dust.add(m);
}
let mood='curiosa',look={x:0,y:0},targetLook={x:0,y:0};
let dragging=false;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons)return;
  const b=renderer.domElement.getBoundingClientRect();
  targetLook.x=((e.clientX-b.left)/b.width-.5)*1.8;
  targetLook.y=(.5-(e.clientY-b.top)/b.height)*1.8;
},{passive:true});
renderer.domElement.addEventListener('pointerleave',()=>{targetLook.x=0;targetLook.y=0});
for(const button of document.querySelectorAll('[data-mood]'))button.addEventListener('click',()=>{
  mood=button.dataset.mood;
  for(const b of document.querySelectorAll('[data-mood]'))b.setAttribute('aria-pressed',String(b===button));
  status.textContent=({curiosa:'La mirada investiga el entorno',alegre:'Los velos se abren y el cuerpo salta',cautelosa:'Las extremidades se retraen'})[mood];
});
document.getElementById('reset').addEventListener('click',()=>{
  camera.position.set(3.1,1.18,7.45);
  controls.target.set(0,-.18,0);controls.update();
});
document.getElementById('export').addEventListener('click',async e=>{
  e.currentTarget.disabled=true;
  status.textContent='Preparando pose GLB…';
  try{
    const temp=new THREE.Scene();
    temp.add(sculpture.root.clone(true));
    const output=await new GLTFExporter().parseAsync(temp,{binary:true,trs:true,onlyVisible:true});
    const url=URL.createObjectURL(new Blob([output],{type:'model/gltf-binary'}));
    const a=document.createElement('a');a.href=url;a.download='LUMEA_creature_pose.glb';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    status.textContent='GLB de la pose exportado · animación editable en creature.mjs';
  }catch(err){
    console.error(err);status.textContent='No se pudo exportar GLB: '+String(err.message||err);
  }finally{e.currentTarget.disabled=false}
});
function resize(){
  const w=mount.clientWidth,h=mount.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?42:36;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null)});
renderer.domElement.addEventListener('webglcontextlost',e=>{
  e.preventDefault();renderer.setAnimationLoop(null);
  status.textContent='Contexto gráfico perdido · recargar para reanudar';
});
resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const elapsed=clock.getElapsedTime();
  look.x+=(targetLook.x-look.x)*.055;
  look.y+=(targetLook.y-look.y)*.055;
  sculpture.update(elapsed,mood,look);
  dust.children.forEach(p=>{p.position.y+=Math.sin(elapsed*.28+p.userData.seed)*.0009});
  controls.update();
  renderer.render(scene,camera);
});
status.textContent='Modelo 3D original · fuente editable y exportación GLB';
setTimeout(()=>{if(status.textContent.startsWith('Modelo'))status.textContent=''},5500);
</script>
</body></html>
