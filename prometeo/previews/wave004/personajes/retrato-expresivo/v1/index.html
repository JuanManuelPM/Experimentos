<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121c23">
<meta name="description" content="Nara: un personaje ilustrado 2.5D original con expresiones faciales, mirada y gestos, presentado como recurso editable de PROMETEO Estudio 3D.">
<title>NARA — Retrato expresivo | PROMETEO</title>
<style>
:root{color-scheme:dark;--paper:#d7c4a4;--fg:#f1e7d7;--muted:#c4b8a7;--line:rgba(237,221,197,.25);--red:#cc835d;--bg:#141e26;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
button,a{font:inherit}button{cursor:pointer}a{color:inherit}.scene{position:relative;width:100%;height:100svh;min-height:390px;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 52% 68% at 55% 51%,#425259 0%,#263943 37%,#16242d 67%,#101920 100%)}
.scene:before{content:"";position:absolute;inset:-10%;background:repeating-linear-gradient(112deg,transparent 0 4px,rgba(251,223,182,.008) 4px 5px),radial-gradient(ellipse 35% 45% at 53% 50%,rgba(234,166,118,.12),transparent);pointer-events:none}
.scene:after{content:"";position:absolute;inset:0;border:clamp(8px,1.7vw,24px) solid #c1a47b20;pointer-events:none;z-index:4}
.graphic-orbit{position:absolute;width:min(84vmin,700px);height:min(84vmin,700px);border:1px solid #c4ac8b33;border-radius:50%;left:52%;top:47%;transform:translate(-50%,-50%);pointer-events:none}
.graphic-orbit:after{content:"";position:absolute;inset:7%;border:1px solid #bd92743b;border-radius:50%;border-bottom-color:transparent;border-right-color:transparent;transform:rotate(27deg)}
.cross{position:absolute;width:14px;height:14px;opacity:.5;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#d8ad78}.cross:before{top:6px;left:0;width:14px;height:1px}.cross:after{left:6px;top:0;width:1px;height:14px}.cross.c1{top:25%;left:21%}.cross.c2{right:19%;bottom:24%}
#stage{position:absolute;inset:0;perspective:1050px;touch-action:none;cursor:grab;z-index:1}#stage:active{cursor:grabbing}
#shell{position:absolute;left:50%;bottom:-7.5vh;width:min(92vw,75vh,760px);height:min(112vw,93vh,920px);transform:translateX(-50%);transform-style:preserve-3d;will-change:transform;transition:transform .34s cubic-bezier(.2,.7,.1,1)}
#portraitFloat{width:100%;height:100%;animation:breath 7s ease-in-out infinite;transform-origin:50% 72%}
#art{height:100%;width:100%;border:0;overflow:visible;filter:drop-shadow(0 28px 16px #07141a38);pointer-events:none}
@keyframes breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.006)}}
.meta{position:absolute;z-index:5;left:clamp(22px,5vw,70px);top:clamp(22px,5vh,56px);pointer-events:none}.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#edcc9b;opacity:.9;font-weight:700}.eyebrow:before{content:"";height:1px;width:24px;background:#dda87a}.meta h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.07em;font-size:clamp(53px,10vw,122px);font-weight:400;line-height:.88;margin:18px 0 12px;color:#fff0d3;text-shadow:0 2px 35px #14273544}.meta p{color:#e4c8aa;font-size:clamp(11px,1.4vw,15px);letter-spacing:.07em;margin:0;max-width:240px;line-height:1.65}
.serial{position:absolute;right:clamp(22px,4vw,58px);top:clamp(24px,5vh,60px);font-size:11px;letter-spacing:.18em;text-align:right;line-height:2.1;color:#d8bfa4a0;z-index:5;pointer-events:none}.serial strong{font-size:14px;color:#e6c79c;font-weight:500}
.hint{position:absolute;left:clamp(24px,5vw,66px);bottom:clamp(115px,16vh,170px);font-size:11px;letter-spacing:.08em;line-height:1.7;color:#dfc5a7b7;z-index:5;pointer-events:none}.hint strong{display:block;font-size:12px;color:#e6c9a8;font-weight:500}
.dock{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:4px;padding:6px;border:1px solid var(--line);background:#17252dd9;backdrop-filter:blur(18px);box-shadow:0 14px 50px #05151a80;border-radius:100px;max-width:calc(100% - 26px)}
.dock button{min-height:48px;min-width:48px;flex:1 1 auto;padding:0 13px;border-radius:100px;border:1px solid transparent;background:transparent;color:#e8d6c3;display:flex;gap:7px;justify-content:center;align-items:center;white-space:nowrap;font-size:12px;letter-spacing:.02em;transition:background .2s,color .2s,border-color .2s}
.dock button:hover,.dock button:focus-visible{background:#35505a;outline:none}.dock button[aria-pressed=true]{background:#d8ad79;color:#14222b;font-weight:700}.dock .symbol{font-size:16px;line-height:1}
.utility{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));right:clamp(20px,3vw,52px);z-index:8;display:flex;gap:9px}.utility a,.utility button{border:1px solid #dac4a758;background:#192b33b0;color:#e6d3b7;border-radius:100px;min-height:46px;min-width:46px;display:grid;place-items:center;text-decoration:none;padding:0 14px;font-size:12px;backdrop-filter:blur(12px)}.utility button:hover,.utility a:hover{background:#33515a}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.15em;color:#e9d7bc;background:#1d2c33;padding:16px 22px;z-index:10}
@media(max-width:680px){.meta{top:24px;left:24px}.meta h1{font-size:68px;margin:15px 0 8px}.meta p{max-width:170px}.serial{top:27px;right:22px;font-size:9px}.serial strong{font-size:11px}#shell{bottom:7.5vh;width:min(120vw,78vh);height:min(145vw,95vh);left:54%}.hint{display:none}.dock{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);justify-content:space-between}.dock button{padding:0 7px;min-width:42px;font-size:10px;flex-direction:column;gap:1px;min-height:58px}.dock .symbol{font-size:19px}.utility{bottom:90px;right:14px}.utility a,.utility button{min-height:44px;min-width:44px;padding:0 11px}}
@media(max-height:540px){.meta h1{font-size:55px}.meta p,.hint{display:none}.serial{top:22px}#shell{bottom:-39vh;width:min(68vw,88vh);height:min(90vw,116vh)}.dock{bottom:8px}}
@media(prefers-reduced-motion:reduce){#portraitFloat{animation:none}#shell{transition:none}}
body.embed .meta,body.embed .serial,body.embed .hint,body.embed .dock,body.embed .utility{display:none}body.embed .scene{background:transparent}body.embed .scene:before,body.embed .scene:after{display:none}body.embed .graphic-orbit,body.embed .cross{display:none}body.embed #shell{width:min(100%,78vh);height:min(120%,94vh);bottom:0}
</style>
</head>
<body>
<main class="scene" aria-label="Visor interactivo de Nara">
  <div class="graphic-orbit"></div><div class="cross c1"></div><div class="cross c2"></div>
  <header class="meta"><div class="eyebrow">PROMETEO / PERSONAJES 01</div><h1>Nara<span style="color:#d7a77d">.</span></h1><p>Restauradora de mapas.<br>Una cara, muchas historias.</p></header>
  <div class="serial">RETRATO EXPRESIVO<br><strong>EDICIÓN 01 / 2026</strong><br>VECTOR · 2.5D</div>
  <div id="stage" aria-label="Arrastrá para inclinar el retrato y dirigir su mirada"><div id="shell"><div id="portraitFloat"><object id="art" type="image/svg+xml" data="./character.svg" aria-label="Ilustración original de Nara con ojos y boca animables"></object></div></div></div>
  <div class="hint"><strong>Una actriz de papel.</strong>Mové el puntero para dirigir su mirada.<br>Arrastrá el retrato para cambiar la perspectiva.</div>
  <nav class="dock" aria-label="Expresiones de Nara">
    <button type="button" data-expression="serena" aria-label="Expresión serena" aria-pressed="true"><span class="symbol">◌</span>Serena</button>
    <button type="button" data-expression="sonrisa" aria-label="Expresión sonriente" aria-pressed="false"><span class="symbol">✦</span>Sonrisa</button>
    <button type="button" data-expression="duda" aria-label="Expresión de duda" aria-pressed="false"><span class="symbol">⌁</span>Duda</button>
    <button type="button" data-expression="sorpresa" aria-label="Expresión sorprendida" aria-pressed="false"><span class="symbol">◉</span>Sorpresa</button>
    <button type="button" data-expression="tristeza" aria-label="Expresión triste" aria-pressed="false"><span class="symbol">﹀</span>Tristeza</button>
  </nav>
  <div class="utility"><button type="button" id="reset" title="Recentrar retrato" aria-label="Recentrar">↺</button><a href="./character.svg" download="Nara-original.svg" title="Descargar personaje SVG editable" aria-label="Obtener archivo SVG original">SVG ↓</a></div>
  <div id="status" aria-live="polite">PREPARANDO RETRATO</div>
</main>
<script src="./viewer.js" defer></script>
</body>
</html>
