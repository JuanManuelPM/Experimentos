<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocho identidades · SVG</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#18201e;color:#e6e2d7;margin:0;padding:25px max(20px,5vw)}h1{font:normal clamp(34px,6vw,70px)/1 Georgia,serif;letter-spacing:-.06em;margin:18px 0 6px}.sub{color:#9dab9f;font-size:13px;line-height:1.5;margin-bottom:32px}a{color:inherit}.back{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#dac394}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}.card{text-decoration:none;display:block;background:#2c3831;border:1px solid #586258;padding:13px}.card:hover,.card:focus-visible{border-color:#e7bd7a}.card img{display:block;width:100%;height:260px;object-fit:contain;background:radial-gradient(#7a817288,#29362f);margin-bottom:10px}.card b{font-size:13px;letter-spacing:.14em}.card span{float:right;color:#e7bd7a;font-size:10px}.note{margin-top:28px;color:#98aa9e;font-size:11px;line-height:1.6}</style></head><body><a class="back" href="../">← Volver a la presentación</a><h1>Ocho archivos.</h1><p class="sub">SVG editables y originales. Tocá cada figura para abrir el archivo vectorial individual.</p><div class="grid" id="grid"></div><p class="note">Animaciones disponibles en la presentación principal. Estos recursos son ilustraciones SVG: no incluyen mallas 3D, esqueletos ni clips GLB.</p><script>const people=[["01","IRIS"],["02","BRUNO"],["03","LILA"],["04","MORA"],["05","ELIO"],["06","NARA"],["07","ADA"],["08","TEO"]];document.getElementById("grid").innerHTML=people.map(([n,name])=>{const f=n+"-"+name.toLowerCase()+".svg";return '<a class="card" href="'+f+'" download><img src="'+f+'" alt="Ilustración de '+name+'"><b>'+n+' / '+name+'</b><span>SVG ↓</span></a>'}).join("")</script></body></html>
