<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ORBITAL 001 · PROMETEO</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090f17;color:#e0edf2;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;display:flex;justify-content:space-between;gap:12px}#hud div{background:#08131ddd;padding:10px 14px;border:1px solid #41616a;border-radius:6px}b{letter-spacing:.16em}small{display:block;color:#9ab9bf;margin-top:4px}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#c9f9ed;pointer-events:none;font-size:20px}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:#09121e;z-index:5}#status[hidden]{display:none}#pad{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,60px);gap:5px}button{background:#112c38de;border:1px solid #65939c;color:#fff;border-radius:8px;font:24px system-ui;touch-action:none;height:56px}#reset{position:absolute;bottom:24px;right:20px;font:14px system-ui;padding:0 16px}#help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#a3c5cd;pointer-events:none;white-space:nowrap}@media(pointer:fine){#pad{opacity:.55}}@media(max-width:500px){#hud{font-size:11px}#pad{grid-template-columns:repeat(3,48px);left:10px;bottom:25px}button{height:48px}#help{display:none}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body>
<div id="hud"><div><b>ORBITAL / 001</b><small>Estación de tránsito profundo</small></div><div id="metrics">Inicializando</div></div><div id="cross">+</div>
<div id="pad"><span></span><button data-key="w" aria-label="Avanzar">▲</button><span></span><button data-key="a" aria-label="Izquierda">◀</button><button data-key="s" aria-label="Retroceder">▼</button><button data-key="d" aria-label="Derecha">▶</button></div>
<button id="reset">VOLVER</button><div id="help">WASD · arrastrá para mirar · flechas táctiles · CC0 Quaternius</div><div id="status"><h2>ORBITAL 001</h2><p id="loading">Preparando modelos originales…</p></div>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
const base='https://raw.githubusercontent.com/JuanManuelPM/Experimentos/8096b82545bc29ee96b07cac72f11939d19dcdf6/prometeo-assets/packs/17-modular-sci-fi-megakit/game-13454739-extracted/Modular%20SciFi%20MegaKit%5BStandard%5D/';
const models={floor:'Platforms/Platform_CenterPlate.gltf',metal:'Platforms/Platform_Metal.gltf',wall:'Walls/WallAstra_Straight.gltf',window:'Walls/WallAstra_Straight_Window.gltf',column:'Columns/Column_Pipes.gltf',computer:'Props/Prop_Computer.gltf',door:'Platforms/Door_Frame_A.gltf'};
const manager=new T.LoadingManager();manager.setURLModifier(url=>url.startsWith(base)&&/\.png(?:\?|$)/i.test(url)?base+'Textures/'+url.split('/').pop():url);
const loader=new GLTFLoader(manager),templates=new Map(),chunks=new Map(),keys=new Set();
const scene=new T.Scene();scene.background=new T.Color(0x101a22);scene.fog=new T.FogExp2(0x101a22,.045);
const camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.06,90);camera.rotation.order='YXZ';camera.position.set(0,1.66,0);
let renderer;try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement)}catch(e){$('loading').textContent='WebGL no disponible: '+e.message;throw e;}
scene.add(new T.HemisphereLight(0xd6e9ff,0x5a443a,2.2));const sun=new T.DirectionalLight(0xb8e7ff,1.7);sun.position.set(3,8,4);scene.add(sun);const fill=new T.PointLight(0xffd3a1,16,12,2);scene.add(fill);
const mod=(a,b)=>((a%b)+b)%b;const hall=z=>mod(z,8)>=2&&mod(z,8)<=4;const open=(x,z)=>x===0||(hall(z)&&Math.abs(x)<=1);
function place(g,id,x,y,z,rot=0,flip=false){const o=templates.get(id).clone(true);o.position.set(x,y,z);o.rotation.set(flip?Math.PI:0,rot,0);g.add(o);}
function buildChunk(i){const g=new T.Group();g.name='sector-'+i;let count=0;for(let z=i*4;z<i*4+4;z++){for(let x=-1;x<=1;x++){if(!open(x,z))continue;const px=x*4,pz=z*4;place(g,x===0?'floor':'metal',px,0,pz);place(g,'metal',px,6,pz,0,true);count+=2;for(const [dx,dz,rot] of [[-1,0,0],[1,0,Math.PI],[0,-1,-Math.PI/2],[0,1,Math.PI/2]]){if(open(x+dx,z+dz))continue;const type=hall(z)&&mod(z,2)===0?'window':'wall';place(g,type,px,0,pz,rot);place(g,'wall',px,3,pz,rot);count+=2;}if(x!==0&&mod(z,8)===3){place(g,'computer',px,0,pz, x<0?Math.PI/2:-Math.PI/2);place(g,'column',px,0,pz+1.4);count+=2;}if(x===0&&mod(z,8)===1){place(g,'door',0,0,pz);count++;}}}g.userData.count=count;scene.add(g);chunks.set(i,g);}
function sync(){const tile=Math.floor((camera.position.z+2)/4),i=Math.floor(tile/4);for(let n=i-1;n<=i+1;n++)if(!chunks.has(n))buildChunk(n);for(const [n,g] of chunks)if(Math.abs(n-i)>1){scene.remove(g);chunks.delete(n);}return i;}
function pass(px,pz){const margin=.62;for(const dx of [-margin,margin])for(const dz of [-margin,margin])if(!open(Math.floor((px+dx+2)/4),Math.floor((pz+dz+2)/4)))return false;const x=Math.round(px/4),z=Math.round(pz/4);if(x!==0&&mod(z,8)===3&&(Math.hypot(px-x*4,pz-z*4)<.9||Math.hypot(px-x*4,pz-z*4-1.4)<.95))return false;return true;}
let yaw=Math.PI,pitch=0,drag=null;const cvs=renderer.domElement;cvs.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};cvs.setPointerCapture(e.pointerId)});cvs.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.004;pitch=T.MathUtils.clamp(pitch-(e.clientY-drag.y)*.004,-1.2,1.2);drag.x=e.clientX;drag.y=e.clientY});for(const evt of ['pointerup','pointercancel','lostpointercapture'])cvs.addEventListener(evt,()=>drag=null);
const keyMap={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};addEventListener('keydown',e=>{let k=keyMap[e.key.toLowerCase()]||e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>keys.delete(keyMap[e.key.toLowerCase()]||e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(b.dataset.key));}
$('reset').onclick=()=>{camera.position.set(0,1.66,0);yaw=Math.PI;pitch=0;keys.clear();sync()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let ready=false,last=performance.now(),frames=0,fps=0,elapsed=0;function frame(now){requestAnimationFrame(frame);if(!ready)return;const dt=Math.min(.05,(now-last)/1000);last=now;camera.rotation.set(pitch,yaw,0);let f=Number(keys.has('w'))-Number(keys.has('s')),r=Number(keys.has('d'))-Number(keys.has('a'));let len=Math.hypot(f,r)||1;let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*dt*3.5/len,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*dt*3.5/len;if(pass(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(pass(camera.position.x,camera.position.z+dz))camera.position.z+=dz;let sector=sync();fill.position.copy(camera.position).add(new T.Vector3(0,1,0));renderer.render(scene,camera);frames++;elapsed+=dt;if(elapsed>.45){fps=Math.round(frames/elapsed);elapsed=0;frames=0;$('metrics').textContent='SECTOR '+sector+' · '+chunks.size+' cargados · '+fps+' FPS';$('metrics').title='Piezas en escena: '+[...chunks.values()].reduce((a,g)=>a+g.userData.count,0);}}requestAnimationFrame(frame);
try{let done=0;await Promise.all(Object.entries(models).map(async ([id,p])=>{let g=await loader.loadAsync(base+'glTF/'+p);templates.set(id,g.scene);$('loading').textContent='Modelos originales: '+(++done)+' / '+Object.keys(models).length;}));sync();ready=true;last=performance.now();$('status').hidden=true;}catch(e){$('loading').textContent='No se pudo cargar el asset original. '+e.message;console.error(e);}
</script></body></html>
