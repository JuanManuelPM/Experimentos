<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c171f">
<title>Archivo Vivo · Estudio 3D</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;color:#f0ede2;background:#0c171f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,#284451,#0c171f)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:fixed;z-index:2;pointer-events:none}
header{left:clamp(18px,4vw,56px);top:clamp(20px,5vh,50px);max-width:370px}
.label{color:#e1be87;font-weight:750;font-size:11px;letter-spacing:.21em}
h1{font:400 clamp(38px,5vw,70px)/.95 Georgia,serif;letter-spacing:-.05em;margin:12px 0}
p{font-size:13px;line-height:1.6;color:#bbc9c7}
#status{border-left:2px solid #d3b889;padding-left:10px;margin-top:15px;font-size:12px;color:#e5e9dc;min-height:18px}
aside{right:clamp(18px,4vw,50px);top:clamp(20px,5vh,50px);text-align:right}
aside strong{display:block;font:400 22px Georgia,serif;margin:7px 0}
aside span{font-size:11px;color:#b6c4c4}
footer{left:clamp(14px,4vw,56px);right:clamp(14px,4vw,56px);bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:12px}
.actions{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;max-width:450px}
button{font:650 13px system-ui;border:1px solid #8fa5a59c;border-radius:8px;min-height:48px;padding:12px 16px;background:#142934e9;color:#f0ede2;cursor:pointer}
button[aria-pressed=true]{background:#e1c893;color:#1b2b2c;border-color:#e1c893}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hint{font-size:11px;line-height:1.5;max-width:160px;color:#c1d4d1;text-align:right}
@media(max-width:650px){header{left:18px;top:17px;max-width:200px}h1{font-size:41px;margin:10px 0}p{display:none}aside{right:18px;top:18px}aside strong{font-size:15px}aside span{font-size:10px}#status{max-width:200px}footer{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}.actions{max-width:230px;gap:6px}button{font-size:12px;padding:11px;min-height:48px}.hint{max-width:90px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}</script>
</head>
<body>
<main id="stage" aria-label="Escena 3D con modelos GLB animados y un objeto OBJ/MTL"></main>
<header class="overlay">
<div class="label">PROMETEO / ESTUDIO 3D · 01</div>
<h1>ARCHIVO<br>VIVO</h1>
<p>Modelos originales, no personajes dibujados con cajas. Zorro articulado, objetos GLB y un yunque con OBJ, MTL y textura.</p>
<div id="status" role="status" aria-live="polite">Preparando WebGL…</div>
</header>
<aside class="overlay"><div class="label">BIBLIOTECA</div><strong>GLB + OBJ/MTL</strong><span id="count">0 / 4 originales</span></aside>
<footer class="overlay">
<div class="actions" role="group" aria-label="Controles de animación y cámara">
<button type="button" data-anim="Idle" aria-pressed="true">Quieto</button>
<button type="button" data-anim="Walk" aria-pressed="false">Caminar</button>
<button type="button" data-anim="Gallop" aria-pressed="false">Correr</button>
<button type="button" id="reset">Cámara</button>
<button type="button" id="pause" aria-pressed="false">Pausar</button>
</div>
<div class="hint">Arrastrá para orbitar.<br>Pellizcá para zoom.<br>Modelos CC0.</div>
</footer>
<script type="module" src="./scene.mjs"></script>
</body>
</html>
