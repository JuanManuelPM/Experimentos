<style>
:root{color-scheme:dark;--paper:#f3dfb5;--ink:#10191a;--copper:#e8ad6c}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#04090d;color:var(--paper);font-family:ui-monospace,"Courier New",monospace}
