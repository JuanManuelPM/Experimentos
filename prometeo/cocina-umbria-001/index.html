<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c1614"><title>PROMETEO · Cocina Umbría</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#09100f;color:#ecebe4;font-family:system-ui,-apple-system,Arial}#stage{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}#vignette{pointer-events:none;position:fixed;inset:0;box-shadow:inset 0 0 11vmax #0009,inset 0 0 3vmax #0005}
#bar{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 2px 10px #000;max-width:65vw}#title{font-weight:700;font-size:11px;letter-spacing:.2em}#state{margin-top:5px;font-size:11px;color:#d4ddd3;line-height:1.5}#hint{font-size:10px;color:#b4c6b8;opacity:.85;transition:opacity .7s}#actions{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:9px}
.action{border:1px solid #a7b9a34b;border-radius:12px;width:43px;height:43px;background:#10211bc9;color:#f4f5e6;font:23px system-ui;display:grid;place-items:center;touch-action:manipulation;backdrop-filter:blur(8px)}.action:active{background:#416255}#error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,420px);background:#14201ff2;border:1px solid #68847755;border-radius:16px;padding:24px;line-height:1.5;font-size:13px;z-index:5}#error[hidden]{display:none}#error strong{display:block;margin-bottom:8px;font-size:17px}#error a{color:#e4bb91}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Microescena 3D navegable: cocina retro nocturna con un humano animado"></canvas></div>
<div id="vignette"></div>
<div id="bar"><div id="title">COCINA UMBRÍA / 18:47</div><div id="state" aria-live="polite">Preparando la escena 3D…</div><div id="hint">Arrastrá para mirar · dos dedos para acercar</div></div>
<div id="actions"><button class="action" id="reset" title="Recentrar cámara" aria-label="Recentrar">⌖</button><button class="action" id="full" title="Pantalla completa" aria-label="Pantalla completa">⛶</button></div>
<div id="error" hidden><strong>La escena no pudo iniciarse</strong><span id="err-text"></span></div>
<script type="module" src="./scene.mjs"></script>
<script defer src="../project-explorer/launcher.js" data-prometeo-3d-nav="1"></script>
</body></html>
