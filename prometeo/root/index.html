<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PROMETEO</title>
<link rel="stylesheet" href="./shared/v1/tokens.css">
<link rel="stylesheet" href="./studio-unified.css?v=20261123-mobile2">
<link rel="stylesheet" href="./focus-map.css?v=20261123-mobile2">
</head>
<body>
<prometeo-shell id="shell" app-label="Dirección"><div id="app-context" slot="context" class="p-context"></div></prometeo-shell>
<main id="messages" class="p-messages">
  <div class="p-message-head">
    <div id="space" class="p-space"></div>
    <button type="button" id="older" class="p-older" aria-label="Mensajes" aria-expanded="false" title="Mensajes" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8 8 8.5 8.5 0 0 1-3.3-.66L4 20l1.16-4.7A8.5 8.5 0 0 1 4.5 12a8 8 0 0 1 8-8A7.5 7.5 0 0 1 20 11.5Z"/></svg>
    </button>
  </div>
  <section id="history" class="p-history" hidden aria-label="Mensajes disponibles"></section>
  <section id="startup-fallback" class="p-startup-fallback" aria-label="Tandas preparadas">
    <h1>Biblioteca de obras</h1>
    <p role="status">Cargando obras y navegación…</p>
    <nav aria-label="Accesos a tandas">
      <a href="./galeria/?studio=3d">3D</a>
      <a href="./galeria/?studio=music">Música</a>
      <a href="./galeria/?studio=web">Web</a>
      <a href="./galeria/?studio=video">Video</a>
      <a href="./galeria/?studio=images">Imágenes</a>
    </nav>
  </section>
  <prometeo-response id="response"></prometeo-response>

</main>
<main id="library" class="p-library" hidden aria-label="Biblioteca universal de obras">
  <div class="p-library-top"><h1>Obras</h1><button id="batch-link" type="button" class="p-batch-link" hidden></button></div>
  <div id="works" class="p-works" aria-live="polite"></div>
</main>
<section id="stage" class="p-stage" hidden aria-label="Obra del Estudio 3D">
  <div id="stage-visual" class="p-stage-visual" aria-label="Superficie de obra"></div>
  <button type="button" id="stage-back" class="p-stage-back" aria-label="Volver a la biblioteca">←</button>
  <a id="stage-open" class="p-stage-open" target="_blank" rel="noopener noreferrer" aria-label="Abrir obra en pantalla completa">↗</a>
</section>
<div id="toast" class="p-toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="./portal-v1.js?v=20261123-mobile2"></script>
</body>
</html>
