<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PROMETEO</title>
<link rel="stylesheet" href="./shared/v1/tokens.css">
<link rel="stylesheet" href="./studio-unified.css">
</head>
<body>
<prometeo-shell id="shell" app-label="Dirección"><div id="app-context" slot="context" class="p-context"></div></prometeo-shell>
<main id="messages" class="p-messages">
  <div id="space" class="p-space"></div>
  <section id="startup-fallback" class="p-startup-fallback" aria-label="Tandas preparadas">
    <h1>Estudios y tandas</h1>
    <p>Cuatro tandas W001 preparadas. Elegí un estudio para ver y copiar los trabajos 01–10.</p>
    <nav aria-label="Accesos a tandas">
      <a href="#music/tanda/music-w001-20261122">Música</a>
      <a href="#web/tanda/web-w001-20261122">Web</a>
      <a href="#video/tanda/video-w001-20261122">Video</a>
      <a href="#images/tanda/images-w001-20261122">Imágenes</a>
    </nav>
  </section>
  <prometeo-response id="response"></prometeo-response>
  <button type="button" id="older" class="p-older" hidden>Historial</button>
  <section id="history" class="p-history" hidden aria-label="Mensajes anteriores"></section>
</main>
<main id="library" class="p-library" hidden aria-label="Biblioteca del Estudio 3D">
  <div class="p-library-top"><h1>Obras</h1><button id="batch-link" type="button" class="p-batch-link" hidden></button></div>
  <div id="works" class="p-works" aria-live="polite"></div>
</main>
<section id="stage" class="p-stage" hidden aria-label="Obra del Estudio 3D">
  <div id="stage-visual" class="p-stage-visual" aria-label="Superficie de obra"></div>
  <button type="button" id="stage-back" class="p-stage-back" aria-label="Volver a la biblioteca">←</button>
  <a id="stage-open" class="p-stage-open" target="_blank" rel="noopener noreferrer" aria-label="Abrir obra en pantalla completa">↗</a>
</section>
<div id="toast" class="p-toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="./portal-v1.js"></script>
</body>
</html>
