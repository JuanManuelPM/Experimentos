<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>PROMETEO</title>
<style>
:root{--bg:#f8f8f6;--fg:#181818;--sub:#6f6f6b;--line:#d9d9d5;--hover:#ecece9;--yellow:#efbe44;--scrim:#f8f8f6}
@media(prefers-color-scheme:dark){:root{--bg:#121312;--fg:#f3f3f0;--sub:#92948f;--line:#30322f;--hover:#242624;--scrim:#121312}}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,system-ui,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:4px}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.menu-button{position:fixed;right:max(21px,env(safe-area-inset-right));top:max(17px,env(safe-area-inset-top));width:49px;height:49px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;z-index:30;border-radius:8px;transition:background .16s}.menu-button:hover{background:var(--hover)}.menu-button i{display:block;width:23px;height:1.5px;background:var(--fg);transition:transform .24s,translate .24s}.menu-button[aria-expanded=true] i:first-child{transform:translateY(4.25px) rotate(45deg)}.menu-button[aria-expanded=true] i:last-child{transform:translateY(-4.25px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:20;background:var(--scrim);padding:max(95px,env(safe-area-inset-top)) clamp(25px,7vw,94px) max(40px,env(safe-area-inset-bottom));overflow:auto;opacity:0;visibility:hidden;transition:opacity .19s,visibility .19s}.menu.open{opacity:1;visibility:visible}.menu-items{max-width:760px;margin:0 auto;display:flex;flex-direction:column}.menu-items button{display:flex;align-items:baseline;justify-content:space-between;gap:15px;padding:15px 0;border:0;border-bottom:1px solid var(--line);text-align:left;background:transparent;font-size:clamp(27px,4.4vw,48px);font-weight:500;letter-spacing:-.065em;line-height:1.15}.menu-items button span:nth-child(2){font-size:12px;letter-spacing:0;color:var(--sub);font-weight:400}.menu-items button[aria-current=page]{color:var(--sub)}.archive{display:block;width:max-content;margin:38px 0 0 auto;color:var(--sub);font-size:12px;text-decoration:none}
.main{width:min(100% - 46px,740px);margin:0 auto;padding-top:clamp(120px,18vh,190px);padding-bottom:max(90px,env(safe-area-inset-bottom));min-height:100dvh}.space{font-size:12px;letter-spacing:.035em;font-weight:600;margin-bottom:clamp(45px,11vh,105px)}.letter{max-width:720px}.date{display:block;color:var(--sub);font-size:11px;letter-spacing:.01em;min-height:15px}.title{font-size:clamp(27px,4.1vw,43px);font-weight:500;line-height:1.17;letter-spacing:-.055em;margin:15px 0 22px}.text{font-size:clamp(14px,1.45vw,16px);font-weight:400;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg);max-width:690px}.text:empty,.title:empty,.date:empty{display:none}.actions{margin-top:clamp(42px,8vh,76px);display:flex;gap:24px;flex-wrap:wrap;align-items:center;min-height:36px}.act{padding:8px 0;border:0;background:none;font-size:13px;font-weight:600;letter-spacing:-.018em}.act:after{content:' ↗';font-weight:400}.act:hover{opacity:.65}.act[data-copied=true]{color:#937019}.act[data-copied=true]:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);margin:0 9px 1px 0}.more{color:var(--sub);font-weight:400}.history{margin:40px 0 0;border-top:1px solid var(--line)}.item{padding:25px 0;border-bottom:1px solid var(--line)}.item button{display:block;text-align:left;max-width:100%;border:0;background:none;padding:0}.item h2{font-size:19px;font-weight:500;letter-spacing:-.045em;margin:8px 0 8px}.item time{font-size:11px;color:var(--sub)}.item p{font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.item .act{margin-top:12px}.toast{position:fixed;left:50%;bottom:clamp(18px,env(safe-area-inset-bottom),40px);transform:translateX(-50%);font-size:12px;padding:9px 14px;background:var(--fg);color:var(--bg);border-radius:40px;z-index:40;pointer-events:none}.toast[hidden]{display:none}body.lock{overflow:hidden}
@media(max-width:400px){.main{width:calc(100% - 40px);padding-top:130px}.space{margin-bottom:64px}.menu{padding-left:23px;padding-right:23px}.menu-items button{font-size:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<button id="menu-btn" class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
<nav id="menu" class="menu" aria-label="Navegación"><div class="menu-items" id="menu-items"></div><a class="archive" href="./archivo-20261121.html#mensajes">Archivo ↗</a></nav>
<main class="main" id="main"><div id="space" class="space"></div><article id="letter" class="letter"><time id="date" class="date"></time><h1 id="title" class="title"></h1><div id="text" class="text"></div></article><div class="actions"><button type="button" class="act" id="copy">Copiar</button><button type="button" class="act more" id="older" hidden>Anterior</button></div><section class="history" id="history" hidden></section></main>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), ROOT='https://juanmanuelpm.github.io/Experimentos/prometeo/root/';
const FALLBACK=[{id:'direccion',label:'Dirección'},{id:'root',label:'ROOT'},{id:'3d',label:'3D'},{id:'music',label:'Música'},{id:'web',label:'Web'},{id:'video',label:'Video'},{id:'images',label:'Imágenes'}];
const state={rooms:FALLBACK,room:'direccion',public:[],legacy:[],open:false,older:false,version:0};
const showToast=txt=>{const node=$('toast');node.textContent=txt;node.hidden=false;clearTimeout(showToast.t);showToast.t=setTimeout(()=>node.hidden=true,1800)};
const get=async path=>{const r=await fetch('./'+path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return r.json()};
const cache=(key,data)=>{try{localStorage.setItem('prometeo:public:'+key,JSON.stringify(data))}catch(e){}};
const stored=(key)=>{try{return JSON.parse(localStorage.getItem('prometeo:public:'+key)||'null')}catch(e){return null}};
const copied=(key)=>{try{return localStorage.getItem('prometeo:copied:'+key)==='1'}catch(e){return false}};
const markCopy=(key)=>{try{localStorage.setItem('prometeo:copied:'+key,'1')}catch(e){}};
const buildPrompt=room=>{const id=room?.id||'direccion';const url='https://github.com/JuanManuelPM/pruebas/blob/candidate/prometeo-portal-unico-base-20261121/PROMETEO/system/PORTAL_BASE_HANDOFF.md';return 'CONTINUAR · PROMETEO · '+id.toUpperCase()+' · '+url+'#'+id};
async function copyText(str){try{await navigator.clipboard.writeText(str);return true}catch(e){const t=document.createElement('textarea');t.value=str;t.style.cssText='position:fixed;top:-1000px';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok}}
function menu(open){state.open=!!open;$('menu').classList.toggle('open',state.open);$('menu-btn').setAttribute('aria-expanded',String(state.open));$('menu-btn').setAttribute('aria-label',state.open?'Cerrar menú':'Abrir menú');document.body.classList.toggle('lock',state.open);if(state.open)$('menu-items').querySelector('button[aria-current=page]')?.focus({preventScroll:true})}
function roomFromHash(){const id=decodeURIComponent(location.hash.slice(1));if(['capturas','ronda','calibrar','ajustes'].includes(id)){location.replace('./archivo-20261121.html#'+id);return null}return id==='mensajes'?'root':state.rooms.find(r=>r.id===id)?id:'direccion'}
const entries=()=>{const own=state.public.filter(e=>e.room===state.room);const roots=state.room==='root'?state.legacy.map(e=>({...e,room:'root'})):[];return [...own,...roots]};
function renderMenu(){const h=$('menu-items');h.replaceChildren();for(const r of state.rooms){const b=document.createElement('button');b.type='button';b.dataset.room=r.id;b.setAttribute('aria-current',r.id===state.room?'page':'false');const name=document.createElement('span');name.textContent=r.label;b.append(name);if(r.id===state.room){const dot=document.createElement('span');dot.textContent='●';dot.setAttribute('aria-hidden','true');b.append(dot)}b.addEventListener('click',()=>{location.hash=r.id;select(r.id)});h.append(b)}}
function select(id){if(!id)return;state.room=state.rooms.some(r=>r.id===id)?id:'direccion';state.older=false;menu(false);render();window.scrollTo(0,0)}
function render(){renderMenu();const room=state.rooms.find(r=>r.id===state.room)||FALLBACK[0];$('space').textContent=room.label;document.title=room.label+' · PROMETEO';const messages=entries(),msg=messages[0];$('date').textContent=msg?.publishedAt?new Date(msg.publishedAt).toLocaleDateString('es-AR',{day:'2-digit',month:'short'}):'';$('title').textContent=msg?.title||'';$('text').textContent=msg?.body||'';const key=state.room+'|'+(msg?.id||'base');const cp=$('copy');cp.dataset.copied=copied(key)?'true':'false';cp.textContent=copied(key)?'Copiado':'Copiar';cp.onclick=async()=>{const ok=await copyText(buildPrompt(room));if(ok){markCopy(key);cp.dataset.copied='true';cp.textContent='Copiado'}showToast(ok?'Copiado':'No se pudo copiar')};$('older').hidden=messages.length<2;$('older').textContent=state.older?'Ocultar':'Anterior';const h=$('history');h.hidden=!state.older;h.replaceChildren();if(state.older)for(const m of messages.slice(1)){const a=document.createElement('article');a.className='item';const time=document.createElement('time');time.textContent=m.publishedAt?new Date(m.publishedAt).toLocaleDateString('es-AR',{day:'2-digit',month:'short'}):'';const title=document.createElement('h2');title.textContent=m.title||'';const body=document.createElement('p');body.textContent=m.body||'';a.append(time,title,body);h.append(a)}}
$('older').addEventListener('click',()=>{state.older=!state.older;render()});$('menu-btn').addEventListener('click',()=>menu(!state.open));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.open){menu(false);$('menu-btn').focus()}});window.addEventListener('hashchange',()=>select(roomFromHash()));
async function refresh(){const names=['ROOMS.json','ROOM_MESSAGES.json','REPLIES.json'];const results=await Promise.allSettled(names.map(get));for(let i=0;i<names.length;i++){let data=results[i].status==='fulfilled'?results[i].value:stored(names[i]);if(!data)continue;if(i===0&&Array.isArray(data.rooms)&&data.rooms.length){state.rooms=data.rooms.filter(x=>/^[a-z0-9-]+$/.test(x.id)&&typeof x.label==='string').slice(0,80);cache(names[i],data)}if(i===1&&Array.isArray(data.entries)){state.public=data.entries;cache(names[i],data)}if(i===2&&Array.isArray(data.entries)){state.legacy=data.entries;cache(names[i],data)}}render()}
select(roomFromHash());refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden)refresh()},45000);
})();
</script>
</body></html>
