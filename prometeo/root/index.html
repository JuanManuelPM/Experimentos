<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>PROMETEO</title>
<link rel="stylesheet" href="./shared/v1/tokens.css">
<style>*{box-sizing:border-box}html{min-height:100%;background:var(--p-bg)}body{margin:0;min-height:100dvh;background:var(--p-bg);color:var(--p-fg);font-family:var(--p-font);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:2px solid var(--p-fg);outline-offset:4px}[hidden]{display:none!important}body.p-menu-locked{overflow:hidden}
.main{width:min(100% - 46px,740px);margin:0 auto;padding-top:clamp(120px,18vh,190px);padding-bottom:max(90px,env(safe-area-inset-bottom));min-height:100dvh}.space{font-size:12px;letter-spacing:.035em;font-weight:600;margin-bottom:clamp(45px,11vh,105px)}.letter{max-width:720px}.date{display:block;color:var(--p-muted);font-size:11px;letter-spacing:.01em;min-height:15px}.title{font-size:clamp(27px,4.1vw,43px);font-weight:500;line-height:1.17;letter-spacing:-.055em;margin:15px 0 22px}.text{font-size:clamp(14px,1.45vw,16px);font-weight:400;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--p-fg);max-width:690px}.text:empty,.title:empty,.date:empty{display:none}.actions{margin-top:clamp(42px,8vh,76px);display:flex;gap:24px;flex-wrap:wrap;align-items:center;min-height:36px}.act{padding:8px 0;border:0;background:none;font-size:13px;font-weight:600;letter-spacing:-.018em}.act:after{content:' ↗';font-weight:400}.act:hover{opacity:.65}.act[data-copied=true]{color:var(--p-muted)}.act[data-copied=true]:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--p-accent);margin:0 9px 1px 0}.more{color:var(--p-muted);font-weight:400}.history{margin:40px 0 0;border-top:1px solid var(--p-line)}.item{padding:25px 0;border-bottom:1px solid var(--p-line)}.item h2{font-size:19px;font-weight:500;letter-spacing:-.045em;margin:8px}.item time{font-size:11px;color:var(--p-muted)}.item p{font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;padding:9px 14px;background:var(--p-fg);color:var(--p-bg);border-radius:40px;z-index:calc(var(--p-layer-controls) + 1);pointer-events:none}
.scene{position:fixed;inset:0;background:var(--p-stage)}
.scene-frame{display:block;width:100%;height:100%;border:0;background:var(--p-stage)}
.scene-external{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));width:44px;height:44px;display:grid;place-items:center;border-radius:var(--p-control-radius);background:var(--p-bg);color:var(--p-fg);border:1px solid var(--p-line);text-decoration:none;font-size:22px;z-index:2}
.scene-external:focus-visible{outline:2px solid var(--p-fg);outline-offset:3px}@media(max-width:400px){.main{width:calc(100% - 40px);padding-top:130px}.space{margin-bottom:64px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<prometeo-shell id="shell" app-label="Dirección"><div id="app-context" slot="context" class="p-context"></div></prometeo-shell>
<main class="main" id="main"><div id="space" class="space"></div><prometeo-response id="response"></prometeo-response><div class="actions"><button type="button" class="act more" id="older" hidden>Anterior</button></div><section class="history" id="history" hidden></section></main>
<section id="scene" class="scene" hidden aria-label="Estudio 3D"><iframe id="scene-frame" class="scene-frame" title="Obra 3D" loading="eager" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe><a id="scene-external" class="scene-external" href="../cocina-umbria-001/" target="_blank" rel="noopener" aria-label="Abrir obra fuera de ROOT">↗</a></section>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="./portal-v1.js"></script>
</body></html>
