<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0b"><title>ROOT · PROMETEO</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html{background:#080a0b;color:#e8eae8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0}main{max-width:1040px;margin:0 auto;padding:25px 18px 44px}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #e5c68d;outline-offset:3px}a{color:inherit;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid #2a3436}.brand{font-weight:850;letter-spacing:.13em}.brand small{color:#859092;font-size:10px;margin-left:6px;letter-spacing:.02em}.ghost{border:1px solid #354043;background:#13191b;color:#c2cbca;padding:10px 12px;border-radius:6px;font-size:12px;min-height:40px}.ghost:disabled{opacity:.5;cursor:default}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border:1px solid #2e3a3c;padding:10px;border-radius:7px;margin-top:12px}.phases[hidden],[hidden]{display:none!important}.phase{font-size:12px;padding:10px;color:#76878a}.phase strong{display:block;font-size:10px;margin-bottom:5px}.phase.active{background:#263034;color:#eee;border-radius:4px}.intro{padding:40px 0 28px}h1{font-size:clamp(44px,8vw,80px);letter-spacing:-.075em;line-height:1;margin:12px 0;font-weight:760}.label{color:#9ea9ab;font-size:11px;letter-spacing:.09em;font-weight:750}.sub{font-size:13px;color:#849294}.bar{border-top:1px solid #2a3537;padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9aa8a8;font-size:12px}.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{background:#151b1d;border:1px solid #303a3d;border-radius:7px;padding:12px;min-width:0}.slot.active{border-color:#d8c6a6}.number{font-size:21px;font-weight:750;display:flex;align-items:center;justify-content:space-between}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c86d63}.dot.yellow{background:#d9b65b}.dot.green{background:#70c092}.state{font-size:11px;color:#859396;margin:10px 0 14px}.slot-buttons{display:flex;gap:5px}.slot-buttons button{flex:1;min-width:0;padding:10px 3px;border:1px solid #4a5658;border-radius:5px;background:#273033;color:#e5eae7;font-size:12px;font-weight:730}.slot-buttons .copy{background:#e5e5df;color:#151b1c;border-color:#e5e5df}.view{border:1px solid #303b3d;margin-top:23px;border-radius:8px;overflow:hidden}.view-header{background:#14191b;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;gap:10px}h2{font-size:17px;margin:4px 0 0;letter-spacing:-.035em}.view-header a{font-size:12px;border:1px solid #475255;padding:10px;border-radius:5px}.screen{min-height:210px;display:flex;align-items:center;justify-content:center;background:#090c0d}.screen p{color:#93a0a2;font-size:12px;text-align:center;padding:18px}iframe{height:480px;width:100%;border:0}.notes{padding:13px;background:#13191b;display:flex;gap:9px;align-items:start;border-top:1px solid #2e3739}textarea{background:#0c1112;color:#f2f3f0;border:1px solid #394649;border-radius:5px;padding:10px 12px;min-height:64px;width:100%;resize:vertical;font-size:13px}.notes button[aria-pressed=true]{color:#e4d3a9;border-color:#c5a87b}.bottom{display:flex;align-items:center;gap:14px;margin:22px 0}.primary{border:none;background:#e5e3dc;color:#111819;border-radius:6px;font-weight:800;padding:14px 18px;min-height:48px;font-size:13px}.primary:hover{background:#fff}#feedback{color:#90ad99;font-size:11px}footer{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:#849394}footer span{display:flex;align-items:center;gap:7px}@media(max-width:650px){main{padding:20px 13px}.ten{grid-template-columns:repeat(2,1fr);gap:7px}.slot{padding:10px}.intro{padding:27px 0 22px}.phases{grid-template-columns:repeat(2,1fr)}.notes{display:block}.notes button{margin-top:9px}iframe{height:65vh}}
</style></head><body><main>
<header><div class="brand">ROOT <small>PROMETEO</small></div><button id="toggle" class="ghost" type="button">Etapas <span id="mark">01/07</span></button></header>
<div id="phases" class="phases" hidden></div>
<div class="intro"><div id="phase" class="label">01 · BASE</div><h1>10 intentos.</h1><div id="wave" class="sub">Ola 01 · Un prompt · Un flujo</div></div>
<div class="bar"><span id="counter">Cargando…</span><button class="ghost" id="refresh" type="button">↻ Actualizar</button></div>
<section id="ten" class="ten" aria-label="Diez intentos"></section>
<section class="view"><div class="view-header"><div><div class="label">SELECCIÓN</div><h2 id="selected">01 · Sin copiar</h2></div><a id="external" href="#" target="_blank" rel="noopener noreferrer" hidden>Abrir ↗</a></div>
<div class="screen"><p id="placeholder">Esperando publicación…</p><iframe id="frame" title="Preview" sandbox="allow-scripts allow-forms allow-pointer-lock" referrerpolicy="no-referrer" hidden></iframe></div>
<div class="notes"><textarea id="note" rows="2" placeholder="¿Qué no te gustó?" aria-label="Nota para la versión seleccionada"></textarea><button type="button" class="ghost" id="favorite">☆ Candidata</button></div></section>
<div class="bottom"><button class="primary" id="calibrar" type="button">Copiar CALIBRAR</button><span id="feedback" role="status" aria-live="polite"></span></div>
<footer><span><i class="dot"></i> Sin copiar</span><span><i class="dot yellow"></i> Copiado</span><span><i class="dot green"></i> Publicado</span></footer>
</main><script>
(()=>{'use strict';
const el=id=>document.getElementById(id),site=new URL('../../',location.href),S={cfg:null,selected:1,status:Array(10).fill('unknown'),copied:{},notes:{},favorites:{},busy:false};
const key=()=> 'prometeo-root-v2:'+S.cfg.active.cohortId;
const allowed=c=>c&&c.active&&Array.isArray(c.stages)&&c.stages.length>1&&Number.isInteger(c.active.wave)&&/^[a-z0-9-]+$/.test(c.active.cohortId)&&/^[a-f0-9]{64}$/.test(c.active.briefSha256)&&/^[a-f0-9]{64}$/.test(c.active.method.sha256Canonical)&&/^https:\/\/github\.com\/JuanManuelPM\/pruebas\/blob\/[A-Za-z0-9_./-]+\/launch\/$/.test(c.active.launcherBase)&&/^prometeo\/root\/ui-lab\/[A-Za-z0-9_/-]+\/$/.test(c.active.previewBase);
function restore(){try{const v=JSON.parse(localStorage.getItem(key())||'{}');S.copied=v.copied||{};S.notes=v.notes||{};S.favorites=v.favorites||{};}catch(e){}}
function save(){try{localStorage.setItem(key(),JSON.stringify({copied:S.copied,notes:S.notes,favorites:S.favorites}));}catch(e){}}
const prompt=n=>'WORK · ROOT UI · '+S.cfg.active.launcherBase+n;
const url=n=>new URL(S.cfg.active.previewBase+n+'/index.html',site).href;
const green=n=>S.status[n-1]==='ready',status=n=>green(n)?'Publicado':S.copied[n]?'Copiado':'Sin copiar',tone=n=>green(n)?'green':S.copied[n]?'yellow':'';
async function copy(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}t.remove();if(!ok)window.prompt('Copiar:',text);return ok;}}
function slots(){const root=el('ten');root.textContent='';for(let n=1;n<=10;n++){const box=document.createElement('article');box.className='slot'+(S.selected===n?' active':'');const h=document.createElement('div');h.className='number';h.textContent=String(n).padStart(2,'0');const dot=document.createElement('i');dot.className='dot '+tone(n);dot.title=green(n)?'index.html disponible, no implica QA':S.copied[n]?'Copiado aquí, no implica enviado':'Sin copiar aquí';h.append(dot);const label=document.createElement('div');label.className='state';label.textContent=status(n);const actions=document.createElement('div');actions.className='slot-buttons';const b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copiar';b.addEventListener('click',async()=>{if(await copy(prompt(n))){S.copied[n]=true;save();slots();el('feedback').textContent='Copiado '+n;}});const v=document.createElement('button');v.type='button';v.textContent='Ver';v.addEventListener('click',()=>{select(n);el('selected').scrollIntoView({behavior:'smooth',block:'center'});});actions.append(b,v);box.append(h,label,actions);root.append(box);}}
function select(n){if(!S.cfg)return;S.selected=n;el('selected').textContent=String(n).padStart(2,'0')+' · '+status(n);el('note').value=S.notes[n]||'';el('favorite').textContent=S.favorites[n]?'★ Candidata':'☆ Candidata';el('favorite').setAttribute('aria-pressed',String(!!S.favorites[n]));const f=el('frame'),ext=el('external'),p=el('placeholder'),ready=green(n);f.hidden=!ready;p.hidden=ready;ext.hidden=!ready;if(ready){const target=url(n);if(f.getAttribute('src')!==target)f.src=target;ext.href=target;}else{f.removeAttribute('src');p.textContent=S.status[n-1]==='unknown'?'Sin comprobar todavía':'Esperando publicación…';}slots();}
async function check(n){const a=new AbortController(),tm=setTimeout(()=>a.abort(),8000);try{const r=await fetch(url(n)+'?t='+Math.floor(Date.now()/60000),{method:'HEAD',cache:'no-store',signal:a.signal});return r.ok?'ready':r.status===404?'pending':'unknown';}catch(e){return'unknown';}finally{clearTimeout(tm);}}
async function scan(){if(!S.cfg||S.busy)return;S.busy=true;el('refresh').disabled=true;S.status=await Promise.all(Array.from({length:10},(_,i)=>check(i+1)));el('counter').textContent=S.status.filter(s=>s==='ready').length+' / 10 publicados';S.busy=false;el('refresh').disabled=false;select(S.selected);}
function stages(){const d=el('phases');d.textContent='';let pos=1;S.cfg.stages.forEach((x,i)=>{const p=document.createElement('div');p.className='phase'+(x.id===S.cfg.active.stageId?' active':'');const n=document.createElement('strong');n.textContent=String(i+1).padStart(2,'0');p.append(n,document.createTextNode(x.name));d.append(p);if(x.id===S.cfg.active.stageId)pos=i+1;});el('mark').textContent=String(pos).padStart(2,'0')+'/'+String(S.cfg.stages.length).padStart(2,'0');el('phase').textContent=String(pos).padStart(2,'0')+' · '+S.cfg.stages[pos-1].name.toUpperCase();el('wave').textContent='Ola '+String(S.cfg.active.wave).padStart(2,'0')+' · Un prompt · Un flujo';}
function message(){const a=S.cfg.active;const text=['CALIBRAR · ROOT · TANDA DE DIEZ','Recuperá las diez producciones y sus trazas. Investigá las decisiones concretas que llevaron a cada defecto y proponé modificar UNA sola raíz. Nunca escribas un flujo por variante ni cambies el brief. La siguiente ola debe repetir exactamente el mismo prompt; sólo podrá cambiar la versión/hash del flujo después de aprobación humana. No tocar el canon global ni otras ramas sin autorización.','Etapa '+a.stageId+' · Ola '+a.wave+' · '+a.cohortId,'Método '+a.method.id+'@'+a.method.version+' / '+a.method.sha256Canonical,'Brief '+a.briefSha256,'Fuente del brief '+a.briefRef,'Fuente del flujo '+a.flowRef,'Galería '+S.cfg.url,'','OBSERVACIONES:'];for(let n=1;n<=10;n++)text.push(String(n).padStart(2,'0')+' '+(S.favorites[n]?'★ ':'')+(S.notes[n]||'(sin nota)')+' | '+url(n));text.push('','IMPORTANTE: amarillo sólo significa copiado en este navegador; verde sólo que existe el HTML, no calidad aprobada. Prepará una única nueva versión del método y diez lanzadores idénticos en brief, con rutas aisladas y limpieza posible de experimentos descartados.');return text.join('\n');}
el('toggle').addEventListener('click',()=>el('phases').hidden=!el('phases').hidden);el('refresh').addEventListener('click',scan);el('note').addEventListener('input',e=>{S.notes[S.selected]=e.target.value;save();});el('favorite').addEventListener('click',()=>{S.favorites[S.selected]=!S.favorites[S.selected];save();select(S.selected);});el('calibrar').addEventListener('click',async()=>{el('feedback').textContent=await copy(message())?'Copiado · Pegalo en Ideas':'Copiá el texto manualmente';});document.addEventListener('visibilitychange',()=>{if(!document.hidden)scan();});setInterval(()=>{if(!document.hidden)scan();},35000);
(async()=>{try{const r=await fetch('./PROGRAM.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const cfg=await r.json();if(!allowed(cfg))throw Error('Configuración inválida');S.cfg=cfg;restore();stages();slots();select(1);scan();}catch(e){el('counter').textContent='Programa no disponible';el('feedback').textContent=e.message;}})();
})();
</script></html>
