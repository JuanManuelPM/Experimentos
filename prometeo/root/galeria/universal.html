<!doctype html><html lang="es" data-u-theme="original"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROMETEO · Galería</title><meta name="theme-color" content="#eeeae4">
<style>
:root{color-scheme:light;--bg:#eeeae4;--ink:#181715;--mute:#78736c;--line:#d9d3ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px system-ui,Segoe UI,Arial,sans-serif}
main{max-width:1150px;margin:auto;padding:clamp(12px,2vw,24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:15px;font-weight:750;letter-spacing:-.4px;margin:0}h2{font-size:14px;margin:0;font-weight:700}
nav{display:flex;gap:3px;overflow:auto;scrollbar-width:none}
nav button{white-space:nowrap;border:0;background:transparent;color:#605d58;font-size:12px;padding:8px 11px;border-radius:9px;cursor:pointer}
nav button[aria-current=true]{background:#252320;color:white}
section{margin:0 0 24px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.heading small{font-size:11px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.item{display:block;min-width:0;color:inherit;text-decoration:none;outline-offset:3px}
.art{position:relative;aspect-ratio:5/4;overflow:hidden;border-radius:8px;background:linear-gradient(120deg,#dcd4ca,#c8c4c0 55%,#e5dfd8);border:1px solid #0000000a;display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:cover}.art .type{font-size:25px;opacity:.55;filter:grayscale(1)}
.art span{position:absolute;top:6px;left:7px;background:#ece9e4d9;border-radius:5px;padding:2px 5px;font-size:10px;font-variant-numeric:tabular-nums}
.item b{display:block;font-size:11px;font-weight:600;margin:6px 1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .state{display:block;font-size:10px;color:var(--mute);margin:1px 1px 0}
.item.noresult{opacity:.6}
.actions{display:flex;gap:8px;align-items:center}
.copy{background:transparent;border:1px solid #beb6aa;color:#5e5a55;padding:6px 9px;border-radius:7px;font-size:11px;cursor:pointer}
details{border-top:1px solid var(--line);margin-top:0}
summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 2px;cursor:pointer;font-size:12px;font-weight:600}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:#6c6761;font-size:18px;font-weight:400}
details[open] summary:after{content:"−"}details .grid{padding-bottom:18px}
#status{color:var(--mute);font-size:12px;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;border-radius:9px;padding:10px 15px;opacity:0;pointer-events:none}
#toast.visible{opacity:1}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:501px) and (max-height:440px){main{padding:9px 13px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.art{aspect-ratio:6/3}header{flex-direction:row;margin-bottom:7px}}
body{font-size:15px}h1{font-size:18px}h2{font-size:16px}nav{flex-wrap:wrap;overflow:visible}nav button,.copy,summary,.back,#retry{min-height:44px;font-size:14px}nav button[aria-current=true]{box-shadow:inset 0 -3px #d9a84a}.heading{flex-wrap:wrap}.item b{font-size:14px;white-space:normal;overflow-wrap:anywhere}.item .state,.art span,.heading small,#status{font-size:12px;line-height:1.45}.back{display:inline-flex;align-items:center;color:inherit;text-decoration:none}.back:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #181715;outline-offset:2px}#retry{background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 14px;color:inherit}#retry[hidden]{display:none}@media(max-width:360px){.grid{grid-template-columns:1fr}}@media(max-height:440px) and (orientation:landscape){header{flex-wrap:wrap}}
</style><link rel="stylesheet" href="../shared/v1/library-universal.css?v=9"><script defer src="../shared/v1/library-universal.js?v=9"></script></head><body class="u-library" data-library="gallery"><aside class="u-rail" id="u-rail" aria-label="Navegación"></aside>
<main><header><h1><a class="back" href="../#root/obras">← PROMETEO</a></h1><nav aria-label="Estudios" id="studios"></nav></header>
<div id="content"></div><p id="status" aria-live="polite">Leyendo obras publicadas…</p><button id="retry" type="button" hidden>Reintentar</button></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./gallery.mjs?v=20261124-identity"></script>
</body></html>
