*{box-sizing:border-box}body{margin:0;background:#242520;color:#e8e3d7;font:14px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}h1{font-size:23px;letter-spacing:.18em;margin:0;font-weight:500}small{color:#b6b2a7}#stage{height:57dvh;min-height:280px;position:relative;background:#78786a}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;left:10px;bottom:8px;background:#262720c9;padding:6px 9px;font-size:11px;pointer-events:none}main{max-width:900px;margin:auto}section{padding:12px 14px}.bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}button{border:1px solid #656559;background:#30322d;color:inherit;padding:10px 13px;border-radius:5px;font:inherit}button.active{background:#ddd3bf;color:#24251f}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}label{display:grid;gap:5px;font-size:12px;color:#c7c2b6}input[type=range]{width:100%;accent-color:#d4bea0}details{border-top:1px solid #44463c;padding:10px 0;margin-top:10px}a{color:#d8c5a4}textarea{width:100%;min-height:100px;background:#30322d;color:inherit}#error{padding:12px;color:#ffd5a9}@media(max-width:500px){.fields{grid-template-columns:repeat(3,minmax(0,1fr))}button{padding:8px 10px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script><body><header><h1 id="name">IRIS</h1><small>V11.2 · ART DIRECTION</small></header><main><div id="stage"><div id="status">Cargando…</div></div><div id="error"></div><section><div class="bar"><button id="act">Actuación</button><button id="front">Frente</button><button id="quarter">¾</button><button id="side">Perfil</button><button id="back">Atrás</button><button id="clay">Arcilla</button><button id="wire">Malla</button><button id="texture" class="active">Pigmento</button><button id="atlas">Atlas PNG</button><button id="normals">Normales: híbridas</button><button id="resetView">Encuadrar</button><button id="glb">GLB</button></div><div class="fields" id="express"></div><details><summary>Identidad y proporciones</summary><div class="bar" style="margin-top:10px"><button data-id="iris">IRIS</button><button data-id="soter">SOTER</button><button data-id="nara">NARA</button></div><div class="fields" id="fields"></div></details><details><summary>Receta para Soter</summary><textarea id="json"></textarea><div class="bar"><button id="apply">Aplicar JSON</button><button id="save">Guardar JSON</button></div><p>La cabeza es una geometría CC0 de Quaternius. Ojos, cejas y labios gráficos se adaptan a su superficie. V6 conserva la anatomía facial avanzada.</p><a href="../v11/">V11 anterior</a> · <a href="../v6/">V6 anatómica</a></details></section></main><script type="module">
import * as T from 'three';import {runQA} from './qa.mjs';import {GLTFExporter} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/exporters/GLTFExporter.js';import {LowPolyFace,PRESETS,FIELDS,recipe} from './clean.mjs';
const $=id=>document.getElementById(id),stage=$('stage');try{const data=await fetch('./head.json').then(r=>{if(!r.ok)throw Error('head.json '+r.status);return r.json()});const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;stage.prepend(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#78786a');const camera=new T.PerspectiveCamera(30,1,.01,20);let light=new T.DirectionalLight('#fff0de',2.35);light.position.set(-3,3,5);scene.add(light,new T.HemisphereLight('#e4ded2','#756c5f',.68));let fill=new T.DirectionalLight('#e0e6ed',.35);fill.position.set(3,1,2);scene.add(fill);let sys=new LowPolyFace(scene,data),q=new URLSearchParams(location.search),id=q.get('identity')||'iris';sys.setRecipe(PRESETS[id]||PRESETS.iris);let yaw=0,pitch=0,dist=3.0,target=new T.Vector3(0,.5,.035),dirty=true,auto=false,start=0,clay=false,wire=false,last=0;const ex={browL:['Ceja izq.',0,1],browR:['Ceja der.',0,1],lookX:['Mirada H',-1,1],lookY:['Mirada V',-1,1],blink:['Parpadeo',0,1],mouth:['Boca',0,1],smile:['Sonrisa',-1,1]};
function view(){camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);dirty=true}function fit(){let b=new T.Box3().setFromObject(sys.head);target.copy(b.getCenter(new T.Vector3()));let s=b.getSize(new T.Vector3()),f=T.MathUtils.degToRad(camera.fov/2),half=Math.min(f,Math.atan(Math.tan(f)*camera.aspect));dist=Math.max(s.y,s.x,s.z)*.73/Math.tan(half)+s.z*.5;view()}function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.fov=34;camera.updateProjectionMatrix();fit()}new ResizeObserver(resize).observe(stage);resize();
$('resetView').onclick=()=>fit();$('texture').onclick=()=>{let on=sys.textureEnabled===false;sys.setTexture(on);$('texture').classList.toggle('active',on);dirty=true};$('atlas').onclick=()=>{let a=document.createElement('a');a.href=sys.exportAtlas();a.download=sys.identity.name+'-atlas.png';a.click()};let modes=['hybrid','smooth','flat'],normalIndex=0;$('normals').onclick=()=>{normalIndex=(normalIndex+1)%3;sys.setNormals(modes[normalIndex]);$('normals').textContent='Normales: '+modes[normalIndex];dirty=true};$('glb').onclick=async()=>{try{let exportGroup=new T.Group();exportGroup.add(sys.head.clone());for(let m of sys.pool.filter(x=>x.visible)){let n=m.geometry.drawRange.count,g=new T.BufferGeometry();for(let k of ['position','normal'])g.setAttribute(k,new T.BufferAttribute(m.geometry.attributes[k].array.slice(0,n*3),3));exportGroup.add(new T.Mesh(g,m.material))}let b=await new GLTFExporter().parseAsync(exportGroup,{binary:true});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'model/gltf-binary'}));a.download=sys.identity.name+'.glb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){$('error').textContent=e.message}};function stop(){auto=false;$('act').classList.remove('active')}function status(){$('status').textContent='V11.2 · '+sys.stats.skinTriangles+' piel + '+sys.stats.featureTriangles+' rasgos · '+sys.stats.totalTriangles+' triángulos';dirty=true}function sync(){$('name').textContent=sys.identity.name;for(let k of Object.keys(FIELDS))$('f_'+k).value=sys.identity[k];$('json').value=JSON.stringify(sys.identity,null,2);status()}
function slider(root,k,arr,fn,prefix){let l=document.createElement('label');l.textContent=arr[0];let i=document.createElement('input');Object.assign(i,{type:'range',min:arr[1],max:arr[2],step:.01,id:prefix+k,value:0});i.oninput=()=>fn(+i.value);l.append(i);$(root).append(l)}
for(let [k,v] of Object.entries(ex))slider('express',k,v,n=>{stop();sys.setExpression({[k]:n});status()},'e_');for(let [k,v] of Object.entries(FIELDS))slider('fields',k,v,n=>{sys.setRecipe({...sys.identity,[k]:n});sync()},'f_');
for(let b of document.querySelectorAll('[data-id]'))b.onclick=()=>{stop();sys.setRecipe(PRESETS[b.dataset.id]);fit();sync()};for(let [k,v] of [['front',0],['quarter',.68],['side',Math.PI/2],['back',Math.PI]])$(k).onclick=()=>{stop();yaw=v;pitch=0;view()};$('act').onclick=()=>{auto=!auto;start=performance.now();$('act').classList.toggle('active',auto)};$('clay').onclick=()=>{clay=!clay;sys.setClay(clay);$('clay').classList.toggle('active',clay);status()};$('wire').onclick=()=>{wire=!wire;sys.setWire(wire);$('wire').classList.toggle('active',wire);status()};$('apply').onclick=()=>{try{sys.setRecipe(recipe(JSON.parse($('json').value)));sync()}catch(e){$('error').textContent=e.message}};$('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sys.identity,null,2)],{type:'application/json'}));a.download='iris-identity.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
let pointers=new Map(),pinch=0,canvas=renderer.domElement;canvas.onpointerdown=e=>{stop();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY])};canvas.onpointermove=e=>{let p=pointers.get(e.pointerId);if(!p)return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let [a,b]=[...pointers.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)dist=Math.max(1.25,Math.min(4,dist*pinch/d));pinch=d}else{yaw-=(e.clientX-p[0])*.009;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-p[1])*.008))}view()};for(let k of ['pointerup','pointercancel'])canvas.addEventListener(k,e=>{pointers.delete(e.pointerId);pinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.25,Math.min(4,dist*Math.exp(e.deltaY*.001)));view()},{passive:false});
if(q.get('view')==='side')yaw=Math.PI/2;else if(q.get('view')==='threeq')yaw=.68;if(q.get('texture')==='off'){$('texture').classList.remove('active');sys.setTexture(false)}if(q.get('mode')==='clay'){clay=true;sys.setClay(true)}if(q.get('pose')==='blink')sys.setExpression({blink:1});if(q.get('pose')==='brow')sys.setExpression({browR:1,lookX:.75});view();sync();renderer.render(scene,camera);document.documentElement.dataset.ready='true';window.IRIS={sys,renderer,scene,camera,version:'11.2',fit,view};if(q.has('qa')){await runQA({sys,renderer,scene,camera,fit,setView:(a,b)=>{yaw=a;pitch=b;view()},q});};
const sm=(a,b,x)=>{let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)},pulse=(t,a,b,c,d)=>sm(a,b,t)*(1-sm(c,d,t));function frame(now){requestAnimationFrame(frame);if(auto&&!document.hidden&&now-last>65){last=now;let t=((now-start)/1000)%10,e={lookX:.85*pulse(t,1.2,1.6,5.7,6.4),lookY:.3*pulse(t,1.6,2,4,4.5),browR:pulse(t,2.6,3.1,5.8,6.5),browL:0,blink:Math.max(pulse(t,4.4,4.55,4.65,4.8),pulse(t,8.2,8.35,8.43,8.6)),mouth:.3*pulse(t,6,6.3,6.8,7.4),smile:.4*pulse(t,6.5,7,8,8.5)};sys.setExpression(e);for(let k of Object.keys(ex))$('e_'+k).value=e[k];status()}if(dirty){renderer.render(scene,camera);dirty=false}}requestAnimationFrame(frame)
}catch(e){$('status').textContent='ERROR';$('error').textContent=e.message;console.error(e)}
</script></body></html>
