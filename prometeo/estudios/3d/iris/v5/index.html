 const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;stage.prepend(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color('#69685d');const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;room.dispose();pmrem.dispose();scene.environmentIntensity=.35;
 const key=new T.DirectionalLight('#fff0df',2.25);key.position.set(-2,3,4);scene.add(key);const fill=new T.DirectionalLight('#d1d8e5',.62);fill.position.set(3,1,2);scene.add(fill);scene.add(new T.HemisphereLight('#e4e0d5','#8b7a68',.7));
 const cam=new T.PerspectiveCamera(32,1,.01,10),sys=new FaceSystem(scene);const query=new URLSearchParams(location.search);if(PRESETS[query.get('identity')])sys.r=recipe(PRESETS[query.get('identity')]);let yaw=0,pitch=0,dist=.73,target=new T.Vector3(0,1.52,.03),auto=false,t0=0,clay=false,wire=false,preset='iris',busy=false,dirty=true;

 let drag=new Map(),pinch=0;renderer.domElement.onpointerdown=e=>{renderer.domElement.setPointerCapture(e.pointerId);drag.set(e.pointerId,[e.clientX,e.clientY]);stop()};renderer.domElement.onpointermove=e=>{let old=drag.get(e.pointerId);if(!old)return;drag.set(e.pointerId,[e.clientX,e.clientY]);if(drag.size===2){let [a,b]=[...drag.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)dist=Math.max(.32,Math.min(1.35,dist*pinch/d));pinch=d}else{yaw-=(e.clientX-old[0])*.009;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-old[1])*.007))}updateCamera()};for(let n of ['pointerup','pointercancel'])renderer.domElement.addEventListener(n,e=>{drag.delete(e.pointerId);pinch=0});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(.32,Math.min(1.35,dist*Math.exp(e.deltaY*.001)));updateCamera()},{passive:false});
 let ex=['browL','browR','lookX','lookY','blink'];function stop(){auto=false;$('act').classList.remove('active')}function clear(){for(let k of ex)$(k).value=0;sys.setExpression(Object.fromEntries(ex.map(k=>[k,0])));dirty=true}

 $('act').onclick=()=>{auto=!auto;t0=performance.now();$('act').classList.toggle('active',auto);if(!auto)clear();dirty=true};
 for(let [id,a] of [['front',0],['threeq',.72],['side',1.48]])$(id).onclick=()=>{stop();yaw=a;pitch=0;updateCamera()};
 $('clay').onclick=()=>{clay=!clay;sys.clay(clay);$('clay').classList.toggle('active',clay);dirty=true};$('wire').onclick=()=>{wire=!wire;sys.wire(wire);$('wire').classList.toggle('active',wire);dirty=true};
 let labels={none:'Sin pelo',short02:'Corto',short04:'Corto liso',bob02:'Bob',bob01:'Bob largo',afro01:'Afro',ponytail01:'Cola',long01:'Largo',braid01:'Trenza'};for(let id of HAIR){let o=document.createElement('option');o.value=id;o.textContent=labels[id];$('hair').append(o)}
 for(let [k,l] of Object.entries(FIELDS)){let lab=document.createElement('label');lab.textContent=l;let inp=document.createElement('input');Object.assign(inp,{id:'f_'+k,type:'range',min:'-.75',max:'.75',step:'.01'});inp.oninput=()=>{sys.r.face[k]=+inp.value;sys.applyShape();dirty=true;syncJSON()};lab.append(inp);$('face').append(lab)}
 function syncJSON(){$('json').value=JSON.stringify(sys.r,null,2)}
 function sync(){for(let k of Object.keys(FIELDS))$('f_'+k).value=sys.r.face[k];$('hair').value=sys.r.hair;$('name').textContent=sys.r.name;syncJSON();let caps=sys.capabilities();$('browL').disabled=!caps.brow[0];$('browR').disabled=!caps.brow[1];$('blink').disabled=!caps.blink;$('lookX').disabled=$('lookY').disabled=!caps.gaze;$('meta').textContent='Base CC0 MakeHuman / CharacterCreator · '+caps.bodyVertices+' vértices de cuerpo · '+caps.faceMorphs+' morphs faciales de identidad · parpadeo '+caps.blink+' · mirada '+caps.gaze+' · cejas '+caps.brow.join('/')+' · '+caps.missing.length+' morphs esperados ausentes.';return caps}
 async function apply(raw){if(busy)return;busy=true;stop();clear();try{if(clay){sys.clay(false);clay=false;$('clay').classList.remove('active')}status.textContent='Actualizando identidad…';await sys.setRecipe(raw);sys.wire(wire);frameCamera();sync();status.textContent='V5 · anatomía de autor';dirty=true}catch(e){status.textContent='Error al cargar cabello o identidad';$('fail').textContent=e.message}finally{busy=false}}
 for(let b of document.querySelectorAll('[data-preset]'))b.onclick=()=>{preset=b.dataset.preset;for(let q of document.querySelectorAll('[data-preset]'))q.classList.toggle('active',q===b);apply(PRESETS[preset])};
 $('hair').onchange=()=>apply({...sys.r,hair:$('hair').value});$('import').onclick=()=>{try{apply(recipe(JSON.parse($('json').value)))}catch(e){$('fail').textContent='Receta inválida: '+e.message}};
 $('export').onclick=()=>{syncJSON();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('json').value],{type:'application/json'}));a.download=sys.r.name.toLowerCase()+'-identity.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 resize();await sys.load();frameCamera();let caps=sync(),qa=sys.verifyTargets();if(query.get('view')==='side'){yaw=1.48;updateCamera()}else if(query.get('view')==='threeq'){yaw=.72;updateCamera()}if(query.get('pose')==='blink')sys.setExpression({blink:1});if(query.get('pose')==='brow')sys.setExpression({browR:1,lookX:.7});if(query.get('mode')==='clay'){clay=true;sys.clay(true)}status.textContent='V5 · '+caps.faceMorphs+' morphs · WebGL · '+Object.values(qa).filter(x=>x.pass).length+'/'+Object.keys(qa).length+' targets';renderer.render(scene,cam);document.documentElement.dataset.ready='true';window.IRIS={sys,renderer,scene,cam,caps,qa,apply,version:'5.1',setPose:e=>{stop();sys.setExpression(e);dirty=true},render:()=>{dirty=true}};
 const S=(a,b,x)=>{let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)},pulse=(t,a,b,c,d)=>S(a,b,t)*(1-S(c,d,t));

}catch(e){status.textContent='NO INICIADO';$('fail').textContent=e.message;console.error(e)}
