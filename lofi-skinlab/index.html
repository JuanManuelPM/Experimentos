<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8e4da">
<title>LO-FI SKINLAB · Touch</title>
<style>
:root{color-scheme:light;--ink:#11110f;--paper:#e8e4da;--panel:#f6f2e8;--muted:#666157}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 8px;display:flex;justify-content:space-between;pointer-events:none}
.brand{font-weight:900;font-size:13px;line-height:1.15;letter-spacing:.07em;text-shadow:0 1px #fff}
.brand small{display:block;font-size:8px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.stats{font-size:8px;line-height:1.4;text-align:right;white-space:pre;background:#f6f2e8d9;border:1px solid #1112;padding:4px 6px}
.help{position:fixed;z-index:4;top:58px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.04em;background:#111;color:#fff;padding:6px 8px;white-space:nowrap;pointer-events:none}
.dock{position:fixed;z-index:10;left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));margin:auto;max-width:650px;background:#f6f2e8f5;border:2px solid #111;padding:8px;box-shadow:0 4px 0 #1112}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rowhead strong{font-size:9px;letter-spacing:.08em}.rowhead span{font-size:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objectGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.skinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
button{font:inherit;color:inherit;touch-action:manipulation}
.obj,.skin{border:2px solid #b7b0a3;background:#fff;min-width:0;border-radius:0}
.obj{height:68px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.obj img{width:45px;height:45px;object-fit:contain;display:block}.obj b,.skin b{font-size:8px;line-height:1}
.obj[data-on="1"]{border-color:#111;background:#ffe36e;transform:translateY(-1px)}
.skin{height:48px;padding:3px 4px;display:flex;align-items:center;justify-content:flex-start;gap:5px}
.skin img{width:34px;height:34px;object-fit:cover;border:1px solid #111;background:#ddd;flex:0 0 34px}.skin[data-on="1"]{border-color:#111;background:#cbe4ff}
.actions{display:flex;gap:6px;margin-top:6px}.action{flex:1;border:2px solid #111;background:#111;color:#fff;height:38px;font-size:9px;font-weight:900;letter-spacing:.04em}
.action.secondary{background:#fff;color:#111}
.status{position:fixed;z-index:3;left:10px;bottom:237px;font-size:7px;color:#5f5a50;pointer-events:none}
.toast{position:fixed;z-index:20;left:50%;top:45%;transform:translate(-50%,-50%);display:none;background:#111;color:#fff;padding:9px 11px;font-size:9px}
@media(max-height:680px){
 .obj{height:60px}.obj img{width:38px;height:38px}.skin{height:43px}.skin img{width:30px;height:30px;flex-basis:30px}
 .action{height:34px}.status{display:none}
}
@media(min-aspect-ratio:1/1){
 .dock{left:auto;right:8px;top:8px;bottom:8px;width:min(42vw,430px);overflow:auto}
 .status{left:10px;bottom:10px}.help{left:29%;top:58px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<header><div class="brand">LO-FI SKINLAB<small>UNA FORMA 3D · MUCHAS IMÁGENES</small></div><div class="stats" id="stats">cargando…</div></header>
<div class="help">TOUCH: ARRASTRÁ PARA GIRAR · PELLIZCÁ PARA ZOOM</div>
<div class="status">assets locales · Kenney CC0 · materiales unlit · sin postprocesado</div>
<div class="toast" id="toast"></div>

<div class="dock" id="dock">
  <div class="rowhead"><strong>1 · FORMA</strong><span id="selectedLabel">GATO · ORIGINAL</span></div>
  <div class="objectGrid" id="objects"></div>

  <div class="rowhead" style="margin-top:8px"><strong>2 · IMAGEN / SKIN</strong><span>la geometría queda igual</span></div>
  <div class="skinGrid" id="skins"></div>

  <div class="actions">
    <button class="action" id="random">ALEATORIA</button>
    <button class="action secondary" id="reset">REINICIAR VISTA</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const assets=[
{id:'cat',label:'GATO',file:'assets/cat.glb',thumb:'assets/cat.webp'},
{id:'fish',label:'PEZ',file:'assets/fish.glb',thumb:'assets/fish.webp'},
{id:'parrot',label:'LORO',file:'assets/parrot.glb',thumb:'assets/parrot.webp'},
{id:'tv',label:'TELE',file:'assets/tv.glb',thumb:'assets/tv.webp'}
];
const skinDefs=[
{id:'original',label:'ORIGINAL'},
{id:'cat',label:'GATO IMG',src:'assets/cat.webp',bg:'#dbc9ad'},
{id:'fish',label:'PEZ IMG',src:'assets/fish.webp',bg:'#a9d8d8'},
{id:'parrot',label:'LORO IMG',src:'assets/parrot.webp',bg:'#b9d18f'},
{id:'tv',label:'TELE IMG',src:'assets/tv.webp',bg:'#c8b8a8'},
{id:'stripes',label:'TRAMA'}
];

const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8e4da);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x81776b,1.8);scene.add(hemi);
const gallery=new THREE.Group();gallery.position.y=.48;scene.add(gallery);

const loader=new GLTFLoader(),loaded=new Map(),textureBank={};
let selected='cat',zoom=1,manualY=0,manualX=0;
const objectsEl=document.getElementById('objects'),skinsEl=document.getElementById('skins'),selectedLabel=document.getElementById('selectedLabel'),toast=document.getElementById('toast');

function toastMsg(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.style.display='none',950)}

function buildButtons(){
 assets.forEach(a=>{
  const b=document.createElement('button');b.className='obj';b.dataset.id=a.id;
  const img=document.createElement('img');img.src=a.thumb;img.alt='';
  const lab=document.createElement('b');lab.textContent=a.label;b.append(img,lab);
  b.addEventListener('click',()=>selectAsset(a.id));objectsEl.appendChild(b);
 });
 skinDefs.forEach(s=>{
  const b=document.createElement('button');b.className='skin';b.dataset.skin=s.id;
  const img=document.createElement('img');img.alt='';if(s.src)img.src=s.src;if(s.id==='original')img.id='originalPreview';if(s.id==='stripes')img.id='stripesPreview';
  const lab=document.createElement('b');lab.textContent=s.label;b.append(img,lab);
  b.addEventListener('click',()=>applySkin(selected,s.id));skinsEl.appendChild(b);
 });
}
buildButtons();

function imageToTexture(url,bg){
 return new Promise((resolve,reject)=>{
  const img=new Image();img.onload=()=>{
   const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d',{alpha:false});
   g.fillStyle=bg;g.fillRect(0,0,256,256);
   g.fillStyle='#ffffff55';for(let y=0;y<256;y+=32)for(let x=(y/32)%2?16:0;x<256;x+=32)g.fillRect(x,y,16,16);
   const m=18,sc=Math.min((256-m*2)/img.width,(256-m*2)/img.height),w=img.width*sc,h=img.height*sc;
   g.drawImage(img,(256-w)/2,(256-h)/2,w,h);
   const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.generateMipmaps=true;t.needsUpdate=true;
   resolve({texture:t,preview:c.toDataURL('image/jpeg',.82)});
  };img.onerror=reject;img.src=url;
 });
}
function stripeTexture(){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d',{alpha:false});
 g.fillStyle='#1b1712';g.fillRect(0,0,128,128);g.fillStyle='#e16a30';
 for(let x=-128;x<256;x+=16){g.beginPath();g.moveTo(x,0);g.lineTo(x+7,0);g.lineTo(x-121,128);g.lineTo(x-128,128);g.closePath();g.fill()}
 g.fillStyle='#f0d36b';for(let y=8;y<128;y+=24)for(let x=8;x<128;x+=24)g.fillRect(x,y,4,4);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapNearestFilter;t.generateMipmaps=true;
 return {texture:t,preview:c.toDataURL('image/png')};
}
async function initTextures(){
 for(const s of skinDefs.filter(x=>x.src)){const o=await imageToTexture(s.src,s.bg);textureBank[s.id]=o.texture;const btn=document.querySelector('[data-skin="'+s.id+'"] img');if(btn)btn.src=o.preview}
 const st=stripeTexture();textureBank.stripes=st.texture;document.getElementById('stripesPreview').src=st.preview;
}
await initTextures();

function basicFrom(mat,geo){
 const one=m=>new THREE.MeshBasicMaterial({
  map:m&&m.map?m.map:null,
  color:m&&m.color?m.color.clone():new THREE.Color(0xffffff),
  vertexColors:!!geo.attributes.color,
  transparent:!!(m&&m.transparent),
  opacity:m&&m.opacity!==undefined?m.opacity:1,
  alphaTest:m&&m.alphaTest?m.alphaTest:0,
  side:THREE.DoubleSide,
  toneMapped:false
 });
 return Array.isArray(mat)?mat.map(one):one(mat);
}
function makeOriginalUnlit(obj){obj.traverse(n=>{if(n.isMesh)n.material=basicFrom(n.material,n.geometry)})}

function mergeModelGeometry(obj){
 obj.updateWorldMatrix(true,true);const gs=[];
 obj.traverse(n=>{
  if(!n.isMesh||!n.geometry||!n.geometry.attributes.position)return;
  let g=n.geometry.clone();
  for(const k of Object.keys(g.attributes))if(k!=='position')g.deleteAttribute(k);
  g.applyMatrix4(n.matrixWorld);gs.push(g);
 });
 let merged=BufferGeometryUtils.mergeGeometries(gs,false);
 gs.forEach(g=>g.dispose());
 if(!merged)return null;
 if(merged.index){const ni=merged.toNonIndexed();merged.dispose();merged=ni}
 merged.computeVertexNormals();makeBoxUV(merged);return merged;
}
function makeBoxUV(g){
 g.computeBoundingBox();const b=g.boundingBox,min=b.min,max=b.max,sz=new THREE.Vector3().subVectors(max,min);
 const p=g.attributes.position.array,n=g.attributes.normal.array,uv=new Float32Array((p.length/3)*2);
 const sx=Math.max(sz.x,.0001),sy=Math.max(sz.y,.0001),szv=Math.max(sz.z,.0001);
 for(let i=0,j=0;i<p.length;i+=3,j+=2){
  const x=p[i],y=p[i+1],z=p[i+2],ax=Math.abs(n[i]),ay=Math.abs(n[i+1]),az=Math.abs(n[i+2]);
  let u,v;
  if(ax>=ay&&ax>=az){u=(z-min.z)/szv;v=(y-min.y)/sy}
  else if(ay>=ax&&ay>=az){u=(x-min.x)/sx;v=(z-min.z)/szv}
  else{u=(x-min.x)/sx;v=(y-min.y)/sy}
  uv[j]=u;uv[j+1]=v;
 }
 g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}
function normalizeObject(obj,target=2.9){
 obj.updateWorldMatrix(true,true);const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),s=target/Math.max(size.x,size.y,size.z,.0001);
 obj.scale.multiplyScalar(s);obj.position.sub(center.multiplyScalar(s));
}
function normalizeGeometryMesh(mesh,target=2.9){
 mesh.geometry.computeBoundingBox();const box=mesh.geometry.boundingBox,size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),s=target/Math.max(size.x,size.y,size.z,.0001);
 mesh.scale.setScalar(s);mesh.position.copy(center).multiplyScalar(-s);
}
function skinMaterial(tex){
 return new THREE.MeshBasicMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide,toneMapped:false});
}
function loadAsset(a){
 loader.load(a.file,gltf=>{
  const original=gltf.scene;makeOriginalUnlit(original);
  const merged=mergeModelGeometry(original);
  normalizeObject(original,2.9);
  const skin=merged?new THREE.Mesh(merged,skinMaterial(textureBank.cat)):null;
  if(skin)normalizeGeometryMesh(skin,2.9);
  const pivot=new THREE.Group();pivot.visible=false;pivot.add(original);if(skin){skin.visible=false;pivot.add(skin)}
  gallery.add(pivot);loaded.set(a.id,{asset:a,pivot,original,skin,skinId:'original',baseRot:0});
  if(a.id===selected){pivot.visible=true;fitSelected();updateUI()}
 },undefined,()=>toastMsg('falló '+a.label));
}
assets.forEach(loadAsset);

function selectAsset(id){
 selected=id;manualX=0;manualY=0;loaded.forEach((it,k)=>it.pivot.visible=k===id);updateUI();fitSelected();
}
function applySkin(id,skinId){
 const it=loaded.get(id);if(!it){toastMsg('todavía cargando');return}
 if(!it.skin&&skinId!=='original'){toastMsg('esta forma no acepta skin');return}
 it.skinId=skinId;it.original.visible=skinId==='original';
 if(it.skin){it.skin.visible=skinId!=='original';if(skinId!=='original'){it.skin.material.map=textureBank[skinId];it.skin.material.needsUpdate=true}}
 updateUI();
}
function updateUI(){
 const a=assets.find(x=>x.id===selected),it=loaded.get(selected),skin=it?it.skinId:'cargando';
 selectedLabel.textContent=a.label+' · '+String(skin).toUpperCase();
 document.querySelectorAll('.obj').forEach(b=>b.dataset.on=b.dataset.id===selected?'1':'0');
 document.querySelectorAll('.skin').forEach(b=>b.dataset.on=b.dataset.skin===skin?'1':'0');
 document.getElementById('originalPreview').src=a.thumb;
}
updateUI();

function fitSelected(){
 const it=loaded.get(selected);if(!it)return;
 it.pivot.updateWorldMatrix(true,true);
 const box=new THREE.Box3().setFromObject(it.pivot);const sphere=box.getBoundingSphere(new THREE.Sphere());
 const vf=THREE.MathUtils.degToRad(camera.fov),hf=2*Math.atan(Math.tan(vf/2)*camera.aspect),fit=Math.min(vf,hf);
 const d=(sphere.radius*1.32/Math.sin(fit/2))*zoom;
 camera.position.set(0,.55,d);camera.lookAt(0,.55,0);camera.near=Math.max(.01,d-sphere.radius*4);camera.far=d+sphere.radius*10;camera.updateProjectionMatrix();
}

document.getElementById('reset').addEventListener('click',()=>{zoom=1;manualX=0;manualY=0;fitSelected();toastMsg('vista reiniciada')});
document.getElementById('random').addEventListener('click',()=>{
 const opts=['cat','fish','parrot','tv','stripes'];const s=opts[Math.floor(Math.random()*opts.length)];applySkin(selected,s);toastMsg('skin: '+s);
});

const pointers=new Map();let moved=false,lastPinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});moved=false;
 if(pointers.size===2){const q=[...pointers.values()];lastPinch=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)}
});
renderer.domElement.addEventListener('pointermove',e=>{
 const p=pointers.get(e.pointerId);if(!p)return;p.px=p.x;p.py=p.y;p.x=e.clientX;p.y=e.clientY;
 if(pointers.size===1){
  const dx=p.x-p.px,dy=p.y-p.py;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
  manualY+=dx*.012;manualX=THREE.MathUtils.clamp(manualX+dy*.008,-.65,.65);
 }else if(pointers.size===2){
  const q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
  if(lastPinch>0){zoom=THREE.MathUtils.clamp(zoom*(lastPinch/d),.72,1.65);fitSelected();moved=true}lastPinch=d;
 }
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0}
renderer.domElement.addEventListener('pointerup',endPointer);renderer.domElement.addEventListener('pointercancel',endPointer);

function resize(){
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitSelected();
}
addEventListener('resize',resize);resize();

let frames=0,lastFps=performance.now();const stats=document.getElementById('stats');
function frame(now){
 const it=loaded.get(selected);if(it){it.pivot.rotation.y=manualY+Math.sin(now*.00028)*.055;it.pivot.rotation.x=manualX}
 renderer.render(scene,camera);frames++;
 if(now-lastFps>700){const fps=Math.round(frames*1000/(now-lastFps));frames=0;lastFps=now;const r=renderer.info.render;stats.textContent=fps+' FPS\n'+r.calls+' DRAW\n'+r.triangles.toLocaleString()+' TRI\nDPR '+renderer.getPixelRatio().toFixed(2)}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
