<script>
(function(){
'use strict';
const FOLDERS=[{id:'games',name:'Videojuegos'},{id:'tools',name:'Herramientas web'},{id:'education',name:'Educación'},{id:'knowledge',name:'Biblioteca'}];
const CATEGORY={games:'Videojuegos',tools:'Herramientas web',education:'Educación',knowledge:'Biblioteca'};
const ALLOWED=new Set(['games','tools','education']);
const TYPES=['2D','3D','Web','Educación','Experimento'];
const STATUSES={candidate:'En prueba',source:'Código disponible',verified:'Disponible',planned:'Planificado',blocked:'Bloqueado'};
const initial=JSON.parse(document.querySelector('#seed').textContent);
const $=s=>document.querySelector(s);
let manifest=initial;
let state={folder:'all',filter:'Todos',project:null,mode:'list',query:''};

let timer;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function publicPass(p){return Boolean(p.previewVerified && p.verification?.runtimePass===true && p.verification?.publicPass===true && typeof p.verification?.evidenceRef==='string' && p.verification.evidenceRef.length>8 && url(p.previewUrl))}
function url(u){if(typeof u!=='string'||u.length>1000)return null;try{const p=new URL(u,location.href);if(!['http:','https:'].includes(p.protocol))return null;return p.href}catch(e){return null}}
function alertUser(s){const el=$('#toast');el.textContent=s;el.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('visible'),3100)}
function count(id){return manifest.items.filter(x=>x.category===id).length}
function nav(){let out=`<button class="navbtn ${state.folder==='all'?'active':''}" data-folder="all"><span class="dot-glyph"></span>Todos los proyectos</button><div class="navlabel">Carpetas</div>`;
for(const f of FOLDERS)out+=`<button class="navbtn ${state.folder===f.id?'active':''}" data-folder="${f.id}"><span class="folder-glyph"></span>${f.name}</button>`;
out+=`<div class="navlabel">Sistema</div><button class="navbtn ${state.folder==='factory'?'active':''}" data-folder="factory"><span class="dot-glyph"></span>Fábrica</button>`;
$('#navgroups').innerHTML=out;
}
function navTo(f){state.folder=f;state.project=null;state.filter='Todos';state.query='';$('#search').value='';$('#sidebar').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');render();$('#work').focus({preventScroll:true});window.scrollTo(0,0)}
function openProject(id){if(!manifest.items.some(p=>p.id===id))return;state.project=id;$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function shortKind(k){return k==='Educación'?'EDU':k==='Experimento'?'LAB':k}
function preview(p){return `<span class="thumb" data-kind="${esc(p.kind)}" aria-label="Marcador visual, no captura del producto">${esc(shortKind(p.kind))}</span>`}
function row(p){const available=publicPass(p),testing=!!url(p.previewUrl);const label=available?'Disponible':p.status==='blocked'?'Bloqueado':testing?'En prueba':STATUSES[p.status]||'En revisión';return `<button class="project-row" data-project="${esc(p.id)}" type="button">${preview(p)}<span><span class="project-name" style="display:block">${esc(p.name)}</span><span class="project-sub">${esc(p.summary)}</span></span><span class="status ${available?'available':''}">${esc(label)}</span><span class="version">${esc(p.version||'')}</span><span class="row-arrow" aria-hidden="true">›</span></button>`}
function rows(items){return items.length?`<div class="list">${items.map(row).join('')}</div>`:'<div class="empty">No hay proyectos en esta carpeta.</div>'}
function folderCard(f){return `<button class="folder-card" data-folder="${f.id}" type="button"><span class="folder-large" aria-hidden="true"></span><span class="folder-copy"><strong>${f.name}</strong><small>${f.id==='knowledge'?'Referencias y métodos':`${count(f.id)} proyectos`}</small></span><span class="arrow">›</span></button>`}
function head(t,n){return `<div class="page-head"><h1>${esc(t)}</h1>${n==null?'':`<span class="count">${n} proyectos</span>`}</div>`}
function filters(){if(state.folder!=='games')return '';return `<div class="switch" aria-label="Filtrar videojuegos">${['Todos','2D','3D','Experimento'].map(t=>`<button type="button" class="chip ${state.filter===t?'active':''}" data-filter="${esc(t)}">${t}</button>`).join('')}</div>`}
function listPage(){const f=FOLDERS.find(x=>x.id===state.folder);const isAll=state.folder==='all';let prods=manifest.items.filter(x=>(isAll||x.category===state.folder));if(state.folder==='games'&&state.filter!=='Todos')prods=prods.filter(p=>p.kind===state.filter);
let out=head(isAll?'Todos los proyectos':f.name,isAll?manifest.items.length:count(state.folder));
if(isAll){out+=`<h2 class="section-title">Carpetas</h2><div class="folders">${FOLDERS.filter(x=>x.id!=='knowledge').map(folderCard).join('')}</div>`;out+=`<div class="row-top"><h2 class="section-title">Proyectos</h2></div>`}
else{out+=`<div class="row-top"><h2 class="section-title">${state.folder==='games'?'Juegos':'Proyectos'}</h2>${filters()}</div>`}
out+=rows(prods);
if(state.folder==='games')out+=`<button class="engine-folder" type="button" data-folder="engine"><span class="folder-large" aria-hidden="true"></span><span><strong>Game Engine</strong><span class="sub">Motor 2D, motor 3D y componentes compartidos</span></span><span class="arrow">›</span></button>`;
return out;}
function knowledgePage(){return head('Biblioteca')+`<div class="summary-list">${[['Referencias visuales','Juegos y aplicaciones'],['Métodos y recetas','Procesos reutilizables'],['Componentes','Piezas de código y diseño'],['Ideas','Conceptos por explorar']].map(x=>`<div class="summary-row"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>`}
function factoryPage(){const round=(manifest.rounds||[])[0];return head('Fábrica')+`<div class="summary-list"><div class="summary-row"><strong>Ronda 001</strong><span>6 entregas · Pruebas incompletas</span></div><div class="summary-row"><strong>Compositor</strong><span>V5.1 candidato</span></div></div>${round&&url(round.reviewUrl)?`<div class="detail-actions" style="margin-top:24px"><a class="action-link primary" target="_blank" rel="noopener noreferrer" href="${esc(url(round.reviewUrl))}">Evaluar Ronda 001 ↗</a>${url(round.reportRef)?`<a class="action-link outline" target="_blank" rel="noopener noreferrer" href="${esc(url(round.reportRef))}">Informe técnico ↗</a>`:''}</div>`:''}<details class="feedback"><summary>Cómo se agregan las siguientes versiones</summary><p>Una sola persona o coordinador valida, publica y actualiza el catálogo. Cada versión conserva su fuente, pruebas y estado. Las notas de evaluación permanecen en el navegador de la galería y pueden exportarse; no se sincronizan automáticamente.</p></details>`}
function enginePage(){return head('Game Engine')+`<div class="engine-sections">${(manifest.capabilities||[]).map(c=>`<section class="engine-panel"><h2>${esc(c.name)}</h2>${(c.sections||[]).map(it=>`<div class="engine-item"><span>${esc(it.name)}</span><em class="${esc(it.status)}">${it.status==='partial'?'Parcial':it.status==='planned'?'Previsto':'Fuente'}</em></div>`).join('')}</section>`).join('')}</div>`}
function searchPage(){const q=state.query.toLocaleLowerCase('es').trim();const found=manifest.items.filter(p=>[p.name,p.kind,p.summary,...(p.parts||[])].join(' ').toLocaleLowerCase('es').includes(q));return head('Resultados',found.length)+rows(found)}
function detail(p){
  const certified=publicPass(p),trial=url(p.previewUrl),review=url(p.reviewUrl),isBlocked=p.status==='blocked';
  const versionLabel=certified?'Verificada':isBlocked?'Bloqueada':trial?'En prueba':'Sin vista previa';
  let out=`<div class="detail-head"><div class="detail-cover" data-kind="${esc(p.kind)}">${esc(shortKind(p.kind))}</div><div class="detail-info"><h1>${esc(p.name)}</h1><p>${esc(p.summary)}</p></div></div>`;
  out+=`<div class="detail-actions">${trial?`<a class="action-link primary" href="${esc(trial)}" target="_blank" rel="noopener noreferrer">${isBlocked?'Ver estado ↗':certified?'Abrir proyecto ↗':'Probar versión ↗'}</a>`:`<button class="primary" disabled>Sin acceso</button>`}${review?`<a class="action-link outline" href="${esc(review)}" target="_blank" rel="noopener noreferrer">Evaluar en galería ↗</a>`:''}</div>`;
  out+=`<div class="detail-grid"><section class="data-block"><h2>Proyecto</h2><div class="meta-row"><div class="meta-label">Carpeta</div><div>${esc(CATEGORY[p.category]||'')}</div></div><div class="meta-row"><div class="meta-label">Tipo</div><div>${esc(p.kind)}</div></div><div class="meta-row"><div class="meta-label">Versión</div><div>${esc(p.version||'Sin versión')}</div></div><div class="meta-row"><div class="meta-label">Estado</div><div>${esc(versionLabel)}</div></div><div class="meta-row"><div class="meta-label">Pendiente</div><div>${esc(p.revision||'Sin datos')}</div></div></section><section class="data-block"><h2>Componentes</h2><div class="tagline">${(p.parts||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="small-head" style="margin-top:34px"><h2>Versiones</h2></div>${(p.versions||[]).map((v,i)=>`<div class="meta-row"><div class="meta-label">${i?'Anterior':'Actual'}</div><div>${esc(v.name||'Versión')}<span class="section-count"> · ${v.publicVerified?'verificada':v.state==='BLOCKED_BACKEND'?'bloqueada':v.state==='SOURCE_ONLY'?'fuente':'candidata'}</span></div></div>`).join('')}<div class="footnote">Las nuevas rondas agregan versiones sin borrar las anteriores.</div></section></div>`;
  return out;
}
function crumbs(){let title=state.project?manifest.items.find(p=>p.id===state.project)?.name:state.query?'Buscar':state.folder==='all'?'Todos los proyectos':state.folder==='engine'?'Game Engine':state.folder==='factory'?'Fábrica':FOLDERS.find(f=>f.id===state.folder)?.name;
let prefix=state.project?CATEGORY[manifest.items.find(p=>p.id===state.project)?.category]:state.folder==='engine'?'Videojuegos':null;
$('#crumbs').innerHTML=`<button type="button" data-home>Proyectos</button>${prefix?`<span>/</span><button type="button" data-breadcrumb="${state.project?manifest.items.find(p=>p.id===state.project)?.category:'games'}">${esc(prefix)}</button>`:''}<span>/</span><strong>${esc(title||'')}</strong>`;
}
function render(){nav();crumbs();let html='';if(state.project){let p=manifest.items.find(x=>x.id===state.project);if(p)html=detail(p);else{state.project=null;html=listPage()}}
else if(state.query.trim())html=searchPage();else if(['all','games','tools','education'].includes(state.folder))html=listPage();else if(state.folder==='engine')html=enginePage();else if(state.folder==='knowledge')html=knowledgePage();else html=factoryPage();$('#work').innerHTML=html;}
function saveNote(id){let t=$('#noteInput');if(!t)return;notes[id]=t.value;let ok=true;try{localStorage.setItem('prometeo-library-notes-v2',JSON.stringify(notes))}catch(e){ok=false}$('#noteStatus').textContent=ok?'Guardada en este navegador':'No se pudo guardar';}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function checkCatalog(data){if(data?.schema!=='prometeo.library-catalog/v1'||!Array.isArray(data.items)||data.items.length>500)throw Error('Formato de catálogo no válido');const ids=new Set;const clean=data.items.map(p=>{if(typeof p.id!=='string'||!/^[a-z0-9][a-z0-9-]{0,79}$/.test(p.id)||ids.has(p.id))throw Error('ID de proyecto inválido o repetido');ids.add(p.id);if(!ALLOWED.has(p.category)||!TYPES.includes(p.kind)||typeof p.name!=='string'||p.name.length>90)throw Error('Datos de proyecto inválidos');return {...p,id:p.id,name:p.name,summary:String(p.summary||'').slice(0,160),status:['candidate','source','verified','planned','blocked'].includes(p.status)?p.status:'candidate',previewUrl:url(p.previewUrl),reviewUrl:url(p.reviewUrl),publicCandidate:p.publicCandidate===true,previewVerified:Boolean(p.previewVerified),verification:p.verification&&typeof p.verification==='object'?{runtimePass:p.verification.runtimePass===true,publicPass:p.verification.publicPass===true,evidenceRef:String(p.verification.evidenceRef||'').slice(0,230)}:null,versions:Array.isArray(p.versions)?p.versions.slice(0,25).map(v=>({name:String(v.name||'').slice(0,50),state:String(v.state||'CANDIDATE').slice(0,25),commit:/^[a-f0-9]{40}$/.test(v.commit||'')?v.commit:null,previewUrl:url(v.previewUrl),publicVerified:v.publicVerified===true,runtimeVerified:v.runtimeVerified===true,evidenceRef:String(v.evidenceRef||'').slice(0,230)})):[],parts:Array.isArray(p.parts)?p.parts.slice(0,15).map(v=>String(v).slice(0,60)):[],version:String(p.version||'').slice(0,40),revision:String(p.revision||'').slice(0,140)}});if(data.capabilities&&!Array.isArray(data.capabilities))throw Error('Game Engine inválido');return {schema:data.schema,generatedAt:data.generatedAt||'',rounds:Array.isArray(data.rounds)?data.rounds.slice(0,100).map(x=>({id:String(x?.id||'').slice(0,20),reviewUrl:url(x?.reviewUrl),reportRef:url(x?.reportRef)})):[],items:clean,capabilities:Array.isArray(data.capabilities)?data.capabilities.slice(0,15).map(c=>({id:String(c?.id||'').slice(0,50),name:String(c?.name||'').slice(0,80),sections:Array.isArray(c?.sections)?c.sections.slice(0,25).map(z=>({name:String(z?.name||'').slice(0,80),status:['partial','planned','source'].includes(z?.status)?z.status:'planned'})):[]})):initial.capabilities}}
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>1500000)throw Error('Archivo demasiado grande');let data=checkCatalog(JSON.parse(await file.text()));manifest=data;state.project=null;state.folder='all';state.query='';$('#search').value='';render();alertUser(`${data.items.length} proyectos importados en esta vista`)}catch(err){alertUser(err.message||'No se pudo importar')}finally{e.target.value=''}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;state.project=null;render()});

$('#menuToggle').addEventListener('click',()=>{let n=$('#sidebar');n.classList.toggle('open');$('#menuToggle').setAttribute('aria-expanded',String(n.classList.contains('open')))});
document.addEventListener('click',e=>{
const t=e.target.closest('button');if(!t)return;
if(t.hasAttribute('data-home'))return navTo('all');
if(t.dataset.breadcrumb)return navTo(t.dataset.breadcrumb);
if(t.dataset.folder)return navTo(t.dataset.folder);
if(t.dataset.project)return openProject(t.dataset.project);
if(t.dataset.filter){state.filter=t.dataset.filter;render();return}
if(t.dataset.open){const p=manifest.items.find(x=>x.id===t.dataset.open);const u=p&&publicPass(p)?url(p.previewUrl):null;if(u)window.open(u,'_blank','noopener,noreferrer');return}


});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false')}});
render();
// Hosted version: the coordinator publishes sanitized catalog.json beside this HTML.
// The file:// demo uses its embedded seed, and local import always remains available.
if(['https:','http:'].includes(location.protocol)){
  fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('no catalog');return r.json()}).then(raw=>{
    const loaded=checkCatalog(raw);manifest=loaded;render();
  }).catch(()=>{/* keep embedded demo until a valid catalog is deployed */});
}
})();
</script>
</body></html>
